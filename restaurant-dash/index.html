<!DOCTYPE html>

<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;width:100%;overflow:hidden;background:#1a0c08;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 0%,#6a2e18 0%,#1a0c08 70%)}
#game{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#3a2218;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#game.portrait{width:100%;height:auto;max-height:94dvh;max-width:100%;object-fit:contain}
#overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
#overlay>*{pointer-events:auto}
/* HUD sits below the top-left Games back button and the top-right icon cluster */
#hud{position:absolute;left:0;right:0;top:calc(72px + env(safe-area-inset-top));padding:0 12px;display:flex;gap:8px;align-items:center;justify-content:center;pointer-events:none;z-index:5;font-weight:800;flex-wrap:wrap}
#hud.hidden,#hits.hidden,#coopBar.hidden,#pauseBtn.hidden{display:none!important}
.icon-btn{position:absolute;z-index:20;width:48px;height:48px;min-width:48px;min-height:48px;border:none;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
/* ≥12px gaps between Pause, Mute, Fullscreen — all top-right, clear of the Games back button */
#fsBtn{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))}
#muteBtn{top:calc(8px + env(safe-area-inset-top));right:calc(68px + env(safe-area-inset-right))}
#pauseBtn{top:calc(8px + env(safe-area-inset-top));right:calc(128px + env(safe-area-inset-right))}
.icon-btn:active{transform:scale(.94)}
.btn{min-width:48px;min-height:48px;padding:12px 22px;border:none;border-radius:18px;font-size:20px;font-weight:800;cursor:pointer;color:#2a1450;background:#ffe566;box-shadow:0 4px 0 #d4b000,0 8px 18px rgba(0,0,0,.25);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d4b000,0 4px 10px rgba(0,0,0,.25)}
.btn.big{font-size:24px;padding:14px 26px;border-radius:22px;min-height:60px}
.btn.green{background:#7dff9a;box-shadow:0 4px 0 #2db854,0 8px 18px rgba(0,0,0,.25)}
.btn.blue{background:#9ad0ff;box-shadow:0 4px 0 #3a7fbf,0 8px 18px rgba(0,0,0,.25)}
.btn.pink{background:#ff9ad4;box-shadow:0 4px 0 #d44f9a,0 8px 18px rgba(0,0,0,.25)}
.btn.purple{background:#c9a6ff;box-shadow:0 4px 0 #7a4ad0,0 8px 18px rgba(0,0,0,.25)}
.btn.tomato{background:#ff8a5b;box-shadow:0 4px 0 #c44a22,0 8px 18px rgba(0,0,0,.25)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.panel{background:rgba(28,12,8,.92);border:3px solid rgba(255,220,160,.22);border-radius:28px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 16px 50px rgba(0,0,0,.45);max-width:min(980px,96vw);max-height:min(94dvh,94vh);overflow:auto}
.title{font-size:clamp(26px,5vw,44px);font-weight:900;letter-spacing:.5px;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35);margin-bottom:6px;color:#ffe566}
.sub{text-align:center;opacity:.9;margin-bottom:14px;font-size:15px;line-height:1.4}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.profile-card{width:min(280px,42vw);min-height:170px;border-radius:24px;background:linear-gradient(160deg,#8a3a1c,#2a120c);border:4px solid rgba(255,255,255,.2);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.profile-card:active{transform:scale(.97)}
.profile-card h2{font-size:22px}
.profile-card .meta{font-size:14px;opacity:.85;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:700;min-height:40px}
#hits{position:absolute;inset:0;z-index:6;pointer-events:none}
#hits .hit{position:absolute;pointer-events:auto;min-width:44px;min-height:44px;padding:0;border:2px solid transparent;border-radius:16px;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#hits .hit:focus-visible{border-color:rgba(255,229,102,.85);outline:none}
#coopBar{position:absolute;inset:0;z-index:7;pointer-events:none}
.coop-tag{position:absolute;min-width:48px;min-height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.coop-tag.left{left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));background:#ff9a4a;color:#3a1a00}
.coop-tag.right{right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));background:#6ad4d0;color:#063230}
.toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:12px 20px;border-radius:16px;font-weight:800;font-size:18px;z-index:30;pointer-events:none}
.hidden{display:none!important}
input.name-in{font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;min-height:48px;width:min(240px,70vw);text-align:center}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;width:100%;max-width:720px;padding:4px}
.lvl{min-width:80px;min-height:72px;border-radius:16px;border:none;background:rgba(255,255,255,.14);color:#fff;font-weight:900;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lvl span{font-size:11px;font-weight:700;opacity:.85}
.lvl.done{background:#3dd68c;color:#083018}
.lvl.locked{opacity:.35;cursor:default}
.lvl.cur{outline:3px solid #ffe566}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;width:100%;max-width:760px}
.shop-card{background:rgba(255,255,255,.1);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;min-height:160px}
.shop-card h3{font-size:18px;margin:0}
.shop-card p{font-size:13px;opacity:.85;margin:0;line-height:1.3}
#rotateTip{position:absolute;left:50%;top:calc(128px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:0 12px;max-width:min(340px,92vw)}
#rotateTip.hidden{display:none!important}
#rotateTip .hint-banner{pointer-events:none;background:rgba(28,12,8,.88);border:2px solid rgba(255,229,102,.45);border-radius:16px;padding:10px 14px;font-weight:800;font-size:14px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);line-height:1.3}
@media (max-height:650px){
  .profile-card{min-height:140px;width:min(230px,40vw)}
  .title{font-size:clamp(20px,4.2vw,32px)}
  .panel{padding:12px;border-radius:20px}
  .shop-card{min-height:130px;padding:10px}
}
@media (orientation:portrait) and (max-width:500px){
  .profile-card{width:min(300px,80vw)}
}

<body>
<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Restaurant Dash"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="hits" class="hidden" aria-hidden="true"></div>
  <div id="coopBar" class="hidden" aria-hidden="true">
    <div class="coop-tag left" id="coopP1">P1</div>
    <div class="coop-tag right" id="coopP2">P2</div>
  </div>
  <div id="overlay"></div>
  <div id="rotateTip" class="hidden" role="status" aria-live="polite">
    <div class="hint-banner">Turn sideways for a wider kitchen!</div>
  </div>
  <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause">⏸</button>
  <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  <button id="fsBtn" class="icon-btn" type="button" aria-label="Fullscreen">⛶</button>
</div>
<script>"use strict";
/* ==== 00-core.js ==== */
;(function(){
/* Restaurant Dash — core namespace & helpers */
const RD = window.RD = {
  VERSION: 1,
  SAVE_KEY: 'restaurant-dash-v1',
  W: 1180, H: 600,
  BASE_W: 1180, BASE_H: 600,
  profiles: {
    p1: {
      id: 'p1', defaultName: 'Player 1', label: 'Gentle',
      infiniteLives: true, lives: 99,
      speed: 260, patienceMul: 1.25, cookMul: 0.8, spawnMul: 1.2,
      thinkMul: 0.85, eatMul: 0.9
    },
    p2: {
      id: 'p2', defaultName: 'Player 2', label: 'Busy Shift',
      infiniteLives: false, lives: 3,
      speed: 230, patienceMul: 1.0, cookMul: 1.0, spawnMul: 1.0,
      thinkMul: 1.0, eatMul: 1.0
    }
  },
  memStore: null,
  state: null,
  screen: 'boot',
  raf: 0,
  lastT: 0,
  muted: false,
  autoplay: false,
  keys: Object.create(null),
  canvas: null,
  ctx: null,
  overlay: null,
  hud: null,
  hitsEl: null,
  run: null,
  portrait: false
};

RD.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
RD.lerp = (a, b, t) => a + (b - a) * t;
RD.rand = (a, b) => a + Math.random() * (b - a);
RD.pick = (arr) => arr[(Math.random() * arr.length) | 0];
RD.seeded = (seed) => {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
};
RD.now = () => performance.now();
RD.len = (x, y) => Math.hypot(x, y);
RD.norm = (x, y) => {
  const l = Math.hypot(x, y) || 1;
  return { x: x / l, y: y / l };
};
RD.meta = (id) => RD.profiles[id || (RD.run && RD.run.soloProfile) || (RD.state && RD.state.lastProfile) || 'p1'];
RD.toast = (msg, ms) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), ms || 1400);
};
RD.fitCanvas = () => {
  const c = RD.canvas;
  if (!c) return;
  const iw = window.innerWidth || RD.BASE_W;
  const ih = window.innerHeight || RD.BASE_H;
  const portrait = ih > iw * 1.05;
  RD.portrait = portrait;
  let wantW = RD.BASE_W, wantH = RD.BASE_H;
  if (portrait) {
    const targetScale = 0.88;
    wantW = Math.round(Math.min(520, Math.max(390, iw / targetScale)));
    wantH = Math.round(wantW * (ih / Math.max(1, iw)));
    wantH = RD.clamp(wantH, 700, 1200);
  }
  if (RD.W !== wantW || RD.H !== wantH) {
    RD.W = wantW; RD.H = wantH;
    if (RD.run) RD.Game && RD.Game.reflow && RD.Game.reflow();
  }
  if (c.width !== RD.W) c.width = RD.W;
  if (c.height !== RD.H) c.height = RD.H;
  c.classList.toggle('portrait', !!portrait);
  RD.refreshRotateHint && RD.refreshRotateHint();
};
RD.clear = (color) => {
  const ctx = RD.ctx;
  ctx.fillStyle = color || '#3a2218';
  ctx.fillRect(0, 0, RD.W, RD.H);
};
RD.roundRect = (ctx, x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};
RD.bindTap = (el, fn) => {
  if (!el) return;
  let last = 0;
  const run = (e) => {
    const t = Date.now();
    if (t - last < 260) return;
    last = t;
    try { e.preventDefault(); } catch (_) {}
    fn(e);
  };
  el.addEventListener('pointerup', run);
  el.addEventListener('click', run);
};
RD.worldToScreen = (x, y) => {
  const c = RD.canvas;
  if (!c) return { x: 0, y: 0, scale: 1, left: 0, top: 0 };
  const r = c.getBoundingClientRect();
  const scale = Math.min(r.width / Math.max(1, RD.W), r.height / Math.max(1, RD.H));
  const left = r.left + (r.width - RD.W * scale) / 2;
  const top = r.top + (r.height - RD.H * scale) / 2;
  const app = document.getElementById('app').getBoundingClientRect();
  return {
    x: left - app.left + x * scale,
    y: top - app.top + y * scale,
    scale, left: left - app.left, top: top - app.top
  };
};

})();
/* ==== 10-audio.js ==== */
;(function(){
/* WebAudio SFX — only after first user input */
RD.Audio = (() => {
  let ctx = null, master = null, unlocked = false;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = RD.muted ? 0 : 0.3;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    unlocked = true;
  }

  function tone(freq, dur, type, vol, slide) {
    if (RD.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  return {
    unlock,
    setMuted(m) {
      RD.muted = !!m;
      if (master) master.gain.value = RD.muted ? 0 : 0.3;
      try { localStorage.setItem('rd-mute', RD.muted ? '1' : '0'); } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = RD.muted ? '🔇' : '🔊';
    },
    loadMute() {
      try { RD.muted = localStorage.getItem('rd-mute') === '1'; } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = RD.muted ? '🔇' : '🔊';
    },
    click() { tone(360, 0.05, 'triangle', 0.06); },
    seat() { tone(440, 0.08, 'sine', 0.07); setTimeout(() => tone(560, 0.08, 'sine', 0.06), 50); },
    order() { tone(620, 0.07, 'triangle', 0.07); },
    drop() { tone(300, 0.06, 'square', 0.04); },
    ding() { tone(880, 0.1, 'sine', 0.08); setTimeout(() => tone(1180, 0.12, 'sine', 0.06), 70); },
    serve() { tone(520, 0.08, 'sine', 0.08); setTimeout(() => tone(780, 0.1, 'sine', 0.07), 40); },
    coin() { tone(980, 0.07, 'square', 0.05); setTimeout(() => tone(1320, 0.09, 'sine', 0.06), 40); },
    combo() { [660, 880, 1100].forEach((f, i) => setTimeout(() => tone(f, 0.08, 'sine', 0.07), i * 45)); },
    clear() { tone(400, 0.06, 'triangle', 0.05); },
    leave() { tone(200, 0.16, 'sawtooth', 0.06, 90); },
    win() { [392, 494, 587, 784].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'sine', 0.09), i * 70)); },
    lose() { tone(220, 0.2, 'sawtooth', 0.07, 90); setTimeout(() => tone(140, 0.25, 'triangle', 0.06, 70), 120); },
    buy() { tone(540, 0.08, 'triangle', 0.07); setTimeout(() => tone(720, 0.1, 'sine', 0.06), 60); }
  };
})();

})();
/* ==== 20-save.js ==== */
;(function(){
/* localStorage per-profile saves with in-memory fallback */
RD.Save = (() => {
  function blankUpgrades() {
    return { shoes: 0, table: 0, decor: 0, dish: 0 };
  }

  function blankProfile(id) {
    const meta = RD.profiles[id];
    return {
      id,
      name: meta.defaultName,
      maxLevel: 1,
      cleared: {},
      bestStars: {},
      starsTotal: 0,
      bank: 0,
      upgrades: blankUpgrades(),
      playSeconds: 0
    };
  }

  function blankState() {
    return {
      v: RD.VERSION,
      lastProfile: 'p1',
      profiles: { p1: blankProfile('p1'), p2: blankProfile('p2') }
    };
  }

  function readRaw() {
    try {
      const s = localStorage.getItem(RD.SAVE_KEY);
      if (s) return JSON.parse(s);
    } catch (_) {}
    return RD.memStore;
  }

  function writeRaw(data) {
    RD.memStore = data;
    try {
      localStorage.setItem(RD.SAVE_KEY, JSON.stringify(data));
      return true;
    } catch (_) {
      return false;
    }
  }

  function load() {
    const raw = readRaw();
    if (!raw || raw.v !== RD.VERSION) {
      RD.state = blankState();
      save();
      return RD.state;
    }
    for (const id of ['p1', 'p2']) {
      raw.profiles[id] = Object.assign(blankProfile(id), raw.profiles[id] || {});
      if (!raw.profiles[id].cleared) raw.profiles[id].cleared = {};
      if (!raw.profiles[id].bestStars) raw.profiles[id].bestStars = {};
      raw.profiles[id].upgrades = Object.assign(blankUpgrades(), raw.profiles[id].upgrades || {});
    }
    if (!raw.lastProfile) raw.lastProfile = 'p1';
    RD.state = raw;
    return RD.state;
  }

  function save() {
    if (!RD.state) return false;
    return writeRaw(RD.state);
  }

  function profile(id) {
    if (!RD.state) load();
    return RD.state.profiles[id || RD.state.lastProfile || 'p1'];
  }

  function setProfile(id) {
    RD.state.lastProfile = id;
    save();
  }

  function rename(id, name) {
    const p = profile(id);
    p.name = String(name || RD.profiles[id].defaultName).slice(0, 16) || RD.profiles[id].defaultName;
    save();
  }

  function markCleared(levelId, stars, earned) {
    const p = profile();
    p.cleared[levelId] = true;
    const prev = p.bestStars[levelId] || 0;
    if (stars > prev) {
      p.starsTotal = (p.starsTotal || 0) + (stars - prev);
      p.bestStars[levelId] = stars;
    }
    p.bank = (p.bank || 0) + (earned || 0);
    const list = RD.Levels.forProfile(p.id);
    if (levelId >= p.maxLevel) p.maxLevel = Math.min(list.length, levelId + 1);
    save();
  }

  function buy(kind) {
    const def = RD.Upgrades[kind];
    if (!def) return false;
    const p = profile();
    const tier = p.upgrades[kind] || 0;
    if (tier >= def.max) return false;
    const cost = def.costs[tier];
    if ((p.bank || 0) < cost) return false;
    p.bank -= cost;
    p.upgrades[kind] = tier + 1;
    save();
    return true;
  }

  function resetAll() {
    RD.state = blankState();
    save();
    return RD.state;
  }

  return { load, save, profile, setProfile, rename, markCleared, buy, resetAll, blankProfile, blankState, readRaw, writeRaw, blankUpgrades };
})();

})();
/* ==== 30-levels.js ==== */
;(function(){
/* Themed shifts, dishes, and between-level upgrades */
RD.THEMES = {
  pizza: {
    id: 'pizza', name: 'Pizza Place',
    sky: ['#f7d9b0', '#e8b86d'], floor: '#d9a066', wall: '#c44536',
    accent: '#fff6e8', wood: '#7a3e22', tileA: '#f4efe6', tileB: '#c44536'
  },
  taco: {
    id: 'taco', name: 'Taco Truck',
    sky: ['#ffe0a8', '#f4a261'], floor: '#c9843e', wall: '#2d6a4f',
    accent: '#ffe8c8', wood: '#6b3a1c', tileA: '#f2d6a6', tileB: '#e07a2f'
  },
  chaat: {

      const py = run.kitchen.y - run.kitchen.h / 2 - 28;

    run.kitchen.queue.forEach((q, i) => {

    const run = RD.run;

        if (n && list[n - 1]) RD.Game.start(n, { profile: pid, coop: !!coop });
        else levels(!!coop);
      } else levels(!!coop);
    });
  }

  function updateHud() {
    const el = RD.hud;
    if (!el || !RD.run) return;
    const r = RD.run;
    const lives = r.infinite ? '∞' : '♥'.repeat(r.lives) + (r.lives < 3 && !r.infinite ? '' : '');
    const lifeBit = r.infinite ? '<span class="chip">Gentle shift</span>' : `<span class="chip">${lives}</span>`;
    const theme = RD.THEMES[r.theme] ? RD.THEMES[r.theme].name : '';
    el.innerHTML = `
      <span class="chip">${theme}</span>
      <span class="chip">Shift ${r.levelId}</span>
      <span class="chip">🪙 ${r.coins}/${r.goal}</span>
      ${r.combo >= 2 ? `<span class="chip">Combo x${r.combo}</span>` : ''}
      ${lifeBit}
    `;
  }

  function showPause() {
    const panel = overlayPanel(`
      <div class="col">
        <div class="title">Paused</div>
        <div class="row">
          <button class="btn big green" id="btnResume" type="button">Resume</button>
          <button class="btn ghost" id="btnMenu" type="button">Menu</button>
        </div>
      </div>`);
    RD.bindTap(panel.querySelector('#btnResume'), () => { RD.Audio.click(); RD.Game.togglePause(); });
    RD.bindTap(panel.querySelector('#btnMenu'), () => { RD.Audio.click(); if (RD.run) RD.run.paused = false; title(); });
  }

  function showResult(win) {
    const run = RD.run;
    if (!run) return title();
    RD.screen = 'result';
    hidePlayChrome();
    const pid = run.soloProfile;
    const list = RD.Levels.forProfile(pid);
    const next = list.find((l) => l.id === run.levelId + 1);
    RD._nextLevel = next ? next.id : null;
    const panel = overlayPanel(`
      <div class="col">
        <div class="title">${win ? 'Shift complete!' : 'Try that shift again'}</div>
        <div class="sub">${win ? starsText(run.stars) + '<br>Earned ' + run.coins + ' coins' + (run.tips ? ' (tips ' + run.tips + ')' : '') : (run.infinite ? 'Guests wandered off. Ready when you are.' : 'Out of lives. The kitchen is still cheering for you.')}</div>
        <div class="row">
          ${win ? `<button class="btn big green" id="btnShop" type="button">Upgrades</button>` : ''}
          <button class="btn ${win ? 'tomato' : 'green'} big" id="btnAgain" type="button">${win ? 'Replay' : 'Retry'}</button>
          <button class="btn ghost" id="btnMenu" type="button">Menu</button>
        </div>
      </div>`);
    if (win) RD.bindTap(panel.querySelector('#btnShop'), () => { RD.Audio.click(); shop(true, run.coop); });
    RD.bindTap(panel.querySelector('#btnAgain'), () => {
      RD.Audio.click();
      RD.Game.start(run.levelId, { profile: pid, coop: run.coop });
    });
    RD.bindTap(panel.querySelector('#btnMenu'), () => { RD.Audio.click(); levels(!!run.coop); });
  }

  return { title, profiles, levels, how, shop, showHud: showPlayChrome, updateHud, showPlayChrome, showPause, showResult, hidePlayChrome, hideOverlay };
})();

;(function(){
/* Boot, input, loop, fullscreen, debug hook */
(function boot() {
  function loop(t) {
    const dt = Math.min(0.033, (t - (RD.lastT || t)) / 1000);
    RD.lastT = t;
    if (RD._rotateHintTimer > 0) {
      RD._rotateHintTimer -= dt;
      if (RD._rotateHintTimer <= 0) {
        RD._rotateDismissed = true;
        const tip = document.getElementById('rotateTip');
        if (tip) tip.classList.add('hidden');
      }
    }
    RD.fitCanvas();
    if (RD.screen === 'play' && RD.run) {
      RD.Game.tick(dt);
      RD.Game.draw();
    } else {
      const ctx = RD.ctx;
      if (ctx) {
        const sec = t / 1000;
        const theme = (RD.run && RD.run.theme) || 'pizza';
        RD.Art.drawBg(ctx, theme, sec);
        RD.Art.drawTitleWaiter(ctx, RD.W * 0.5, RD.H * 0.66, sec);
        RD.Art.drawTitleGuest(ctx, RD.W * 0.28, RD.H * 0.68, sec, 0);
        RD.Art.drawTitleGuest(ctx, RD.W * 0.72, RD.H * 0.70, sec, 2);
      }
    }
    RD.raf = requestAnimationFrame(loop);
  }

  function bindInput() {
    window.addEventListener('keydown', (e) => {
      RD.Audio.unlock();
      RD.keys[e.key] = true;
      if (e.code) RD.keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
      if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && RD.run && RD.screen === 'play') {
        RD.Game.togglePause();
      }
    }, { passive: false });
    window.addEventListener('keyup', (e) => {
      RD.keys[e.key] = false;
      if (e.code) RD.keys[e.code] = false;
    });
    const unlock = () => RD.Audio.unlock();
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('touchstart', unlock, { passive: true });

    try {
      RD._rotateSeenEver = localStorage.getItem('rd-rotate-hint-v1') === '1';
    } catch (e) { RD._rotateSeenEver = false; }
    RD._rotateDismissed = !!RD._rotateSeenEver;
    RD._rotateHintTimer = 0;
    RD.refreshRotateHint = () => {
      const tip = document.getElementById('rotateTip');
      if (!tip) return;
      const show = !!RD.portrait && !RD._rotateDismissed && RD.screen === 'play';
      if (show && tip.classList.contains('hidden')) {
        tip.classList.remove('hidden');
        RD._rotateHintTimer = 4.0;
        try { localStorage.setItem('rd-rotate-hint-v1', '1'); RD._rotateSeenEver = true; } catch (err) {}
      }
      if (!show) tip.classList.add('hidden');
    };
    window.addEventListener('resize', () => {
      RD.fitCanvas();
      if (RD.screen === 'play' && RD.run) RD.Game.syncHits();
    });
    window.addEventListener('orientationchange', () => setTimeout(() => {
      RD.fitCanvas();
      if (RD.screen === 'play' && RD.run) RD.Game.syncHits();
    }, 50));

    const mute = document.getElementById('muteBtn');
    if (mute) mute.onclick = () => { RD.Audio.unlock(); RD.Audio.setMuted(!RD.muted); };
    const fs = document.getElementById('fsBtn');
    if (fs) fs.onclick = () => {
      RD.Audio.unlock();
      const app = document.getElementById('app');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const req = app.requestFullscreen || app.webkitRequestFullscreen;
        if (req) req.call(app).catch(() => {});
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
      }
    };
    const pause = document.getElementById('pauseBtn');
    if (pause) {
      pause.classList.add('hidden');
      pause.onclick = () => { RD.Audio.unlock(); RD.Game.togglePause(); };
    }
  }

  function init() {
    RD.canvas = document.getElementById('game');
    RD.ctx = RD.canvas.getContext('2d');
    RD.overlay = document.getElementById('overlay');
    RD.hud = document.getElementById('hud');
    RD.hitsEl = document.getElementById('hits');
    RD.fitCanvas();
    RD.Save.load();
    RD.Audio.loadMute();
    bindInput();
    RD.screen = 'title';
    RD.UI.title();
    RD.raf = requestAnimationFrame(loop);

    window.__game = {
      RD,
      start(level, profile, coop) {
        if (profile && !coop) RD.Save.setProfile(profile);
        return RD.Game.start(level || 1, { profile: profile, coop: !!coop, autoplay: false });
      },
      startCoop(level) { return RD.Game.start(level || 1, { coop: true }); },
      autoplay(on) { RD.autoplay = on !== false; return RD.autoplay; },
      state: () => RD.state,
      run: () => RD.run,
      screen: () => RD.screen,
      goTitle: () => RD.UI.title(),
      goProfiles: () => RD.UI.profiles(),
      goLevels: (coop) => RD.UI.levels(!!coop),
      goHow: () => RD.UI.how(),
      goShop: () => RD.UI.shop(false, false),
      pause: () => RD.Game.togglePause(),
      muted: () => RD.muted,
      hit: (role, index, ev) => RD.Game.handleHit(role, index, ev || { clientX: 10 }),
      fastForward: (s) => RD.Game.fastForward(s),
      solveAll: (pid, fresh) => RD.Game.solveAll(pid, fresh !== false),
      resetSave: () => RD.Save.resetAll()
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

<script id="car-mode-js">
window.__CAR_GAME = "restaurant-dash";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
