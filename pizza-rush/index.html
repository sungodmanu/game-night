<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230e121b%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%23ffd77a%27/%3E%3Ccircle cx=%2740%27 cy=%2726%27 r=%2716%27 fill=%27%230e121b%27/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5c2a1a">
<title>Pizza Rush</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;width:100%;overflow:hidden;background:#3d1f12;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#3a1a10;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 10%,#ffb347 0%,#e87a3a 35%,#8b3a1a 75%,#3d1f12 100%)}
#game{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#5c3317;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.45)}
#overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
#overlay > *{pointer-events:auto}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
#hud.hidden{display:none}
.icon-btn{position:absolute;z-index:30;width:48px;height:48px;min-width:48px;min-height:48px;border:none;border-radius:14px;background:rgba(255,255,255,.92);color:#3a1a10;font-size:22px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25)}
/* Mute / FS stay top-right of the app — never sit on Quit */
#muteBtn{top:calc(8px + env(safe-area-inset-top));right:calc(56px + env(safe-area-inset-right))}
#fsBtn{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))}
.icon-btn:active{transform:scale(.94)}
.btn{min-width:48px;min-height:48px;padding:12px 22px;border:none;border-radius:18px;font-size:20px;font-weight:800;cursor:pointer;color:#3a1a10;background:#ffe566;box-shadow:0 4px 0 #d4b000,0 8px 18px rgba(0,0,0,.2);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d4b000,0 4px 10px rgba(0,0,0,.2)}
.btn.big{font-size:24px;padding:14px 26px;border-radius:22px;min-height:56px}
.btn.green{background:#7dff9a;box-shadow:0 4px 0 #2db854,0 8px 18px rgba(0,0,0,.2)}
.btn.blue{background:#7ec8ff;box-shadow:0 4px 0 #2a7fbf,0 8px 18px rgba(0,0,0,.2)}
.btn.pink{background:#ff9ad4;box-shadow:0 4px 0 #d44f9a,0 8px 18px rgba(0,0,0,.2)}
.btn.orange{background:#ffb347;box-shadow:0 4px 0 #d47800,0 8px 18px rgba(0,0,0,.2)}
.btn.red{background:#ff7a7a;box-shadow:0 4px 0 #c04040,0 8px 18px rgba(0,0,0,.2)}
.btn.ghost{background:rgba(255,255,255,.55);color:#3a1a10;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.panel{background:linear-gradient(180deg,#fff6e8 0%,#ffe0b8 100%);border:4px solid #e8a04a;border-radius:28px;padding:18px;box-shadow:0 16px 50px rgba(0,0,0,.35),inset 0 1px 0 #fff;max-width:min(1000px,96vw);max-height:min(94dvh,94vh);overflow:auto;color:#3a1a10}
.title{font-size:clamp(26px,5vw,42px);font-weight:900;letter-spacing:.5px;text-align:center;color:#8b2e0e;text-shadow:0 2px 0 rgba(255,255,255,.6);margin-bottom:6px}
.sub{text-align:center;opacity:.9;margin-bottom:12px;font-size:15px;color:#5c3317;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.profile-card{width:min(280px,42vw);min-height:200px;border-radius:24px;background:linear-gradient(160deg,#fff 0%,#ffe8c8 100%);border:4px solid #f0a830;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.2);color:#3a1a10}
.profile-card:active{transform:scale(.97)}
.profile-card h2{font-size:22px;margin-top:2px;color:#8b2e0e}
.profile-card .meta{font-size:14px;opacity:.85;text-align:center;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;border:2px solid #f0c070;font-weight:800;min-height:36px;color:#5c3317;font-size:14px}
.toast{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:rgba(60,20,10,.88);color:#fff;padding:12px 20px;border-radius:16px;font-weight:800;font-size:20px;z-index:40;pointer-events:none;animation:pop .45s ease}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}40%{transform:translateX(-50%) scale(1.06);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
.hidden{display:none!important}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;width:100%;max-width:760px;max-height:46vh;overflow:auto;padding:4px}
.lvl{min-width:52px;min-height:52px;border-radius:14px;border:3px solid #f0c070;background:#fff;color:#8b2e0e;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #e8a04a}
.lvl.done{background:#7dff9a;border-color:#2db854}
.lvl.rush{background:linear-gradient(160deg,#ffb088,#ff6b6b);color:#fff;border-color:#c04040}
.lvl.vip{background:linear-gradient(160deg,#ffe566,#f0a830);border-color:#d4a017}
.lvl.locked{opacity:.35;cursor:default;box-shadow:none}
.lvl.cur{outline:3px solid #ff6b35;outline-offset:2px}

.ing-btn{min-width:64px;min-height:72px;width:72px;height:80px;border-radius:16px;border:3px solid #f0a830;background:linear-gradient(180deg,#ffffff,#fff3d6);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;color:#5c3317;font-weight:800;font-size:11px;padding:4px 2px 6px;box-shadow:0 3px 0 #e08a20}
.ing-btn canvas{width:52px;height:44px;pointer-events:none;border-radius:10px;background:rgba(255,200,120,.25)}
.ing-btn.sel{border-color:#2db854;background:linear-gradient(180deg,#e8ffe8,#b8f5c8);box-shadow:0 3px 0 #2db854,0 0 0 3px rgba(125,255,154,.45)}
.ing-btn.locked{opacity:.35;filter:grayscale(.7);cursor:default}
.ing-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;min-width:0}
.ing-line{display:flex;flex-direction:row;align-items:center;gap:8px;width:100%;margin:3px 0}
.ing-label{flex:0 0 64px;font-weight:900;font-size:13px;color:#8b2e0e;text-align:right}

.upgrade-card{min-width:130px;min-height:110px;border-radius:18px;background:linear-gradient(180deg,#fff,#ffe8c8);border:3px solid #f0a830;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#3a1a10;font-weight:800;font-size:13px;text-align:center;box-shadow:0 4px 0 #e08a20}
.upgrade-card.owned{border-color:#2db854;background:linear-gradient(180deg,#e8ffe8,#c8f5d8)}
.upgrade-card.locked{opacity:.4;cursor:default}
.coin-btn{min-width:52px;min-height:52px;width:56px;height:56px;border-radius:50%;border:3px solid #c9a227;background:radial-gradient(circle at 35% 30%,#ffe566,#d4a017);color:#3a1a10;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #8a6a00;display:flex;align-items:center;justify-content:center;padding:0}
.coin-btn:active{transform:translateY(2px)}
.coin-tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px}
.coin-target-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:100%}
.coin-target-row canvas{width:28px;height:28px}
.patience{height:12px;border-radius:8px;background:rgba(0,0,0,.12);overflow:hidden;width:100%;max-width:160px;border:2px solid #e8a04a}
.patience > i{display:block;height:100%;background:linear-gradient(90deg,#7dff9a,#ffe566,#ff7a7a);width:100%;transform-origin:left}

/* Play layout */
.play-panel{width:min(1100px,98vw)!important;padding:8px 12px!important;background:linear-gradient(180deg,#fff8ee 0%,#ffd9a8 100%)!important;overflow:hidden!important;max-height:min(96dvh,580px)!important}
/* Reserve room so Quit never sits under mute/fullscreen */
.play-top{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;align-items:center;width:100%;margin-bottom:4px;padding-right:128px;box-sizing:border-box}
.play-top #btnQuit{margin-left:auto;flex-shrink:0}
.play-grid{display:grid;grid-template-columns:180px 1fr 280px;gap:8px;width:100%;align-items:stretch;min-height:0}
.play-left,.play-center,.play-right{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.order-canvas,.pizza-canvas{display:block;border-radius:18px;background:linear-gradient(180deg,#fff,#ffe8c8);border:3px solid #f0a830;box-shadow:0 4px 14px rgba(0,0,0,.12);width:100%;height:auto;max-height:min(400px,58vh)}
.pizza-canvas.pizza-pay{max-height:min(180px,42vh)}
.play-right{align-items:stretch;overflow:hidden;max-height:min(460px,72vh);padding-right:2px;display:flex;flex-direction:column}
.ings-scroll{flex:1;min-height:0;overflow:auto;width:100%;padding-bottom:4px}
.bake-row{flex-shrink:0;padding:6px 0 2px;margin-top:2px;background:linear-gradient(180deg,rgba(255,248,238,0),#ffe0b0 25%,#ffd9a8 100%);width:100%;display:flex;justify-content:center;z-index:2}
.bake-meter{position:relative;width:92%;height:22px;border-radius:12px;background:#f3e6d0;border:2px solid #e8a04a;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.bake-zones{position:absolute;inset:0;display:flex;pointer-events:none;z-index:0}
.bake-zones i{display:block;height:100%}
.bake-zones .z-early{background:rgba(180,180,180,.35)}
.bake-zones .z-good{background:linear-gradient(90deg,rgba(125,255,154,.55),rgba(255,229,102,.65))}
.bake-zones .z-late{background:rgba(255,122,122,.45)}
.bake-ideal{position:absolute;top:0;bottom:0;width:3px;background:#2db854;z-index:2;transform:translateX(-1px);box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.bake-fill{position:absolute;left:0;top:0;bottom:0;z-index:1;background:linear-gradient(90deg,#6ad0ff,#7dff9a 40%,#ffe566 70%,#ff7a7a);opacity:.92;transition:width .08s linear;pointer-events:none}
.bake-legend{display:flex;justify-content:space-between;width:92%;font-size:10px;font-weight:800;color:#8b2e0e;margin:2px 0 4px;opacity:.85}
.bake-legend .leg-good{color:#1a7a3a}
.bake-legend .leg-late{color:#c04040}
.msg{font-weight:800;font-size:13px;color:#8b2e0e;text-align:center;min-height:18px}
.pay-panel-right{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:4px;justify-content:center;flex:1}
.pay-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}

@media (max-width:900px),(max-height:650px){
  .play-grid{grid-template-columns:150px 1fr 260px;gap:6px}
  .ing-btn{width:56px;height:64px;min-width:52px;min-height:56px}
  .ing-btn canvas{width:40px;height:32px}
  .ing-label{flex:0 0 48px;font-size:11px}
  .play-panel{max-height:min(96dvh,560px)!important;padding:6px 8px!important}
  .order-canvas,.pizza-canvas{max-height:min(300px,48vh)}
  .pizza-canvas.pizza-pay{max-height:min(150px,36vh)}
  .play-right{max-height:min(420px,70vh);overflow:hidden}
  .play-top{padding-right:128px}
  .profile-card{min-height:160px;width:min(240px,40vw)}
  .title{font-size:clamp(22px,4.5vw,32px)}
  .btn.big{min-height:48px;font-size:18px;padding:10px 18px}
}
@media (max-width:700px),(orientation:portrait) and (max-width:500px){
  /* Tall narrow: order+pizza side-by-side, ingredients below — all must fit without scroll */
  .play-panel{max-height:min(96dvh,820px)!important;padding:4px 6px!important;overflow:hidden!important}
  .play-grid{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:4px}
  .play-left{grid-column:1;grid-row:1}
  .play-center{grid-column:2;grid-row:1}
  .play-right{grid-column:1 / -1;grid-row:2;max-height:min(360px,48vh);overflow:hidden}
  .order-canvas{max-height:min(200px,28vh)}
  .pizza-canvas{max-height:min(200px,28vh)}
  .pizza-canvas.pizza-pay{max-height:min(140px,20vh)}
  .play-top{padding-right:128px}
  .profile-card{width:min(300px,80vw)}
  .ings-scroll{max-height:min(220px,30vh)}
  .pay-panel-right{max-height:min(280px,40vh)}
}
@media (max-height:420px) and (orientation:landscape){
  .play-grid{grid-template-columns:110px 1fr 230px;gap:4px}
  .ing-btn{width:48px;height:50px;min-width:48px;min-height:48px;font-size:9px;padding:2px}
  .ing-btn canvas{width:30px;height:22px}
  .ing-label{flex:0 0 40px;font-size:10px}
  .ing-line{margin:0}
  .play-panel{max-height:96dvh!important;padding:3px 6px!important}
  .order-canvas{max-height:min(170px,58vh)}
  .pizza-canvas{max-height:min(180px,58vh)}
  .pizza-canvas.pizza-pay{max-height:min(120px,40vh)}
  .play-right{max-height:min(310px,86vh)}
  .play-top{padding-right:128px;gap:4px;margin-bottom:2px}
  .play-top .chip{padding:3px 8px;min-height:26px;font-size:11px}
  .btn.big{min-height:48px;font-size:15px;padding:8px 14px}
  .coin-btn{width:48px;height:48px;min-width:48px;min-height:48px}
  .pay-panel-right{gap:4px}
  .msg{font-size:12px;min-height:14px}
}
</style>

<body>
<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Pizza Rush"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="overlay"></div>
  <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  <button id="fsBtn" class="icon-btn" type="button" aria-label="Fullscreen">⛶</button>
</div>
<script>"use strict";
/* ==== 00-core.js ==== */
;(function(){
/* Pizza Rush — core namespace & helpers */
const PR = window.PR = {
  VERSION: 1,
  SAVE_KEY: 'pizza-rush-v1',
  W: 1180, H: 600,
  DAY_COUNT: 36,
  profiles: {
    alpha: { id: 'alpha', defaultName: 'Player 1', label: 'Easy', noGameOver: true, patience: false, mathMode: 'count', tipMul: 1.2 },
    beta:  { id: 'beta',  defaultName: 'Player 2', label: 'Challenge', noGameOver: false, patience: true, mathMode: 'ops', tipMul: 1.0, hearts: 3 }
  },
  memStore: null,
  state: null,
  screen: 'boot',
  raf: 0,
  lastT: 0,
  muted: false,
  keys: Object.create(null),
  canvas: null,
  ctx: null,
  overlay: null,
  hud: null,
  run: null
};

PR.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
PR.lerp = (a, b, t) => a + (b - a) * t;
PR.rand = (a, b) => a + Math.random() * (b - a);
PR.pick = (arr) => arr[(Math.random() * arr.length) | 0];
PR.seeded = (seed) => {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
};
PR.now = () => performance.now();

PR.toast = (msg, ms) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), ms || 1400);
};

PR.fitCanvas = () => {
  const c = PR.canvas;
  if (!c) return;
  if (c.width !== PR.W) c.width = PR.W;
  if (c.height !== PR.H) c.height = PR.H;
};

PR.clear = (color) => {
  const ctx = PR.ctx;
  ctx.fillStyle = color || '#4a2418';
  ctx.fillRect(0, 0, PR.W, PR.H);
};

PR.roundRect = (ctx, x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};

})();
/* ==== 10-audio.js ==== */
;(function(){
/* Gentle WebAudio SFX */
PR.Audio = (() => {
  let ctx = null, master = null, unlocked = false;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = PR.muted ? 0 : 0.35;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    unlocked = true;
  }

  function tone(freq, dur, type, vol, slide) {
    if (PR.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol) {
    if (PR.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const n = Math.max(1, (c.sampleRate * dur) | 0);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    g.gain.value = vol || 0.08;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1400;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  return {
    unlock,
    setMuted(m) {
      PR.muted = !!m;
      if (master) master.gain.value = PR.muted ? 0 : 0.35;
      try { localStorage.setItem('pr-mute', PR.muted ? '1' : '0'); } catch (_) {}
    },
    loadMute() {
      try { PR.muted = localStorage.getItem('pr-mute') === '1'; } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = PR.muted ? '🔇' : '🔊';
    },
    click() { tone(320, 0.05, 'triangle', 0.07); },
    soft() { tone(360, 0.08, 'sine', 0.08); },
    plop() { tone(220, 0.1, 'sine', 0.1, 140); },
    sauce() { tone(180, 0.12, 'triangle', 0.09, 120); noise(0.05, 0.04); },
    cheese() { tone(440, 0.1, 'sine', 0.1); },
    topping() { tone(520, 0.08, 'triangle', 0.09); },
    oven() { tone(140, 0.2, 'sawtooth', 0.06, 90); noise(0.12, 0.05); },
    ding() { tone(880, 0.12, 'sine', 0.12); setTimeout(() => tone(1175, 0.14, 'sine', 0.1), 70); },
    burn() { tone(90, 0.25, 'sawtooth', 0.08, 50); noise(0.2, 0.07); },
    slice() { tone(700, 0.06, 'triangle', 0.08); noise(0.04, 0.04); },
    coin() { tone(660, 0.07, 'sine', 0.1); setTimeout(() => tone(880, 0.09, 'sine', 0.09), 50); },
    tip() { tone(523, 0.08, 'sine', 0.1); setTimeout(() => tone(659, 0.1, 'sine', 0.1), 60); setTimeout(() => tone(784, 0.14, 'sine', 0.1), 120); },
    win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'sine', 0.12), i * 90)); },

      id,
      name: meta.defaultName,
      maxDay: 1,
      cleared: {},
      coins: 0,
      tips: 0,
      upgrades: [],
      decorations: [],
      unlockedToppings: ['pepperoni', 'mushroom'],
      hearts: meta.hearts || 3,
      playSeconds: 0,
      pizzasServed: 0
    };
  }

  function blankState() {
    return {
      v: PR.VERSION,
      lastProfile: null,
      profiles: {
        alpha: blankProfile('alpha'),
        beta: blankProfile('beta')
      }
    };
  }

  function readRaw() {
    try {
      const s = localStorage.getItem(PR.SAVE_KEY);
      if (s) return JSON.parse(s);
    } catch (_) {}
    return PR.memStore;
  }

  function writeRaw(data) {
    PR.memStore = data;
    try {
      localStorage.setItem(PR.SAVE_KEY, JSON.stringify(data));
      return true;
    } catch (_) {
      return false;
    }
  }

  function load() {
    const raw = readRaw();
    if (!raw || raw.v !== PR.VERSION) {
      PR.state = blankState();
      save();
      return PR.state;
    }
    for (const id of ['alpha', 'beta']) {
      raw.profiles[id] = Object.assign(blankProfile(id), raw.profiles[id] || {});
      if (!raw.profiles[id].cleared) raw.profiles[id].cleared = {};
      if (!Array.isArray(raw.profiles[id].upgrades)) raw.profiles[id].upgrades = [];
      if (!Array.isArray(raw.profiles[id].decorations)) raw.profiles[id].decorations = [];
      if (!Array.isArray(raw.profiles[id].unlockedToppings)) raw.profiles[id].unlockedToppings = ['pepperoni', 'mushroom'];
    }

    return PR.state;
  }

  function save() {
    if (!PR.state) return false;
    return writeRaw(PR.state);
  }

  function profile(id) {
    if (!PR.state) load();
    return PR.state.profiles[id || PR.state.lastProfile || 'alpha'];
  }

    unlocked.forEach((item) => {
      const isSel = selectedArr ? selectedArr.includes(item.id) : selected === item.id;
      html += '<button class="ing-btn' + (isSel ? ' sel' : '') + '" type="button" data-kind="' + kind + '" data-id="' + item.id + '">';
      html += '<canvas width="64" height="48" data-ing="' + kind + ':' + item.id + '"></canvas>';
      html += '<span>' + item.name + '</span></button>';
    });
    html += '</div></div>';
    return html;
  }

  function mathPanel(r, c) {
    let html = '<div class="pay-panel-right">';
    if (r.meta.mathMode === 'count') {
      html += '<div class="msg">Count out <b>' + r.payTarget + '</b></div>';
      html += '<div class="coin-target-row">';
      const show = Math.min(r.payTarget, 10);
      for (let i = 0; i < show; i++) {
        html += '<canvas width="28" height="28" class="coin-vis" data-i="' + i + '"></canvas>';
      }
      if (r.payTarget > 10) html += '<span class="chip">×' + r.payTarget + '</span>';
      html += '</div>';
    } else {
      html += '<div class="msg">Price <b>' + c.price + '</b> · Paid <b>' + c.pays + '</b></div>';
      html += '<div class="msg">Change <b>' + r.payTarget + '</b></div>';
    }
    html += '<div class="chip" id="givenChip">Given: ' + r.payGiven + ' / ' + r.payTarget + '</div>';
    html += '<div class="coin-tray">';
    const coins = r.meta.mathMode === 'count' ? [1] : [1, 2, 5, 10];
    coins.forEach((v) => {
      html += '<button class="coin-btn" type="button" data-v="' + v + '" aria-label="coin ' + v + '">';
      html += '<canvas class="coin-face" width="36" height="36" data-v="' + v + '"></canvas>';
      html += '</button>';
    });
    html += '</div><div class="pay-actions">';
    html += '<button class="btn ghost" id="btnClearPay" type="button">Clear</button>';
    html += '<button class="btn big green" id="btnConfirmPay" type="button">Serve</button>';
    html += '</div></div>';
    return html;
  }

  function drawBackdrop() {
    if (!PR.ctx) return;
    const r = PR.run;
    const loc = (r && r.day && r.day.loc) || 'downtown';
    PR.Art.drawShopBg(PR.ctx, loc, { ovenGlow: r && r.ovenGlow });
    const p = PR.state && PR.Save.profile();
    if (p && p.decorations) {
      p.decorations.forEach((id, i) => {
        const x = 80 + i * 90;
        const y = PR.H * 0.52;
        PR.ctx.fillStyle = id === 'neon' ? '#ff6ec7' : id === 'plant' ? '#27ae60' : '#f5d76e';
        PR.roundRect(PR.ctx, x, y, 50, 40, 8);
        PR.ctx.fill();
      });
    }
  }

  return {
    profilePicker, hub, daySelect, upgrades, startPlay,
    renderPlayUI, updateBakeMeter,
    drawBackdrop, pick
  };
})();

})();

;(function(){
/* Bootstrap, loop, window.__game */
(function boot() {
  function init() {
    PR.canvas = document.getElementById('game');
    PR.ctx = PR.canvas.getContext('2d');
    PR.overlay = document.getElementById('overlay');
    PR.hud = document.getElementById('hud');
    PR.fitCanvas();
    PR.Audio.loadMute();
    PR.Save.load();

    document.getElementById('muteBtn').onclick = () => {
      PR.Audio.unlock();
      PR.Audio.setMuted(!PR.muted);
      document.getElementById('muteBtn').textContent = PR.muted ? '🔇' : '🔊';
    };
    const fsBtn = document.getElementById('fsBtn');
    if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) {
      fsBtn.style.display = 'none';
    } else {
      fsBtn.onclick = () => {
        const el = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
      };
    }

    window.addEventListener('resize', PR.fitCanvas);
    window.addEventListener('orientationchange', () => setTimeout(PR.fitCanvas, 100));

    ['pointerdown', 'touchstart', 'keydown'].forEach((ev) =>
      window.addEventListener(ev, () => PR.Audio.unlock(), { passive: true })
    );

    const autosave = () => PR.Save.save();
    window.addEventListener('pagehide', autosave);
    document.addEventListener('visibilitychange', () => { if (document.hidden) autosave(); });
    setInterval(autosave, 5000);

    window.__game = {
      PR,
      save: PR.Save,
      pick: (id) => { PR.Save.setProfile(id); PR.UI.hub(); },
      profiles: () => PR.UI.profilePicker(),
      hub: () => PR.UI.hub(),
      start: (day, pid) => {
        if (pid) PR.Save.setProfile(pid);
        PR.UI.startPlay(day || 1);
      },
      getRun: () => PR.Shop.getRun(),
      solve: (day, pid, opts) => PR.Shop.solve(day, pid, opts),
      solveAll: (pid, opts) => {
        const out = [];
        for (let i = 1; i <= PR.DAY_COUNT; i++) {
          out.push(PR.Shop.solve(i, pid || 'alpha', Object.assign({ proof: true }, opts || {})));
        }
        return out;
      },
      days: () => PR.Data.summary(),
      dayCount: () => PR.DAY_COUNT,
      resetSave: () => { PR.state = PR.Save.blankState(); PR.Save.save(); },
      setMaxDay: (n, pid) => {
        const p = PR.Save.profile(pid || PR.state.lastProfile);
        p.maxDay = n;
        PR.Save.save();
      },
      screen: () => PR.screen,
      state: () => PR.state,
      buyUpgrade: (id) => PR.Shop.buyUpgrade(id),
      render: () => PR.UI.renderPlayUI()
    };

    PR.lastT = PR.now();
    function frame(t) {
      const dt = Math.min(0.05, (t - PR.lastT) / 1000);
      PR.lastT = t;
      if (PR.screen === 'play' && PR.run) {
        const prevPhase = PR.run.phase;
        PR.Shop.tick(dt);
        // refresh UI while baking or patience changing
        if (PR.run.phase !== prevPhase) {
          PR.UI.renderPlayUI();
        } else if (PR.run.phase === 'bake') {
          // NEVER full-rebuild overlay while baking — that destroyed Pull mid-press.
          PR.UI.updateBakeMeter();
        }
      }
      PR.UI.drawBackdrop();
      PR.raf = requestAnimationFrame(frame);
    }
    PR.raf = requestAnimationFrame(frame);

    PR.UI.profilePicker();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

})();</script>

<script id="car-mode-js">
window.__CAR_GAME = "pizza-rush";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
</script>
