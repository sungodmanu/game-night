<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230e121b%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%23ffd77a%27/%3E%3Ccircle cx=%2740%27 cy=%2726%27 r=%2716%27 fill=%27%230e121b%27/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<title>Dragon Keeper</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;width:100%;overflow:hidden;background:#0a1a2e;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 10%,#2a5a8c 0%,#0a1a2e 70%)}
#game{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#1a3a5c;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.45)}
#overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
#overlay > *{pointer-events:auto}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
#hud.hidden{display:none}
.icon-btn{position:absolute;z-index:20;width:48px;height:48px;min-width:48px;min-height:48px;border:none;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#muteBtn{top:calc(8px + env(safe-area-inset-top));right:calc(60px + env(safe-area-inset-right))}
#fsBtn{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))}
.icon-btn:active{transform:scale(.94)}
.btn{min-width:48px;min-height:48px;padding:12px 22px;border:none;border-radius:18px;font-size:20px;font-weight:800;cursor:pointer;color:#1a2744;background:#ffe566;box-shadow:0 4px 0 #d4b000,0 8px 18px rgba(0,0,0,.25);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d4b000,0 4px 10px rgba(0,0,0,.25)}
.btn.big{font-size:24px;padding:14px 26px;border-radius:22px;min-height:60px}
.btn.green{background:#7dff9a;box-shadow:0 4px 0 #2db854,0 8px 18px rgba(0,0,0,.25)}
.btn.blue{background:#7ec8ff;box-shadow:0 4px 0 #2a7fbf,0 8px 18px rgba(0,0,0,.25)}
.btn.pink{background:#ff9ad4;box-shadow:0 4px 0 #d44f9a,0 8px 18px rgba(0,0,0,.25)}
.btn.orange{background:#ffb347;box-shadow:0 4px 0 #d47800,0 8px 18px rgba(0,0,0,.25)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.panel{background:rgba(24,48,86,.88);border:3px solid rgba(255,255,255,.22);border-radius:28px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 16px 50px rgba(0,0,0,.4);max-width:min(960px,96vw);max-height:min(94dvh,94vh);overflow:auto}
.title{font-size:clamp(26px,5vw,42px);font-weight:900;letter-spacing:.5px;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35);margin-bottom:6px}
.sub{text-align:center;opacity:.85;margin-bottom:14px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.profile-card{width:min(280px,42vw);min-height:200px;border-radius:24px;background:linear-gradient(160deg,#3a6a9c,#1a3a5c);border:4px solid rgba(255,255,255,.2);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.profile-card:active{transform:scale(.97)}
.profile-card h2{font-size:22px}
.profile-card .meta{font-size:14px;opacity:.85;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:700;min-height:40px}
.pad{position:absolute;z-index:8;bottom:calc(10px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
.pad .cluster{display:flex;gap:10px;pointer-events:auto}
.pad-btn{width:68px;height:68px;min-width:68px;min-height:68px;border:none;border-radius:18px;background:rgba(255,255,255,.22);color:#fff;font-size:28px;font-weight:900;cursor:pointer;backdrop-filter:blur(4px);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pad-btn:active,.pad-btn.held{transform:translateY(2px);background:rgba(255,230,100,.55)}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:min(520px,70vw);text-align:center;background:rgba(0,0,0,.72);padding:12px 20px;border-radius:16px;font-weight:800;font-size:18px;z-index:30;pointer-events:none;animation:pop .45s ease}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}40%{transform:translateX(-50%) scale(1.06);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
.hidden{display:none!important}
input.name-in,select.name-in{font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;min-height:48px;width:min(240px,70vw);text-align:center}
input.name-in::placeholder{color:rgba(255,255,255,.45)}
select.name-in option{color:#111;background:#fff}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;width:100%;max-width:760px;max-height:48vh;overflow:auto;padding:4px}
.lvl{min-width:56px;min-height:56px;border-radius:14px;border:none;background:rgba(255,255,255,.14);color:#fff;font-weight:900;font-size:18px;cursor:pointer}
.lvl.done{background:#3dd68c}
.lvl.boss{background:linear-gradient(160deg,#ff8a5c,#c44569)}
.lvl.locked{opacity:.35;cursor:default}
.lvl.cur{outline:3px solid #ffe566}
.shop-grid,.egg-grid,.hat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%;max-width:720px;max-height:42vh;overflow:auto;padding:4px}
.shop-tile{min-height:110px;border-radius:18px;border:3px solid transparent;background:rgba(255,255,255,.1);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;color:#fff;font-weight:800;font-size:13px}
.shop-tile canvas{width:72px;height:56px;pointer-events:none;border-radius:10px;background:rgba(0,0,0,.18)}
.shop-tile:active{transform:scale(.96)}
.shop-tile.locked{opacity:.4;cursor:default}
.dragon-card{width:min(200px,40vw);min-height:160px;border-radius:20px;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.18);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.dragon-card.sel{border-color:#ffe566;background:rgba(255,229,102,.22)}
.dragon-card canvas{width:120px;height:90px;border-radius:12px;background:rgba(0,0,0,.2)}
.hint{font-size:14px;opacity:.9;background:rgba(255,229,102,.18);border:2px solid rgba(255,229,102,.35);padding:8px 12px;border-radius:12px;max-width:520px;text-align:center}
.bar{height:14px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;width:min(220px,50vw)}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#7dff9a,#ffe566);border-radius:999px}
.world-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.world-tab{min-height:48px;padding:10px 16px;border-radius:14px;border:3px solid transparent;background:rgba(255,255,255,.12);color:#fff;font-weight:800;cursor:pointer}
.world-tab.sel{border-color:#ffe566;background:rgba(255,229,102,.25)}
@media (max-height:650px){
  .pad-btn{width:56px;height:56px;min-width:56px;min-height:56px;font-size:24px}
  .profile-card{min-height:160px;width:min(230px,40vw)}
  .title{font-size:clamp(20px,4.2vw,32px)}
  .panel{padding:12px;border-radius:20px}
}
@media (orientation:portrait) and (max-width:500px){
  .profile-card{width:min(300px,80vw)}
  .pad-btn{width:60px;height:60px}
}

/* Race HUD — no overlap with mute/fullscreen or canvas text */
#hud{flex-wrap:nowrap;gap:10px;align-items:flex-start}
.race-hud-left{display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(260px,42vw)}
.race-chip{min-height:40px;font-size:16px;backdrop-filter:blur(6px);background:rgba(10,20,40,.55)}
.race-chip.hearts{color:#ffb0d0}
.race-hud-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-top:2px}
.race-prog-track{width:min(360px,50vw);height:14px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;border:2px solid rgba(255,255,255,.2)}
.race-prog-track>i{display:block;height:100%;background:linear-gradient(90deg,#ffe566,#7dff9a);border-radius:999px}
.race-hud-right{pointer-events:none;display:flex;align-items:flex-start}
.race-hud-right .btn{pointer-events:auto}

/* Nursery — warm friendly panel + big tappable swatches */
.nursery-panel{background:linear-gradient(165deg,rgba(255,220,170,.95),rgba(255,190,140,.92) 40%,rgba(255,160,150,.9))!important;border-color:rgba(255,255,255,.45)!important;color:#3a2040}
.nursery-panel .title,.nursery-panel .sub,.nursery-panel .swatch-label,.nursery-panel .meta,.nursery-panel strong{color:#3a2040;text-shadow:none}
.nursery-panel .sub{opacity:.8}
.nursery-panel .btn.ghost{background:rgba(255,255,255,.45);color:#3a2040}
.nurse-stage{border-radius:22px;background:#9ad4ff;cursor:pointer;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 8px 20px rgba(0,0,0,.18);width:min(340px,86vw);height:auto;max-height:42vh}
.swatch-block{width:100%;max-width:720px;margin:8px auto 0;text-align:center}
.swatch-label{font-weight:900;font-size:14px;margin-bottom:6px;opacity:.85}
.swatch-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.swatch{min-width:56px;min-height:56px;border-radius:18px;border:4px solid transparent;cursor:pointer;padding:4px;background:rgba(255,255,255,.35);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.swatch:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.swatch.sel{border-color:#5a3ad4;box-shadow:0 0 0 3px #ffe566,0 4px 0 rgba(0,0,0,.15)}
.swatch.locked{opacity:.72;filter:saturate(.7)}
.color-swatch{width:56px;height:56px;border-radius:50%}
.icon-swatch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:72px;min-height:72px;font-size:11px;font-weight:800;color:#3a2040}
.icon-swatch canvas{width:48px;height:48px;pointer-events:none}
.dragon-strip{justify-content:flex-start}
.stats-row span{font-weight:800;font-size:13px;color:#3a2040}
.nursery-panel .bar{background:rgba(0,0,0,.18)}
@media (max-height:650px){
  .nurse-stage{max-height:34vh}
  .race-hud-left{max-width:200px}
  .race-chip{font-size:14px;min-height:36px;padding:6px 10px}

.nursery-layout{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:center;width:100%}
.nursery-left,.nursery-right{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 280px;min-width:min(280px,92vw);display:flex;flex-direction:column;align-items:center}
.nursery-right .swatch-block{margin-top:4px}
@media (max-height:650px){
  .nursery-panel{padding:8px!important;max-height:min(96dvh,96vh);overflow:auto}
  .nursery-panel .title{font-size:20px;margin-bottom:0}
  .nursery-panel .sub{margin-bottom:2px;font-size:12px}
  .nurse-stage{max-height:24vh;width:min(220px,36vw)}
  .stats-row{display:none}
  .swatch{min-width:40px;min-height:40px;border-width:3px;padding:2px}
  .color-swatch{width:40px;height:40px}
  .icon-swatch{min-width:48px;min-height:48px;font-size:9px;gap:0}
  .icon-swatch canvas{width:30px;height:30px}
  .swatch-label{font-size:11px;margin-bottom:1px}
  .swatch-block{margin-top:2px}
  .swatch-grid{gap:6px}
  .dragon-strip{display:none}
  .nursery-layout{gap:6px;flex-wrap:nowrap}
  .nursery-left{flex:0 0 auto}
  .nursery-right{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;max-height:78vh;overflow:auto}
  .name-in{min-height:40px;font-size:14px}
  #hudHint.hint{font-size:12px;padding:4px 8px;max-width:min(420px,46vw)}
}
@media (max-height:420px){
  .nurse-stage{max-height:16vh;width:min(160px,30vw)}
  .btn.big{font-size:15px;padding:6px 12px;min-height:44px}
  .nursery-panel .title{font-size:16px;margin-bottom:0}
  .nursery-panel .sub{font-size:12px;margin-bottom:2px}
  .name-block{display:none}
  .stats-row{display:none}
  .swatch{min-width:36px;min-height:36px;padding:1px;border-width:2px}
  .color-swatch{width:36px;height:36px}
  .icon-swatch{min-width:44px;min-height:44px;gap:0;font-size:9px}
  .icon-swatch canvas{width:26px;height:26px}
  .swatch-block{margin-top:0}
  .swatch-label{font-size:11px;margin-bottom:1px}
  .swatch-grid{gap:4px}
  .nursery-right{overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:82vh}
  .nursery-layout{gap:4px}
  .dragon-strip, .nursery-panel .row:has(#btnBack){margin-top:2px!important}
  .nursery-panel .btn.orange,.nursery-panel .btn.ghost{min-height:40px;padding:6px 10px;font-size:14px}
}
</style>

<body>
<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Dragon Keeper"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="overlay"></div>
  <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  <button id="fsBtn" class="icon-btn" type="button" aria-label="Fullscreen">⛶</button>
</div>
<script>"use strict";
/* ==== 00-core.js ==== */
;(function(){
/* Dragon Keeper — core namespace & helpers */
const DK = window.DK = {
  VERSION: 1,
  SAVE_KEY: 'dragon-keeper-v1',
  W: 1180, H: 600,
  profiles: {
    alpha: { id: 'alpha', defaultName: 'Player 1', label: 'Easy', ageHint: 'gentle', noGameOver: true, speed: 0.85, hazardScale: 0.7, gemMagnet: 28, hint: true },
    beta:  { id: 'beta',  defaultName: 'Player 2', label: 'Challenge', ageHint: 'adventure', noGameOver: false, hearts: 3, speed: 1.0, hazardScale: 1.0, gemMagnet: 8, hint: false }
  },
  memStore: null,
  state: null,
  screen: 'boot',
  raf: 0,
  lastT: 0,
  muted: false,
  keys: Object.create(null),
  pointers: Object.create(null),
  canvas: null,
  ctx: null,
  overlay: null,
  hud: null,
  run: null,
  nurseryAnim: 0
};

DK.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
DK.lerp = (a, b, t) => a + (b - a) * t;
DK.rand = (a, b) => a + Math.random() * (b - a);
DK.pick = (arr) => arr[(Math.random() * arr.length) | 0];
DK.seeded = (seed) => {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
};
DK.now = () => performance.now();

DK.toast = (msg, ms) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), ms || 1400);
};

DK.fitCanvas = () => {
  const c = DK.canvas;
  if (!c) return;
  if (c.width !== DK.W) c.width = DK.W;
  if (c.height !== DK.H) c.height = DK.H;
};

DK.clear = (color) => {
  const ctx = DK.ctx;
  ctx.fillStyle = color || '#1a3a5c';
  ctx.fillRect(0, 0, DK.W, DK.H);
};

DK.roundRect = (ctx, x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};

DK.meta = () => DK.profiles[DK.state && DK.state.lastProfile || 'alpha'];

})();
/* ==== 10-audio.js ==== */
;(function(){
/* Gentle WebAudio SFX */
DK.Audio = (() => {
  let ctx = null, master = null, unlocked = false;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = DK.muted ? 0 : 0.32;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    unlocked = true;
  }

  function tone(freq, dur, type, vol, slide) {
    if (DK.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol) {
    if (DK.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const n = Math.max(1, (c.sampleRate * dur) | 0);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    g.gain.value = vol || 0.06;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  return {
    unlock,
    setMuted(m) {
      DK.muted = !!m;
      if (master) master.gain.value = DK.muted ? 0 : 0.32;
      try { localStorage.setItem('dk-mute', DK.muted ? '1' : '0'); } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = DK.muted ? '🔇' : '🔊';
    },
    loadMute() {
      try { DK.muted = localStorage.getItem('dk-mute') === '1'; } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = DK.muted ? '🔇' : '🔊';
    },
    click() { tone(320, 0.05, 'triangle', 0.06); },
    soft() { tone(360, 0.08, 'sine', 0.08); },
    hatch() { tone(280, 0.15, 'triangle', 0.12, 520); setTimeout(() => tone(520, 0.18, 'sine', 0.1), 100); noise(0.08, 0.04); },
    feed() { tone(440, 0.1, 'sine', 0.1); setTimeout(() => tone(560, 0.1, 'sine', 0.08), 70); },
    play() { tone(500, 0.08, 'sine', 0.09); setTimeout(() => tone(660, 0.1, 'triangle', 0.08), 60); },
    grow() { [392, 494, 587, 784].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'sine', 0.1), i * 80)); },
    gem() { tone(740, 0.07, 'sine', 0.1); setTimeout(() => tone(980, 0.09, 'sine', 0.08), 40); },
    hurt() { tone(180, 0.18, 'sine', 0.1, 90); },
    whoosh() { tone(220, 0.12, 'sawtooth', 0.05, 120); noise(0.1, 0.04); },

    try {

  }

    try {

      if (DK.keys['ArrowDown'] || DK.keys['s'] || DK.keys['S']) dy += 1;
    } else {
      if (DK.keys['i'] || DK.keys['I']) dy -= 1;
      if (DK.keys['k'] || DK.keys['K']) dy += 1;
    }
    const ptr = DK.pointers;
    for (const id in ptr) {
      const p = ptr[id];
      if (!p) continue;
      if (p.pad === 'up' && which === 1) dy -= 1;
      if (p.pad === 'down' && which === 1) dy += 1;
      if (p.pad === 'up2' && which === 2) dy -= 1;
      if (p.pad === 'down2' && which === 2) dy += 1;
      if (p.drag && which === 1) {
        dy += DK.clamp((p.y - p.startY) / 80, -1, 1);
      }
    }
    return DK.clamp(dy, -1, 1);
  }

  function step(dt) {
    if (!level || !course || finished || failed) return getState();
    elapsed += dt;
    invuln = Math.max(0, invuln - dt);

    const spd = player.speed;
    if (!player.finished) {
      player.x += spd * 60 * dt;
      const iy = inputY(1);
      player.vy = DK.lerp(player.vy, iy * 220, 0.18);
      if (Math.abs(iy) > 0.2) DK.Audio.flap();
      player.y = DK.clamp(player.y + player.vy * dt, 50, DK.H - 50);
      if (player.x >= course.length) {
        player.finished = true;
        player.finishX = player.x;
      }
    }

    if (p2) {
      if (!p2.finished) {
        p2.x += p2.speed * 60 * dt;
        let iy2 = inputY(2);
        if (p2.aiAssist && Math.abs(iy2) < 0.1) {
          const g = nearestGem(p2);
          if (g) iy2 = DK.clamp((g.y - p2.y) / 100, -1, 1) * 0.6;
        }
        p2.vy = DK.lerp(p2.vy, iy2 * 220, 0.18);
        p2.y = DK.clamp(p2.y + p2.vy * dt, 50, DK.H - 50);
        if (p2.x >= course.length) { p2.finished = true; p2.finishX = p2.x; }
      }
    }

    for (const ai of course.ais) {
      if (ai.finished) continue;
      ai.x += ai.speed * spd * 60 * dt;
      ai.y += Math.sin(elapsed * 1.5 + ai.x * 0.01) * 40 * dt;
      ai.y = DK.clamp(ai.y, 60, DK.H - 60);
      const g = nearestGem(ai);
      if (g) ai.y = DK.lerp(ai.y, g.y, 0.02);
      if (ai.x >= course.length) { ai.finished = true; ai.finishX = ai.x; }
    }

    // birds drift
    if (course.birds) {
      for (const b of course.birds) {
        b.y += Math.sin(elapsed * 2 + b.phase) * 30 * dt;
        b.y = DK.clamp(b.y, 50, DK.H - 50);
      }
    }

    camX = Math.max(0, player.x - 220);

    const magnet = (meta && meta.gemMagnet) || 10;
    for (const g of course.gems) {
      if (g.taken) continue;
      if (hit(player, g, magnet) || (p2 && hit(p2, g, magnet))) {
        g.taken = true;
        gemsGot += 1;
        DK.Audio.gem();
      }
    }

    if (invuln <= 0) {
      for (const c of course.clouds) {
        if (hit(player, c, -10)) { hurt(); break; }
      }
      for (const s of course.storms) {
        if (hit(player, s, -8)) { hurt(); break; }
      }
      if (course.birds) {
        for (const b of course.birds) {
          if (hit(player, b, -6)) { hurt(); break; }
        }
      }
      if (course.rocks) {
        for (const r of course.rocks) {
          if (hit(player, r, -8)) { hurt(); break; }
        }
      }
    }

    if (player.finished) {
      const okGems = gemsGot >= level.goalGems;
      if (okGems || (meta && meta.noGameOver)) {
        if (okGems || meta.noGameOver) {
          finished = true;
          onWin();
        }
      } else if (!meta.noGameOver) {
        finished = true;
        onWin();
      }
    }

    if (!meta.noGameOver && hearts <= 0) {
      failed = true;
      DK.Audio.hurt();
    }

    if (elapsed > level.timeLimit) {
      if (meta.noGameOver) {
        if (!player.finished) { player.finished = true; player.finishX = player.x; finished = true; onWin(); }
      } else if (!player.finished) {
        failed = true;
      }
    }

    refreshHud();
    DK.run = getState();
    return DK.run;
  }

  function hit(a, b, pad) {
    const dx = a.x - b.x, dy = a.y - b.y;
    const r = (a.r || 20) + (b.r || 16) + (pad || 0);
    return dx * dx + dy * dy < r * r;
  }

  function nearestGem(who) {
    let best = null, bd = 1e9;
    for (const g of course.gems) {
      if (g.taken) continue;
      if (g.x < who.x - 20) continue;
      const d = Math.abs(g.x - who.x) + Math.abs(g.y - who.y) * 0.5;
      if (d < bd) { bd = d; best = g; }
    }
    return best;
  }

  function hurt() {
    if (meta && meta.noGameOver) {
      invuln = 1.2;
      DK.Audio.soft();
      player.y = DK.clamp(player.y + (Math.random() > 0.5 ? 30 : -30), 50, DK.H - 50);
      if (meta.hint) hintMsg = 'Whoa! Fly around the clouds.';
      return;
    }
    hearts -= 1;
    invuln = 2.0;
    DK.Audio.hurt();
  }

  function onWin() {
    DK.Audio.win();
    const p = DK.Save.profile();
    const gained = gemsGot + (level.boss ? 15 : 5);
    p.gems = (p.gems || 0) + gained;
    const stars = gemsGot >= level.goalGems + 4 ? 3 : gemsGot >= level.goalGems ? 2 : 1;
    const prev = p.cleared[level.id] || { stars: 0 };
    p.cleared[level.id] = { stars: Math.max(prev.stars || 0, stars), gems: gemsGot };
    if (level.id >= p.maxLevel) p.maxLevel = Math.min(DK.Levels.count(), level.id + 1);
    const d = DK.Save.ensureDragon(p);
    if (d) {
      d.racesWon = (d.racesWon || 0) + 1;
      d.growth = DK.clamp((d.growth || 0) + 3, 0, 100);
      DK.Nursery.maybeGrow(d);
    }
    DK.Save.save();
  }

  function draw(ctx) {
    if (!level || !course) return;
    const worldNum = level.id;
    DK.Art.sky(ctx, worldNum, elapsed * 1000, camX);

    for (let i = 0; i < 5; i++) {
      const cx = ((i * 300 - camX * 0.25) % (DK.W + 220)) + 50;
      DK.Art.cloud(ctx, cx, 30 + i * 28, 0.55 + (i % 3) * 0.12, 'rgba(255,255,255,.28)');
    }

    for (const g of course.gems) {
      if (g.taken) continue;
      const sx = g.x - camX;
      if (sx < -40 || sx > DK.W + 40) continue;
      DK.Art.gem(ctx, sx, g.y + Math.sin(elapsed * 3 + g.x * 0.01) * 4, 1.25, g.kind);
    }
    for (const c of course.clouds) {
      const sx = c.x - camX;
      if (sx < -70 || sx > DK.W + 70) continue;
      DK.Art.cloud(ctx, sx, c.y, c.s);
    }
    for (const s of course.storms) {
      const sx = s.x - camX;
      if (sx < -70 || sx > DK.W + 70) continue;
      DK.Art.stormCloud(ctx, sx, s.y, s.s, elapsed * 6 + s.flash);
    }
    if (course.birds) {
      for (const b of course.birds) {
        const sx = b.x - camX;
        if (sx < -40 || sx > DK.W + 40) continue;
        DK.Art.bird(ctx, sx, b.y, b.s, elapsed + b.phase);
      }
    }
    if (course.rocks) {
      for (const r of course.rocks) {
        const sx = r.x - camX;
        if (sx < -50 || sx > DK.W + 50) continue;
        DK.Art.rock(ctx, sx, r.y, r.s);
      }
    }

    const fx = course.length - camX;
    if (fx > -40 && fx < DK.W + 40) {
      DK.Art.finishGate(ctx, fx, 30, DK.H - 30);
    }

    for (const ai of course.ais) {
      const sx = ai.x - camX;
      if (sx < -100 || sx > DK.W + 100) continue;
      DK.Art.dragon(ctx, sx, ai.y, 1.7, {
        stage: 'kid', hex: ai.color, element: ai.element, flap: elapsed * 9
      });
    }

    drawPilot(ctx, player, camX, elapsed);
    if (p2) drawPilot(ctx, p2, camX, elapsed);

    // canvas progress bar only (text lives in HTML HUD to avoid overlap)
    const barW = Math.min(360, DK.W - 280);
    const barX = (DK.W - barW) / 2;
    const barY = 14;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    DK.roundRect(ctx, barX, barY, barW, 16, 8); ctx.fill();
    const pct = course ? DK.clamp(player.x / course.length, 0, 1) : 0;
    ctx.fillStyle = '#ffe566';
    DK.roundRect(ctx, barX + 2, barY + 2, Math.max(4, (barW - 4) * pct), 12, 6); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Finish', barX + barW / 2, barY + 12);
    ctx.textAlign = 'left';
  }

  function drawPilot(ctx, who, cam, t) {
    const sx = who.x - cam;
    const d = who.dragon;
    const col = DK.Data.colorOf(d.color).hex;
    const blink = invuln > 0 && who === player ? (Math.floor(t * 10) % 2 === 0) : true;
    if (!blink) return;
    DK.Art.dragon(ctx, sx, who.y, 2.05, {
      stage: d.stage === 'egg' ? 'baby' : d.stage,
      hex: col,
      element: d.element,
      hat: d.hat,
      flap: t * 11
    });
  }

  function solve(levelId, profileId, opts) {
    opts = opts || {};
    const maxSteps = opts.maxSteps || 20000;
    DK.state.lastProfile = profileId;
    const m = DK.profiles[profileId];
    const p = DK.Save.profile(profileId);
    if (!p.dragons.length) {
      p.dragons.push(DK.Save.makeDragon({ stage: 'kid', growth: 60, name: 'Solver', color: 'crimson', element: 'fire' }));
      p.activeDragonId = p.dragons[0].id;
      DK.Save.save();
    } else {
      const d = p.dragons[0];
      if (d.stage === 'egg') { d.stage = 'kid'; d.growth = 60; }
    }
    start(levelId, {});
    meta = m;
    hearts = m.noGameOver ? 99 : Math.max(m.hearts || 3, 5);
    const dt = 1 / 60;
    let steps = 0;
    invuln = 0.5;
    while (steps < maxSteps && !finished && !failed) {
      const look = course.clouds.concat(course.storms)
        .concat(course.rocks || []).concat(course.birds || []);
      const lanes = [80, 150, 220, 300, 380, 460, 520];
      let bestY = player.y, bestScore = -1e9;
      const g = nearestGem(player);
      for (const ly of lanes) {
        let score = -Math.abs(ly - player.y) * 0.15;
        if (g && g.x < player.x + 600) score -= Math.abs(ly - g.y) * 0.35;
        for (const h of look) {
          const dx = h.x - player.x;
          if (dx > -10 && dx < 260) {
            const dy = Math.abs(h.y - ly);
            const prox = Math.max(0, 220 - dx);
            if (dy < 70) score -= (70 - dy) * (0.8 + prox * 0.01);
          }
        }
        if (score > bestScore) { bestScore = score; bestY = ly; }
      }
      const want = DK.clamp((bestY - player.y) / 40, -1, 1);
      DK.keys = {};
      if (want < -0.15) DK.keys['ArrowUp'] = true;
      if (want > 0.15) DK.keys['ArrowDown'] = true;
      for (const h of look) {
        const dx = h.x - player.x;
        if (dx > -5 && dx < 90 && Math.abs(h.y - player.y) < 55) {
          const upClear = h.y - 100;
          const downClear = h.y + 100;
          player.y = DK.clamp(Math.abs(upClear - 300) < Math.abs(downClear - 300) ? downClear : upClear, 50, DK.H - 50);
        }
      }
      if (!g || g.x > player.x + 700) {
        if (Math.abs(player.y - bestY) > 20) player.y = DK.lerp(player.y, bestY, 0.35);
      }
      step(dt);
      steps++;
    }
    const beat = finished && (m.noGameOver || (!failed && gemsGot >= 0));
    return {
      ok: !!beat,
      level: levelId,
      profile: profileId,
      gems: gemsGot,
      goal: level.goalGems,
      steps,
      finished,
      failed,
      hearts,
      proof: opts.proof || false
    };
  }

  return { start, step, draw, getState, solve, refreshHud };
})();

    ov().querySelectorAll('.dragon-card[data-id]').forEach((card) => {
      const id = card.getAttribute('data-id');
      const dr = p.dragons.find((x) => x.id === id);
      const cv = card.querySelector('canvas');
      if (cv && dr) DK.Art.previewDragon(cv, dr);
      card.onclick = () => { p.activeDragonId = id; DK.Save.save(); nursery(); };
    });
  }

  function buildColorSwatches(d) {
    const grid = document.getElementById('colorGrid');
    if (!grid) return;
    DK.Data.colors.forEach((c) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch color-swatch' + (c.id === d.color ? ' sel' : '');
      btn.setAttribute('aria-label', c.name);
      btn.style.background = c.hex;
      btn.onclick = () => {
        d.color = c.id; DK.Save.save(); DK.Audio.click();
        nursery();
      };
      grid.appendChild(btn);
    });
  }

  function buildElemSwatches(d) {
    const grid = document.getElementById('elemGrid');
    if (!grid) return;
    DK.Data.elements.forEach((e) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch icon-swatch' + (e.id === d.element ? ' sel' : '');
      btn.setAttribute('aria-label', e.name);
      const cv = document.createElement('canvas');
      cv.width = 48; cv.height = 48;
      DK.Art.elementIcon(cv.getContext('2d'), e.id, 24, 24, 1.2);
      btn.appendChild(cv);
      const lab = document.createElement('span');
      lab.textContent = e.name;
      btn.appendChild(lab);
      btn.onclick = () => {
        d.element = e.id; DK.Save.save(); DK.Audio.click();
        nursery();
      };
      grid.appendChild(btn);
    });
  }

  function buildHatSwatches(d, hatsOwned) {
    const grid = document.getElementById('hatGrid');
    if (!grid) return;
    const owned = new Set(hatsOwned || []);
    const catalog = (DK.Data.shop || []).filter((it) => it.kind === 'hat').map((it) => it.hatId);
    const none = document.createElement('button');
    none.type = 'button';
    none.className = 'swatch icon-swatch' + (!d.hat ? ' sel' : '');
    none.innerHTML = '<span style="font-size:22px;line-height:48px">∅</span><span>None</span>';
    none.onclick = () => { d.hat = null; DK.Save.save(); DK.Audio.click(); nursery(); };
    grid.appendChild(none);
    catalog.forEach((h) => {
      const unlocked = owned.has(h);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch icon-swatch' + (d.hat === h ? ' sel' : '') + (unlocked ? '' : ' locked');
      const cv = document.createElement('canvas');
      cv.width = 48; cv.height = 48;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = 'rgba(255,255,255,.15)';
      ctx.fillRect(0, 0, 48, 48);
      DK.Art.drawHat(ctx, h, 24, 24);
      if (!unlocked) {
        ctx.fillStyle = 'rgba(40,20,10,.45)';
        ctx.fillRect(0, 0, 48, 48);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🔒', 24, 30);
      }
      btn.appendChild(cv);
      const lab = document.createElement('span');
      lab.textContent = unlocked ? h : 'Shop';
      btn.appendChild(lab);
      if (unlocked) {
        btn.onclick = () => { d.hat = h; DK.Save.save(); DK.Audio.click(); nursery(); };
      } else {
        btn.onclick = () => { DK.Audio.click(); DK.toast('Buy hats in the Shop!'); };
      }
      grid.appendChild(btn);
    });
  }

  function paintNurse(d) {
    const c = document.getElementById('nurseCanvas');
    if (!c) return;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    const g = ctx.createLinearGradient(0, 0, 0, c.height);
    g.addColorStop(0, '#9ad4ff');
    g.addColorStop(0.55, '#ffe6b0');
    g.addColorStop(1, '#ffd0a8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
    // soft ground
    ctx.fillStyle = 'rgba(120,190,90,.45)';
    ctx.beginPath();
    ctx.ellipse(c.width / 2, c.height - 18, c.width * 0.42, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    DK.Art.cloud(ctx, 70, 44, 0.8); DK.Art.cloud(ctx, 250, 56, 0.6);
    DK.Art.tree(ctx, 48, c.height - 28, 0.7);
    DK.Art.tree(ctx, c.width - 50, c.height - 30, 0.65);
    let mood = 'idle';
    if (DK.now() < (DK.nurseryMoodUntil || 0)) mood = DK.nurseryMood || 'idle';
    else DK.nurseryMood = 'idle';
    if (d.stage === 'egg') {
      DK.Art.egg(ctx, c.width / 2, c.height / 2 + 16, 2.8, DK.Data.colorOf(d.color).hex, (d.growth || 0) / 15);
    } else {
      DK.Art.dragon(ctx, c.width / 2, c.height / 2 + 20, 2.95, {
        stage: d.stage, hex: DK.Data.colorOf(d.color).hex, element: d.element, hat: d.hat,
        flap: DK.now() / 180, mood
      });
    }
  }

  function shop() {
    DK.screen = 'shop';
    clear();
    const p = DK.Save.profile();
    showPanel(`
      <div class="title">Sky Market</div>
      <div class="sub">Gems: <strong>${p.gems}</strong> · Food ${p.inventory.food} · Toys ${p.inventory.toys} · Eggs ${p.eggsOwned}</div>
      <div class="shop-grid" id="shopGrid"></div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" type="button" id="btnBack">Back</button></div>
    `);
    const grid = document.getElementById('shopGrid');
    DK.Data.shop.forEach((item) => {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'shop-tile';
      tile.innerHTML = `<canvas width="72" height="56"></canvas><span>${item.name}</span><span class="chip">${item.cost} gems</span>`;
      const cv = tile.querySelector('canvas');
      const ctx = cv.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(0, 0, 72, 56);
      if (item.kind === 'food') DK.Art.food(ctx, 36, 28, 1.2);
      else if (item.kind === 'toy') DK.Art.toy(ctx, 36, 28, 1.3);
      else if (item.kind === 'egg') DK.Art.egg(ctx, 36, 30, 1.1, '#f0c090', 0);
      else if (item.kind === 'hat') DK.Art.drawHat(ctx, item.hatId, 36, 28);
      tile.onclick = () => buy(item);
      grid.appendChild(tile);
    });
    document.getElementById('btnBack').onclick = hub;
  }

  function buy(item) {
    const p = DK.Save.profile();
    if (p.gems < item.cost) { DK.toast('Need more gems!'); return; }
    p.gems -= item.cost;
    if (item.kind === 'food') p.inventory.food += item.amount;
    else if (item.kind === 'toy') p.inventory.toys += item.amount;
    else if (item.kind === 'egg') p.eggsOwned += 1;
    else if (item.kind === 'hat') {
      if (!p.inventory.hats.includes(item.hatId)) p.inventory.hats.push(item.hatId);
      const d = DK.Save.ensureDragon(p);
      if (d && !d.hat) d.hat = item.hatId;
    }
    DK.Audio.buy();
    DK.Save.save();
    DK.toast('Bought ' + item.name + '!');
    shop();
  }

  function levels() {
    DK.screen = 'levels';
    clear();
    const p = DK.Save.profile();
    const worlds = DK.Data.worlds;
    let curWorld = worlds.find((w) => p.maxLevel >= w.from && p.maxLevel <= w.to) || worlds[0];
    renderLevels(curWorld.id);

    function renderLevels(wid) {
      curWorld = worlds.find((w) => w.id === wid) || worlds[0];
      showPanel(`
        <div class="title">Sky Races</div>
        <div class="sub">Pick a course · Unlocked to level ${p.maxLevel}</div>
        <div class="world-tabs">${worlds.map((w) =>
          `<button class="world-tab ${w.id===curWorld.id?'sel':''}" data-w="${w.id}" type="button">${w.name}</button>`
        ).join('')}</div>
        <div class="level-grid" id="lvlGrid"></div>
        <div class="row" style="margin-top:12px"><button class="btn ghost" type="button" id="btnBack">Back</button></div>
      `);
      const grid = document.getElementById('lvlGrid');
      for (let n = curWorld.from; n <= curWorld.to; n++) {
        const lv = DK.Levels.get(n);
        const locked = n > p.maxLevel;
        const done = !!p.cleared[n];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lvl' + (locked ? ' locked' : '') + (done ? ' done' : '') + (lv.boss ? ' boss' : '') + (n === p.maxLevel ? ' cur' : '');
        btn.textContent = lv.boss ? 'B' + n : String(n);
        btn.title = lv.name;
        if (!locked) btn.onclick = () => startRace(n, false);
        grid.appendChild(btn);
      }
      ov().querySelectorAll('.world-tab').forEach((t) => {
        t.onclick = () => { DK.Audio.click(); renderLevels(t.getAttribute('data-w')); };
      });
      document.getElementById('btnBack').onclick = hub;
    }
  }

  function startRace(n, twoPlayer) {
    const p = DK.Save.profile();
    const d = DK.Save.ensureDragon(p);
    if (!DK.Nursery.canRace(d)) {
      DK.toast('Hatch your egg first!');
      nursery();
      return;
    }
    DK.Audio.click();
    DK.screen = 'race';
    clear();
    ov().style.pointerEvents = 'none';
    DK.Race.start(n, { twoPlayer });
    addRacePad(twoPlayer);
    const hud = document.getElementById('hud');
    hud.classList.remove('hidden');
    const lv = DK.Levels.get(n);
    hud.innerHTML = `
      <div class="race-hud-left">
        <div class="chip race-chip" id="hudLevel">${lv.name}</div>
        <div class="chip race-chip" id="hudGems">Gems 0/${lv.goalGems}</div>
        <div class="chip race-chip hearts" id="hudHearts">♥ 3</div>
      </div>
      <div class="race-hud-mid">
        <div class="race-prog-track"><i id="hudProg" style="width:0%"></i></div>
        <div class="hint hidden" id="hudHint"></div>
      </div>
      <div class="race-hud-right">
        <button class="btn ghost" type="button" id="btnQuit" style="pointer-events:auto;min-height:48px;margin-right:110px">Quit</button>
      </div>`;
    document.getElementById('btnQuit').onclick = () => { DK.run = null; hub(); };
    DK.Race.refreshHud();
    setTimeout(() => { const h = document.getElementById('hudHint'); if (h) h.classList.add('hidden'); }, 3500);
  }

  function startTwoPlayer() {
    const p = DK.Save.profile();
    const n = Math.min(p.maxLevel, DK.Levels.count());
    startRace(Math.max(1, n), true);
  }

  function addRacePad(twoPlayer) {
    removePad();
    const pad = document.createElement('div');
    pad.className = 'pad';
    pad.innerHTML = `
      <div class="cluster">
        <button class="pad-btn" type="button" data-pad="up" aria-label="Up">▲</button>
        <button class="pad-btn" type="button" data-pad="down" aria-label="Down">▼</button>
      </div>
      ${twoPlayer ? `<div class="cluster">
        <button class="pad-btn" type="button" data-pad="up2" aria-label="P2 Up">▲</button>
        <button class="pad-btn" type="button" data-pad="down2" aria-label="P2 Down">▼</button>
      </div>` : '<div class="cluster"></div>'}
    `;
    document.getElementById('app').appendChild(pad);
    pad.querySelectorAll('.pad-btn').forEach((btn) => {
      const id = 'pad-' + btn.getAttribute('data-pad');
      const set = (on) => {
        if (on) {
          DK.pointers[id] = { pad: btn.getAttribute('data-pad') };
          btn.classList.add('held');
        } else {
          delete DK.pointers[id];
          btn.classList.remove('held');
        }
      };
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); set(true); });
      btn.addEventListener('pointerup', () => set(false));
      btn.addEventListener('pointercancel', () => set(false));
    });
  }

  function results() {
    const run = DK.run;
    if (!run) { hub(); return; }
    DK.screen = 'results';
    removePad();
    const lv = run.level;
    const p = DK.Save.profile();
    const cleared = p.cleared[lv.id] || { stars: 1 };
    showPanel(`
      <div class="title">${run.failed ? 'Try Again!' : 'Finish!'}</div>
      <div class="sub">${lv.name}</div>
      <div class="row"><span class="chip">Gems ${run.gemsGot}</span>
        <span class="chip">Stars ${cleared.stars || 0}</span>
        ${run.failed ? '<span class="chip">Keep practicing!</span>' : '<span class="chip">Nice flying!</span>'}
      </div>
      <div class="row" style="margin-top:14px">
        ${run.failed ? `<button class="btn orange big" type="button" id="btnRetry">Retry</button>` : ''}
        <button class="btn green big" type="button" id="btnNext">${lv.id < DK.Levels.count() && !run.failed ? 'Next Race' : 'Home'}</button>
        <button class="btn ghost" type="button" id="btnLevels">Courses</button>
      </div>
    `);
    const retry = document.getElementById('btnRetry');
    if (retry) retry.onclick = () => startRace(lv.id, run.twoPlayer);
    document.getElementById('btnNext').onclick = () => {
      if (!run.failed && lv.id < DK.Levels.count()) startRace(lv.id + 1, false);
      else hub();
    };
    document.getElementById('btnLevels').onclick = levels;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"'`]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/\n/g, ' '); }

  return { profiles, pick, hub, nursery, shop, levels, startRace, startTwoPlayer, results, clear, paintNurse };
})();

;(function(){
/* Boot, loop, input, __game test API */
(function boot() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  DK.canvas = canvas;
  DK.ctx = ctx;
  DK.overlay = document.getElementById('overlay');
  DK.hud = document.getElementById('hud');
  DK.Save.load();
  DK.Audio.loadMute();
  DK.Levels.build();
  DK.fitCanvas();

  document.getElementById('muteBtn').addEventListener('click', () => {
    DK.Audio.unlock();
    DK.Audio.setMuted(!DK.muted);
  });
  document.getElementById('fsBtn').addEventListener('click', () => {
    const app = document.getElementById('app');
    if (!document.fullscreenElement) app.requestFullscreen?.() || app.webkitRequestFullscreen?.();
    else document.exitFullscreen?.();
  });

  window.addEventListener('resize', () => DK.fitCanvas());
  window.addEventListener('keydown', (e) => {
    DK.keys[e.key] = true;
    if (['ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { DK.keys[e.key] = false; });

  // drag on canvas for vertical flight
  let dragId = null;
  canvas.addEventListener('pointerdown', (e) => {
    DK.Audio.unlock();
    dragId = e.pointerId;
    DK.pointers.drag = { drag: true, startY: e.clientY, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('pointermove', (e) => {
    if (DK.pointers.drag && e.pointerId === dragId) DK.pointers.drag.y = e.clientY;
  });
  function endDrag(e) {
    if (e && dragId != null && e.pointerId !== dragId) return;
    delete DK.pointers.drag;
    dragId = null;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // first user gesture unlocks audio
  ['pointerdown', 'keydown'].forEach((ev) => {
    window.addEventListener(ev, () => DK.Audio.unlock(), { once: false, passive: true });
  });

  let wasRacing = false;
  function frame(t) {
    DK.raf = requestAnimationFrame(frame);
    const dt = DK.lastT ? Math.min(0.05, (t - DK.lastT) / 1000) : 0.016;
    DK.lastT = t;

    if (DK.screen === 'race' && DK.run && !DK.run.finished && !DK.run.failed) {
      DK.Race.step(dt);
      wasRacing = true;
    }

    // draw
    if (DK.screen === 'race' && DK.run) {
      DK.Race.draw(ctx);
      if ((DK.run.finished || DK.run.failed) && wasRacing) {
        wasRacing = false;
        setTimeout(() => DK.UI.results(), 400);
      }
    } else if (DK.screen === 'nursery') {
      DK.clear('#ffd8b0');
      const d = DK.Save.ensureDragon(DK.Save.profile());
      if (d && document.getElementById('nurseCanvas')) {
        if ((t / 160 | 0) !== (DK.nurseryAnim | 0)) {
          DK.nurseryAnim = t / 160;
          try { DK.UI.paintNurse(d); } catch (_) {}
        }
      }
    } else {
      DK.clear('#1a3a5c');
      // decorative idle sky behind overlays
      DK.Art.sky(ctx, Math.min(32, (DK.Save.profile().maxLevel || 1)), t, t * 0.02);
      DK.Art.cloud(ctx, 200 + Math.sin(t / 2000) * 30, 120, 1.2);
      DK.Art.cloud(ctx, 800, 200, 0.9);
      DK.Art.dragon(ctx, 900, 320 + Math.sin(t / 800) * 20, 1.2, {
        stage: 'kid', hex: '#e85d4c', element: 'fire', flap: t / 180
      });
    }
  }

  // Test / automation API
  window.__game = {
    DK,
    screen: () => DK.screen,
    save: DK.Save,
    pick: (id) => DK.UI.pick(id),
    setMaxLevel: (n, pid) => {
      const p = DK.Save.profile(pid || DK.state.lastProfile);
      p.maxLevel = n;
      DK.Save.save();
    },
    getRun: () => DK.run,
    solve: (lv, pid, opts) => DK.Race.solve(lv, pid, opts),
    startRace: (n, two) => DK.UI.startRace(n, !!two),
    hub: () => DK.UI.hub(),
    nursery: () => DK.UI.nursery(),
    levels: () => DK.UI.levels(),
    shop: () => DK.UI.shop(),
    profiles: () => DK.UI.profiles(),
    levelCount: () => DK.Levels.count(),
    meta: () => DK.meta()
  };

  DK.UI.profiles();
  requestAnimationFrame(frame);
})();

})();</script>

<script id="car-mode-js">
window.__CAR_GAME = "dragon-keeper";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
</script>
