<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230e121b%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%23ffd77a%27/%3E%3Ccircle cx=%2740%27 cy=%2726%27 r=%2716%27 fill=%27%230e121b%27/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3d2a1a">
<title>Dino Dig</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;width:100%;overflow:hidden;background:#1a120c;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 10%,#5a3d28 0%,#1a120c 70%)}
#game{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#3d2a1a;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.45)}
#overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
#overlay > *{pointer-events:auto}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
#hud.hidden{display:none}
.icon-btn{position:absolute;z-index:20;width:48px;height:48px;min-width:48px;min-height:48px;border:none;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#muteBtn{top:calc(8px + env(safe-area-inset-top));right:calc(60px + env(safe-area-inset-right))}
#fsBtn{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))}
.icon-btn:active{transform:scale(.94)}
.btn{min-width:48px;min-height:48px;padding:12px 22px;border:none;border-radius:18px;font-size:20px;font-weight:800;cursor:pointer;color:#2a1a10;background:#ffe566;box-shadow:0 4px 0 #d4b000,0 8px 18px rgba(0,0,0,.25);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d4b000,0 4px 10px rgba(0,0,0,.25)}
.btn.big{font-size:24px;padding:14px 26px;border-radius:22px;min-height:60px}
.btn.green{background:#7dff9a;box-shadow:0 4px 0 #2db854,0 8px 18px rgba(0,0,0,.25)}
.btn.blue{background:#7ec8ff;box-shadow:0 4px 0 #2a7fbf,0 8px 18px rgba(0,0,0,.25)}
.btn.pink{background:#ff9ad4;box-shadow:0 4px 0 #d44f9a,0 8px 18px rgba(0,0,0,.25)}
.btn.orange{background:#ffb347;box-shadow:0 4px 0 #d47800,0 8px 18px rgba(0,0,0,.25)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.4;cursor:default}
.panel{background:rgba(72,48,28,.94);border:3px solid rgba(255,255,255,.22);border-radius:28px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 16px 50px rgba(0,0,0,.4);max-width:min(980px,96vw);max-height:min(94dvh,94vh);overflow:auto}
.title{font-size:clamp(26px,5vw,42px);font-weight:900;letter-spacing:.5px;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35);margin-bottom:6px}
.sub{text-align:center;opacity:.85;margin-bottom:14px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.profile-card{width:min(280px,42vw);min-height:200px;border-radius:24px;background:linear-gradient(160deg,#6a4a30,#3d2a1a);border:4px solid rgba(255,255,255,.2);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.profile-card:active{transform:scale(.97)}
.profile-card h2{font-size:22px}
.profile-card .meta{font-size:14px;opacity:.85;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:700;min-height:40px}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:min(520px,70vw);text-align:center;background:rgba(0,0,0,.72);padding:12px 20px;border-radius:16px;font-weight:800;font-size:18px;z-index:30;pointer-events:none;animation:pop .45s ease}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}40%{transform:translateX(-50%) scale(1.06);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
.hidden{display:none!important}
.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%;max-width:860px;max-height:50vh;overflow:auto;padding:4px}
.site-card{min-height:110px;border-radius:18px;border:3px solid transparent;background:rgba(255,255,255,.1);cursor:pointer;padding:10px;color:#fff;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.site-card canvas{width:100px;height:56px;border-radius:10px;background:rgba(0,0,0,.2);pointer-events:none}
.site-card.done{border-color:#7dff9a;background:rgba(125,255,154,.15)}
.site-card.locked{opacity:.35;cursor:default}
.site-card.rare{box-shadow:inset 0 0 0 2px #7ec8ff}
.site-card.super{box-shadow:inset 0 0 0 2px #ffc94a}
.era-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.era-tab{min-height:48px;padding:10px 14px;border-radius:14px;border:3px solid transparent;background:rgba(255,255,255,.12);color:#fff;font-weight:800;cursor:pointer;font-size:14px}
.era-tab.sel{border-color:#ffe566;background:rgba(255,229,102,.25)}
.tool-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.tool-btn{min-width:72px;min-height:72px;border-radius:18px;border:3px solid transparent;background:rgba(255,255,255,.14);color:#fff;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.tool-btn.sel{border-color:#ffe566;background:rgba(255,229,102,.28)}
.tool-btn canvas{width:40px;height:40px;pointer-events:none}
.dig-stage{width:min(700px,92vw);height:min(320px,42vh);border-radius:16px;background:#5a4030;border:3px solid rgba(255,255,255,.15);touch-action:none;cursor:crosshair}
.hint{font-size:14px;opacity:.9;background:rgba(255,229,102,.18);border:2px solid rgba(255,229,102,.35);padding:8px 12px;border-radius:12px;max-width:520px;text-align:center}
.fact-card{background:rgba(255,255,255,.08);border-radius:18px;padding:14px;max-width:640px;text-align:left;line-height:1.35}
.fact-card h3{font-size:22px;margin-bottom:4px}
.fact-card .not-dino{display:inline-block;background:#ff8a5c;color:#2a1a10;font-weight:900;padding:4px 10px;border-radius:999px;margin:4px 0 8px;font-size:13px}
.museum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:100%;max-width:860px;max-height:46vh;overflow:auto}
.museum-slot{min-height:120px;border-radius:16px;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;font-size:12px;font-weight:700}
.museum-slot.filled{border-style:solid;border-color:rgba(255,229,102,.4);background:rgba(255,229,102,.1)}
.museum-slot canvas{width:96px;height:64px}
.decor-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.energy{width:min(220px,50vw);height:14px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.energy > i{display:block;height:100%;background:linear-gradient(90deg,#7dff9a,#ffe566)}
.puzzle-stage{position:relative;width:min(700px,92vw);height:min(340px,46vh);border-radius:16px;background:linear-gradient(180deg,#4a3828,#2a1e14);border:3px solid rgba(255,255,255,.15);overflow:hidden}
.bone{position:absolute;min-width:48px;min-height:48px;cursor:grab;touch-action:none;border-radius:10px}
.bone.snapped{cursor:default;opacity:.95}
.bone-ghost{position:absolute;border:2px dashed rgba(255,229,102,.55);border-radius:10px;pointer-events:none;opacity:.7}

  .profile-card{min-height:160px}
  .title{font-size:clamp(20px,4.2vw,32px)}
  .tool-btn{min-width:64px;min-height:64px}
}
@media (orientation:portrait) and (max-width:500px){
  .profile-card{width:min(300px,80vw)}
  .site-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}

.dig-hud{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(700px,92vw);margin:10px auto 0;padding:0 4px}
.dig-hud-spacer{flex:1}
.dig-quit{position:static!important;margin-left:auto;min-width:96px;flex:0 0 auto}
.fact-art-row{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.fact-art-row canvas{width:160px;height:110px;border-radius:14px;background:rgba(0,0,0,.25);flex-shrink:0}


@media (max-height:650px){
  .dig-stage{height:min(220px,34vh)}
  .profile-card{min-height:160px}
  .title{font-size:clamp(18px,3.8vw,28px);margin-bottom:2px}
  .sub{margin-bottom:6px;font-size:13px}
  .tool-btn{min-width:56px;min-height:56px}
  .hint{font-size:12px;padding:4px 8px;margin:4px auto}
  .dig-hud{margin-top:4px}
  .panel{padding:10px;max-height:min(96dvh,96vh)}
  .fact-art-row canvas{width:120px;height:82px}
}
@media (max-height:420px){
  .dig-stage{height:min(160px,28vh);width:min(640px,90vw)}
  .tool-btn{min-width:48px;min-height:48px}
  .tool-btn canvas{width:28px;height:28px}
  .hint{display:none}
  .title{font-size:18px}
  .dig-hud .chip{min-height:36px;padding:4px 10px;font-size:14px}
  .dig-quit{min-height:44px;padding:8px 14px;font-size:16px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Dino Dig"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="overlay"></div>
  <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  <button id="fsBtn" class="icon-btn" type="button" aria-label="Fullscreen">⛶</button>
</div>
<script>
window.__DINO_DATA__ = [{"name":"Tyrannosaurus rex","isDinosaur":true,"group":"theropod","pronunciation":"tie-RAN-oh-SORE-us reks","period":"Late Cretaceous","mya":"68–66","fossilLocations":["Canada","USA"],"diet":"carnivore","lengthFt":"39–43","lengthM":"12–13","rarity":"common","kidFact":"It had the strongest bite of any land animal we know.","deeperFact":"Skin impressions from T. rex and close relatives show scales; feathers are uncertain and would likely have been limited if present at all. Famous specimens Sue and Scotty reached about 13 m and over 8,000 kg.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/tyrannosaurus.html"},{"name":"Triceratops","isDinosaur":true,"group":"ceratopsian","pronunciation":"try-SER-uh-tops","period":"Late Cretaceous","mya":"68–66","fossilLocations":["USA"],"diet":"herbivore","lengthFt":"about 30","lengthM":"about 9","rarity":"common","kidFact":"It had three horns and a big bony neck frill.","deeperFact":"Its skull is among the largest of any land animal. Fossils show healed T. rex bite marks on horns and frills, so some fights were survived.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/triceratops.html"},{"name":"Stegosaurus","isDinosaur":true,"group":"stegosaur","pronunciation":"STEG-oh-SORE-us","period":"Late Jurassic","mya":"152–145","fossilLocations":["USA"],"diet":"herbivore","lengthFt":"about 30","lengthM":"about 9","rarity":"common","kidFact":"It had tall plates on its back and spikes on its tail.","deeperFact":"The plates sat in the skin, not on the skeleton. Scientists still debate whether they helped with display, recognition, or temperature control.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/stegosaurus.html"},{"name":"Brachiosaurus","isDinosaur":true,"group":"sauropod","pronunciation":"BRAK-ee-oh-SORE-us","period":"Late Jurassic","mya":"152–145","fossilLocations":["USA"],"diet":"herbivore","lengthFt":"about 72","lengthM":"about 22","rarity":"common","kidFact":"Its front legs were longer than its back legs, so it stood tall.","deeperFact":"Many full-body reconstructions borrow from the related African sauropod Giraffatitan. It likely browsed high tree leaves and swallowed plants without chewing.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/brachiosaurus.html"},{"name":"Velociraptor","isDinosaur":true,"group":"theropod","pronunciation":"veh-LOSS-ih-rap-tor","period":"Late Cretaceous","mya":"74–70","fossilLocations":["Mongolia"],"diet":"carnivore","lengthFt":"about 6","lengthM":"about 1.8","rarity":"common","kidFact":"Real Velociraptor was about turkey-sized and feathered.","deeperFact":"Movie raptors were sized more like Deinonychus. Quill knobs show Velociraptor had long arm feathers; it could not fly and likely used feathers for warmth, display, or brooding.","sourceUrl":"https://www.nhm.ac.uk/discover/velociraptor-facts.html"},{"name":"Spinosaurus","isDinosaur":true,"group":"theropod","pronunciation":"SPY-no-SORE-us","period":"Late Cretaceous","mya":"99–94","fossilLocations":["Egypt","Morocco"],"diet":"carnivore","lengthFt":"about 46","lengthM":"about 14","rarity":"common","kidFact":"It had a tall sail on its back and ate lots of fish.","deeperFact":"How much it swam and whether it walked mostly on two legs are still debated. Incomplete fossils and lost early bones make size and posture estimates uncertain.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/spinosaurus.html"},{"name":"Ankylosaurus","isDinosaur":true,"group":"ankylosaur","pronunciation":"ang-KYE-loh-SORE-us","period":"Late Cretaceous","mya":"68–66","fossilLocations":["Canada","USA"],"diet":"herbivore","lengthFt":"about 26","lengthM":"about 8","rarity":"common","kidFact":"It wore bony armor and swung a heavy club tail.","deeperFact":"No complete skeleton is known, so the exact armor layout is still uncertain. It likely grazed low plants and used the side-swinging tail club for defense.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/ankylosaurus.html"},{"name":"Parasaurolophus","isDinosaur":true,"group":"hadrosaur","pronunciation":"pair-uh-saw-ROL-uh-fus","period":"Late Cretaceous","mya":"77–73","fossilLocations":["Canada","USA"],"diet":"herbivore","lengthFt":"about 30","lengthM":"about 9","rarity":"common","kidFact":"Its long hollow head crest may have made loud trumpet sounds.","deeperFact":"It could walk on two or four legs. Scientists think the crest helped with calling, recognizing others, or maybe cooling, and different species had different crest shapes.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/parasaurolophus.html"},{"name":"Diplodocus","isDinosaur":true,"group":"sauropod","pronunciation":"dih-PLOD-uh-kus","period":"Late Jurassic","mya":"152–145","fossilLocations":["USA"],"diet":"herbivore","lengthFt":"about 85","lengthM":"about 26","rarity":"common","kidFact":"It had a super-long neck and a whip-like tail.","deeperFact":"Ligaments likely helped hold the long neck roughly horizontal. All known fossils come from the Morrison Formation of the western USA.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/diplodocus.html"},{"name":"Allosaurus","isDinosaur":true,"group":"theropod","pronunciation":"AL-oh-SORE-us","period":"Late Jurassic","mya":"152–145","fossilLocations":["USA"],"diet":"carnivore","lengthFt":"about 32","lengthM":"about 9.7","rarity":"common","kidFact":"It was a big Jurassic hunter with horns above its eyes.","deeperFact":"Bite marks on Stegosaurus and sauropod remains show it hunted or scavenged large plant-eaters. It lived tens of millions of years before T. rex and was not a close relative.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/allosaurus.html"},{"name":"Iguanodon","isDinosaur":true,"group":"ornithopod","pronunciation":"ih-GWAH-nuh-don","period":"Early Cretaceous","mya":"140–110","fossilLocations":["Belgium","England","United Kingdom"],"diet":"herbivore","lengthFt":"about 33","lengthM":"about 10","rarity":"common","kidFact":"It had a big thumb spike that could poke predators.","deeperFact":"One of the first dinosaurs scientifically named. It could walk on two or four legs and used a beak plus cheek teeth for plants.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/iguanodon.html"},{"name":"Dilophosaurus","isDinosaur":true,"group":"theropod","pronunciation":"dy-LOH-fuh-SORE-us","period":"Early Jurassic","mya":"about 184","fossilLocations":["USA"],"diet":"carnivore","lengthFt":"about 23","lengthM":"about 7","rarity":"common","kidFact":"It had two thin crests on its head, not a venom spit.","deeperFact":"The Jurassic Park venom and neck frill are fiction. Real Dilophosaurus was much larger than the movie version and likely an active hunter.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/dilophosaurus.html"},{"name":"Edmontosaurus","isDinosaur":true,"group":"hadrosaur","pronunciation":"ed-MON-toh-SORE-us","period":"Late Cretaceous","mya":"76–66","fossilLocations":["Canada"],"diet":"herbivore","lengthFt":"about 43","lengthM":"about 13","rarity":"common","kidFact":"This duck-billed dinosaur had about a thousand cheek teeth.","deeperFact":"Mummified specimens preserve skin texture. Stomach contents include tough pine needles, cones, and twigs.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/edmontosaurus.html"},{"name":"Pachycephalosaurus","isDinosaur":true,"group":"pachycephalosaur","pronunciation":"pack-ee-SEF-uh-loh-SORE-us","period":"Late Cretaceous","mya":"69–66","fossilLocations":["Canada","USA"],"diet":"herbivore","lengthFt":"about 10","lengthM":"about 3","rarity":"common","kidFact":"It had a thick bony dome on its head.","deeperFact":"Scientists debate whether the dome was for head-butting, display, or both. Many now treat Stygimoloch and Dracorex as younger growth stages of this animal.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/pachycephalosaurus.html"},{"name":"Brontosaurus","isDinosaur":true,"group":"sauropod","pronunciation":"BRON-toh-SORE-us","period":"Late Jurassic","mya":"156–145","fossilLocations":["USA"],"diet":"herbivore","lengthFt":"66–75","lengthM":"20–23","rarity":"common","kidFact":"Its name means thunder lizard, and it had a long neck.","deeperFact":"Brontosaurus was sunk into Apatosaurus for over a century, then reinstated as a separate genus in a 2015 study. Some paleontologists still debate that split.","sourceUrl":"https://www.nhm.ac.uk/discover/brontosaurus-reinstating-a-prehistoric-icon.html"},{"name":"Pteranodon","isDinosaur":false,"group":"pterosaur","pronunciation":"teh-RAN-oh-don","period":"Late Cretaceous","mya":"about 90–85","fossilLocations":["USA (especially Kansas)"],"diet":"carnivore","lengthFt":"wingspan about 20–23","lengthM":"wingspan about 6–7","rarity":"common","kidFact":"Not a dinosaur—it was a flying reptile with no teeth.","deeperFact":"Pterosaurs are archosaurs related to dinosaurs but are not dinosaurs. Pteranodon likely soared over seas and ate fish; hollow bones kept it light.","sourceUrl":"https://www.amnh.org/explore/news-blogs/pteranodon-longiceps"},{"name":"Mosasaurus","isDinosaur":false,"group":"marine reptile","pronunciation":"MOH-zuh-SORE-us","period":"Late Cretaceous","mya":"about 82–66","fossilLocations":["Netherlands","USA","Canada","Morocco","worldwide seas"],"diet":"carnivore","lengthFt":"36–59","lengthM":"11–18","rarity":"common","kidFact":"Not a dinosaur—it was a giant ocean lizard with flippers.","deeperFact":"Mosasaurs are squamates related to lizards and snakes. Length estimates for Mosasaurus hoffmannii range widely because complete skeletons are rare.","sourceUrl":"https://www.nhm.ac.uk/discover/what-is-a-mosasaur.html"},{"name":"Woolly mammoth","isDinosaur":false,"group":"mammal","pronunciation":"WOOL-ee MAM-uth","period":"Pleistocene (not Mesozoic)","mya":"about 0.4–0.004","fossilLocations":["Europe","northern Asia","North America"],"diet":"herbivore","lengthFt":"height about 10–12","lengthM":"height about 3–3.7","rarity":"common","kidFact":"Not a dinosaur—it was a furry Ice Age elephant relative.","deeperFact":"Lived in the Pleistocene ice ages, long after dinosaurs. Thick fur, small ears, and fat stores helped it survive cold steppe-tundra habitats.","sourceUrl":"https://kids.britannica.com/scholars/article/woolly-mammoth/634537"},{"name":"Baryonyx","isDinosaur":true,"group":"theropod","pronunciation":"BAIR-ee-ON-icks","period":"Early Cretaceous","mya":"about 125","fossilLocations":["England","Spain","United Kingdom"],"diet":"carnivore","lengthFt":"about 33","lengthM":"about 10","rarity":"rare","kidFact":"It had a huge claw and crocodile-like jaws for fish.","deeperFact":"A spinosaur relative, it may have hooked fish from riverbanks and also scavenged. Fossils from England include remains with fish and Iguanodon evidence.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/baryonyx.html"},{"name":"Carnotaurus","isDinosaur":true,"group":"theropod","pronunciation":"KAR-noh-TORE-us","period":"Late Cretaceous","mya":"71–69","fossilLocations":["Argentina"],"diet":"carnivore","lengthFt":"about 26","lengthM":"about 8","rarity":"rare","kidFact":"This meat-eater had two horns like a bull and tiny arms.","deeperFact":"Skin impressions show scales, not feathers. Incomplete legs and tail mean full reconstructions lean on related abelisaurs.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/carnotaurus.html"},{"name":"Gallimimus","isDinosaur":true,"group":"theropod","pronunciation":"GAL-ih-MIME-us","period":"Late Cretaceous","mya":"about 70","fossilLocations":["Mongolia"],"diet":"omnivore","lengthFt":"about 20","lengthM":"about 6","rarity":"rare","kidFact":"This ostrich-like dinosaur could run very fast.","deeperFact":"Likely feathered based on close relatives. Its toothless beak suggests mixed plant and small-animal foods, and top speed estimates are roughly 47–55 km/h.","sourceUrl":"https://www.nhm.ac.uk/discover/dino-directory/gallimimus.html"},{"name":"Deinonychus","isDinosaur":tr DD.meta = () => DD.profiles[DD.state && DD.state.lastProfile || 'alpha'];

  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);

  let ctx = null, master = null, unlocked = false;

    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;

    master.gain.value = DD.muted ? 0 : 0.3;

  }
  function unlock() {

    if (c.state === 'suspended') c.resume().catch(() => {});

    if (DD.muted) return;

    if (!c || !unlocked) return;

    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (DD.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const n = Math.max(1, (c.sampleRate * dur) | 0);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    g.gain.value = vol || 0.06;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = freq || 800;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();

    setMuted(m) {

;(function(){
DD.Save = (() => {
  function blankProfile(id) {
    const meta = DD.profiles[id];
    return {
      id,
      name: meta.defaultName,
      maxSite: 1,
      cleared: {},       // siteId -> {assembled, stars}
      museum: [],        // animal keys found & assembled
      decor: [],         // decor item ids placed
      coins: 15,
      energy: meta.maxEnergy || 100,
      playSeconds: 0
    };
  }
  function blankState() {
    return {
      v: DD.VERSION,
      lastProfile: null,
      profiles: { alpha: blankProfile('alpha'), beta: blankProfile('beta') }
    };
  }
  function readRaw() {
    try {
      const s = localStorage.getItem(DD.SAVE_KEY);
      if (s) return JSON.parse(s);
    } catch (_) {}
    return DD.memStore;
  }
  function writeRaw(data) {
    DD.memStore = data;
    try { localStorage.setItem(DD.SAVE_KEY, JSON.stringify(data)); return true; }
    catch (_) { return false; }
  }
  function load() {
    const raw = readRaw();
    if (!raw || raw.v !== DD.VERSION) {
      DD.state = blankState();
      save();
      return DD.state;
    }
    for (const id of ['alpha', 'beta']) {
      raw.profiles[id] = Object.assign(blankProfile(id), raw.profiles[id] || {});
      if (!raw.profiles[id].cleared) raw.profiles[id].cleared = {};
      if (!Array.isArray(raw.profiles[id].museum)) raw.profiles[id].museum = [];
      if (!Array.isArray(raw.profiles[id].decor)) raw.profiles[id].decor = [];
    }
    DD.state = raw;
    return DD.state;
  }
  function save() {
    if (!DD.state) return false;
    return writeRaw(DD.state);
  }
  function profile(id) {
    if (!DD.state) load();
    return DD.state.profiles[id || DD.state.lastProfile || 'alpha'];
  }
  function setProfile(id) {
    DD.state.lastProfile = id;
    save();
  }
  return { load, save, profile, setProfile, blankProfile, blankState, readRaw, writeRaw };
})();

})();

      <div class="row">
        <button class="btn orange big" type="button" id="btnRetry">Retry</button>
        <button class="btn ghost" type="button" id="btnBack">Sites</button>
      </div>
    `);
    // refill a bit of energy
    const p = DD.Save.profile();
    p.energy = Math.max(p.energy || 0, 40);
    DD.Save.save();
    document.getElementById('btnRetry').onclick = () => startDig(id);
    document.getElementById('btnBack').onclick = sites;
  }

  function factThenPuzzle(id) {
    const site = DD.Data.site(id);
    const a = site.animal;
    const size = site.size;
    DD.screen = 'fact';
    showPanel(`
      <div class="fact-card">
        <div class="fact-art-row">
          <canvas id="factSil" width="160" height="110"></canvas>
          <div>
            <h3>${esc(a.name)}</h3>
            <div class="sub" style="text-align:left;margin:0">${esc(a.pronunciation || '')}</div>
            ${a.isDinosaur ? '' : `<div class="not-dino">Not a dinosaur! · ${esc(a.group)}</div>`}
          </div>
        </div>
        <div class="row" style="justify-content:flex-start;margin:8px 0">
          <span class="chip">${esc(a.period)}</span>
          <span class="chip">${esc(a.mya)} mya</span>
          <span class="chip">${esc(a.diet)}</span>
          <span class="chip">${esc(size.display)}</span>
        </div>
        <p style="margin:8px 0;font-size:17px"><strong>Kid fact:</strong> ${esc(a.kidFact)}</p>
        <p style="margin:8px 0;font-size:14px;opacity:.85"><strong>More:</strong> ${esc(a.deeperFact)}</p>
        <p style="font-size:12px;opacity:.55">Source on file (offline game — URL stored in data)</p>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn green big" type="button" id="btnAssemble">Assemble Skeleton</button>
      </div>
    `);
        const fs = document.getElementById('factSil');
    if (fs) { const c = fs.getContext('2d'); c.clearRect(0,0,160,110); DD.Art.silhouette(c, site, 80, 62, 1.35); }
    document.getElementById('btnAssemble').onclick = () => puzzle(id);
  }

  function puzzle(id) {
    DD.screen = 'puzzle';
    clear();
    const site = DD.Data.site(id);
    DD.Puzzle.start(id);
    const st = DD.Puzzle.getState();
    const meta = DD.meta();
    showPanel(`
      <div class="title">Assemble · ${esc(shortName(site.animal.name))}</div>
      <div class="sub">${meta.snapHints ? 'Ghost outlines show where bones go — drag to snap!' : 'Drag bones into place'}</div>
      <div class="puzzle-stage" id="puzzleStage" style="width:${st.stageW}px;max-width:92vw;height:${st.stageH}px"></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost" type="button" id="btnQuit">Quit</button></div>
    `);
    const stage = document.getElementById('puzzleStage');
    // scale stage via CSS width; keep internal coords
    stage.style.height = Math.min(st.stageH, window.innerHeight * 0.46) + 'px';

    function render() {
      stage.innerHTML = '';
      const cur = DD.Puzzle.getState();
      // ghosts for P1
      if (meta.snapHints) {
        cur.pieces.forEach((p) => {
          if (p.snapped) return;
          const g = document.createElement('div');
          g.className = 'bone-ghost';
          g.style.left = p.tx + 'px'; g.style.top = p.ty + 'px';
          g.style.width = p.w + 'px'; g.style.height = p.h + 'px';
          stage.appendChild(g);
        });
      }
      cur.pieces.forEach((p) => {
        const el = document.createElement('canvas');
        el.className = 'bone' + (p.snapped ? ' snapped' : '');
        el.width = p.w; el.height = p.h;
        el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
        el.style.width = p.w + 'px'; el.style.height = p.h + 'px';
        el.dataset.id = p.id;
        DD.Art.boneShape(el.getContext('2d'), p.w / 2, p.h / 2, p.w * 0.9, p.h * 0.85, p.kind);
        if (!p.snapped) bindDrag(el, p);
        stage.appendChild(el);
      });
      if (cur.complete) setTimeout(() => puzzleDone(id), 400);
    }

    function bindDrag(el, piece) {
      let ox = 0, oy = 0;
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        el.setPointerCapture(e.pointerId);
        const rect = stage.getBoundingClientRect();
        const sx = rect.width / st.stageW, sy = rect.height / st.stageH;
        ox = e.clientX / sx - piece.x;
        oy = e.clientY / sy - piece.y;
        const move = (ev) => {
          const x = ev.clientX / sx - ox;
          const y = ev.clientY / sy - oy;
          DD.Puzzle.moveTo(piece.id, x, y);
          const np = DD.Puzzle.getState().pieces.find((q) => q.id === piece.id);
          el.style.left = np.x + 'px'; el.style.top = np.y + 'px';
          if (np.snapped) { el.classList.add('snapped'); render(); }
        };
        const up = () => {
          el.removeEventListener('pointermove', move);
          el.removeEventListener('pointerup', up);
          render();
        };
        el.addEventListener('pointermove', move);
        el.addEventListener('pointerup', up);
      });
    }

    render();
    document.getElementById('btnQuit').onclick = sites;
  }

  function puzzleDone(id) {
    const site = DD.Data.site(id);
    showPanel(`
      <div class="title">Exhibit Ready!</div>
      <div class="sub">${esc(site.animal.name)} joins your museum.</div>
      <canvas id="doneSil" width="200" height="100" style="background:rgba(0,0,0,.2);border-radius:12px"></canvas>
      <div class="row" style="margin-top:14px">
        <button class="btn green big" type="button" id="btnMus">See Museum</button>
        <button class="btn orange big" type="button" id="btnNext">Next Site</button>
        <button class="btn ghost" type="button" id="btnSites">Sites</button>
      </div>
    `);
    DD.Art.silhouette(document.getElementById('doneSil').getContext('2d'), site, 100, 55, 2);
    document.getElementById('btnMus').onclick = museum;
    document.getElementById('btnNext').onclick = () => {
      const n = Math.min(DD.Data.count(), id + 1);
      startDig(n);
    };
    document.getElementById('btnSites').onclick = sites;
  }

  function museum() {
    DD.screen = 'museum';
    clear();
    const p = DD.Save.profile();
    showPanel(`
      <div class="title">Your Museum</div>
      <div class="sub">${p.museum.length} exhibits · Coins ${p.coins}</div>
      <canvas id="museumBg" width="640" height="160" style="width:min(640px,90vw);border-radius:12px;background:#4a3828"></canvas>
      <div class="decor-bar" style="margin:10px 0" id="decorBar"></div>
      <div class="museum-grid" id="musGrid"></div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" type="button" id="btnBack">Back</button></div>
    `);
    DD.Art.museumRoom(document.getElementById('museumBg').getContext('2d'), 640, 160, p.decor);
    const bar = document.getElementById('decorBar');
    DD.Data.decorItems.forEach((d) => {
      const owned = p.decor.includes(d.id);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn' + (owned ? ' green' : '');
      btn.textContent = owned ? d.name + ' ✓' : d.name + ' (' + d.cost + ')';
      btn.disabled = owned || p.coins < d.cost;
      btn.onclick = () => {
        if (p.decor.includes(d.id) || p.coins < d.cost) return;
        p.coins -= d.cost;
        p.decor.push(d.id);
        DD.Save.save();
        DD.Audio.click();
        museum();
      };
      bar.appendChild(btn);
    });
    const grid = document.getElementById('musGrid');
    DD.Data.sites.forEach((s) => {
      const slot = document.createElement('div');
      const filled = p.museum.includes(s.key);
      slot.className = 'museum-slot' + (filled ? ' filled' : '');
      if (filled) {
        slot.innerHTML = `<canvas width="96" height="64"></canvas><span>${esc(shortName(s.animal.name))}</span>`;
        DD.Art.silhouette(slot.querySelector('canvas').getContext('2d'), s, 48, 36, 1);
        slot.onclick = () => showFactOnly(s.id);
        slot.style.cursor = 'pointer';
      } else {
        slot.textContent = 'Empty';
      }
      grid.appendChild(slot);
    });
    document.getElementById('btnBack').onclick = hub;
  }

  function showFactOnly(id) {
    const site = DD.Data.site(id);
    const a = site.animal;
    const size = site.size;
    showPanel(`
      <div class="fact-card">
        <div class="fact-art-row">
          <canvas id="factSil2" width="160" height="110"></canvas>
          <div>
            <h3>${esc(a.name)}</h3>
            ${a.isDinosaur ? '' : `<div class="not-dino">Not a dinosaur! · ${esc(a.group)}</div>`}
          </div>
        </div>
        <div class="row" style="justify-content:flex-start;margin:8px 0">
          <span class="chip">${esc(a.period)}</span>
          <span class="chip">${esc(size.display)}</span>
        </div>
        <p>${esc(a.kidFact)}</p>
        <p style="opacity:.85;font-size:14px">${esc(a.deeperFact)}</p>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn" type="button" id="btnBack">Back</button></div>
    `);
    const fs = document.getElementById('factSil2');
    if (fs) { const c = fs.getContext('2d'); c.clearRect(0,0,160,110); DD.Art.silhouette(c, site, 80, 62, 1.35); }
    document.getElementById('btnBack').onclick = museum;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"'`]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
  }

  return { profiles, pick, hub, sites, startDig, museum, factThenPuzzle, puzzle, clear };
})();

})();

;(function(){
(function boot() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  DD.canvas = canvas;
  DD.ctx = ctx;
  DD.overlay = document.getElementById('overlay');
  DD.hud = document.getElementById('hud');
  DD.Save.load();
  DD.Audio.loadMute();
  DD.fitCanvas();

  document.getElementById('muteBtn').addEventListener('click', () => {
    DD.Audio.unlock();
    DD.Audio.setMuted(!DD.muted);
  });
  document.getElementById('fsBtn').addEventListener('click', () => {
    const app = document.getElementById('app');
    if (!document.fullscreenElement) app.requestFullscreen?.() || app.webkitRequestFullscreen?.();
    else document.exitFullscreen?.();
  });
  window.addEventListener('resize', () => DD.fitCanvas());
  ['pointerdown', 'keydown'].forEach((ev) => {
    window.addEventListener(ev, () => DD.Audio.unlock(), { passive: true });
  });

  function frame(t) {
    DD.raf = requestAnimationFrame(frame);
    DD.lastT = t;
    // background art when overlays show
    DD.clear('#3d2a1a');
    const g = ctx.createLinearGradient(0, 0, 0, DD.H);
    g.addColorStop(0, '#6a4a30');
    g.addColorStop(1, '#2a1a10');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, DD.W, DD.H);
    // decorative hills
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath();
    ctx.moveTo(0, DD.H);
    for (let i = 0; i <= 10; i++) {
      ctx.lineTo(i * (DD.W / 9), DD.H - 60 - Math.sin(i + t / 3000) * 20);
    }
    ctx.lineTo(DD.W, DD.H);
    ctx.fill();
    if (DD.Data.sites[0]) {
      DD.Art.silhouette(ctx, DD.Data.sites[0], 200, 400, 2.2);
      DD.Art.silhouette(ctx, DD.Data.sites[Math.min(3, DD.Data.count() - 1)], 900, 380, 1.8);
    }
  }

  window.__game = {
    DD,
    screen: () => DD.screen,
    save: DD.Save,
    pick: (id) => DD.UI.pick(id),
    setMaxSite: (n, pid) => {
      const p = DD.Save.profile(pid || DD.state.lastProfile);
      p.maxSite = n;
      DD.Save.save();
    },
    siteCount: () => DD.Data.count(),
    solveDig: (id, pid) => DD.Dig.solve(id, pid),
    solvePuzzle: (id, pid) => DD.Puzzle.solve(id, pid),
    solve: (id, pid, opts) => {
      const dig = DD.Dig.solve(id, pid);
      if (!dig.ok) return Object.assign({ phase: 'dig' }, dig);
      const puzz = DD.Puzzle.solve(id, pid);
      return { ok: dig.ok && puzz.ok, dig, puzz, site: id, profile: pid, proof: !!(opts && opts.proof) };
    },
    hub: () => DD.UI.hub(),
    sites: () => DD.UI.sites(),
    museum: () => DD.UI.museum(),
    profiles: () => DD.UI.profiles(),
    startDig: (id) => DD.UI.startDig(id),
    meta: () => DD.meta(),
    data: () => DD.Data
  };

  DD.UI.profiles();
  requestAnimationFrame(frame);
})();

})();</script>

<script id="car-mode-js">
window.__CAR_GAME = "dino-dig";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
</script>
