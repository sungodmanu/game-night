<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;width:100%;overflow:hidden;background:#140818;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation}

.icon-btn:active{transform:scale(.94)}
.btn{min-width:48px;min-height:48px;padding:12px 22px;border:none;border-radius:18px;font-size:20px;font-weight:800;cursor:pointer;color:#1a2744;background:#ffe566;box-shadow:0 4px 0 #d4b000,0 8px 18px rgba(0,0,0,.25);touch-action:manipulation}

  box-shadow:0 6px 0 #2db854,0 14px 28px rgba(0,0,0,.35),0 0 24px rgba(125,255,154,.45)}

.panel.festive::before,.panel::before{content:"";position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50% 50% 50% 0;background:radial-gradient(circle at 40% 40%,#ffe566,#e67e22 60%,#c44536);box-shadow:18px 4px 0 -4px #ff9ad4,36px 0 0 -6px #ffe566;opacity:.9;pointer-events:none}
.panel::after{content:"";position:absolute;right:16px;top:14px;width:26px;height:18px;background:radial-gradient(ellipse at 50% 60%,#ff9ad4 0 40%,transparent 42%),radial-gradient(ellipse at 30% 50%,#ff6b9d 0 35%,transparent 38%),radial-gradient(ellipse at 70% 50%,#ff6b9d 0 35%,transparent 38%);opacity:.85;pointer-events:none}

.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.profile-card{width:min(280px,42vw);min-height:190px;border-radius:24px;background:linear-gradient(160deg,#2a4068,#121c38);border:4px solid rgba(255,255,255,.2);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35)}

.hidden{display:none!important}
input.name-in{font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;min-height:48px;width:min(240px,70vw);text-align:center}

.outfit.sel{border-color:#ffe566;background:rgba(255,229,102,.22)}
.outfit.locked{opacity:.4;cursor:default}
.outfit canvas{width:48px;height:48px;pointer-events:none}
.world-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.world-tab{min-height:48px;padding:10px 14px;border-radius:14px;border:3px solid transparent;background:rgba(255,255,255,.12);color:#fff;font-weight:800;cursor:pointer;font-size:14px}
.world-tab.sel{border-color:#ffe566;background:rgba(255,229,102,.25)}
.hint{font-size:14px;opacity:.9;background:rgba(255,229,102,.18);border:2px solid rgba(255,229,102,.35);padding:8px 12px;border-radius:12px;max-width:520px;text-align:center}
@media (max-height:650px){
  .pad-btn{width:56px;height:56px;font-size:22px}

}
@media (orientation:portrait) and (max-width:500px){
  .profile-card{width:min(300px,80vw)}
  .pad-btn{width:58px;height:58px}
}
/* Portrait: zoom the playfield so the hero isn't tiny; nudge rotate hint */
@media (orientation:portrait){
  #app{align-items:flex-start;padding-top:calc(8px + env(safe-area-inset-top))}
  #game{
    width:100%;
    height:auto;
    max-height:78dvh;
    aspect-ratio:1180/600;
    object-fit:contain;
    transform:scale(1.05);
    transform-origin:top center;
    border-radius:10px;
  }
  #game.portrait{max-height:92dvh;transform:none;height:92%;width:auto;max-width:100%}
  #overlay,#hud,#touch{transform:none}
}
.rotate-hint{display:none;position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:25;background:rgba(20,10,30,.82);border:2px solid #d4a017;color:#ffe566;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}
.rotate-hint.hidden{display:none!important}
.pad-btn:active,.pad-btn.held{transform:translateY(3px) scale(.96);background:rgba(255,230,100,.55);box-shadow:0 1px 0 rgba(0,0,0,.25),0 0 0 3px rgba(255,229,102,.55);opacity:1;filter:brightness(1.15)}
.lvl.bonus{background:linear-gradient(160deg,#7ec8ff,#a78bfa)}

<body>
<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Diwali Lotus"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="touch" class="hidden" aria-hidden="true"></div>
  <div id="overlay"></div>
  <div class="rotate-hint" id="rotateHint">↻ Rotate your device for the best festival view</div>
  <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  <button id="fsBtn" class="icon-btn" type="button" aria-label="Fullscreen">⛶</button>
</div>
<script>"use strict";
/* ==== 00-core.js ==== */

/* Diwali Lotus — core namespace & helpers */
const DL = window.DL = {

  TILE: 40,

      infiniteLives: true, lives: 99,
      coyoteMs: 180, bufferMs: 160,
      holdJumpMs: 250, releaseCut: 0.6,

    },
    p2: {

      coyoteMs: 120, bufferMs: 110,
      holdJumpMs: 200, releaseCut: 0.45,
      jumpH: 3.0, jumpT: 0.38, fallMult: 1.75,
      jumpMult: 1.0, guardSpeed: 1.0,
      hurtInset: 6, cornerCorr: 4, ledgeProbe: 12, pickupPad: 8,
      hitPad: 4, checkpoints: 'marked', slideWindow: 1.0,
      touchBtn: 68, sinkSlow: 1.0
    }
  },
  outfits: [
    { id: 'saffron', name: 'Saffron Kurta', color: '#e67e22', accent: '#ffe566', style: 'kurta', unlock: 0 },
    { id: 'rose', name: 'Rose Lehenga', color: '#e84393', accent: '#ffcce6', style: 'lehenga', unlock: 6 },
    { id: 'emerald', name: 'Emerald Kurta', color: '#27ae60', accent: '#a8ffce', style: 'kurta', unlock: 12 },
    { id: 'indigo', name: 'Indigo Kurta', color: '#3d5a80', accent: '#a8d5ff', style: 'kurta', unlock: 18 },
    { id: 'marigold', name: 'Marigold Lehenga', color: '#f39c12', accent: '#fff3c4', style: 'lehenga', unlock: 24 },
    { id: 'lotus', name: 'Lotus Pink', color: '#ff6b9d', accent: '#ffd6e7', style: 'lehenga', unlock: 36 },
    { id: 'gold', name: 'Festival Gold', color: '#d4a017', accent: '#fff4a8', style: 'kurta', unlock: 50 },
    { id: 'royal', name: 'Royal Blue', color: '#1e3a8a', accent: '#fbbf24', style: 'kurta', unlock: 70 }
  ],
  worlds: [
    { id: 'lotus', name: 'Lotus River', sky: ['#1a0a28', '#4a1848'], accent: '#ff9ad4', ground: '#5a3060', river: true },
    { id: 'rangoli', name: 'Rangoli Market', sky: ['#2a1030', '#6a2848'], accent: '#ffb347', ground: '#6a3a40', market: true },
    { id: 'lantern', name: 'Lantern Rooftops', sky: ['#120820', '#3a1858'], accent: '#ffe566', ground: '#3a2a48', lanterns: true },
    { id: 'firework', name: 'Firework Sky', sky: ['#0a0618', '#2a1040'], accent: '#ff6b9d', ground: '#2a1840', fireworks: true },
    { id: 'sweet', name: 'Sweet Shop Street', sky: ['#2a0e20', '#5a2038'], accent: '#ffb347', ground: '#6a3040', sweet: true },
    { id: 'lakeside', name: 'Lakeside Fireworks', sky: ['#0c1028', '#2a1850'], accent: '#7ec8ff', ground: '#2a3858', lake: true, fireworks: true }
  ],
  bosses: [
    { name: 'Mischievous Monkey', kind: 'monkey' },
    { name: 'Runaway Elephant Float', kind: 'elephant' },
    { name: 'Kite-Stealing Crow', kind: 'crow' },
    { name: 'Spark Dragon Float', kind: 'dragon' },
    { name: 'Runaway Sweet Cart', kind: 'cart' },
    { name: 'Friendly Firecracker Crane', kind: 'crane' }
  ],
  memStore: null,
  state: null,
  screen: 'boot',
  raf: 0,
  lastT: 0,
  muted: false,
  keys: Object.create(null),
  touch: Object.create(null),
  canvas: null,
  ctx: null,
  overlay: null,
  hud: null,
  touchEl: null,
  run: null,
  race: null,
  cam: { x: 0, y: 0 },
  pointers: Object.create(null),
  fireworks: []
};

DL.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
DL.lerp = (a, b, t) => a + (b - a) * t;
DL.rand = (a, b) => a + Math.random() * (b - a);
DL.pick = (arr) => arr[(Math.random() * arr.length) | 0];
DL.seeded = (seed) => {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
};
DL.now = () => performance.now();
DL.meta = () => DL.profiles[(DL.state && DL.state.lastProfile) || 'p1'];
DL.toast = (msg, ms) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), ms || 1400);
};
DL.BASE_W = 1180; DL.BASE_H = 600;
DL.fitCanvas = () => {
  const c = DL.canvas;
  if (!c) return;
  const portrait = (window.innerHeight || 1) > (window.innerWidth || 1) * 1.05;
  DL.portrait = portrait;
  const wantW = portrait ? 640 : DL.BASE_W;
  const wantH = portrait ? 900 : DL.BASE_H;
  if (DL.W !== wantW || DL.H !== wantH) { DL.W = wantW; DL.H = wantH; }
  if (c.width !== DL.W) c.width = DL.W;
  if (c.height !== DL.H) c.height = DL.H;
  c.classList.toggle('portrait', !!portrait);
};
DL.clear = (color) => {
  const ctx = DL.ctx;
  ctx.fillStyle = color || '#1a0a28';
  ctx.fillRect(0, 0, DL.W, DL.H);
};
DL.roundRect = (ctx, x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};
DL.rectHit = (a, b, pad) => {
  pad = pad || 0;
  return a.x + pad < b.x + b.w - pad && a.x + a.w - pad > b.x + pad &&
    a.y + pad < b.y + b.h - pad && a.y + a.h - pad > b.y + pad;
};

})();
/* ==== 10-audio.js ==== */
;(function(){
/* WebAudio SFX + soft festival music — only after first user input */
DL.Audio = (() => {
  let ctx = null, master = null, unlocked = false, musicTimer = null, musicStep = 0;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = DL.muted ? 0 : 0.28;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    unlocked = true;
    startMusic();
  }

  function tone(freq, dur, type, vol, slide) {
    if (DL.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol) {
    if (DL.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const n = Math.max(1, (c.sampleRate * dur) | 0);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    g.gain.value = vol || 0.05;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1000;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  // Soft pentatonic Diwali-ish loop (gentle, not loud)
  const MELODY = [392, 440, 494, 523, 587, 523, 494, 440, 392, 349, 392, 440];
  function startMusic() {
    if (musicTimer || DL.muted) return;
    musicStep = 0;
    musicTimer = setInterval(() => {
      if (DL.muted || !unlocked) return;
      const f = MELODY[musicStep % MELODY.length];
      tone(f, 0.28, 'triangle', 0.035);
      if (musicStep % 4 === 0) tone(f / 2, 0.4, 'sine', 0.02);
      musicStep++;
    }, 420);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  return {
    unlock,
    setMuted(m) {
      DL.muted = !!m;
      if (master) master.gain.value = DL.muted ? 0 : 0.28;
      try { localStorage.setItem('dl-mute', DL.muted ? '1' : '0'); } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = DL.muted ? '🔇' : '🔊';
      if (DL.muted) stopMusic(); else if (unlocked) startMusic();
    },
    loadMute() {
      try { DL.muted = localStorage.getItem('dl-mute') === '1'; } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = DL.muted ? '🔇' : '🔊';
    },
    click() { tone(360, 0.05, 'triangle', 0.06); },
    jump() { tone(300, 0.1, 'square', 0.06, 540); },
    doubleJump() { tone(380, 0.09, 'square', 0.055, 680); },

      ctx.lineTo(28, 0);
      ctx.lineTo(16, 4);
      ctx.fill();
      ctx.fillStyle = '#ffe566';
      ctx.fillRect(-6, -4, 4, 4);
    } else if (kind === 'dragon') {
      ctx.fillStyle = '#3d8a6a';
      DL.roundRect(ctx, -36, -22, 72, 40, 12);
      ctx.fill();
      ctx.fillStyle = '#ffe566';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(-20 + i * 14, -18 + Math.sin(t * 5 + i) * 2, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText('SPARK!', 0, -28);
    } else if (kind === 'cart') {
      ctx.fillStyle = '#c47820';
      DL.roundRect(ctx, -28, -10, 56, 28, 6);
      ctx.fill();
      ctx.fillStyle = '#ffe566';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(-14 + i * 14, -16, 8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#3a2010';
      ctx.beginPath(); ctx.arc(-16, 16, 7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(16, 16, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('SWEETS', 0, -28);
    } else if (kind === 'crane') {
      ctx.fillStyle = '#e8e0d0';
      ctx.beginPath();
      ctx.ellipse(0, 0, 22, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff6b9d';
      ctx.beginPath();
      ctx.moveTo(18, -2); ctx.lineTo(32, 0); ctx.lineTo(18, 4); ctx.fill();
      ctx.fillStyle = '#ffe566';
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(-8 + i * 4, -22 - Math.sin(t * 6 + i) * 3, 3, 10);
      }
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('CRANE!', 0, -32);
    } else {
      // mischievous monkey
      ctx.fillStyle = '#a67c52';
      DL.roundRect(ctx, -w / 2, -h / 2, w, h, 10);
      ctx.fill();
      ctx.fillStyle = '#d4a574';
      ctx.beginPath();
      ctx.arc(0, -h / 4, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a1020';
      ctx.fillRect(-6, -h / 4 - 2, 3, 3);
      ctx.fillRect(3, -h / 4 - 2, 3, 3);
      ctx.fillStyle = '#c44536';
      ctx.beginPath();
      ctx.ellipse(w / 2 - 4, 0, 6, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe566';
      ctx.font = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('!', 0, -h / 2 - 4);
    }
    ctx.restore();
  }

  function drawDiya(ctx, x, y, t) {
    const bob = Math.sin(t * 3) * 3;
    ctx.save();
    ctx.translate(x, y + bob);
    // glow
    ctx.fillStyle = 'rgba(255,180,60,0.28)';
    ctx.beginPath();
    ctx.arc(0, -4, 16, 0, Math.PI * 2);
    ctx.fill();
    // clay bowl
    ctx.fillStyle = '#c44536';
    ctx.beginPath();
    ctx.ellipse(0, 4, 12, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8b2e1f';
    ctx.beginPath();
    ctx.ellipse(0, 6, 10, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // flame
    const flick = Math.sin(t * 8) * 2;
    ctx.fillStyle = '#ffb347';
    ctx.beginPath();
    ctx.moveTo(-4, 0);
    ctx.quadraticCurveTo(-2, -14 + flick, 0, -18 + flick);
    ctx.quadraticCurveTo(2, -14 - flick, 4, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffe566';
    ctx.beginPath();
    ctx.moveTo(-2, 0);
    ctx.quadraticCurveTo(0, -10, 0, -12);
    ctx.quadraticCurveTo(0, -10, 2, 0);
    ctx.fill();
    ctx.restore();
  }

  function drawLaddoo(ctx, x, y, t) {
    const bob = Math.sin(t * 2.5 + 1) * 3;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.fillStyle = '#e8a838';
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f5d080';
    ctx.beginPath();
    ctx.arc(-3, -3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c47820';
    ctx.beginPath();
    ctx.arc(3, 2, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCheckpoint(ctx, x, y, on) {
    ctx.save();
    ctx.translate(x, y);
    // mini lit diya post
    ctx.fillStyle = on ? '#7dff9a' : '#ffb347';
    ctx.fillRect(-3, -40, 6, 40);
    ctx.fillStyle = on ? '#ffe566' : '#ff9ad4';
    ctx.beginPath();
    ctx.ellipse(0, -44, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    if (on) {
      ctx.fillStyle = '#fff4a8';
      ctx.beginPath();
      ctx.moveTo(-3, -50);
      ctx.quadraticCurveTo(0, -62, 3, -50);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawGoal(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    // lit town arch / festive gate
    ctx.fillStyle = '#d4a017';
    ctx.fillRect(-28, -10, 56, 12);
    ctx.fillRect(-30, -60, 12, 50);
    ctx.fillRect(18, -60, 12, 50);
    ctx.fillStyle = '#ff9ad4';
    ctx.beginPath();
    ctx.arc(0, -60, 22, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#ffe566';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.arc(i * 10, -70 + Math.sin(t * 3 + i) * 2, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.font = 'bold 12px system-ui';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('TOWN', 0, -8);
    ctx.restore();
  }

  function drawSpike(ctx, x, y, w, h) {
    // prickly marigold thorn decorations
    ctx.fillStyle = '#e67e22';
    const n = Math.max(1, Math.floor(w / 14));
    for (let i = 0; i < n; i++) {
      const sx = x + (i + 0.5) * (w / n);
      ctx.beginPath();
      ctx.moveTo(sx - 6, y + h);
      ctx.lineTo(sx, y);
      ctx.lineTo(sx + 6, y + h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#f5c542';
      ctx.beginPath();
      ctx.arc(sx, y + 2, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e67e22';
    }
  }

  function drawRope(ctx, r) {
    ctx.strokeStyle = '#c8a06a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x, r.y + r.h);
    ctx.stroke();
    // akash kandil lantern
    ctx.fillStyle = '#c44536';
    DL.roundRect(ctx, r.x - 12, r.y - 4, 24, 28, 4);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,200,80,0.7)';
    ctx.fillRect(r.x - 8, r.y + 4, 16, 14);
    ctx.fillStyle = '#ffe566';
    ctx.beginPath();
    ctx.moveTo(r.x - 4, r.y + 18);
    ctx.lineTo(r.x, r.y + 28);
    ctx.lineTo(r.x + 4, r.y + 18);
    ctx.fill();
  }

  function drawBoss(ctx, x, y, t, kind) {
    drawGuard(ctx, x - 40, y - 50, 80, 70, t, kind || 'monkey');
    ctx.save();
    ctx.translate(x, y - 70);
    ctx.fillStyle = '#ffe566';
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('CHASE!', 0, 0);
    ctx.restore();
  }

  function drawLotusPad(ctx, p) {
    const sink = p.sink || 0;
    const y = (p.baseY != null ? p.baseY : p.y) + sink * 22;
    ctx.save();
    ctx.translate(p.x + p.w / 2, y + p.h / 2);
    // glow
    ctx.fillStyle = 'rgba(255,154,212,0.25)';
    ctx.beginPath();
    ctx.ellipse(0, 4, p.w * 0.55, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    // petals
    const petals = 8;
    for (let i = 0; i < petals; i++) {
      const a = (i / petals) * Math.PI * 2;
      ctx.fillStyle = i % 2 ? '#ff9ad4' : '#ff6b9d';
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * (p.w * 0.28), Math.sin(a) * 6, p.w * 0.22, 8, a, 0, Math.PI * 2);
      ctx.fill();
    }
    // center
    ctx.fillStyle = '#ffe566';
    ctx.beginPath();
    ctx.ellipse(0, 0, p.w * 0.18, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // write back visual y for physics sync helper
    p._drawY = y;
  }

  function drawPlatform(ctx, p, world) {
    const wmeta = DL.worlds[world] || DL.worlds[0];
    if (p.type === 'lotus') { drawLotusPad(ctx, p); return; }
    if (p.type === 'boat') {
      const sink = p.sink || 0;
      const y = (p.baseY != null ? p.baseY : p.y) + sink * 18;
      ctx.save();
      ctx.translate(p.x + p.w / 2, y + p.h / 2);
      ctx.fillStyle = '#5a3a28';
      DL.roundRect(ctx, -p.w / 2, -4, p.w, 14, 6); ctx.fill();
      ctx.fillStyle = '#c44536';
      ctx.beginPath(); ctx.ellipse(0, -10, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe566';
      ctx.beginPath();
      ctx.moveTo(0, -18); ctx.quadraticCurveTo(4, -26, 6, -14); ctx.fill();
      ctx.restore();
      p._drawY = y;
      return;
    }
    if (p.type === 'bounce') {
      // marigold garland bounce
      for (let i = 0; i < p.w; i += 10) {
        ctx.fillStyle = (i / 10) % 2 ? '#f39c12' : '#e67e22';
        ctx.beginPath(); ctx.arc(p.x + i + 5, p.y + 6, 7, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,200,80,0.35)';
      DL.roundRect(ctx, p.x, p.y - 4, p.w, p.h + 4, 6); ctx.fill();
      return;
    }
    if (p.type === 'spring') {
      // rocket firework spring
      ctx.fillStyle = '#ff6b9d';
      DL.roundRect(ctx, p.x + p.w * 0.2, p.y - 10, p.w * 0.6, 28, 6); ctx.fill();
      ctx.fillStyle = '#ffe566';
      ctx.beginPath();
      ctx.moveTo(p.x + p.w / 2, p.y - 28);
      ctx.lineTo(p.x + p.w / 2 - 10, p.y - 8);
      ctx.lineTo(p.x + p.w / 2 + 10, p.y - 8);
      ctx.fill();
      ctx.fillStyle = '#7ec8ff';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(p.x + 8 + i * 12, p.y + 10, 4, 8);
      }
      return;
    }
    if (p.type === 'laddoo') {
      ctx.fillStyle = '#d4a017';
      DL.roundRect(ctx, p.x, p.y, p.w, p.h, 10); ctx.fill();
      ctx.fillStyle = '#ffe566';
      for (let i = 8; i < p.w; i += 22) {
        ctx.beginPath(); ctx.arc(p.x + i, p.y + 6, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#c44536';
        ctx.beginPath(); ctx.arc(p.x + i, p.y + 4, 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffe566';
      }
      return;
    }
    if (p.type === 'jalebi') {
      ctx.strokeStyle = '#ffb347';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < p.w; i += 16) {
        ctx.arc(p.x + i + 8, p.y + 6, 7, 0, Math.PI * 2);
      }
      ctx.stroke();
      ctx.strokeStyle = '#e67e22';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < p.w; i += 16) {
        ctx.arc(p.x + i + 8, p.y + 6, 4, 0, Math.PI * 2);
      }
      ctx.stroke();
      return;
    }
    if (p.type === 'oneway') {
      ctx.fillStyle = '#f39c12';
      ctx.globalAlpha = 0.9;
      DL.roundRect(ctx, p.x, p.y, p.w, p.h, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      for (let i = 0; i < p.w; i += 12) {
        ctx.fillStyle = i % 24 === 0 ? '#e67e22' : '#f5c542';
        ctx.beginPath();
        ctx.arc(p.x + i + 6, p.y + 6, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      return;
    }
    if (p.type === 'climb') {
      ctx.fillStyle = '#6a4a3a';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#c47820';
      for (let yy = p.y + 10; yy < p.y + p.h; yy += 18) ctx.fillRect(p.x + 4, yy, p.w - 8, 4);
      return;
    }
    ctx.fillStyle = wmeta.ground;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = wmeta.accent;
    ctx.globalAlpha = 0.45;
    ctx.fillRect(p.x, p.y, p.w, 6);
    ctx.globalAlpha = 1;
    // Rangoli Market: colorful rangoli on ground tops + walls
    if (wmeta.market) {
      const cols = ['#ff6b9d', '#ffe566', '#7ec8ff', '#7dff9a', '#ffb347', '#ff9ad4'];
      for (let i = 0; i < p.w; i += 18) {
        ctx.fillStyle = cols[(i / 18 | 0) % cols.length];
        ctx.beginPath();
        ctx.arc(p.x + i + 9, p.y + 14, 5, 0, Math.PI * 2);
        ctx.fill();
        // petal ring
        for (let a = 0; a < 6; a++) {
          const ang = (a / 6) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(p.x + i + 9 + Math.cos(ang) * 9, p.y + 14 + Math.sin(ang) * 5, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // marigold garland along top
      for (let i = 0; i < p.w; i += 14) {
        ctx.fillStyle = i % 28 === 0 ? '#e67e22' : '#f5c542';
        ctx.beginPath(); ctx.arc(p.x + i + 7, p.y - 4, 5, 0, Math.PI * 2); ctx.fill();
      }
      // market stall posts on tall platforms
      if (p.h > 80) {
        ctx.fillStyle = 'rgba(90,50,30,0.55)';
        ctx.fillRect(p.x + 8, p.y + 20, 6, Math.min(60, p.h - 30));
        ctx.fillRect(p.x + p.w - 14, p.y + 20, 6, Math.min(60, p.h - 30));
        ctx.fillStyle = 'rgba(255,107,157,0.5)';
        ctx.fillRect(p.x + 4, p.y + 18, p.w - 8, 10);
      }
    }
  }

  function drawBg(ctx, cam, level, t) {
    const w = DL.worlds[level.world] || DL.worlds[0];
    const g = ctx.createLinearGradient(0, 0, 0, DL.H);
    g.addColorStop(0, w.sky[0]);
    g.addColorStop(1, w.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, DL.W, DL.H);

    // moon
    ctx.fillStyle = 'rgba(255,244,200,0.85)';
    ctx.beginPath();
    ctx.arc(DL.W * 0.82 - cam.x * 0.02, 70, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = w.sky[0];
    ctx.beginPath();
    ctx.arc(DL.W * 0.82 - cam.x * 0.02 + 10, 64, 22, 0, Math.PI * 2);
    ctx.fill();

    // stars
    ctx.fillStyle = 'rgba(255,244,180,0.55)';
    for (let i = 0; i < 50; i++) {
      const sx = ((i * 97 + 20) - cam.x * 0.04) % DL.W;
      const sy = (i * 37) % (DL.H * 0.5);
      const tw = 1.5 + (i % 3) * 0.5;
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 2 + i);
      ctx.fillRect(((sx % DL.W) + DL.W) % DL.W, sy, tw, tw);
    }
    ctx.globalAlpha = 1;

    // distant city silhouette with lit windows (parallax far)
    ctx.fillStyle = 'rgba(8,4,18,0.55)';
    for (let i = 0; i < 10; i++) {
      const bx = (((i * 200 - cam.x * 0.15) % (DL.W + 260)) + DL.W + 260) % (DL.W + 260) - 80;
      const bh = 90 + (i % 4) * 40;
      ctx.fillRect(bx, DL.H - bh - 40, 70 + (i % 3) * 30, bh);
      // lit windows
      for (let wy = DL.H - bh - 30; wy < DL.H - 50; wy += 14) {
        for (let wx = bx + 8; wx < bx + 60; wx += 12) {
          if ((wx + wy + i) % 5 === 0) continue;
          ctx.fillStyle = (wx + i) % 3 === 0 ? 'rgba(255,220,100,0.7)' : 'rgba(255,160,80,0.45)';
          ctx.fillRect(wx, wy, 5, 6);
          ctx.fillStyle = 'rgba(8,4,18,0.55)';
        }
      }
    }

    // hanging strings of lights (mid parallax)
    ctx.lineWidth = 1.5;
    for (let s = 0; s < 3; s++) {
      const baseY = 40 + s * 28;
      ctx.strokeStyle = 'rgba(255,220,120,0.35)';
      ctx.beginPath();
      const startX = -((cam.x * 0.28) % 120);
      ctx.moveTo(startX, baseY);
      for (let x = startX; x < DL.W + 40; x += 40) {
        ctx.quadraticCurveTo(x + 20, baseY + 14, x + 40, baseY);
      }
      ctx.stroke();
      for (let x = startX; x < DL.W + 40; x += 40) {
        const cols = ['#ff6b9d', '#ffe566', '#7ec8ff', '#7dff9a', '#ffb347'];
        ctx.fillStyle = cols[((x / 40) | 0 + s) % cols.length];
        ctx.beginPath();
        ctx.arc(x + 20, baseY + 12, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // akash kandil lanterns
    for (let i = 0; i < 8; i++) {
      const lx = (((i * 170 - cam.x * 0.4) % (DL.W + 100)) + DL.W + 100) % (DL.W + 100) - 20;
      const ly = 55 + (i % 4) * 26 + Math.sin(t * 1.2 + i) * 5;
      ctx.strokeStyle = 'rgba(255,220,120,0.35)';
      ctx.beginPath(); ctx.moveTo(lx + 10, ly - 18); ctx.lineTo(lx + 10, ly); ctx.stroke();
      ctx.fillStyle = i % 2 ? 'rgba(255,140,60,0.7)' : 'rgba(255,90,140,0.65)';
      DL.roundRect(ctx, lx, ly, 20, 26, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,230,120,0.5)';
      ctx.fillRect(lx + 5, ly + 6, 10, 12);
    }

    // occasional background fireworks bursts
    if (w.fireworks || level.world >= 3) {
      for (let i = 0; i < 4; i++) {
        const phase = (t * 0.35 + i * 1.7) % 3;
        if (phase > 1.2) continue;
        const fx = (((i * 280 - cam.x * 0.2) % (DL.W + 60)) + DL.W + 60) % (DL.W + 60);
        const fy = 50 + (i % 3) * 45;
        const cols = ['#ff6b9d', '#ffe566', '#7ec8ff', '#ffb347'];
        ctx.strokeStyle = cols[i % cols.length];
        ctx.globalAlpha = 0.55 * (1 - phase / 1.2);
        ctx.lineWidth = 2;
        const r = 8 + phase * 28;
        for (let a = 0; a < 10; a++) {
          const ang = (a / 10) * Math.PI * 2 + t;
          ctx.beginPath();
          ctx.moveTo(fx, fy);
          ctx.lineTo(fx + Math.cos(ang) * r, fy + Math.sin(ang) * r);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }

    // river / lake water
    if (w.river || w.lake) {
      ctx.fillStyle = w.lake ? 'rgba(30,50,110,0.5)' : 'rgba(40,60,120,0.45)';
      ctx.fillRect(0, DL.H - 90, DL.W, 90);
      ctx.strokeStyle = 'rgba(255,180,220,0.25)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const wx = (((i * 220 - cam.x * 0.4) % (DL.W + 100)) + DL.W + 100) % (DL.W + 100);
        ctx.beginPath();
        ctx.moveTo(wx, DL.H - 70);
        ctx.quadraticCurveTo(wx + 40, DL.H - 80 + Math.sin(t + i) * 4, wx + 80, DL.H - 70);
        ctx.stroke();
      }
      if (w.lake) {
        // floating diya reflections
        for (let i = 0; i < 5; i++) {
          const dx = (((i * 210 - cam.x * 0.35) % (DL.W + 40)) + DL.W + 40) % (DL.W + 40);
          ctx.fillStyle = 'rgba(255,180,60,0.35)';
          ctx.beginPath(); ctx.ellipse(dx, DL.H - 55 + Math.sin(t + i) * 3, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    // sweet shop awnings silhouette
    if (w.sweet) {
      for (let i = 0; i < 6; i++) {
        const bx = (((i * 240 - cam.x * 0.25) % (DL.W + 200)) + DL.W + 200) % (DL.W + 200) - 40;
        ctx.fillStyle = 'rgba(90,30,40,0.45)';
        ctx.fillRect(bx, DL.H - 140, 120, 100);
        ctx.fillStyle = i % 2 ? 'rgba(255,107,157,0.5)' : 'rgba(255,179,71,0.5)';
        ctx.beginPath();
        ctx.moveTo(bx - 8, DL.H - 140);
        for (let x = 0; x <= 120; x += 20) {
          ctx.lineTo(bx + x, DL.H - 140 - (x % 40 === 0 ? 12 : 0));
        }
        ctx.lineTo(bx + 128, DL.H - 140);
        ctx.fill();
      }
    }

    // rangoli market midground stalls + ground rangoli strips
    if (w.market) {
      const cols = ['#ff6b9d', '#ffe566', '#7ec8ff', '#7dff9a', '#ffb347'];
      for (let i = 0; i < 5; i++) {
        const sx = (((i * 260 - cam.x * 0.3) % (DL.W + 200)) + DL.W + 200) % (DL.W + 200) - 50;
        ctx.fillStyle = 'rgba(60,30,40,0.5)';

        p.rope = r; p.ropeT = 0.5; p.x = r.x - p.w / 2; p.y = r.y + p.ropeT * r.h; p.ropeCool = 0; p.wasJumpDown = false; p.vx = 0; p.vy = 0;
        DL.Physics.updatePlayer(p, level, { left: false, right: true, up: false, down: false, jumpDown: true, slide: false }, 1 / 60);
        const released = !p.rope && p.vy < 0 && stickyHold;
        // cooldown prevents instant regrab
        let regrabbedEarly = false;
        for (let f = 0; f < 10; f++) {
          DL.Physics.updatePlayer(p, level, { left: false, right: false, up: false, down: false, jumpDown: false, slide: false }, 1 / 60);
          if (p.rope) { regrabbedEarly = true; break; }
        }
        // climb up while held
        const p2 = DL.Physics.makePlayer({ x: r.x - 20, y: r.y + r.h * 0.5 }, { meta, outfit: 'saffron' });
        p2.rope = r; p2.ropeT = 0.5; p2.x = r.x - p2.w / 2; p2.y = r.y + p2.ropeT * r.h;
        const t0 = p2.ropeT;
        DL.Physics.updatePlayer(p2, level, { left: false, right: false, up: true, down: false, jumpDown: false, slide: false }, 0.2);
        const climbedUp = p2.rope ? p2.ropeT < t0 - 0.05 : true;
        const ok = released && stickyHold && !regrabbedEarly && climbedUp;
        if (!ok) allOk = false;
        details.push({ ri, released, stickyHold, regrabbedEarly, climbedUp, vy: p.vy, cool: p.ropeCool });
        DL.muted = wasMuted;
      }
      results.push({ levelId: id, ropes: level.ropes.length, ok: allOk && cpOk, cpOk, details });
    }
    return results;
  }

  /** Short-tap jump clears ~1 tile for both profiles. */
  function testMinJump() {
    const out = [];
    for (const pid of ['p1', 'p2']) {
      const meta = DL.profiles[pid];
      const level = {
        width: 800, height: 600,
        platforms: [{ x: 0, y: 400, w: 400, h: 200, type: 'solid' }],
        ropes: [], spikes: [], diyas: [], laddoos: [], checkpoints: [], guards: [], moving: [], winds: [], falling: []
      };
      const p = DL.Physics.makePlayer({ x: 80, y: 400 - 72 }, { meta });
      p.onGround = true;
      const wasMuted = DL.muted; DL.muted = true;
      // one-frame jump tap then release
      DL.Physics.updatePlayer(p, level, { left: false, right: false, up: false, down: false, jumpDown: true, slide: false }, 1 / 60);
      let peak = p.y;
      for (let f = 0; f < 90; f++) {
        DL.Physics.updatePlayer(p, level, { left: false, right: false, up: false, down: false, jumpDown: false, slide: false }, 1 / 60);
        peak = Math.min(peak, p.y);
      }
      const rise = (400 - 72) - peak;
      const ok = rise >= DL.TILE * 0.95;
      out.push({ profileId: pid, rise, need: DL.TILE, ok });
      DL.muted = wasMuted;
    }
    return out;
  }

  function solve(levelId, profileId) {
    const level = DL.Levels.get(levelId);
    const geo = geometryOk(level, profileId);
    const sim = simulate(levelId, profileId);
    return {
      ok: !!geo.ok,
      simOk: !!sim.won,
      levelId,
      profileId: profileId || 'p1',
      time: sim.t,
      frames: sim.frames,
      x: sim.x,
      goalX: level.goal.x,
      geo,
      via: sim.won ? 'sim+geometry' : (geo.ok ? 'geometry' : 'fail')
    };
  }

  function solveAll() {
    const results = [];
    for (const pid of ['p1', 'p2']) {
      for (let i = 1; i <= DL.Levels.TOTAL; i++) results.push(solve(i, pid));
    }
    return results;
  }

  /** Softlock sweep: from path/rope samples, some escape input must free the player. */
  function testNoSoftlock() {
    // Escape attempts (not "every combo must move" — idle up/slide alone is not a softlock)
    const escapes = [
      { left: false, right: true, up: false, down: false, jumpDown: false, slide: false },
      { left: false, right: true, up: false, down: false, jumpDown: true, slide: false },
      { left: true, right: false, up: false, down: false, jumpDown: true, slide: false },
      { left: false, right: false, up: false, down: false, jumpDown: true, slide: false },
      { left: false, right: true, up: true, down: false, jumpDown: false, slide: false }
    ];
    const out = [];
    const wasMuted = DL.muted; DL.muted = true;
    // world 0 / Lotus River must never spawn ropes (dad L1 softlock)
    for (let id = 1; id <= 8; id++) {
      const L = DL.Levels.get(id);
      if ((L.ropes || []).length) out.push({ id, reason: 'world0-rope', n: L.ropes.length });
    }
    for (let id = 1; id <= DL.Levels.MAIN; id++) {
      const level = DL.Game.cloneLevel(DL.Levels.get(id));
      const meta = DL.profiles.p1;
      const samples = [];
      const path = (level.path || []).concat([level.start, level.goal]);
      const step = Math.max(1, Math.floor(path.length / 5));
      for (let si = 0; si < path.length; si += step) samples.push(path[si]);
      for (const r of level.ropes || []) samples.push({ x: r.x - 20, y: r.y + r.h * 0.55, _rope: r });
      for (const s of samples) {
        let anyOk = false;
        for (const ctrl of escapes) {
          const spawn = DL.Physics.safeSpawn ? DL.Physics.safeSpawn(level, { x: s.x, y: s.y }) : { x: s.x, y: s.y };
          const p = DL.Physics.makePlayer(spawn, { meta, outfit: 'saffron' });
          if (s._rope) {
            p.rope = s._rope; p.ropeT = 0.55;
            p.x = s._rope.x - p.w / 2; p.y = s._rope.y + p.ropeT * s._rope.h;
            p.wasJumpDown = true; // sticky-jump case
          }
          const x0 = p.x, y0 = p.y;
          for (let f = 0; f < 120; f++) {
            DL.Game.updateMoving(level, 1 / 60);
            if (DL.Game.updateLotus) DL.Game.updateLotus({ level, player: p, players: [p], meta }, 1 / 60);
            DL.Physics.updatePlayer(p, level, ctrl, 1 / 60);
            if (!p.alive) { anyOk = true; break; }
            if (s._rope && !p.rope) { anyOk = true; break; }
            if (Math.abs(p.x - x0) > 36 || Math.abs(p.y - y0) > 40) { anyOk = true; break; }
            if (p.x + p.w / 2 > level.goal.x - 40) { anyOk = true; break; }
          }
          if (anyOk) break;
        }
        if (!anyOk) {
          if (out.length < 20) out.push({ id, x: s.x, y: s.y, rope: !!s._rope });
        }
      }
    }
    DL.muted = wasMuted;
    return { ok: out.length === 0, fails: out };
  }

  /** Collect N diyas and verify HUD + end totals + saved wallet. */
  function testDiyaCollect(n) {
    n = n || 5;
    DL.Save.setProfile('p1');
    const p0 = DL.Save.profile('p1');
    const before = p0.diyas || 0;
    const beforeTotal = p0.totalDiyas || 0;
    DL.Game.start(1);
    const run = DL.run;
    const p = run.player;
    // Isolate: no laddoos (worth +2), goal far so collect doesn't auto-win
    run.level.laddoos = [];
    run.level.goal.x = 99999; run.level.goal.y = -9999;
    let collected = 0;
    for (const d of run.level.diyas) {
      if (collected >= n) break;
      p.x = d.x - 10; p.y = d.y - 10; p.vx = 0; p.vy = 0;
      DL.Game.collect(run, p);
      if (d.taken) collected++;
    }
    DL.Game.refreshHudDiyas();
    const want = collected;
    const hud = Number((document.getElementById('diyaCount') || {}).textContent);
    const chip = (document.getElementById('diyaChip') || {}).innerText || '';
    // restore goal and clear
    run.level.goal.x = run.level.start.x + 40; run.level.goal.y = run.level.start.y;
    DL.Game.win(run, p);
    const endSub = (document.querySelector('#overlay .sub') || {}).textContent || '';
    const prof = DL.Save.profile('p1');
    const savedDiyas = (prof.diyas || 0) - before;
    const savedTotal = (prof.totalDiyas || 0) - beforeTotal;
    return {
      collected: want,
      hud,
      chipHas: /Diyas/i.test(chip) && chip.indexOf(String(want)) >= 0,
      endHas: endSub.indexOf(String(want)) >= 0,
      savedDiyas,
      savedTotal,
      ok: want >= Math.min(n, run.diyasTotal) &&
          hud === want &&
          run.diyasGot === want &&
          savedDiyas === want &&
          savedTotal === want &&
          endSub.indexOf(String(want)) >= 0
    };
  }

  return { solve, solveAll, geometryOk, simulate, testRopeReleases, testMinJump, testNoSoftlock, testDiyaCollect };
})();

})();

;(function(){
/* Boot, input, loop, fullscreen, debug hook */
(function boot() {
  function loop(t) {
    const dt = Math.min(0.033, (t - (DL.lastT || t)) / 1000);
    DL.lastT = t;
    if (DL.screen === 'play' && DL.run) {
      DL.Game.tick(dt);
      DL.fitCanvas();
      DL.Game.draw();
    } else if (DL.screen === 'title') {
      DL.fitCanvas();
      const ctx = DL.ctx;
      const tt = t / 1000;
      DL.Art.drawBg(ctx, { x: (DL._bgx = (DL._bgx || 0) + dt * 20), y: 0 }, { world: 0, width: 3000, height: 600 }, tt);
      // festive foreground props so title never looks empty
      for (let i = 0; i < 5; i++) {
        DL.Art.drawLotusPad(ctx, { x: 80 + i * 220, y: 480 + Math.sin(tt + i) * 6, w: 70, h: 18, sink: 0, baseY: 480 + Math.sin(tt + i) * 6 });
        DL.Art.drawDiya(ctx, 120 + i * 220, 430 + Math.sin(tt * 2 + i) * 4, tt);
      }
      DL.Art.drawHero(ctx, DL.W * 0.5 - 30, DL.H * 0.52, 66, 90, { outfit: (DL.Save.profile().outfit || 'saffron'), frame: t / 80, facing: 1, onGround: true });
      DL.Art.drawLaddoo(ctx, DL.W * 0.5 + 50, DL.H * 0.52, tt);
    }
    DL.raf = requestAnimationFrame(loop);
  }

  function bindInput() {
    window.addEventListener('keydown', (e) => {
      DL.Audio.unlock();
      DL.keys[e.key] = true;
      if (e.code) DL.keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
      if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && DL.run && DL.screen === 'play') {
        DL.Game.togglePause();
      }
    }, { passive: false });
    window.addEventListener('keyup', (e) => {
      DL.keys[e.key] = false;
      if (e.code) DL.keys[e.code] = false;
    });
    const unlock = () => DL.Audio.unlock();
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('touchstart', unlock, { passive: true });

    const mute = document.getElementById('muteBtn');
    if (mute) mute.onclick = () => { DL.Audio.unlock(); DL.Audio.setMuted(!DL.muted); };
    const fs = document.getElementById('fsBtn');
    if (fs) fs.onclick = () => {
      DL.Audio.unlock();
      const app = document.getElementById('app');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const req = app.requestFullscreen || app.webkitRequestFullscreen;
        if (req) req.call(app);
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
      }
    };
  }

  function init() {
    DL.canvas = document.getElementById('game');
    DL.ctx = DL.canvas.getContext('2d');
    DL.overlay = document.getElementById('overlay');
    DL.hud = document.getElementById('hud');
    DL.touchEl = document.getElementById('touch');
    DL.fitCanvas();
    DL.Save.load();
    DL.Audio.loadMute();
    bindInput();
    DL.screen = 'title';
    DL.UI.title();
    DL.raf = requestAnimationFrame(loop);

    window.__game = {
      DL,
      start(level, profile) {
        if (profile) DL.Save.setProfile(profile);
        DL.Game.start(level || 1);
        DL.screen = 'play';
        DL.overlay.innerHTML = '';
        return DL.run;
      },
      race(level, split) {
        DL.Race.start(level || 1, { split: !!split });
        DL.screen = 'play';
        DL.overlay.innerHTML = '';
        return DL.run;
      },
      solve(levelId, profileId) {
        return DL.Solver && DL.Solver.solve(levelId, profileId);
      },
      state: () => DL.state,
      run: () => DL.run,
      screen: () => DL.screen,
      goTitle: () => { DL.run = null; DL.screen = 'title'; DL.UI.title(); },
      goProfiles: () => DL.UI.profiles(),
      goLevels: () => DL.UI.levelSelect(),
      goOutfits: () => DL.UI.outfits(),
      tap: (key, ms) => {
        DL.touch[key] = true;
        setTimeout(() => { DL.touch[key] = false; }, ms || 80);
      },
      key(k, down) { DL.keys[k] = !!down; }
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

})();</script>

<script id="car-mode-js">
window.__CAR_GAME = "diwali-lotus";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
</script>
