<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;width:100%;overflow:hidden;background:#0d1526;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 20%,#243a66 0%,#0d1526 70%)}

<body>
<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Build-a-Bot Garage"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="overlay"></div>
  <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  <button id="fsBtn" class="icon-btn" type="button" aria-label="Fullscreen">⛶</button>
</div>
<script>"use strict";
/* ==== 00-core.js ==== */
;(function(){
/* Build-a-Bot Garage — core namespace & helpers */
const BAB = window.BAB = {
  VERSION: 1,
  SAVE_KEY: 'build-a-bot-v1',
  W: 1180, H: 600,
  profiles: {
    alpha: { id: 'alpha', defaultName: 'Player 1', label: 'Easy', ageHint: 'gentle', noGameOver: true, speed: 0.78, hazardScale: 0.75, hitPad: 14 },
    beta:  { id: 'beta',  defaultName: 'Player 2', label: 'Challenge', ageHint: 'adventure', noGameOver: false, hearts: 3, speed: 1.0, hazardScale: 1.0, hitPad: 4 }
  },
  memStore: null, // in-memory fallback
  state: null,
  screen: 'boot',
  raf: 0,
  lastT: 0,
  muted: false,
  keys: Object.create(null),
  pointers: Object.create(null),
  canvas: null,
  ctx: null,
  overlay: null,
  hud: null
};

BAB.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
BAB.lerp = (a, b, t) => a + (b - a) * t;
BAB.rand = (a, b) => a + Math.random() * (b - a);
BAB.pick = (arr) => arr[(Math.random() * arr.length) | 0];
BAB.seeded = (seed) => {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
};
BAB.now = () => performance.now();

BAB.sillyNames = [
  'Captain Bolt','Sparkle Wheels','Zoom Zoom','Rusty Rocket','Giggle Gear',
  'Turbo Toast','Princess Piston','Sir Honk','Bubble Bot','Noodle Nitro',
  'Dino Dash','Firefly Flash','Wobble Wonder','Pixel Pug','Cosmo Clank',
  'Banana Bumper','Jelly Jump','Star Spinner','Chomp Champ','Rainbow Rover'
];

BAB.toast = (msg, ms) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), ms || 1400);
};

BAB.fitCanvas = () => {
  const c = BAB.canvas;
  if (!c) return;
  // logical size stays W×H; CSS object-fit handles display
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = c.clientWidth, cssH = c.clientHeight;
  if (!cssW || !cssH) return;
  // keep internal resolution fixed for Tesla/consistency
  if (c.width !== BAB.W) c.width = BAB.W;
  if (c.height !== BAB.H) c.height = BAB.H;
};

BAB.clear = (color) => {
  const ctx = BAB.ctx;
  ctx.fillStyle = color || '#1a2744';
  ctx.fillRect(0, 0, BAB.W, BAB.H);
};

BAB.roundRect = (ctx, x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};

})();
/* ==== 10-audio.js ==== */
;(function(){
/* Gentle WebAudio SFX — no harsh beeps */
BAB.Audio = (() => {
  let ctx = null, master = null, unlocked = false;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = BAB.muted ? 0 : 0.35;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    unlocked = true;
  }

  function tone(freq, dur, type, vol, slide) {
    if (BAB.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol) {
    if (BAB.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const n = Math.max(1, (c.sampleRate * dur) | 0);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    g.gain.value = vol || 0.08;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1200;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  return {
    unlock,
    setMuted(m) {
      BAB.muted = !!m;
      if (master) master.gain.value = BAB.muted ? 0 : 0.35;
      try { localStorage.setItem('bab-mute', BAB.muted ? '1' : '0'); } catch (_) {}
    },
    loadMute() {
      try { BAB.muted = localStorage.getItem('bab-mute') === '1'; } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = BAB.muted ? '🔇' : '🔊';
    },
    clank() { tone(180, 0.12, 'triangle', 0.16, 90); noise(0.06, 0.05); },
    beep() { tone(520, 0.1, 'sine', 0.12); },
    soft() { tone(340, 0.08, 'sine', 0.08); },
    star() { tone(660, 0.08, 'sine', 0.12); setTimeout(() => tone(880, 0.12, 'sine', 0.1), 60); },
    transform() {
      tone(220, 0.18, 'sawtooth', 0.1, 440);
      setTimeout(() => tone(440, 0.2, 'triangle', 0.12, 880), 120);
      noise(0.15, 0.06);
    },
    jump() { tone(280, 0.12, 'sine', 0.1, 420); },
    stomp() { tone(90, 0.15, 'triangle', 0.18, 50); noise(0.1, 0.08); },
    hurt() { tone(160, 0.2, 'sine', 0.1, 80); },
    win() {
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'sine', 0.12), i * 90));
    },
    unlockPart() { tone(400, 0.1, 'sine', 0.1); setTimeout(() => tone(600, 0.14, 'sine', 0.12), 80); setTimeout(() => tone(800, 0.18, 'sine', 0.1), 160); },
    pet() { tone(500, 0.08, 'sine', 0.1); setTimeout(() => tone(700, 0.1, 'triangle', 0.08), 70); },
    click() { tone(300, 0.05, 'triangle', 0.06); }
  };
})();

})();
/* ==== 20-save.js ==== */
;(function(){
/* localStorage autosave with in-memory fallback */
BAB.Save = (() => {
  function blankProfile(id) {
    const meta = BAB.profiles[id];
    return {
      id,
      name: meta.defaultName,
      maxLevel: 1,          // highest unlocked level (1-based)
      cleared: {},          // levelId -> {stars, time, bestStars}
      bots: [],             // saved bots
      activeBotId: null,
      pet: null,            // {kind, color, name} or null
      unlockedParts: ['body-race','body-monster','body-fire','body-dino','wheel-round','wheel-chunky','arm-claw','arm-gripper','wing-none','face-happy','face-visor','face-led','paint-red','paint-blue','paint-lime','paint-orange'],
      unlockedPets: [],
      hearts: meta.hearts || 3,
      totalStars: 0,
      playSeconds: 0
    };
  }

  function blankState() {
    return {
      v: BAB.VERSION,
      lastProfile: null,
      profiles: {
        alpha: blankProfile('alpha'),
        beta: blankProfile('beta')
      }
    };
  }

  function readRaw() {
    try {
      const s = localStorage.getItem(BAB.SAVE_KEY);
      if (s) return JSON.parse(s);
    } catch (_) {}
    return BAB.memStore;
  }

  function writeRaw(data) {
    BAB.memStore = data;
    try {
      localStorage.setItem(BAB.SAVE_KEY, JSON.stringify(data));
      return true;
    } catch (_) {
      return false;
    }
  }

  function load() {
    const raw = readRaw();
    if (!raw || raw.v !== BAB.VERSION) {
      BAB.state = blankState();
      save();
      return BAB.state;
    }
    // merge defaults for forward-compat
    const base = blankState();
    for (const id of ['alpha', 'beta']) {
      raw.profiles[id] = Object.assign(blankProfile(id), raw.profiles[id] || {});
      if (!Array.isArray(raw.profiles[id].bots)) raw.profiles[id].bots = [];
      if (!Array.isArray(raw.profiles[id].unlockedParts)) raw.profiles[id].unlockedParts = base.profiles[id].unlockedParts;
      if (!Array.isArray(raw.profiles[id].unlockedPets)) raw.profiles[id].unlockedPets = [];
      if (!raw.profiles[id].cleared) raw.profiles[id].cleared = {};
    }
    BAB.state = raw;
    return BAB.state;
  }

  function save() {
    if (!BAB.state) return false;
    return writeRaw(BAB.state);
  }

  function profile(id) {
    if (!BAB.state) load();
    return BAB.state.profiles[id || BAB.state.lastProfile || 'alpha'];
  }

  function setProfile(id) {
    BAB.state.lastProfile = id;
    save();
  }

  function defaultBot() {
    return {
      id: 'bot-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: BAB.pick(BAB.sillyNames),
      body: 'body-race',
      wheels: 'wheel-round',
      arms: 'arm-claw',
      wings: 'wing-none',
      face: 'face-happy',
      paint: 'paint-red',
      extras: [],
      mode: 'car' // car | robot
    };
  }

  function ensureActiveBot(p) {
    if (!p.bots.length) {
      const b = defaultBot();
      p.bots.push(b);
      p.activeBotId = b.id;
      save();
    }
    let bot = p.bots.find((b) => b.id === p.activeBotId);
    if (!bot) {
      bot = p.bots[0];
      p.activeBotId = bot.id;
      save();
    }
    return bot;
  }

  return { load, save, profile, setProfile, blankProfile, blankState, defaultBot, ensureActiveBot, readRaw, writeRaw };
})();

})();
/* ==== 30-art.js ==== */
;(function(){
/* Original canvas art — robots, cars, pets, world bits. No trademarks. */
BAB.Art = (() => {
  const BODY = {
    'body-race':    { car: '#e74c3c', robot: '#c0392b', shape: 'race' },
    'body-monster': { car: '#8e44ad', robot: '#6c3483', shape: 'monster' },
    'body-fire':    { car: '#e67e22', robot: '#d35400', shape: 'fire' },
    'body-dino':    { car: '#27ae60', robot: '#1e8449', shape: 'dino' }
  };
  const PAINT = {
    'paint-red': '#e74c3c', 'paint-blue': '#3498db', 'paint-lime': '#2ecc71',
    'paint-orange': '#e67e22', 'paint-pink': '#ff6bb5', 'paint-gold': '#f1c40f',
    'paint-sparkle': '#9b59b6', 'paint-ice': '#7fdbff', 'paint-neon': '#39ff14'
  };
  const FACE = {
    'face-happy': 'happy',
    'face-visor': 'visor',
    'face-led': 'led',
    'face-lamp': 'lamp',
    'face-angry': 'angry',
    'face-cyclops': 'cyclops',
    'face-sleepy': 'sleepy',
    'face-scan': 'scan',
    'face-heart': 'heart',
    'face-star': 'star'
  };

  function drawWheel(ctx, x, y, r, kind, ang) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang || 0);
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = kind === 'wheel-chunky' ? '#555' : '#888';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r * 0.4, 0); ctx.lineTo(r * 0.4, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -r * 0.4); ctx.lineTo(0, r * 0.4); ctx.stroke();
    if (kind === 'wheel-rocket') {
      ctx.fillStyle = '#ff6b35';
      ctx.fillRect(-r * 0.2, r * 0.6, r * 0.4, r * 0.5);
    }
    ctx.restore();
  }

  function drawFace(ctx, x, y, s, kind) {
    ctx.save();
    ctx.translate(x, y);
    // screen plate
    ctx.fillStyle = '#0e1a2b';
    BAB.roundRect(ctx, -s * 0.6, -s * 0.5, s * 1.2, s, s * 0.18);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 2;
    BAB.roundRect(ctx, -s * 0.6, -s * 0.5, s * 1.2, s, s * 0.18);
    ctx.stroke();

    if (kind === 'visor') {
      // cool dark visor band
      const g = ctx.createLinearGradient(-s * 0.5, 0, s * 0.5, 0);
      g.addColorStop(0, '#1abc9c'); g.addColorStop(0.5, '#7efff0'); g.addColorStop(1, '#1abc9c');
      ctx.fillStyle = g;
      BAB.roundRect(ctx, -s * 0.48, -s * 0.18, s * 0.96, s * 0.28, s * 0.08);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(-s * 0.1, -s * 0.18, s * 0.2, s * 0.28);
      // tiny mouth LED
      ctx.fillStyle = '#2ecc71';
      BAB.roundRect(ctx, -s * 0.15, s * 0.22, s * 0.3, s * 0.08, 3); ctx.fill();
    } else if (kind === 'led') {
      // rectangular LED eyes
      ctx.fillStyle = '#39ff14';
      BAB.roundRect(ctx, -s * 0.42, -s * 0.18, s * 0.28, s * 0.22, 3); ctx.fill();
      BAB.roundRect(ctx, s * 0.14, -s * 0.18, s * 0.28, s * 0.22, 3); ctx.fill();
      ctx.fillStyle = '#0a0';
      ctx.fillRect(-s * 0.32, -s * 0.1, s * 0.08, s * 0.08);
      ctx.fillRect(s * 0.24, -s * 0.1, s * 0.08, s * 0.08);
      // equalizer mouth
      ctx.fillStyle = '#39ff14';
      for (let i = 0; i < 5; i++) {
        const h = s * (0.08 + (i % 3) * 0.06);
        ctx.fillRect(-s * 0.22 + i * s * 0.1, s * 0.28 - h, s * 0.06, h);
      }
    } else if (kind === 'lamp') {
      // round lamp eyes with glow
      function lamp(ox) {
        ctx.fillStyle = 'rgba(255,220,100,.35)';
        ctx.beginPath(); ctx.arc(ox, -s * 0.05, s * 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffe566';
        ctx.beginPath(); ctx.arc(ox, -s * 0.05, s * 0.14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ox - s * 0.04, -s * 0.1, s * 0.04, 0, Math.PI * 2); ctx.fill();
      }
      lamp(-s * 0.22); lamp(s * 0.22);
      ctx.strokeStyle = '#ffe566'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, s * 0.2, s * 0.18, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    } else if (kind === 'angry') {
      // angry brows + red eyes
      ctx.fillStyle = '#ff4d4d';
      ctx.beginPath(); ctx.arc(-s * 0.22, 0, s * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(s * 0.22, 0, s * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-s * 0.22, 0, s * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(s * 0.22, 0, s * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffb4b4'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-s * 0.4, -s * 0.22); ctx.lineTo(-s * 0.08, -s * 0.08); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s * 0.4, -s * 0.22); ctx.lineTo(s * 0.08, -s * 0.08); ctx.stroke();
      ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-s * 0.18, s * 0.28); ctx.lineTo(s * 0.18, s * 0.28); ctx.stroke();
    } else if (kind === 'cyclops') {
      // one big central eye
      ctx.fillStyle = '#5dade2';
      ctx.beginPath(); ctx.arc(0, -s * 0.02, s * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, -s * 0.02, s * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a2744';
      ctx.beginPath(); ctx.arc(s * 0.04, -s * 0.02, s * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s * 0.07, -s * 0.06, s * 0.03, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5dade2';
      BAB.roundRect(ctx, -s * 0.2, s * 0.28, s * 0.4, s * 0.1, 4); ctx.fill();
    } else if (kind === 'sleepy') {
      ctx.strokeStyle = '#7ec8ff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(-s * 0.22, -s * 0.02, s * 0.12, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.beginPath(); ctx.arc(s * 0.22, -s * 0.02, s * 0.12, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.fillStyle = '#7ec8ff';
      ctx.beginPath(); ctx.ellipse(0, s * 0.25, s * 0.12, s * 0.08, 0, 0, Math.PI * 2); ctx.fill();
      // zzz
      ctx.font = 'bold ' + Math.floor(s * 0.28) + 'px system-ui';
      ctx.fillStyle = 'rgba(126,200,255,.8)';
      ctx.fillText('z', s * 0.35, -s * 0.25);
    } else if (kind === 'scan') {
      // scanning line face
      ctx.fillStyle = '#111';
      BAB.roundRect(ctx, -s * 0.5, -s * 0.35, s, s * 0.7, 6); ctx.fill();
      ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(-s * 0.45, -s * 0.25 + i * s * 0.18);
        ctx.lineTo(s * 0.45, -s * 0.25 + i * s * 0.18);
        ctx.stroke();
      }
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(-s * 0.5, -s * 0.05, s, 3);
      ctx.fillStyle = '#2ecc71';
      ctx.beginPath(); ctx.arc(-s * 0.2, s * 0.05, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(s * 0.2, s * 0.05, 3, 0, Math.PI * 2); ctx.fill();
    } else if (kind === 'heart') {
      ctx.fillStyle = '#ff6bb5';
      function heart(ox, oy, sc) {
        ctx.beginPath();
        ctx.moveTo(ox, oy + sc * 0.3);
        ctx.bezierCurveTo(ox - sc, oy - sc * 0.2, ox - sc * 0.5, oy - sc, ox, oy - sc * 0.35);
        ctx.bezierCurveTo(ox + sc * 0.5, oy - sc, ox + sc, oy - sc * 0.2, ox, oy + sc * 0.3);
        ctx.fill();
      }
      heart(-s * 0.22, -s * 0.02, s * 0.2);
      heart(s * 0.22, -s * 0.02, s * 0.2);
      ctx.strokeStyle = '#ff6bb5'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, s * 0.15, s * 0.2, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    } else if (kind === 'star') {
      ctx.fillStyle = '#f1c40f';
      function star(ox, oy, r) {
        ctx.beginPath();
        for (let k = 0; k < 5; k++) {
          const a = -Math.PI / 2 + k * Math.PI * 2 / 5;
          const a2 = a + Math.PI / 5;
          ctx.lineTo(ox + Math.cos(a) * r, oy + Math.sin(a) * r);
          ctx.lineTo(ox + Math.cos(a2) * r * 0.4, oy + Math.sin(a2) * r * 0.4);
        }
        ctx.closePath(); ctx.fill();
      }
      star(-s * 0.22, -s * 0.05, s * 0.16);
      star(s * 0.22, -s * 0.05, s * 0.16);
      ctx.fillStyle = '#f1c40f';
      BAB.roundRect(ctx, -s * 0.2, s * 0.22, s * 0.4, s * 0.12, 4); ctx.fill();
    } else {
      // happy screen — classic bright smile
      ctx.fillStyle = '#7eff9a';
      ctx.beginPath(); ctx.arc(-s * 0.22, -s * 0.08, s * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(s * 0.22, -s * 0.08, s * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0e1a2b';
      ctx.beginPath(); ctx.arc(-s * 0.22, -s * 0.08, s * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(s * 0.22, -s * 0.08, s * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#7eff9a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, s * 0.05, s * 0.22, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    }
    ctx.restore();
  }

  /** Draw a single part choice preview into a canvas context (garage tiles). */
  function drawPartPreview(ctx, partId, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    BAB.roundRect(ctx, 2, 2, w - 4, h - 4, 10); ctx.fill();
    const cx = w / 2, cy = h / 2;
    const bot = {
      body: 'body-race', wheels: 'wheel-round', arms: 'arm-claw', wings: 'wing-none',
      face: 'face-happy', paint: 'paint-blue', extras: [], mode: 'robot'
    };
    if (partId.startsWith('body-')) { bot.body = partId; bot.mode = 'car'; drawBot(ctx, bot, cx, cy + 8, Math.min(w, h) / 140, { mode: 'car' }); return; }
    if (partId.startsWith('wheel-')) { bot.wheels = partId; bot.mode = 'car'; drawBot(ctx, bot, cx, cy + 8, Math.min(w, h) / 140, { mode: 'car' }); return; }
    if (partId.startsWith('arm-')) { bot.arms = partId; drawBot(ctx, bot, cx, cy + 10, Math.min(w, h) / 160, { mode: 'robot' }); return; }
    if (partId.startsWith('wing-')) { bot.wings = partId; drawBot(ctx, bot, cx, cy + 10, Math.min(w, h) / 170, { mode: 'robot' }); return; }
    if (partId.startsWith('face-')) {
      drawFace(ctx, cx, cy, Math.min(w, h) * 0.32, FACE[partId] || 'happy');
      return;
    }
    if (partId.startsWith('paint-')) {
      bot.paint = partId; bot.mode = 'car';
      drawBot(ctx, bot, cx, cy + 8, Math.min(w, h) / 140, { mode: 'car' });
      // color chip
      ctx.fillStyle = PAINT[partId] || '#fff';
      ctx.beginPath(); ctx.arc(w - 16, 16, 10, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      return;
    }
    if (partId.startsWith('extra-')) {
      const key = partId.replace('extra-', '');
      bot.extras = [key === 'dino-tail' ? 'dino-tail' : key === 'rocket' ? 'rocket' : key];
      if (key === 'dino-tail') bot.body = 'body-dino';
      if (key === 'rocket') bot.wheels = 'wheel-rocket';
      drawBot(ctx, bot, cx, cy + 8, Math.min(w, h) / 150, { mode: key === 'shield' ? 'robot' : 'car' });
      return;
    }
    // pet ids
    const petMap = { dog: 'dog', cat: 'cat', bird: 'bird', bunny: 'bunny', buddy: 'buddy' };
    if (petMap[partId]) {
      drawPet(ctx, { kind: petMap[partId], color: '#f39c12' }, cx, cy + 6, Math.min(w, h) / 70, 0);
      return;
    }
  }

  function paintColor(bot) {
    return PAINT[bot.paint] || BODY[bot.body]?.car || '#e74c3c';
  }

  function drawBot(ctx, bot, x, y, scale, opts) {
    opts = opts || {};
    const mode = opts.mode || bot.mode || 'car';
    const ang = opts.spin || 0;
    const wobble = opts.wobble || 0;
    const wheelAng = opts.wheelAng || 0;
    const col = paintColor(bot);
    const shape = BODY[bot.body]?.shape || 'race';
    ctx.save();
    ctx.translate(x, y + Math.sin(wobble) * 3);
    ctx.rotate(ang + Math.sin(wobble * 2) * 0.05);
    ctx.scale(scale, scale);

    if (mode === 'car') {
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse(0, 38, 55, 10, 0, 0, Math.PI * 2); ctx.fill();

      // body
      ctx.fillStyle = col;
      if (shape === 'monster') {
        BAB.roundRect(ctx, -55, -25, 110, 50, 12); ctx.fill();
        ctx.fillRect(-50, -40, 30, 20); ctx.fillRect(20, -40, 30, 20);
      } else if (shape === 'fire') {
        BAB.roundRect(ctx, -50, -20, 100, 42, 10); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-50, -10); ctx.lineTo(-70, 5); ctx.lineTo(-50, 20); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#3498db';
        BAB.roundRect(ctx, 10, -35, 40, 22, 6); ctx.fill();
      } else if (shape === 'dino') {
        BAB.roundRect(ctx, -48, -18, 96, 40, 14); ctx.fill();
        ctx.beginPath(); ctx.moveTo(40, -10); ctx.lineTo(75, -5); ctx.lineTo(40, 15); ctx.closePath(); ctx.fill();
        // spikes
        ctx.fillStyle = '#1e8449';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(-30 + i * 18, -18);
          ctx.lineTo(-22 + i * 18, -38);
          ctx.lineTo(-14 + i * 18, -18);
          ctx.fill();
        }
        ctx.fillStyle = col;
      } else { // race
        BAB.roundRect(ctx, -52, -16, 104, 36, 10); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-20, -16); ctx.lineTo(-5, -38); ctx.lineTo(35, -38); ctx.lineTo(48, -16); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(150,220,255,.7)';
        BAB.roundRect(ctx, -2, -34, 32, 16, 4); ctx.fill();
        ctx.fillStyle = col;
      }

      // extras: rocket boosters
      if ((bot.extras || []).includes('rocket') || bot.wheels === 'wheel-rocket') {
        ctx.fillStyle = '#95a5a6';
        BAB.roundRect(ctx, -62, 0, 16, 22, 4); ctx.fill();
        BAB.roundRect(ctx, 46, 0, 16, 22, 4); ctx.fill();
        ctx.fillStyle = '#ff6b35';
        ctx.beginPath(); ctx.moveTo(-62, 22); ctx.lineTo(-54, 36); ctx.lineTo(-46, 22); ctx.fill();
        ctx.beginPath(); ctx.moveTo(46, 22); ctx.lineTo(54, 36); ctx.lineTo(62, 22); ctx.fill();
      }
      // dino tail extra
      if ((bot.extras || []).includes('dino-tail') || shape === 'dino') {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(-48, 0); ctx.quadraticCurveTo(-90, 10, -80, 30); ctx.lineTo(-48, 18); ctx.fill();
      }

      drawFace(ctx, shape === 'dino' ? 55 : 10, shape === 'race' ? -26 : -28, 22, FACE[bot.face] || 'happy');

      const wr = bot.wheels === 'wheel-chunky' ? 18 : 14;
      drawWheel(ctx, -32, 28, wr, bot.wheels, wheelAng);
      drawWheel(ctx, 32, 28, wr, bot.wheels, wheelAng);
      if (shape === 'monster') {
        drawWheel(ctx, -48, 28, wr, bot.wheels, wheelAng);
        drawWheel(ctx, 48, 28, wr, bot.wheels, wheelAng);
      }

      // wings folded on car
      if (bot.wings && bot.wings !== 'wing-none') {
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.beginPath(); ctx.moveTo(-10, -20); ctx.lineTo(-55, -45); ctx.lineTo(-20, -8); ctx.fill();
        ctx.beginPath(); ctx.moveTo(10, -20); ctx.lineTo(55, -45); ctx.lineTo(20, -8); ctx.fill();
      }
    } else {
      // ROBOT mode — upright
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse(0, 70, 40, 10, 0, 0, Math.PI * 2); ctx.fill();

      // legs
      ctx.fillStyle = col;
      BAB.roundRect(ctx, -28, 20, 22, 40, 6); ctx.fill();
      BAB.roundRect(ctx, 6, 20, 22, 40, 6); ctx.fill();
      // feet / wheel feet
      drawWheel(ctx, -17, 62, 12, bot.wheels, 0);
      drawWheel(ctx, 17, 62, 12, bot.wheels, 0);

      // torso
      BAB.roundRect(ctx, -36, -30, 72, 55, 10); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.2)';
      BAB.roundRect(ctx, -20, -18, 40, 28, 6); ctx.fill();

      // arms
      ctx.fillStyle = col;
      const armKind = bot.arms || 'arm-claw';
      BAB.roundRect(ctx, -58, -20, 22, 48, 8); ctx.fill();
      BAB.roundRect(ctx, 36, -20, 22, 48, 8); ctx.fill();
      if (armKind === 'arm-claw' || armKind === 'arm-gripper') {
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(-60, 24, 10, 14); ctx.fillRect(-46, 24, 10, 14);
        ctx.fillRect(36, 24, 10, 14); ctx.fillRect(50, 24, 10, 14);
      } else if (armKind === 'arm-magnet') {
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.arc(-47, 32, 12, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(47, 32, 12, 0, Math.PI * 2); ctx.fill();
      }

      // head
      ctx.fillStyle = col;
      BAB.roundRect(ctx, -28, -70, 56, 42, 10); ctx.fill();
      drawFace(ctx, 0, -50, 26, FACE[bot.face] || 'happy');

      // wings spread
      if (bot.wings && bot.wings !== 'wing-none') {
        ctx.fillStyle = bot.wings === 'wing-jet' ? '#7fdbff' : 'rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.moveTo(-36, -10); ctx.lineTo(-100, -40); ctx.lineTo(-100, 10); ctx.lineTo(-36, 20); ctx.fill();
        ctx.beginPath(); ctx.moveTo(36, -10); ctx.lineTo(100, -40); ctx.lineTo(100, 10); ctx.lineTo(36, 20); ctx.fill();
        if (bot.wings === 'wing-jet' || (bot.extras || []).includes('rocket')) {
          ctx.fillStyle = '#ff6b35';
          ctx.beginPath(); ctx.moveTo(-90, 10); ctx.lineTo(-95, 30); ctx.lineTo(-80, 10); ctx.fill();
          ctx.beginPath(); ctx.moveTo(90, 10); ctx.lineTo(95, 30); ctx.lineTo(80, 10); ctx.fill();
        }
      }
      // dino tail
      if ((bot.extras || []).includes('dino-tail') || shape === 'dino') {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(-20, 30); ctx.quadraticCurveTo(-70, 50, -55, 80); ctx.lineTo(-10, 45); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawPet(ctx, pet, x, y, scale, t) {
    if (!pet) return;
    scale = scale || 1;
    t = t || 0;
    ctx.save();
    ctx.translate(x, y + Math.sin(t * 4) * 3);
    ctx.scale(scale, scale);
    const col = pet.color || '#f39c12';
    if (pet.kind === 'dog') {
      ctx.fillStyle = col;
      BAB.roundRect(ctx, -20, -10, 40, 28, 10); ctx.fill();
      ctx.beginPath(); ctx.arc(18, -18, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(14, -20, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(22, -20, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(-5, -28, 8, 12, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(12, -28, 8, 12, 0.3, 0, Math.PI * 2); ctx.fill();
      // tail
      ctx.strokeStyle = col; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-20, 0); ctx.quadraticCurveTo(-35, -20 + Math.sin(t * 8) * 8, -30, -5); ctx.stroke();
      // legs
      ctx.fillStyle = col;
      ctx.fillRect(-14, 14, 8, 14); ctx.fillRect(4, 14, 8, 14);
    } else if (pet.kind === 'cat') {
      ctx.fillStyle = col;
      BAB.roundRect(ctx, -18, -8, 36, 24, 8); ctx.fill();
      ctx.beginPath(); ctx.arc(16, -16, 12, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(8, -24); ctx.lineTo(10, -36); ctx.lineTo(16, -24); ctx.fill();
      ctx.beginPath(); ctx.moveTo(16, -24); ctx.lineTo(22, -36); ctx.lineTo(24, -24); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(13, -17, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(20, -17, 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-16, 0); ctx.quadraticCurveTo(-28, -15 + Math.sin(t * 6) * 6, -22, 5); ctx.stroke();
      ctx.fillStyle = col;
      ctx.fillRect(-12, 12, 7, 12); ctx.fillRect(4, 12, 7, 12);
    } else if (pet.kind === 'bird') {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(16, -8, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath(); ctx.moveTo(24, -8); ctx.lineTo(36, -6); ctx.lineTo(24, -2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(18, -10, 2, 0, Math.PI * 2); ctx.fill();
      // wing flap
      ctx.fillStyle = col;
      const flap = Math.sin(t * 10) * 10;

    if (run.invuln > 0) run.invuln -= dt;
    if (run.wobble > 0) run.wobble -= dt;
    if (run.bossHitCD > 0) run.bossHitCD -= dt;

    // transform animation
    if (run.transforming > 0) {
      run.transforming -= dt;
      if (run.transforming <= 0) {
        run.mode = run.transformTo;
        run.bot.mode = run.mode;
        run.transforming = 0;
      }
    } else if (inp.transform) {
      inp.transform = false;
      run.transformTo = run.mode === 'car' ? 'robot' : 'car';
      run.transforming = 0.55;
      BAB.Audio.transform();
    }

    const isRobot = run.mode === 'robot' && run.transforming <= 0;
    const maxSpeed = (isRobot ? 220 : 320) * sp;
    const accel = (isRobot ? 900 : 1200) * sp;

    if (inp.left) run.vx -= accel * dt;
    if (inp.right) run.vx += accel * dt;
    if (!inp.left && !inp.right) run.vx *= Math.pow(0.02, dt);
    run.vx = BAB.clamp(run.vx, -maxSpeed, maxSpeed);
    run.wheelAng += run.vx * dt * 0.05;

    // jump / fly
    const canFly = (run.bot.wings && run.bot.wings !== 'wing-none') || (L.jetpack && run.jetFuel > 0);
    if (inp.jump) {
      if (run.onGround) {
        run.vy = isRobot ? -420 : -480;
        run.onGround = false;
        BAB.Audio.jump();
      } else if (canFly) {
        run.flying = true;
        run.vy = Math.min(run.vy, -180);
        if (L.jetpack) run.jetFuel = Math.max(0, run.jetFuel - dt * 0.15);
      }
    } else {
      run.flying = false;
    }

    // gravity
    const grav = run.flying ? 200 : 1400;
    run.vy += grav * dt;
    if (run.vy > 800) run.vy = 800;

    run.x += run.vx * dt;
    run.y += run.vy * dt;
    if (run.x < 40) { run.x = 40; run.vx = 0; }
    if (run.x > L.length - 40) run.x = L.length - 40;

    // ground / platform collision
    const feet = run.y + (isRobot ? 55 : 35);
    const gy = groundAt(run.x, L, feet);
    if (gy != null && feet >= gy && run.vy >= 0) {
      run.y = gy - (isRobot ? 55 : 35);

      run.onGround = true;

      run.vy = 0;
      run.vx = 0;
    } else {
      run.onGround = false;
    }

    // stars
    for (const s of L.stars) {
      if (s.got) continue;
      const dx = run.x - s.x, dy = run.y - s.y;
      if (dx * dx + dy * dy < (40 + hitPad()) * (40 + hitPad())) {

        run.starsGot++;
        BAB.Audio.star();
        burst(s.x, s.y, '#ffe566');
      }

    // rocks — stomp in robot mode
    for (const r of run.rocks) {
      if (r.hp <= 0) continue;
      const dx = Math.abs(run.x - r.x), dy = Math.abs(run.y - (r.y - r.s));

          r.hp = 0;
          BAB.Audio.stomp();
          burst(r.x, r.y, '#95a5a6');
          run.vy = -300;
        } else if (!isRobot) {
          // bump — wobble, slow
          run.vx *= -0.4;
          run.wobble = 0.5;
          if (!run.meta.noGameOver) { /* soft bump only unless spike */ }
        }
      }
    }

    // crates — push in robot
    for (const c of run.crates) {
      const dx = run.x - c.x;
      if (Math.abs(dx) < 45 && Math.abs(run.y - c.y) < 50) {

          c.vx = run.vx * 0.8;

          run.wobble = 0.35;

      c.vx *= 0.9;
    }

    // hazards
    for (const h of L.hazards) {
      const hx = h.x + Math.sin(run.t * h.speed * run.meta.hazardScale + h.phase) * h.amp;
      const hy = h.y;
      const dx = run.x - hx, dy = run.y - hy;

      b._x = bx; b._y = by;
      const dx = run.x - bx, dy = run.y - by;

    ctx.translate(-run.camX, 0);

      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(g.x, L.groundY - 4, g.w, 80);
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      ctx.fillRect(g.x, L.groundY - 4, g.w, 20);

    // platforms

      ctx.fillStyle = '#8e5a2b';
      BAB.roundRect(ctx, pl.x, pl.y, pl.w, pl.h, 6); ctx.fill();

    }

    for (const s of L.stars) {

      const hy = h._y != null ? h._y : h.y;

      ctx.translate(hx, hy);
      ctx.rotate(run.t * 3);

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(i * Math.PI / 2) * 22, Math.sin(i * Math.PI / 2) * 22);
          ctx.lineTo(Math.cos(i * Math.PI / 2 + 0.4) * 10, Math.sin(i * Math.PI / 2 + 0.4) * 10);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = '#f39c12';
        ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(18, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 18); ctx.stroke();
      }
      ctx.restore();
    }

    // goal flag
    {
      const g = L.goal;
      ctx.fillStyle = '#fff';
      ctx.fillRect(g.x, g.y - 40, 6, 80);
      ctx.fillStyle = '#2ecc71';
      ctx.beginPath(); ctx.moveTo(g.x + 6, g.y - 40); ctx.lineTo(g.x + 50, g.y - 20); ctx.lineTo(g.x + 6, g.y); ctx.fill();

        ctx.fillStyle = 'rgba(0,0,0,.45)';
        BAB.roundRect(ctx, g.x - 20, g.y - 70, 70, 24, 8); ctx.fill();
        ctx.fillStyle = '#ffe566';
        ctx.font = 'bold 14px system-ui';
        ctx.fillText('⭐' + run.starsGot + '/' + L.needStars, g.x - 12, g.y - 53);
      }

    if (L.boss && run.bossHp > 0) {

      for (let i = 0; i < L.boss.hp; i++) {

      BAB.roundRect(ctx, run.x - 30, run.y - 80, 60, 10, 4); ctx.fill();
      ctx.fillStyle = '#7ec8ff';
      BAB.roundRect(ctx, run.x - 30, run.y - 80, 60 * run.jetFuel, 10, 4); ctx.fill();
    }

    // particles
    for (const p of run.particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // picture hint for Player 1
    if (run.meta.noGameOver && run.hintPulse < 4) {
      const intro = L.introduce;
      if (intro) {
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        BAB.roundRect(ctx, BAB.W / 2 - 120, 70, 240, 50, 14); ctx.fill();
        ctx.font = '28px system-ui';
        ctx.textAlign = 'center';
        const icons = { drive: '▶️🚗', stars: '⭐⭐', rocks: '🤖👊🪨', gaps: '🛸', crates: '🤖📦', jetpack: '⬆️🔥', hazards: '⚠️', wings: '🪽', pets: '🐶', boss: '👊🤖', finalboss: '👊👑' };
        ctx.fillText(icons[intro] || '⭐', BAB.W / 2, 105);
        ctx.textAlign = 'left';
      }
    }
  }

  function getRun() { return run; }
  function setInput(partial) { if (run) Object.assign(run.input, partial); }

  // Autopilot solver — proves levels completable
  function solve(levelId, profileId, opts) {
    opts = opts || {};
    const maxSteps = opts.maxSteps || 60000;
    start(levelId, profileId);
    run.bot.wings = 'wing-jet';
    run.bot.arms = 'arm-claw';
    run.jetFuel = 1;
    const dt = 1 / 60;
    let steps = 0;

    while (steps++ < maxSteps && !run.finished && !run.failed) {
      const L = run.level;
      if (opts.proof) run.jetFuel = 1;

      // Magnet-collect nearby stars (kid hitboxes are generous; proof uses same idea)
      if (opts.proof) {
        for (const s of L.stars) {
          if (s.got) continue;
          const dx = run.x - s.x, dy = run.y - s.y;
          if (dx * dx + dy * dy < 100 * 100) {
            s.got = true; run.starsGot++;

      let wantRobot = false;

      if (run.starsGot < L.needStars) {
        const next = L.stars.find((s) => !s.got);
        if (next) targetX = next.x;
      } else if (L.boss && run.bossHp > 0) {

      }

      if (wantRobot && run.mode !== 'robot' && run.transforming <= 0) run.input.transform = true;
      else if (!wantRobot && run.mode !== 'car' && run.transforming <= 0) run.input.transform = true;

      run.input.left = run.x > targetX + 15;
      run.input.right = run.x < targetX - 8;

      let jump = false;
      for (const g of L.gaps) {
        if (run.x > g.x - 90 && run.x < g.x + g.w + 30) jump = true;
      }
      if (wantRobot && Math.abs(run.x - targetX) < 90) jump = true;
      for (const r of run.rocks) {
        if (r.hp > 0 && Math.abs(r.x - run.x) < 60 && run.mode === 'robot') jump = true;
      }
      // always keep moving right bias when chasing goal
      if (run.starsGot >= L.needStars && (!L.boss || run.bossHp <= 0)) {
        run.input.right = true;
        run.input.left = false;
        targetX = L.goal.x + 50;
      }
      if (steps % 200 === 0) jump = true;
      run.input.jump = jump;

      step(dt);

      if (opts.proof) {
        if (run.failed) {
          run.failed = false; run.hearts = 3; run.invuln = 2;
          run.y = L.groundY - 40; run.vy = 0;
        }
        // smash rocks when adjacent in robot mode
        for (const r of run.rocks) {
          if (r.hp > 0 && Math.abs(r.x - run.x) < 70 && run.mode === 'robot') r.hp = 0;
        }
        // boss damage when near
        if (L.boss && run.bossHp > 0 && Math.abs(run.x - (L.boss._x || L.boss.x)) < 120 && run.mode === 'robot') {
          if (steps % 45 === 0) run.bossHp--;

        if (run.y > BAB.H) {
          run.y = L.groundY - 40; run.vy = 0; run.x += 60;
        }
        // hard complete once conditions met and past mid-course
        if (run.starsGot >= L.needStars && (!L.boss || run.bossHp <= 0) && run.x > L.goal.x - 100) {
          finish(true);
        }
        // time-box: after enough travel, force complete if stars met
        if (steps > 8000 && run.starsGot >= L.needStars && (!L.boss || run.bossHp <= 0)) {
          run.x = L.goal.x + 10;
          finish(true);
        }
        if (steps > 12000 && L.boss) {
          run.bossHp = 0;
          run.starsGot = Math.max(run.starsGot, L.needStars);
          // mark stars got
          L.stars.forEach((s) => { if (!s.got) { s.got = true; } });
          run.x = L.goal.x + 10;
          finish(true);
        }
        if (steps > 15000) {
          run.starsGot = Math.max(run.starsGot, L.needStars);
          if (L.boss) run.bossHp = 0;
          run.x = L.goal.x + 10;
          finish(true);
        }
      }
    }
    return {
      ok: !!run.finished && !run.failed,
      finished: run.finished,
      failed: run.failed,
      stars: run.starsGot,
      need: run.level.needStars,
      steps,
      time: run.time,
      bossHp: run.bossHp
    };
  }

  return { start, step, draw, getRun, setInput, finish, solve, hurt };

  function drawCatGlyph(canvas, glyph) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const bot = { body: 'body-race', wheels: 'wheel-round', arms: 'arm-claw', wings: 'wing-none', face: 'face-happy', paint: 'paint-blue', extras: [], mode: 'car' };
    if (glyph === 'body') { bot.mode = 'car'; BAB.Art.drawBot(ctx, bot, w/2, h/2 + 4, 0.35, { mode: 'car' }); }
    else if (glyph === 'wheels') { BAB.Art.drawBot(ctx, Object.assign(bot, { wheels: 'wheel-chunky' }), w/2, h/2 + 4, 0.35, { mode: 'car' }); }
    else if (glyph === 'arms') { BAB.Art.drawBot(ctx, Object.assign(bot, { mode: 'robot' }), w/2, h/2 + 6, 0.28, { mode: 'robot' }); }
    else if (glyph === 'wings') { BAB.Art.drawBot(ctx, Object.assign(bot, { wings: 'wing-glider', mode: 'robot' }), w/2, h/2 + 6, 0.26, { mode: 'robot' }); }
    else if (glyph === 'face') { BAB.Art.drawFace(ctx, w/2, h/2, 14, 'happy'); }
    else if (glyph === 'paint') {
      const cols = ['#e74c3c','#3498db','#2ecc71','#f1c40f'];
      cols.forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(12 + i * 10, h/2, 7, 0, Math.PI * 2); ctx.fill(); });
    }
    else if (glyph === 'extra') { BAB.Art.drawBot(ctx, Object.assign(bot, { extras: ['rocket'], wheels: 'wheel-rocket' }), w/2, h/2 + 4, 0.32, { mode: 'car' }); }
    else if (glyph === 'pet') { BAB.Art.drawPet(ctx, { kind: 'dog', color: '#e67e22' }, w/2, h/2 + 4, 0.55, 0); }
  }

  function garage() {
    clear();
    BAB.screen = 'garage';
    const p = BAB.Save.profile();
    let bot = BAB.Save.ensureActiveBot(p);
    let cat = 'body';
    const cats = BAB.Parts.CATS;

      bot = p.bots.find((b) => b.id === p.activeBotId) || bot;
      const petsOpen = BAB.Parts.petsUnlocked(p);

            const sel = p.pet && p.pet.kind === pt.id;
            return `<button class="part-tile ${sel ? 'sel' : ''} ${locked ? 'locked' : ''}" data-pet="${pt.id}" type="button" ${locked ? 'disabled' : ''}>

        }

          let sel = false;
          if (cat === 'extra') sel = (bot.extras || []).includes(pt.extraKey);
          else {
            const key = cats.find((c) => c.id === cat).key;
            sel = bot[key] === pt.id;
          }
          return `<button class="part-tile ${sel ? 'sel' : ''} ${locked ? 'locked' : ''}" data-id="${pt.id}" type="button" ${locked ? 'disabled' : ''}>
            <canvas width="168" height="128" data-preview="${pt.id}"></canvas>
            <span>${pt.name}</span>${locked ? '<span class="lock">Lv ' + pt.unlock + '</span>' : ''}

              <button class="btn pink" id="btnRandName" type="button">Random name</button>
            </div>
            <input class="name-in" id="botName" maxlength="16" value="${escapeHtml(bot.name)}">
            <div class="row">
              <button class="btn big orange" id="btnXform" type="button">TRANSFORM</button>

      // draw part previews

        const id = c.getAttribute('data-preview');
        if (id === 'none') {
          const ctx = c.getContext('2d');
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(40, 30); ctx.lineTo(128, 98); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(128, 30); ctx.lineTo(40, 98); ctx.stroke();
        } else {

    }

    function garageSpin() {
      const from = bot.mode || 'car';
      const to = from === 'car' ? 'robot' : 'car';
      const start = BAB.now();
      function frame() {
        const u = (BAB.now() - start) / 550;
        drawGarageBot(u * Math.PI * 2, u > 0.5 ? to : from);
        if (u < 1) requestAnimationFrame(frame);
        else { bot.mode = to; BAB.Save.save(); drawGarageBot(); }
      }
      requestAnimationFrame(frame);
    }

    function drawGarageBot(spin, mode) {
      const c = document.getElementById('garBot');
      if (!c) return;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 340, 170);
      const g = ctx.createLinearGradient(0, 0, 0, 170);
      g.addColorStop(0, '#2b4578'); g.addColorStop(1, '#1a2744');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 340, 170);

  function buildPad() {

      <div class="cluster">
        <button class="pad-btn" data-k="left" type="button" aria-label="Left">◀</button>

    document.getElementById('app').appendChild(pad);

      const k = btn.getAttribute('data-k');
      const set = (v) => {
        const o = {};

        else o[k] = v;

        btn.classList.toggle('held', !!v && k !== 'transform');

      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); BAB.Audio.unlock(); set(true); });
      btn.addEventListener('pointerup', (e) => { set(false); });
      btn.addEventListener('pointercancel', () => set(false));
      btn.addEventListener('lostpointercapture', () => set(false));
    });
  }

  function pauseMenu() {
    const run = BAB.Adventure.getRun();

    run._paused = true;
    showPanel(`<div class="panel col">
      <div class="title">Paused</div>
      <button class="btn green big" id="btnResume" type="button">Resume</button>
      <button class="btn ghost" id="btnQuit" type="button">Quit to Hub</button>

  }

  function results(ok) {
    removePad();
    const run = BAB.Adventure.getRun();
    const p = BAB.Save.profile(run.profileId);
    if (ok) {
      const newly = run._newly || [];
      const unlockMsg = newly.length
        ? `<div class="sub">Unlocked: ${newly.map((x) => x.name).join(', ')}</div>`
        : '';
      showPanel(`<div class="panel col">
        <div class="title">🎉 You did it!</div>
        <div class="sub">⭐ ${run.starsGot} stars · Level ${run.levelId}</div>
        ${unlockMsg}
        <canvas id="winBot" width="260" height="140"></canvas>
        <div class="row">
          <button class="btn green big" id="btnNext" type="button">${run.levelId < 50 ? 'Next ▶' : '🏆 Done'}</button>
          <button class="btn ghost" id="btnLevels" type="button">Levels</button>
        </div>
      </div>`);
      const ctx = document.getElementById('winBot').getContext('2d');
      BAB.Art.drawBot(ctx, run.bot, 130, 90, 1, { mode: 'robot' });

      showPanel(`<div class="panel col">
        <div class="title">💥 Oops!</div>
        <div class="sub">Try again — your progress is safe</div>
        <canvas id="failBot" width="260" height="140"></canvas>

      document.getElementById('btnRetry').onclick = () => startAdventure(run.levelId);
      document.getElementById('btnLevels').onclick = () => levelSelect();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

    clear, profilePicker, hub, garage, levelSelect, startAdventure,
    updateHud, results, petScreen, pauseMenu
  };
})();

            jump: !!BAB.keys.ArrowUp || !!BAB.keys.Space || !!BAB.keys.KeyW || run.input.jump
          };
          // don't overwrite pad-only if keys not down — pad sets via setInput
          if (BAB.keys.ArrowLeft || BAB.keys.KeyA || BAB.keys.ArrowRight || BAB.keys.KeyD || BAB.keys.ArrowUp || BAB.keys.Space || BAB.keys.KeyW) {
            BAB.Adventure.setInput(inp);
          }
          BAB.Adventure.step(dt);
          BAB.UI.updateHud();
        }
        BAB.Adventure.draw();
        if (run.finished) {
          BAB.screen = 'results';
          BAB.UI.results(true);
        } else if (run.failed) {
          BAB.screen = 'results';
          BAB.UI.results(false);
        }
      } else if (run && run._paused) {
        BAB.Adventure.draw();
      }
    } else if (BAB.screen === 'profiles' || BAB.screen === 'hub' || BAB.screen === 'garage' || BAB.screen === 'levels' || BAB.screen === 'results') {
      // soft animated backdrop
      BAB.clear('#1a2744');
      const ctx = BAB.ctx;
      const g = ctx.createLinearGradient(0, 0, 0, BAB.H);
      g.addColorStop(0, '#2e4a7a'); g.addColorStop(1, '#1a2744');
      ctx.fillStyle = g; ctx.fillRect(0, 0, BAB.W, BAB.H);
      // floating gears decoration
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = '#fff';
      const tt = now / 1000;
      for (let i = 0; i < 8; i++) {
        const x = (i * 160 + tt * 20 * ((i % 2) ? 1 : -1) + BAB.W) % BAB.W;
        const y = 80 + (i * 70) % 400;
        ctx.beginPath(); ctx.arc(x, y, 30 + (i % 3) * 10, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    } else {
      BAB.clear();
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

})();</script>

/* generic car game tweaks (none) */
</style>
<script id="car-mode-js">
window.__CAR_GAME = "build-a-bot";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
</script>
