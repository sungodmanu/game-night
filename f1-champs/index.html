<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230e121b%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%23ffd77a%27/%3E%3Ccircle cx=%2740%27 cy=%2726%27 r=%2716%27 fill=%27%230e121b%27/%3E%3C/svg%3E">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>F1 Champs</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e17;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0a0e17}
#game{display:block;max-width:100%;max-height:100%;background:#111;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;z-index:10}
#ui .panel{pointer-events:auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;overflow:auto;background:rgba(6,10,18,.92)}
.screen.hidden{display:none}
h1{font-size:clamp(28px,6vw,48px);letter-spacing:.04em;color:#fff;text-shadow:0 0 24px #e8002044}
h2{font-size:clamp(18px,3.5vw,28px);margin:8px 0}
.sub{opacity:.75;margin-bottom:16px;text-align:center;max-width:520px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:8px 0}
.btn{min-width:48px;min-height:48px;padding:12px 20px;border:2px solid #334;border-radius:12px;background:#1a2233;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.btn:hover,.btn:focus{border-color:#27f4d2;outline:none}
.btn.primary{background:#e80020;border-color:#ff4058}
.btn.primary:hover{background:#ff1a38}
.btn:disabled{opacity:.4;cursor:default}
.btn.selected{border-color:#27f4d2;box-shadow:0 0 0 2px #27f4d288}
.btn.danger{background:#3a1520;border-color:#e80020}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:min(960px,96vw);max-height:55vh;overflow:auto;padding:4px;align-content:start}
.grid.track-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:min-content;gap:8px;width:min(1100px,96vw);max-height:min(58vh,calc(100% - 180px));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px;align-content:start}
.card{position:relative;min-height:48px;padding:10px;border:2px solid #2a3344;border-radius:14px;background:#121a28;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;overflow:hidden;z-index:0}
.card.track-card{padding:6px;gap:2px;min-height:0;overflow:visible}
.card:hover,.card.selected{border-color:#27f4d2;z-index:1}
.card .logo{width:56px;height:56px;flex-shrink:0}
.card .track-mini{display:block;width:110px;height:66px;max-width:100%;max-height:66px;border-radius:6px;background:#13281c;flex-shrink:0;position:relative;z-index:0;margin:0 auto;object-fit:contain}
.card .name{font-size:14px;font-weight:700;position:relative;z-index:1;width:100%;line-height:1.2}
.card .meta{font-size:12px;opacity:.7;position:relative;z-index:1;width:100%;line-height:1.2}
.hud{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:14px;text-shadow:0 1px 2px #000}
.hud .box{background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;border:1px solid #334}
.steward{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(20,20,40,.9);border:2px solid #ffd100;padding:10px 16px;border-radius:10px;font-weight:700;pointer-events:none;z-index:5}
.podium{display:flex;align-items:flex-end;gap:12px;margin:16px 0}
.podium .step{width:100px;text-align:center;padding:10px;border-radius:10px 10px 0 0;background:#1a2233;border:2px solid #445}
.podium .p1{height:120px;border-color:#ffd100}
.podium .p2{height:90px;border-color:#c0c0c0}
.podium .p3{height:70px;border-color:#cd7f32}
table.stand{border-collapse:collapse;width:min(720px,96vw);font-size:13px;background:#121a28}
table.stand th,table.stand td{padding:6px 8px;border-bottom:1px solid #223;text-align:left}
table.stand tr.human{background:#1a3040}
#touch{position:absolute;inset:0;pointer-events:none;z-index:4}
#touch:not(.hidden){pointer-events:none}
.tpads{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 8px;pointer-events:none}
.tpad{pointer-events:auto;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:6px}
.tpad button{width:48px;height:48px;border-radius:10px;border:2px solid #456;background:rgba(20,30,50,.7);color:#fff;font-size:18px;font-weight:700}
.tpad .up{grid-column:2;grid-row:1}
.tpad .left{grid-column:1;grid-row:2}
.tpad .brake{grid-column:2;grid-row:2}
.tpad .right{grid-column:3;grid-row:2}
.split-hint{font-size:12px;opacity:.7;margin-top:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700}
.tire-S{background:#FF2800;color:#fff}.tire-M{background:#FFD100;color:#111}.tire-H{background:#eee;color:#111}
.tire-I{background:#43B02A;color:#fff}.tire-W{background:#0090D0;color:#fff}
.logo-svg{display:block}
@media (orientation:portrait){
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));max-height:48vh}
  .grid.track-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:min-content;max-height:min(55vh,calc(100% - 190px));gap:8px;overflow-y:auto}
  .card.track-card{overflow:hidden;height:auto;min-height:0}
  .card .track-mini{width:100px;height:60px;max-width:100%;max-height:60px}
  .card .name{font-size:12px}
  .card .meta{font-size:11px}
}
@media (max-height:620px) and (min-width:1000px){
  .grid.track-grid{max-height:calc(100% - 125px);grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:2px}
  .card.track-card{padding:3px;gap:0;overflow:hidden}
  .card .track-mini{width:88px;height:52px;max-height:52px}
  .card .name{font-size:11px;margin-top:0;line-height:1.1}
  .card .meta{font-size:9px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .screen h1{font-size:28px}
  .screen h2{font-size:14px;margin:2px 0}
  .sub{margin-bottom:2px;font-size:12px}
  #ui .screen{padding:6px}
  .row{margin:4px 0}
}

#view3d{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;display:none;background:#0b1020;z-index:0}
#view3d.active{display:block}
#game{position:relative;z-index:1}
#game.hud-overlay{background:transparent !important}
#radioPanel{position:absolute;left:12px;bottom:72px;z-index:8;max-width:min(420px,90vw);pointer-events:none}
#radioPanel.hidden{display:none}
#radioPanel.fade{opacity:0;transition:opacity .4s}
.radio-msg{display:flex;gap:10px;align-items:flex-start;background:rgba(8,12,20,.88);border:2px solid #27f4d2;border-radius:12px;padding:10px 12px;box-shadow:0 0 18px #0008}
.radio-beep{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0;animation:radioPulse .9s ease}
@keyframes radioPulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.6}100%{transform:scale(1);opacity:1}}
.radio-from{font-size:11px;opacity:.7;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.radio-text{font-size:15px;font-weight:700;line-height:1.25}
.race-bar{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;pointer-events:auto;z-index:6}
.radio-btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.radio-btns .radio-call{display:none;font-size:13px;padding:8px 10px;min-height:40px}
.radio-btns.open .radio-call{display:inline-flex}
.pit-choose{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);display:flex;gap:8px;z-index:7;padding:10px;background:rgba(10,14,24,.9)}
.pit-choose.hidden{display:none}

.cabinet{width:min(960px,96vw);text-align:center}
.cabinet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:12px 0;max-height:55vh;overflow:auto}
.cabinet-slot{padding:10px;border:2px solid #2a3344;border-radius:12px;background:#121a28}
.cabinet-slot.won{border-color:#ffd100;background:#1a2818}
.cabinet-slot .cup{font-size:28px;line-height:1.2}
.champ-trophy{font-size:22px;font-weight:800;color:#ffd100;margin:8px 0;text-shadow:0 0 18px #ffd10088}
#hud3d{position:absolute;inset:0;pointer-events:none;z-index:3}
#hud3d.hidden{display:none}

/* strategy tire pick */
#strategyScreen{max-width:920px;width:min(920px,96vw)}
.strategy-slots{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:min(720px,96vw);margin:8px auto}
.strategy-slots .strategy-slot{
  min-width:160px;min-height:96px;flex:1 1 140px;
  background:#121a28!important;border:2px solid #2a3344!important;
  border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.strategy-slots .strategy-slot.selected{border-color:#27f4d2!important;box-shadow:0 0 14px #27f4d255}
.strategy-slots .strategy-slot .name{font-size:22px;font-weight:800;letter-spacing:.04em}
.strategy-slots .strategy-slot .meta{font-size:12px;opacity:.85}
#compoundRow{flex-wrap:wrap;justify-content:center;gap:8px}


/* 3D podium ceremony results card */
.podium-card {
  position: absolute; right: 24px; bottom: 24px; width: 320px;
  background: rgba(8,12,24,0.88); border: 1px solid rgba(255,209,0,0.35);
  padding: 16px 18px; z-index: 20; pointer-events: auto;
}
.podium-card h2 { margin: 0 0 10px; font-size: 16px; color: #ffd100; }
.podium-list { margin-bottom: 12px; }
.podium-row { padding: 4px 0; font-size: 13px; color: #e8eef8; }
.podium-row.p1 { color: #ffd100; font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <canvas id="view3d" width="1180" height="600"></canvas>
  <canvas id="game" width="1180" height="600"></canvas>
  <div id="ui"></div>
  <div id="touch" class="hidden"></div>
  <div id="hud3d" class="hidden"></div>
  <div id="radioPanel" class="hidden" aria-live="polite"></div>
</div>

    if ((car.colCooldown || 0) > 0) return false;
    if (race && race.time < 2.5) return false; // ignore lights/grid chaos
    let dd = Math.abs(car.dist - other.dist);
    dd = Math.min(dd, track.total - dd);
    const lat = Math.abs(car.lateral - other.lateral);
    if (dd > 10 || lat > 8) return false; // must be a real hit, not a brush
    const aheadGap = (other.dist - car.dist + track.total) % track.total;
    // other must be clearly ahead (we are the rear car)
    if (aheadGap <= 0.5 || aheadGap > 11) return false;
    const closing = (car.speed || 0) - (other.speed || 0);
    const d = diffOf(car);
    // Easy needs a bigger ram; hard is still strict but lower than old random spam
    const minDelta = car.difficulty === 'easy' ? 38 : (car.difficulty === 'medium' ? 30 : 24);
    if (closing < minDelta) return false;
    // Being hit: if other is catching us from behind, never blame the human
    const behindGap = (car.dist - other.dist + track.total) % track.total;
    if (behindGap < 12 && (other.speed || 0) > (car.speed || 0) + 8) return false;
    return true;
  }

  function applyPenalty(race, car, seconds, reason) {
    // Don't flood: skip if steward banner still up for same-ish reason unless forced collision
    if (race.stewardT > 0.8 && reason === 'track limits') return;
    const scale = car.human ? diffOf(car).penScale : 1;
    const t = Math.max(2, Math.round(seconds * scale));
    car.pendingPenalty += t;
    race.steward = 'Stewards: ' + car.name + ' — ' + reason + ' (+' + t + 's)';
    race.stewardT = 1.6;
    race._tlStats.penalties++;
    if (car.human) AudioFX.penalty();
  }

  function warnTrackLimits(race, car) {
    car.trackLimitWarnings++;
    car.trackLimitEvents++;
    car.trackLimitStrikes++;
    race._tlStats.events++;
    if (car.human) {
      race.steward = 'Track limits warning ' + car.trackLimitStrikes + '/' + TL_WARN_MAX + ' — ' + car.name;
      race.stewardT = 1.2;
    }
    if (car.trackLimitStrikes >= TL_WARN_MAX) {
      applyPenalty(race, car, 5, 'track limits');
      car.trackLimitStrikes = 0;
    }
  }

  /** Distance of car center past asphalt edge (positive = outside). */
  function outsideAmount(track, car) {
    const half = track.halfWidth != null ? track.halfWidth : track.width * 0.5;
    return Math.abs(car.lateral) - half;
  }

  function updateAI(race, car, dt) {
    const d = diffOf(car);
    const track = race.track;
    const half = track.halfWidth != null ? track.halfWidth : track.width * 0.5;
    car.throttle = 1;
    car.brake = 0;

    // Look ahead: modest scale for heading (full lonScale over-bends AI on long tracks)
    const LS = lonScale(track);
    const TS = track.world3d ? 1.55 : 1; // traffic gap scale (was LS=5.5 → pack forever)
    const lookDist = track.world3d ? (55 + car.speed * 0.5) : (90 + car.speed * 0.35);
    const look = track.pointAt(car.dist + lookDist);
    const now = track.pointAt(car.dist);
    let turn = look.ang - now.ang;
    while (turn > Math.PI) turn -= Math.PI * 2;
    while (turn < -Math.PI) turn += Math.PI * 2;

    const curv = track.curvatureAhead ? track.curvatureAhead(car.dist, lookDist) : Math.abs(turn);
    const nearHairpin = track.hairpinIdx && track.hairpinIdx.has(now.i);

    // Soft PD toward preferred lane / racing line
    const noise = (Math.random() - 0.5) * d.aiErr * 0.25;
    car.targetLateral = (car.preferredLane || 0) * 0.85 + noise * half * 0.1;
    // Overtake / avoid: find nearest car ahead
    let ahead = null, aheadGap = 1e9;
    race.cars.forEach(o => {
      if (o === car || o.finished || o.inPit) return;
      let gap = (o.dist - car.dist + track.total) % track.total;
      if (gap > 0 && gap < 80 * TS && gap < aheadGap) { aheadGap = gap; ahead = o; }
    });
    // Standing start / launch: look-ahead heading often crosses a bend near the
    // grid, and corner braking then makes throttle < brake*1.4 so accel stays
    // <= 0 forever. Keep full throttle for a short post-lights window, skip
    // traffic speed clamps while still slow, and only apply race-speed corner
    // braking when actually too fast for the corner (otherwise low-speed cars
    // in twisty sectors pin forever the same way as the grid).
    const launching = race.time < 4;
    let cornerLimit = nearHairpin
      ? (50 + d.aiSpeed * 22)
      : Math.max(52, 160 - curv * 210 - Math.abs(turn) * 35);
    if (track.world3d) cornerLimit = Math.max(cornerLimit, nearHairpin ? 70 : 95);
    if (ahead && aheadGap < 55 * TS) {
      const prefer = ahead.lateral >= 0 ? -1 : 1;
      car.targetLateral = prefer * half * 0.42;
      if (!(launching || car.speed < 40)) {
        if (aheadGap < 28 * TS) {
          car.brake = Math.max(car.brake, 0.15 + (28 * TS - aheadGap) / (60 * TS));
          car.throttle = Math.min(car.throttle, 0.55);
          car.speed = Math.min(car.speed, ahead.speed + Math.max(4, aheadGap * 0.5 / TS));
        }
        if (aheadGap < 12 * TS) {
          car.speed = Math.min(car.speed, ahead.speed + 2);
          car.throttle = Math.min(car.throttle, 0.25);
        }
      }
    }

    // Steer toward target lateral + mild turn following (no wild wiggle)
    const latErr = car.targetLateral - car.lateral;
    car.steer = Math.max(-1, Math.min(1, latErr * 0.08 + turn * 1.1));

    if (!launching && car.speed > cornerLimit * 0.88 && (curv > 0.28 || nearHairpin || Math.abs(turn) > 0.28)) {
      const brakeForce = Math.min(1, 0.2 + curv * 1.1 + (nearHairpin ? 0.5 : 0));
      car.throttle = Math.max(0.08, 0.6 - curv * 0.9) * (0.55 + (1 - d.aiAggro) * 0.3);
      car.brake = Math.max(car.brake, brakeForce * (0.5 + d.aiAggro * 0.4));
      if (nearHairpin) car.speed = Math.min(car.speed, cornerLimit);
    }

    // Soft clamp AI well inside — AI almost never gets track limits
    const aiMax = half * 0.72;
    if (Math.abs(car.lateral) > aiMax) {
      car.lateral = Math.sign(car.lateral) * aiMax;
      car.steer *= 0.3;
    }

    if (!car.inPit && car.lap >= car.aiNextPitLap && car.tireWear > 0.35 && car.lap < race.laps - 1) {
      requestPit(race, car, nextStrategyTire(car, race) || weatherTirePick(race, car));
    }
    if (car.tireWear > 0.85 && !car.inPit) requestPit(race, car, nextStrategyTire(car, race) || weatherTirePick(race, car));
  }

  function nextStrategyTire(car, race) {
    if (!car.strategy || !car.strategy.length) return null;
    const idx = Math.min(car.strategyIndex + 1, car.strategy.length - 1);
    // If already on last set, weather pick
    if (car.strategyIndex >= car.strategy.length - 1) return weatherTirePick(race, car);
    return car.strategy[idx];
  }

  function fitStrategySet(car, compound) {
    car.tire = compound;
    car.tireWear = 0;
    car.compoundsUsed.add(compound);
    if (car.strategy && car.strategy.length) {
      // advance index when fitting the planned next, or rewrite slot if changed
      const nextIdx = Math.min(car.strategyIndex + 1, car.strategy.length - 1);
      if (car.strategyIndex < car.strategy.length - 1) {
        car.strategy[nextIdx] = compound;
        car.strategyIndex = nextIdx;
      } else {
        car.strategy[car.strategyIndex] = compound;
      }
    }
  }

  function weatherTirePick(race, car) {
    if (race.weather === 'wet') return 'wet';
    if (race.weather === 'damp') return 'intermediate';
    const used = car.compoundsUsed;
    const dry = ['soft', 'medium', 'hard'];
    if (used.size < 2) {
      const opts = dry.filter(t => !used.has(t));
      return opts[Math.floor(Math.random() * opts.length)] || 'hard';
    }
    return car.tireWear > 0.7 ? 'soft' : 'medium';
  }

  function requestPit(race, car, compound) {
    if (car.inPit || car.finished) return;
    car.pitTarget = compound;
    car._pitRequested = true;
  }

  function updateHuman(race, car, input) {
    const assist = car.assist;
    car.throttle = input.throttle ? 1 : 0;
    car.brake = input.brake ? 1 : 0;
    car.steer = input.left ? -1 : input.right ? 1 : 0;
    if (assist) {
      const look = race.track.pointAt(car.dist + 40);
      const now = race.track.pointAt(car.dist);
      let turn = look.ang - now.ang;
      while (turn > Math.PI) turn -= Math.PI * 2;
      while (turn < -Math.PI) turn += Math.PI * 2;
      const curv = race.track.curvatureAhead ? race.track.curvatureAhead(car.dist, 45) : Math.abs(turn);
      const half = race.track.halfWidth != null ? race.track.halfWidth : race.track.width * 0.5;
      if (!input.left && !input.right) {
        // gently return to racing line + follow turn
        car.steer = Math.max(-1, Math.min(1, -car.lateral * 0.06 + turn * 1.6));
      }
      if ((Math.abs(turn) > 0.3 || curv > 0.32) && !input.throttle) car.brake = Math.max(car.brake, 0.45 + curv * 0.45);
      if (!input.throttle && !input.brake && Math.abs(turn) < 0.22 && curv < 0.25) car.throttle = 0.75;
      // keep assist inside
      if (Math.abs(car.lateral) > half * 0.85) car.steer += -Math.sign(car.lateral) * 0.5;
    }
  }

  function wrapDist(d, total) {
    d = d % total;
    if (d < 0) d += total;
    return d;
  }

  function resolveOverlaps(race) {
    const track = race.track;
    const total = track.total;
    const half = track.halfWidth != null ? track.halfWidth : track.width * 0.5;
    const cars = race.cars;
    // Gap math uses wrapped positions, but stored dist stays cumulative so
    // lap = floor(dist/total) keeps working after the first SF crossing.
    for (let i = 0; i < cars.length; i++) {
      const a = cars[i];
      if (a.finished || a.inPit || a.crashed) continue;
      for (let j = i + 1; j < cars.length; j++) {
        const b = cars[j];
        if (b.finished || b.inPit || b.crashed) continue;
        const aPos = wrapDist(a.dist, total);
        const bPos = wrapDist(b.dist, total);
        let signed = aPos - bPos;
        if (signed > total * 0.5) signed -= total;
        if (signed < -total * 0.5) signed += total;
        const dd = Math.abs(signed);
        const lat = Math.abs(a.lateral - b.lateral);
        const LS = lonScale(track);
        const carLen = track.world3d ? 5.5 : 14;
        const lonMin = track.world3d ? 5.5 : 22;
        if (dd >= lonMin || lat >= carLen) continue;
        // Lane split first — keep the pack readable
        const side = a.lateral >= b.lateral ? 1 : -1;
        const latPush = Math.min(track.world3d ? 0.35 : 1.2, (carLen - lat) * 0.28);
        a.lateral = Math.max(-half * 0.85, Math.min(half * 0.85, a.lateral + side * latPush));
        b.lateral = Math.max(-half * 0.85, Math.min(half * 0.85, b.lateral - side * latPush));
        // Tiny longitudinal nudge on cumulative dist (do not wrap-store)
        if (dd < carLen && lat < carLen * 0.7) {
          const push = Math.min(0.9 * LS, (carLen - dd) * 0.2);
          if (signed >= 0) {
            a.dist += push * 0.3;
            b.dist -= push * 0.7;
            if (!b.human) b.speed = Math.min(b.speed, Math.max(b.speed * 0.98, a.speed + 6));
          } else {
            b.dist += push * 0.3;
            a.dist -= push * 0.7;
            if (!a.human) a.speed = Math.min(a.speed, Math.max(a.speed * 0.98, b.speed + 6));
          }
        }
      }
    }
  }


  function updateApproachCorner(race, followCar) {
    if (!followCar || !race.track.corners) { race.approachCorner = null; return; }
    const pts = race.track.pts.length;
    const now = race.track.pointAt(followCar.dist);
    let best = null, bestAhead = 1e9;
    race.track.corners.forEach(c => {
      if (!c.name || c.name === 'Start') return;
      let ahead = (c.i - now.i + pts) % pts;
      // convert index delta to rough dist
      const ad = ahead * (race.track.total / pts);
      const LS = lonScale(race.track);
      if (ad > 8 * LS && ad < 120 * LS && ad < bestAhead) {
        bestAhead = ad;
        best = c;
      }
    });
    if (best) {
      if (!race.approachCorner || race.approachCorner.i !== best.i) {
        race.approachCorner = { i: best.i, name: best.name, t: 0 };
      } else {
        race.approachCorner.t += 1 / 60;
      }
    } else if (race.approachCorner) {
      race.approachCorner.t += 1 / 60;
      if (race.approachCorner.t > 1.8) race.approachCorner = null;
    }
  }

  function step(race, dt, inputs) {
    // Start lights sequence before running (wall-clock so slow 3D frames don't stretch the GO)
    if (race.lights > 0 && race.lights < 6) {
      const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
      if (race._lightsWall == null) race._lightsWall = now;
      const wallDt = Math.min(0.25, (now - race._lightsWall) / 1000);
      race._lightsWall = now;
      race.lightsT += Math.max(dt, wallDt);
      if (race.lightsT >= 0.7) {
        race.lightsT = 0;
        race.lights++;
        if (race.lights === 6) {
          race.running = true;
          race._lightsWall = null;
          AudioFX.start();
        }
      }
      return;
    }
    if (!race.running || race.finished) return;
    race.time += dt;
    if (race.stewardT > 0) {
      race.stewardT -= dt;
      if (race.stewardT <= 0) race.steward = null;
    }
    const track = race.track;
    const half = track.halfWidth != null ? track.halfWidth : track.width * 0.5;

    race.cars.forEach(car => {
      if (car.finished) return;
      if (car.spin > 0) car.spin -= dt;
      if (car.tlCooldown > 0) car.tlCooldown -= dt;
      if (car.colCooldown > 0) car.colCooldown -= dt;

      if (car.human) {
        const inp = inputs[car.playerIndex] || {};
        updateHuman(race, car, inp);
        if (inp.pit) requestPit(race, car, inp.pitCompound || weatherTirePick(race, car));
      } else {
        updateAI(race, car, dt);
      }

      if (car._pitRequested && !car.inPit) {
        const idx = track.pointAt(car.dist).i;
        const entrySlop = track.world3d ? 8 : 4;
        if (Math.abs(idx - track.pitEntry) < entrySlop || (idx > track.pitEntry && idx < track.pitEntry + entrySlop * 3)) {
          car.inPit = true;
          car._pitRequested = false;
          // Real stop: 2–3s station time after limiter arrival
          car.pitStopTotal = 2.1 + Math.random() * 0.8;
          car.pitTimer = car.pitStopTotal;
          car.pitPhase = 'entry';
          car.lateral = half * 1.15;
          if (!car.pitTarget) car.pitTarget = nextStrategyTire(car, race) || weatherTirePick(race, car);
          if (car.human && window.TeamRadio) {
            TeamRadio.show('Box box, box this lap. Coming to you.', { hold: 3500 });
          }
          AudioFX.pit();
          if (car.human && race.use3d && window.World3D) {
            race.pitCamCar = car;
            World3D.showPitCrew(true);
            World3D.setMode('pit');
          }
        }
      }

      if (car.inPit) {
        // Pit-lane limiter ~80 kph feel → speed cap ~55 (same units)
        const limiter = 55;
        if (car.speed > limiter) {
          if (car.human && car.speed > limiter + 8) {
            applyPenalty(race, car, 5, 'pit-lane speeding');
          }
          car.speed = Math.min(car.speed, limiter);
        }
        if (car.pitPhase === 'entry') {
          car.pitPhase = 'box';
          if (car.human) car.pitChooseOpen = true;
        }
        car.pitTimer -= dt;
        if (car.human && car.pitChooseOpen && car.pitTimer < car.pitStopTotal * 0.35) {
          // auto-confirm if player didn't pick
          car.pitChooseOpen = false;
        }
        if (car.pitTimer <= 0) {
          const next = car.pitTarget || nextStrategyTire(car, race) || 'medium';
          fitStrategySet(car, next);
          car.inPit = false;
          car.pitPhase = 'exit';
          car.pitChooseOpen = false;
          car.lateral = 0;
          car.pitTarget = null;
          if (race.pitCamCar === car && window.World3D) {
            World3D.showPitCrew(false);
            World3D.setMode(race.cameraMode || 'chase');
            race.pitCamCar = null;
          }
          if (car.human && window.TeamRadio) {
            TeamRadio.show('Go go go! ' + next.toUpperCase() + ' fitted. Cleared the box.', { hold: 3200 });
          }
        }
      }

      car.drs = !car.inPit && inDrs(race, car) && car.speed > 80;

      const grip = tireGrip(car, race.weather);
      const vmax = maxSpeed(car, race.weather);
      let accel = (car.throttle - car.brake * 1.4) * 90 * grip;
      if (car.inPit) accel *= 0.5;
      car.speed += accel * dt;
      car.speed = Math.max(0, Math.min(vmax, car.speed));

      // Responsive but damped steering — high speed reduces authority so no instant spin
      const steerAuth = (48 + car.speed * 0.08) * (car.human && !car.assist ? 1 : 0.9);
      const damp = car.human && !car.steer ? 0.92 : 1;
      car.lateral += car.steer * steerAuth * dt;
      if (!car.steer && car.human) car.lateral *= Math.pow(0.15, dt); // gentle self-center when no input? NO - F1 shouldn't auto-center hard
      // Actually keep lateral; only lightly damp wild oscillation
      void damp;

      // Soft walls: slow when on grass, push back gently
      const out = outsideAmount(track, car);
      if (out > 0) {
        car.speed *= Math.max(0.86, 1 - out * 0.012);
        // gentle nudge back toward asphalt
        car.lateral -= Math.sign(car.lateral) * Math.min(out, 18) * dt * 1.8;
      }

      // ---- Track limits (human-focused, F1-style) ----
      // All-wheels-out ≈ car center past edge by CAR_HALF*0.4 + margin
      const wellOut = out > (CAR_HALF * 0.35 + TL_OUTSIDE_MARGIN);
      if (wellOut && !car.inPit) {
        car.offTrack += dt;
        // "gained time" proxy: cutting when curvature high and still fast
        const curv = track.curvatureAhead ? track.curvatureAhead(car.dist, 20) : 0;
        if (curv > 0.18 && car.speed > 35) car.offTrackCut += dt;
        else car.offTrackCut = Math.max(0, car.offTrackCut - dt * 0.5);

        if (car.offTrack > TL_HOLD && car.offTrackCut > 0.25 && car.tlCooldown <= 0) {
          // AI almost never: only if absurdly outside for ages
          if (car.human) {
            warnTrackLimits(race, car);
            car.tlCooldown = TL_COOLDOWN;
            car.offTrack = 0;
            car.offTrackCut = 0;
            // soft reset toward edge
            car.lateral = Math.sign(car.lateral) * (half + 2);
          } else if (out > half * 0.9 && car.offTrack > 2.5) {
            // rare AI slap — reset without steward spam
            car.lateral = Math.sign(car.lateral) * half * 0.6;
            car.offTrack = 0;
            car.offTrackCut = 0;
            car.trackLimitEvents++;
          }
        }
      } else {
        car.offTrack = 0;
        car.offTrackCut = Math.max(0, car.offTrackCut - dt);
      }

      // Hard clamp so cars don't fly into the void
      const hardMax = half + 28;
      if (Math.abs(car.lateral) > hardMax) car.lateral = Math.sign(car.lateral) * hardMax;

      // collisions — physics bump vs steward penalty (rear-end ram only)
      race.cars.forEach(other => {
        if (other === car || other.finished || other.inPit || car.inPit) return;
        let dd = Math.abs(car.dist - other.dist);
        dd = Math.min(dd, track.total - dd);
        const lat = Math.abs(car.lateral - other.lateral);
        if (dd >= 14 || lat >= 11) return;
        const aheadGap = (other.dist - car.dist + track.total) % track.total;
        const closing = car.speed - other.speed;
        // Soft physics for any overlap while closing from behind
        if (aheadGap < 14 && closing > 6) {
          car.speed *= 0.78;
          other.speed *= 0.92;
        }
        // Steward: only clear rear-end rams by the human, with cooldown + difficulty threshold
        if (car.human && isClearRearEndCollision(car, other, track, race)) {
          applyPenalty(race, car, 10, 'causing a collision');
          other.spin = Math.max(other.spin || 0, 0.9);
          car.crashed++;
          const d = diffOf(car);
          car.colCooldown = car.difficulty === 'easy' ? 18 : (car.difficulty === 'medium' ? 12 : 8);
        } else if (!car.human && aheadGap < 12 && closing > 22 && Math.random() < 0.02) {
          other.spin = 0.5;
          car.speed *= 0.88;
        }
      });

      car.dist += car.speed * dt * 0.85;
      const tread = F1DATA.tires[car.tire] || F1DATA.tires.medium;
      if (car.pitPhase !== 'exit') car.tireWear = Math.max(0, Math.min(1, car.tireWear + dt * 0.012 * tread.wearRate * (1 + car.speed / 300)));
      else car.pitPhase = null;

      const prog = car.dist / track.total;
      const newLap = Math.floor(prog);
      if (newLap > car.lap) {
        car.lap = newLap;
        AudioFX.lap();
        if (car.pendingPenalty > 0 && !car.inPit) {
          car.penaltyTime += car.pendingPenalty;
          car.speed = 0;
          car.spin = car.pendingPenalty * 0.35;
          car.pendingPenalty = 0;
        }
      }
      if (car.lap >= race.laps && !car.finished) {
        if (race.weather === 'dry') {
          const dryUsed = [...car.compoundsUsed].filter(t => !F1DATA.tires[t].wet);
          if (dryUsed.length < 2 && car.human) {
            applyPenalty(race, car, 10, 'must use 2 dry compounds');
          }
        }
        car.finished = true;
        car.finishOrder = race._finishCount++;
        car.finishTime = race.time + car.penaltyTime;
      }
    });

    resolveOverlaps(race);

    // camera follow (smooth, no rotation)
    const follow = race.cars.find(c => c.human && c.playerIndex === 0) || race.cars.find(c => c.human);
    if (follow && race.cam) {
      const p = track.pointAt(follow.dist);
      const nx = Math.cos(p.ang + Math.PI / 2), ny = Math.sin(p.ang + Math.PI / 2);
      const tx = p.x + nx * follow.lateral;
      const ty = p.y + ny * follow.lateral;
      const k = 1 - Math.pow(0.001, dt); // smooth lerp
      race.cam.x += (tx - race.cam.x) * Math.min(1, k * 14);
      race.cam.y += (ty - race.cam.y) * Math.min(1, k * 14);
      updateApproachCorner(race, follow);
    }

    if (window.TeamRadio) TeamRadio.tick(race);
    if (race.use3d && window.World3D && World3D.isActive()) {
      World3D.update(race, dt);
      const hum = race.cars.find(c => c.human); if (hum && window.AudioFX) AudioFX.engine(hum.spd || 0);
    }
    if (window.Trophies) Trophies.update(dt);

    const humans = race.cars.filter(c => c.human);
    if (humans.every(c => c.finished) || race.cars.every(c => c.finished)) {
      finishRace(race);
    }
  }

  function finishRace(race) {
    if (race.finished) return;
    race.finished = true;
    race.running = false;
    const order = race.cars.slice().sort((a, b) => {
      if (a.finished && b.finished) return (a.finishTime - b.finishTime) || (a.finishOrder - b.finishOrder);

  function drawStrategyHud(ctx, car, x, y) {

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x, y, 168, 28);

      if (follow) {
        const pos = positions(race).findIndex(c => c.id === follow.id) + 1;
        const tire = follow.tire[0].toUpperCase();
        const kph = Math.round((follow.speed || follow.spd || 0) * 2.4);
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(8, 8, 268, 88);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('P' + pos + '  Lap ' + Math.min(follow.lap + 1, race.laps) + '/' + race.laps, 16, 28);
        ctx.fillText(follow.name + ' #' + follow.number, 16, 46);
        ctx.fillText(kph + ' km/h   Tire ' + tire + ' ' + Math.max(0, Math.min(100, Math.round((1 - follow.tireWear) * 100))) + '%' + (follow.drs ? '  DRS' : '') + (follow.inPit ? '  PIT' : ''), 16, 64);
        ctx.fillStyle = '#9fffd0';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('SPD ' + kph, 16, 82);

          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(W / 2 - 90, H * 0.35, 180, 50);
          ctx.fillStyle = '#27F4D2';
          ctx.font = 'bold 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('PIT STOP ' + remain.toFixed(1) + 's', W / 2, H * 0.35 + 32);
          ctx.textAlign = 'left';
          if (follow.pitChooseOpen) {

            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';

      if (followCar) {

        const nx = Math.cos(p.ang + Math.PI / 2), ny = Math.sin(p.ang + Math.PI / 2);

        const nx = Math.cos(p.ang + Math.PI / 2);
        const ny = Math.sin(p.ang + Math.PI / 2);
        const x = p.x + nx * car.lateral;
        const y = p.y + ny * car.lateral;
        const ang = p.ang + (car.spin > 0 ? race.time * 8 : 0);
        Draw.car(ctx, car, x, y, ang, car.human ? 0.92 : 0.82);
        if (car.human) {

      if (followCar) {

        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(8, y0 + 8, 230, 64);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('P' + pos + '  Lap ' + Math.min(followCar.lap + 1, race.laps) + '/' + race.laps, 16, y0 + 28);
        ctx.fillText(followCar.name + ' #' + followCar.number, 16, y0 + 46);
        ctx.fillText('Tire ' + tire + ' ' + Math.max(0, Math.min(100, Math.round((1 - followCar.tireWear) * 100))) + '%' + (followCar.drs ? '  DRS' : '') + (followCar.pendingPenalty ? '  PEN' : '') + (followCar.trackLimitStrikes ? '  TL' + followCar.trackLimitStrikes : ''), 16, y0 + 62);
        drawStrategyHud(ctx, followCar, 8, y0 + 78);
        if (Draw.minimap) {

  function drawLightsAndSteward(race, ctx, W, H) {

      for (let i = 0; i < 5; i++) {

        ctx.arc(bx + i * 32, by + 6, 12, 0, Math.PI * 2);

        ctx.fill();

    if (race.steward) {

      ctx.fillRect(W / 2 - tw / 2, H * 0.18, tw, 36);
      ctx.strokeRect(W / 2 - tw / 2, H * 0.18, tw, 36);
      ctx.fillStyle = '#FFD100';
      ctx.textAlign = 'center';
      ctx.fillText(race.steward, W / 2, H * 0.18 + 24);
      ctx.textAlign = 'left';

    if (!race.running && !race.finished && race.lights === 0 && !(race.time > 0)) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';

  /**
   * Human-like scripted drive (NOT autopilot cheat): computes key-like inputs
   * from racing line + braking points. Returns stats + optional frame callback.
   */
  function scriptedDrive(race, opts) {
    opts = opts || {};
    const maxSeconds = opts.seconds || 120;
    const dt = 1 / 30;
    const onFrame = opts.onFrame || null;
    const shotEvery = opts.shotEvery || 2;
    race.lights = 0;
    race.running = true;
    // Humans: assist OFF — we supply raw inputs
    race.cars.forEach(c => { if (c.human) c.assist = false; });
    let t = 0, lastShot = -999;
    const frames = [];
    while (t < maxSeconds && !race.finished) {
      const human = race.cars.find(c => c.human);
      const input = { throttle: false, brake: false, left: false, right: false };
      if (human && !human.finished) {
        const track = race.track;
        const half = track.halfWidth != null ? track.halfWidth : track.width * 0.5;
        const look = track.pointAt(human.dist + 50 + human.speed * 0.15);
        const now = track.pointAt(human.dist);
        let turn = look.ang - now.ang;
        while (turn > Math.PI) turn -= Math.PI * 2;
        while (turn < -Math.PI) turn += Math.PI * 2;
        const curv = track.curvatureAhead ? track.curvatureAhead(human.dist, 55) : Math.abs(turn);
        // steer keys toward racing line
        const wantLat = 0;
        const latErr = wantLat - human.lateral;
        const steerCmd = latErr * 0.1 + turn * 1.4;
        if (steerCmd < -0.18) input.left = true;
        else if (steerCmd > 0.18) input.right = true;

        const nearHairpin = track.hairpinIdx && track.hairpinIdx.has(now.i);
        if (curv > 0.3 || nearHairpin || Math.abs(turn) > 0.32) {
          input.brake = true;
          if (human.speed < 70 && curv < 0.55) input.throttle = true;
        } else {
          input.throttle = true;
        }
        // if drifting outside, steer in hard and lift
        if (Math.abs(human.lateral) > half * 0.75) {
          if (human.lateral > 0) input.left = true; else input.right = true;
          input.throttle = false;
        }
      }
      const inputs = [input, { throttle: true, brake: false, left: false, right: false }];
      step(race, dt, inputs);
      if (onFrame && t - lastShot >= shotEvery) {
        onFrame(race, t, frames.length);
        lastShot = t;
        frames.push(t);
      }
      t += dt;
      // stop after ~1 clean lap for playtest (or humans finished)
      if (opts.oneLap && human && human.lap >= 1) break;
      if (race.cars.filter(c => c.human).every(c => c.finished)) break;
    }
    const ai = race.cars.filter(c => !c.human);
    const humans = race.cars.filter(c => c.human);
    const aiEvents = ai.reduce((s, c) => s + (c.trackLimitEvents || 0), 0);
    const humanEvents = humans.reduce((s, c) => s + (c.trackLimitEvents || 0), 0);
    const lapsDone = Math.max(1, Math.max(...race.cars.map(c => c.lap || 0), 1));
    return {
      time: t,
      frames: frames.length,
      humanTrackLimits: humanEvents,
      aiTrackLimits: aiEvents,
      aiAvgPerLap: aiEvents / (ai.length * Math.max(1, lapsDone / race.cars.length * race.laps || 1) || 1),
      aiAvgPerCarLap: ai.length ? aiEvents / (ai.length * Math.max(0.25, Math.max(...ai.map(c => c.lap), 0.25))) : 0,
      cars: race.cars.map(c => ({
        id: c.id, human: c.human, lap: c.lap, events: c.trackLimitEvents || 0,
        warnings: c.trackLimitWarnings || 0, pending: c.pendingPenalty || 0
      }))
    };
  }

  return {
    start, step, draw, positions, requestPit, beginLights,
    debugFinish, debugForcePenalty, debugPit, debugAutopilot, scriptedDrive,
    weatherTirePick, TIRE_KEYS, recommendStrategy, aiStrategy, nextStrategyTire,
    fitStrategySet, confirmPitCompound, setCameraMode, lonScale,
    isClearRearEndCollision
  };
})();

    const s = screen(pl.name + ' — Choose Team', 'Then pick your driver · logos are hand-drawn lookalikes');
    const grid = el('<div class="grid" id="teamGrid"></div>');
    F1DATA.teams.forEach(t => {
      const taken = state.players.some((p, i) => i !== pi && p.teamId === t.id);
      const card = el('<div class="card" data-team="' + t.id + '"></div>');
      if (pl.teamId === t.id) card.classList.add('selected');
      if (taken) card.style.opacity = '0.4';
      card.appendChild(logoImg(t.id));
      card.appendChild(el('<div class="name">' + t.name + '</div>'));
      const cols = el('<div class="meta"></div>');
      cols.textContent = t.drivers.map(d => d.name.split(' ').pop()).join(' · ');
      card.appendChild(cols);
      // color swatch + mini car preview
      const canvas = document.createElement('canvas');
      canvas.width = 80; canvas.height = 36;
      canvas.className = 'car-preview';
      const ctx = canvas.getContext('2d');
      Draw.car(ctx, { teamColors: t.colors, teamId: t.id, number: t.drivers[0].number, tire: 'medium' }, 40, 18, 0, 1.2);
      card.appendChild(canvas);
      card.addEventListener('click', () => {
        if (taken) return;
        AudioFX.ui();
        pl.teamId = t.id;
        pl.driverId = null;
        showTeamPick(state, actions);
      });
      grid.appendChild(card);
    });
    s.appendChild(grid);
    const row = el('<div class="row"></div>');
    row.appendChild(btn('Back', '', () => {
      if (pi > 0) { state.pickIndex = pi - 1; showTeamPick(state, actions); }
      else actions.toPlayers();
    }));
    row.appendChild(btn('Next', 'primary', () => {
      if (!pl.teamId) return;
      showDriverPick(state, actions);
    }));
    s.appendChild(row);
  }

  function showDriverPick(state, actions) {
    const pi = state.pickIndex || 0;
    const pl = state.players[pi];
    const team = F1DATA.teams.find(t => t.id === pl.teamId);
    const s = screen(pl.name + ' — Choose Driver', team.name);
    // difficulty
    s.appendChild(el('<h2>Difficulty</h2>'));
    const drow = el('<div class="row" id="diffRow"></div>');
    ['hard', 'medium', 'easy'].forEach(id => {
      const d = DIFFICULTY[id];
      const b = btn(d.label, pl.difficulty === id ? 'selected primary' : '', () => {
        pl.difficulty = id;
        showDriverPick(state, actions);
      });
      b.dataset.diff = id;
      drow.appendChild(b);
    });
    s.appendChild(drow);
    s.appendChild(el('<p class="sub">Hard is default and tough. Easy: slower AI, more grip, softer penalties.</p>'));
    // assist
    const arow = el('<div class="row"></div>');
    const ab = btn('Assist: ' + (pl.assist ? 'ON' : 'OFF'), pl.assist ? 'selected' : '', () => {
      pl.assist = !pl.assist;
      showDriverPick(state, actions);
    });
    ab.id = 'btnAssist';
    arow.appendChild(ab);
    s.appendChild(arow);
    s.appendChild(el('<p class="sub">Steering & braking assist is optional and off by default.</p>'));

    const grid = el('<div class="grid"></div>');
    team.drivers.forEach(d => {
      const taken = state.players.some((p, i) => i !== pi && p.driverId === d.id);
      const card = el('<div class="card" data-driver="' + d.id + '"></div>');
      if (pl.driverId === d.id) card.classList.add('selected');
      if (taken) card.style.opacity = '0.4';
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      Draw.helmet(c.getContext('2d'), d.helmet, 32, 32, 26);
      card.appendChild(c);
      card.appendChild(el('<div class="name">#' + d.number + ' ' + d.name + '</div>'));
      card.addEventListener('click', () => {
        if (taken) return;
        AudioFX.ui();
        pl.driverId = d.id;
        showDriverPick(state, actions);
      });
      grid.appendChild(card);
    });
    s.appendChild(grid);
    const row = el('<div class="row"></div>');
    row.appendChild(btn('Back', '', () => showTeamPick(state, actions)));
    row.appendChild(btn(pi < state.numPlayers - 1 ? 'Next Player' : 'To Calendar', 'primary', () => {
      if (!pl.driverId) return;
      if (pi < state.numPlayers - 1) {
        state.pickIndex = pi + 1;
        showTeamPick(state, actions);
      } else {
        state.pickIndex = 0;
        actions.toCalendar();
      }
    }));
    s.appendChild(row);
  }

  function showCalendar(state, actions) {
    const s = screen('Choose Grand Prix', 'Win ' + WINS_TO_END_SEASON + ' Grands Prix to finish the season · human wins: ' + (state.humanWins || 0));
    // lap length
    s.appendChild(el('<h2>Race length</h2>'));
    const lrow = el('<div class="row"></div>');
    [3, 5, 10].forEach(n => {
      const b = btn(n + ' laps', (state.laps || 3) === n ? 'selected primary' : '', () => {
        state.laps = n;
        showCalendar(state, actions);
      });
      lrow.appendChild(b);
    });
    s.appendChild(lrow);
    const grid = el('<div class="grid track-grid" id="trackGrid"></div>');
    F1DATA.tracks.forEach(t => {
      const card = el('<div class="card track-card" data-track="' + t.id + '"></div>');
      if (state.trackId === t.id) card.classList.add('selected');
      const c = document.createElement('canvas');
      c.width = 110; c.height = 66;
      c.className = 'track-mini';
      c.style.width = '110px';
      c.style.height = '66px';
      c.style.maxWidth = '100%';
      c.style.maxHeight = '66px';
      Tracks.drawMini(c.getContext('2d'), t, 110, 66, { labels: false });
      card.appendChild(c);
      card.appendChild(el('<div class="name">' + t.gp.replace(' Grand Prix', ' GP') + '</div>'));
      card.appendChild(el('<div class="meta">' + t.name + ' · ' + t.country + '</div>'));
      card.addEventListener('click', () => {
        AudioFX.ui();
        state.trackId = t.id;
        showCalendar(state, actions);
      });
      grid.appendChild(card);
    });
    s.appendChild(grid);
    const row = el('<div class="row"></div>');
    row.appendChild(btn('Standings', '', actions.toStandings));
    row.appendChild(btn('Back', '', () => { state.pickIndex = state.numPlayers - 1; showDriverPick(state, actions); }));
    row.appendChild(btn('Tire Choice', 'primary', () => {
      if (!state.trackId) state.trackId = F1DATA.tracks[0].id;
      showTires(state, actions);
    }));
    s.appendChild(row);
  }

  function availableCompounds(weather) {
    if (weather === 'wet') return ['wet', 'intermediate', 'soft', 'medium', 'hard'];
    if (weather === 'damp') return ['intermediate', 'wet', 'soft', 'medium', 'hard'];
    return ['soft', 'medium', 'hard', 'intermediate', 'wet'];
  }

  function ensureStrategy(pl, weather) {
    if (!pl.strategy || pl.strategy.length !== 3) {
      const rec = Race.recommendStrategy(weather || 'dry', pl.difficulty || 'hard');
      pl.strategy = rec.slice();
      pl.tire = pl.strategy[0];
    }
  }

  function showTires(state, actions) {
    const pi = state.tirePick || 0;
    const pl = state.players[pi];
    // Guess weather for strategy screen from track rain chance (same as race default)
    const meta = F1DATA.tracks.find(t => t.id === state.trackId) || F1DATA.tracks[0];
    const weatherGuess = state.weatherPreview || (Math.random() < meta.rainChance ? (Math.random() < 0.5 ? 'wet' : 'damp') : 'dry');
    state.weatherPreview = weatherGuess;
    ensureStrategy(pl, weatherGuess);
    // Easy P1: preselect recommended
    if (pi === 0 && pl.difficulty === 'easy' && !pl._stratTouched) {
      pl.strategy = Race.recommendStrategy(weatherGuess, 'easy');
      pl.tire = pl.strategy[0];
    }
    const s = screen(pl.name + ' — Tire Strategy', 'Pick 3 sets for the race (start on set 1). Weather: ' + weatherGuess.toUpperCase() + '. Soft=red · Medium=yellow · Hard=white · Inter=green · Wet=blue');
    s.id = 'strategyScreen';
    const slots = el('<div class="row strategy-slots" id="strategySlots"></div>');
    pl.strategy.forEach((id, idx) => {
      const t = F1DATA.tires[id];
      const card = el('<div class="card strategy-slot" data-slot="' + idx + '"></div>');
      if (state.strategySlot === idx) card.classList.add('selected');
      card.innerHTML = '<div class="meta">Set ' + (idx + 1) + (idx === 0 ? ' (start)' : '') + '</div>' +
        '<div class="name" style="color:' + t.color + '">' + id.toUpperCase() + '</div>' +
        '<div class="meta">grip ' + t.grip + ' · wear ' + t.wearRate + '</div>';
      card.addEventListener('click', () => { state.strategySlot = idx; showTires(state, actions); });
      slots.appendChild(card);
    });
    s.appendChild(slots);
    const slot = state.strategySlot != null ? state.strategySlot : 0;
    state.strategySlot = slot;
    const row = el('<div class="row" id="compoundRow"></div>');
    availableCompounds(weatherGuess).forEach(id => {
      const t = F1DATA.tires[id];
      const b = btn(id.toUpperCase(), pl.strategy[slot] === id ? 'selected primary' : '', () => {
        pl.strategy[slot] = id;
        pl._stratTouched = true;
        if (slot === 0) pl.tire = id;
        showTires(state, actions);
      });
      b.style.borderColor = t.color;
      b.dataset.tire = id;
      b.dataset.slot = String(slot);
      row.appendChild(b);
    });
    s.appendChild(row);
    if (pl.difficulty === 'easy') {
      s.appendChild(el('<p class="sub">Easy: recommended strategy preselected (S-M-H dry).</p>'));
    }
    const recRow = el('<div class="row"></div>');
    recRow.appendChild(btn('Use Recommended', '', () => {
      pl.strategy = Race.recommendStrategy(weatherGuess, pl.difficulty || 'hard');
      pl.tire = pl.strategy[0];
      pl._stratTouched = false;
      showTires(state, actions);
    }));
    s.appendChild(recRow);
    const nav = el('<div class="row"></div>');
    nav.appendChild(btn('Back', '', actions.toCalendar));
    nav.appendChild(btn(pi < state.numPlayers - 1 ? 'Next Player' : 'Grid Walk', 'primary', () => {
      pl.tire = pl.strategy[0];
      if (pi < state.numPlayers - 1) {
        state.tirePick = pi + 1;
        state.strategySlot = 0;
        showTires(state, actions);
      } else {
        state.tirePick = 0;
        actions.toGrid();
      }
    }));
    s.appendChild(nav);
  }

  function showGrid(state, actions) {
    const s = screen('Starting Grid', F1DATA.tracks.find(t => t.id === state.trackId).gp);
    const list = el('<div class="grid" id="gridList"></div>');
    // preview humans + note AI fills rest
    state.players.forEach((pl, i) => {
      const team = F1DATA.teams.find(t => t.id === pl.teamId);
      const drv = team.drivers.find(d => d.id === pl.driverId);
      const card = el('<div class="card"></div>');
      card.appendChild(logoImg(team.id));
      const c = document.createElement('canvas');
      c.width = 90; c.height = 40;
      Draw.car(c.getContext('2d'), { teamColors: team.colors, teamId: team.id, number: drv.number, tire: pl.tire }, 45, 20, 0, 1.3);
      card.appendChild(c);
      card.appendChild(el('<div class="name">P' + (i + 1) + ' #' + drv.number + ' ' + drv.name + '</div>'));
      card.appendChild(el('<div class="meta">' + team.name + ' · ' + DIFFICULTY[pl.difficulty].label + (pl.assist ? ' · Assist' : '') + '</div>'));
      list.appendChild(card);
    });
    s.appendChild(list);
    s.appendChild(el('<p class="sub">AI fills the rest of the 22-car 2026 grid.</p>'));
    const row = el('<div class="row"></div>');
    row.appendChild(btn('Back', '', () => showTires(state, actions)));
    row.appendChild(btn('Race!', 'primary', actions.startRace));
    s.appendChild(row);
  }

  function showRaceChrome(state, actions) {
    const gc = document.getElementById('game');
    if (gc) gc.style.opacity = '';
    clear();
    const bar = el('<div class="panel race-bar" id="raceBar"></div>');
    // Menu Start only before the race begins — never during lights/running
    const raceIdle = !state.race.running && !state.race.finished && !(state.race.lights > 0) && !(state.race.time > 0);
    const raceLive = !state.race.finished && (state.race.running || state.race.lights > 0 || state.race.time > 0);
    if (raceIdle && !raceLive) {
      bar.appendChild(btn('Start', 'primary', actions.goRace));
    }
    const humanCar = state.race.cars && state.race.cars.find(c => c.human);
    if (raceLive && state.race.running && !(humanCar && humanCar.inPit)) {
      bar.appendChild(btn('Pit', '', actions.pit));
    }
    if (raceLive) {
      const radioWrap = el('<div class="radio-btns" id="radioBtns"></div>');
      const radioMain = btn('Radio', '', () => {
        radioWrap.classList.toggle('open');
      });
      radioMain.id = 'btnRadio';
      radioWrap.appendChild(radioMain);
      [['box', 'Box this lap?'], ['tires', 'Tires are gone'], ['gap', "What's the gap?"]].forEach(([k, lab]) => {
        const b = btn(lab, 'radio-call', () => actions.radioCall && actions.radioCall(k));
        b.dataset.radio = k;
        radioWrap.appendChild(b);
      });
      bar.appendChild(radioWrap);
      const camLabel = (state.race._pitCam || (window.World3D && World3D.getMode() === 'pit')) ? 'Cam: Pit'
        : (state.race.cameraMode === 'cockpit' ? 'Cam: Cockpit' : 'Cam: Chase');
      bar.appendChild(btn(camLabel, '', () => {
        if (World3D.getMode() === 'pit') return;
        const next = state.race.cameraMode === 'cockpit' ? 'chase' : 'cockpit';
        Race.setCameraMode(state.race, next);
        showRaceChrome(state, actions);
      }));
      bar.appendChild(btn('Pause', '', actions.pauseRace));
    }
    ui.appendChild(bar);

    // Pit compound chooser
    const pitChoose = el('<div class="panel pit-choose hidden" id="pitChoose"></div>');
    ['soft', 'medium', 'hard', 'intermediate', 'wet'].forEach(id => {
      const t = F1DATA.tires[id];
      const b = btn(id.toUpperCase(), '', () => {
        const car = state.race.cars.find(c => c.human);
        if (car) Race.confirmPitCompound(state.race, car, id);
      });
      b.style.borderColor = t.color;
      b.dataset.pitTire = id;
      pitChoose.appendChild(b);
    });
    ui.appendChild(pitChoose);
    // poll visibility lightly via CSS class from boot
    setupTouch(state);
  }

  function setupTouch(state) {
    touch.className = '';
    const pads = el('<div class="tpads"></div>');
    function makePad(pi, side) {
      const p = el('<div class="tpad" data-player="' + pi + '" style="' + (side === 'left' ? 'margin-right:auto' : 'margin-left:auto') + '"></div>');
      const map = { up: 'throttle', left: 'left', brake: 'brake', right: 'right' };
      ['up', 'left', 'brake', 'right'].forEach(k => {
        const b = document.createElement('button');
        b.className = k;
        b.textContent = ({ up: '▲', left: '◀', brake: '■', right: '▶' })[k];
        const bind = (v) => {
          const on = (e) => { e.preventDefault(); state.input[pi][map[k]] = v; };
          b.addEventListener('touchstart', on, { passive: false });
          b.addEventListener('touchend', () => { state.input[pi][map[k]] = false; });
          b.addEventListener('mousedown', on);
          b.addEventListener('mouseup', () => { state.input[pi][map[k]] = false; });
          b.addEventListener('mouseleave', () => { state.input[pi][map[k]] = false; });
        };
        bind(true);
        p.appendChild(b);
      });
      return p;
    }
    if (state.numPlayers === 1) {
      pads.appendChild(el('<div></div>'));
      pads.appendChild(makePad(0, 'right'));
    } else {
      pads.appendChild(makePad(0, 'left'));
      pads.appendChild(makePad(1, 'right'));
    }
    touch.appendChild(pads);
  }

  function showPodium(state, actions) {
    const order = state.race.results;
    // 3D ceremony: keep WebGL view, hide all race chrome
    if (state.race && state.race.use3d && window.World3D && World3D.isActive()) {
      clear();
      const v3 = document.getElementById('view3d');
      if (v3) v3.classList.add('active');
      const gc = document.getElementById('game');
      if (gc) { gc.classList.add('hud-overlay'); gc.style.opacity = '0'; }
      state.screen = 'podium';
      if (window.Trophies) Trophies.showPodium3D(state.race, order);
      // results card — keep .podium for suite + Continue/Standings
      const card = el('<div class="panel podium podium-card" id="podiumCard"></div>');
      card.innerHTML = '<h2>Results · ' + state.race.meta.gp + '</h2>';
      const list = el('<div class="podium-list"></div>');
      order.slice(0, 3).forEach((c, i) => {
        const row = el('<div class="podium-row p' + (i + 1) + '"></div>');
        row.textContent = (i + 1) + '. #' + c.number + ' ' + c.name + ' · ' + c.points + ' pts';
        list.appendChild(row);
      });
      card.appendChild(list);
      // Full results table (id=raceResults) — suites + accessibility; compact under the top-3
      const table = el('<table class="stand" id="raceResults"></table>');
      table.innerHTML = '<tr><th>Pos</th><th></th><th>Driver</th><th>Pts</th></tr>';
      order.forEach((c, i) => {
        const tr = document.createElement('tr');
        if (c.human) tr.className = 'human';
        tr.innerHTML = '<td>' + (i + 1) + '</td><td></td><td>#' + c.number + ' ' + c.name + '</td><td>' + c.points + '</td>';
        tr.cells[1].appendChild(logoImg(c.teamId));
        const img = tr.cells[1].querySelector('img');
        if (img) { img.width = 22; img.height = 22; }
        table.appendChild(tr);
      });
      table.style.maxHeight = '160px';
      table.style.overflow = 'auto';
      table.style.fontSize = '12px';
      card.appendChild(table);
      const row = el('<div class="row"></div>');
      row.appendChild(btn('Standings', 'primary', actions.afterRaceStandings));
      row.appendChild(btn('Continue', '', actions.afterRaceStandings));
      card.appendChild(row);
      ui.appendChild(card);
      return;
    }
    const s = screen('Podium', state.race.meta.gp + ' · trophies awarded');
    const pod = el('<div class="podium"></div>');
    [1, 0, 2].forEach((idx) => {
      const c = order[idx];
      if (!c) return;
      const step = el('<div class="step p' + (idx + 1) + '"></div>');
      step.appendChild(logoImg(c.teamId));
      step.appendChild(el('<div class="name">' + (idx + 1) + '. #' + c.number + '</div>'));
      step.appendChild(el('<div class="meta">' + c.name + '</div>'));
      step.appendChild(el('<div class="meta">' + c.points + ' pts</div>'));
      pod.appendChild(step);
    });
    s.appendChild(pod);
    const table = el('<table class="stand" id="raceResults"></table>');
    table.innerHTML = '<tr><th>Pos</th><th></th><th>Driver</th><th>Pts</th></tr>';
    order.slice(0, 10).forEach((c, i) => {
      const tr = document.createElement('tr');
      if (c.human) tr.className = 'human';
      tr.innerHTML = '<td>' + (i + 1) + '</td><td></td><td>#' + c.number + ' ' + c.name + '</td><td>' + c.points + '</td>';
      tr.cells[1].appendChild(logoImg(c.teamId));
      tr.cells[1].querySelector('img').width = 28;
      tr.cells[1].querySelector('img').height = 28;
      table.appendChild(tr);
    });
    s.appendChild(table);
    const row = el('<div class="row"></div>');
    row.appendChild(btn('Standings', 'primary', actions.afterRaceStandings));
    row.appendChild(btn('Continue', '', actions.afterRaceStandings));
    s.appendChild(row);
  }

  function showStandings(state, actions, seasonOver) {
    const s = screen(seasonOver ? 'Final Standings' : 'Championship Standings',
      seasonOver ? '' : ('First to ' + WINS_TO_END_SEASON + ' wins ends the season · now ' + (state.humanWins || 0)));
    const drivers = Object.keys(state.driverPoints || {}).map(id => {
      const info = (function () {
        for (const t of F1DATA.teams) {
          const d = t.drivers.find(x => x.id === id);
          if (d) return { d, t };
        }
      })();
      return { id, name: info.d.name, number: info.d.number, teamId: info.t.id, team: info.t.name, pts: state.driverPoints[id] || 0, wins: (state.driverWins || {})[id] || 0 };
    }).sort((a, b) => b.pts - a.pts || b.wins - a.wins);
    const table = el('<table class="stand" id="standingsTable"></table>');
    table.innerHTML = '<tr><th>#</th><th></th><th>Driver</th><th>Wins</th><th>Pts</th></tr>';
    drivers.forEach((d, i) => {
      const tr = document.createElement('tr');
      const human = state.players.some(p => p.driverId === d.id);
      if (human) tr.className = 'human';
      tr.innerHTML = '<td>' + (i + 1) + '</td><td></td><td>#' + d.number + ' ' + d.name + '</td><td>' + d.wins + '</td><td>' + d.pts + '</td>';
      tr.cells[1].appendChild(logoImg(d.teamId));
      const img = tr.cells[1].querySelector('img');
      img.width = 28; img.height = 28;
      table.appendChild(tr);
    });
    s.appendChild(table);

    // constructors
    const ct = {};
    drivers.forEach(d => { ct[d.teamId] = ct[d.teamId] || { teamId: d.teamId, name: d.team, pts: 0 }; ct[d.teamId].pts += d.pts; });
    const constructors = Object.values(ct).sort((a, b) => b.pts - a.pts);
    s.appendChild(el('<h2>Constructors</h2>'));
    const table2 = el('<table class="stand" id="constructorsTable"></table>');
    table2.innerHTML = '<tr><th>#</th><th></th><th>Team</th><th>Pts</th></tr>';
    constructors.forEach((t, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + (i + 1) + '</td><td></td><td>' + t.name + '</td><td>' + t.pts + '</td>';
      tr.cells[1].appendChild(logoImg(t.teamId));
      const img = tr.cells[1].querySelector('img');
      img.width = 28; img.height = 28;
      table2.appendChild(tr);
    });
    s.appendChild(table2);

    const row = el('<div class="row"></div>');
    if (seasonOver) {
      const champ = drivers[0];
      const humanChamp = state.players.some(p => p.driverId === champ.id);
      s.insertBefore(el('<p class="sub" id="seasonResult">' + (humanChamp
        ? 'Champion! ' + champ.name + ' takes the title — celebration time!'
        : 'Good racing! ' + champ.name + ' is World Champion. Kind try-again — another season?') + '</p>'), table);
      row.appendChild(btn('New Season', 'primary', actions.newGame));
      row.appendChild(btn('Title', '', actions.toTitle));
    } else {
      row.appendChild(btn('Next GP', 'primary', actions.toCalendar));
      row.appendChild(btn('Title', '', actions.toTitle));
    }
    s.appendChild(row);
  }

  function syncRaceChrome(state, actions) {
    if (!state || !state.race || state.screen !== 'race') return;
    const raceLive = !state.race.finished && (state.race.running || state.race.lights > 0 || state.race.time > 0);
    const bar = document.getElementById('raceBar');
    if (!bar) return;
    // Strip leftover Start / menu buttons once the race is live
    if (raceLive) {
      Array.from(bar.querySelectorAll('button')).forEach(b => {
        const t = (b.textContent || '').trim();
        if (t === 'Start' || t === 'Race!' || t === 'Back') b.remove();
      });
      // Ensure race HUD controls exist
      if (!bar.querySelector('#btnRadio') && !bar.querySelector('[data-radio]')) {
        showRaceChrome(state, actions);
      }
    }
  }

  return {
    showTitle, showPlayers, showTeamPick, showDriverPick, showCalendar, showTires, showGrid,

    tcamBall.position.set(0, 1.32, -0.35); g.add(tcamBall);

    g.userData.carId = car.id;
    g.userData.bodyMat = bodyMat;
    return g;
  }

  function buildCockpitOverlay() {

    const nose = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.14, 0.95, 14), shoulderMat);
    nose.rotation.x = Math.PI / 2;
    nose.position.set(0, -0.45, -2.05);
    g.add(nose);
    const noseTip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.32, 12), carbon);

    noseTip.position.set(0, -0.45, -2.6);

    // Front wing elements
    const fw = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.028, 0.2), carbon);
    fw.position.set(0, -0.66, -2.45);

    const fw2 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.022, 0.12), carbon);
    fw2.position.set(0, -0.60, -2.3);
    g.add(fw2);
    const fw3 = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.018, 0.08), carbon);

    [-1, 1].forEach(s => {
      const ep = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.18, 0.32), shoulderMat);

    // Front wheels visible left/right
    const tireGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.16, 14);
    tireGeo.rotateZ(Math.PI / 2);

    // Halo mirror mounts / upper body hints
