  function addSponsorBoard(group, x, y, z, ang, text, color) {
    const col = color || 0x1a2040;
    const postMat = new THREE.MeshStandardMaterial({ color: 0x2a2a30, metalness: 0.35, roughness: 0.55 });
    // two posts + base so board never floats
    const postH = Math.max(1.2, y + 0.15);
    [-1, 1].forEach(s => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, postH, 6), postMat);
      post.position.set(
        x + Math.cos(ang) * s * 2.5,
        postH / 2,
        z + Math.sin(ang) * s * 2.5
      );
      group.add(post);
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.14, 0.7), postMat);
      base.position.set(post.position.x, 0.07, post.position.z);
      group.add(base);
    });
    const c = document.createElement('canvas');
    c.width = 256; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#' + col.toString(16).padStart(6, '0');
    ctx.fillRect(0, 0, 256, 64);
    ctx.fillStyle = '#ffd100';
    ctx.fillRect(0, 0, 256, 8);
    ctx.fillRect(0, 56, 256, 8);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(String(text || 'GRIDONE'), 128, 40);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace || THREE.sRGBEncoding;
    const boardMat = new THREE.MeshStandardMaterial({
      map: tex, color: 0xffffff, roughness: 0.55, metalness: 0.1,
      emissive: 0x111111, emissiveIntensity: 0.15
    });
    const board = new THREE.Mesh(new THREE.BoxGeometry(6.4, 1.5, 0.22), boardMat);
    board.position.set(x, y, z); board.rotation.y = -ang;
    group.add(board);
    // Backing plate so reverse view is dark, not a washed white plane
    const back = new THREE.Mesh(new THREE.BoxGeometry(6.4, 1.5, 0.05),
      new THREE.MeshStandardMaterial({ color: 0x151518, roughness: 0.8 }));
    back.position.set(
      x - Math.sin(ang) * 0.14,
      y,
      z + Math.cos(ang) * 0.14
    );
    back.rotation.y = -ang;
    group.add(back);
  }

  function buildTrackRibbon(track, trackId) {
    const group = new THREE.Group();
    group.name = 'track';
    const half = track.halfWidth;
    const pts = track.pts;
    const low = preferLow();

    // Ground plane with grass texture (Lambert avoids ACES washout)
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(track.worldSize * 2.4, track.worldSize * 2.4),
      new THREE.MeshLambertMaterial({ map: grassTex, color: 0x3a5540 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.08;
    ground.receiveShadow = true;
    group.add(ground);

    // Distant hills + treeline silhouette on horizon
    const hillCols = [0x1a2e20, 0x203428, 0x162818, 0x243830, 0x1e3224];
    const hillN = low ? 8 : 14;
    for (let h = 0; h < hillN; h++) {
      const ang = (h / hillN) * Math.PI * 2 + 0.15;
      const dist = track.worldSize * (0.52 + (h % 5) * 0.06);
      const hill = new THREE.Mesh(
        new THREE.SphereGeometry(200 + (h % 6) * 70, low ? 8 : 14, low ? 6 : 9),
        new THREE.MeshBasicMaterial({ color: hillCols[h % hillCols.length], fog: true })
      );
      hill.scale.set(2.2 + (h % 3) * 0.55, 0.38 + (h % 5) * 0.08, 1.9 + (h % 2) * 0.4);
      hill.position.set(Math.cos(ang) * dist, 18 + (h % 4) * 8, Math.sin(ang) * dist);
      group.add(hill);
    }
    // Soft treeline band — grounded canopy mounds (not floating green slabs)
    const treeLineN = low ? 18 : 32;
    for (let t = 0; t < treeLineN; t++) {
      const ang = (t / treeLineN) * Math.PI * 2 + 0.05;
      const dist = track.worldSize * 0.64;
      const h = 22 + (t % 5) * 6;
      const tl = new THREE.Mesh(
        new THREE.SphereGeometry(55 + (t % 4) * 18, low ? 6 : 10, low ? 5 : 8),
        new THREE.MeshBasicMaterial({ color: 0x0e2818, fog: true })
      );
      tl.scale.set(2.4 + (t % 3) * 0.4, 0.55 + (t % 4) * 0.08, 1.2);
      tl.position.set(Math.cos(ang) * dist, h * 0.35, Math.sin(ang) * dist);
      group.add(tl);
    }

    // Street vs permanent circuit flags
    const tid = trackId || (track.meta && track.meta.id) || track.id || '';
    const isStreet = /monaco|singapore|vegas|lasvegas|baku|jeddah|miami/i.test(tid);
    group.userData.isStreet = isStreet;

    if (isStreet) {
      // window facade texture
      const wc = document.createElement('canvas'); wc.width = 64; wc.height = 128;
      const wctx = wc.getContext('2d');
      wctx.fillStyle = '#2a3340'; wctx.fillRect(0, 0, 64, 128);
      for (let wy = 4; wy < 120; wy += 10) for (let wx = 4; wx < 60; wx += 10) {
        wctx.fillStyle = (Math.random() > 0.35) ? '#d8e6ff' : '#1a222c';
        wctx.fillRect(wx, wy, 6, 7);
      }
      const winTex = new THREE.CanvasTexture(wc);
      winTex.wrapS = winTex.wrapT = THREE.RepeatWrapping;
      const bmat = [
        new THREE.MeshStandardMaterial({ map: winTex, color: 0x99aabb, roughness: 0.55, metalness: 0.35, envMap: envMap || undefined }),
        new THREE.MeshStandardMaterial({ map: winTex, color: 0xb0c0d0, roughness: 0.45, metalness: 0.4, envMap: envMap || undefined }),
        new THREE.MeshStandardMaterial({ map: winTex, color: 0x8899aa, roughness: 0.65, metalness: 0.25 }),
        new THREE.MeshStandardMaterial({ color: 0xc4b8a0, roughness: 0.75, metalness: 0.1 }), // mediterranean plaster
        new THREE.MeshStandardMaterial({ color: 0xd8cfc0, roughness: 0.8, metalness: 0.05 })
      ];
      bmat.forEach((m, mi) => { if (m.map) m.map.repeat.set(2 + (mi % 3), 4 + (mi % 3)); });
      // dense buildings BOTH sides, tight to barriers
      const bCount = low ? 70 : 150;
      for (let b = 0; b < bCount; b++) {
        const i = Math.floor((b / bCount) * pts.length) % pts.length;
        const p = pts[i], q = pts[(i + 1) % pts.length];
        const ang = Math.atan2(q.y - p.y, q.x - p.x);
        const side = (b % 2) ? 1 : -1;
        const h = 8 + (b % 11) * 3.5;
        const bw = 5 + (b % 4) * 1.8;
        const bd = 5 + (b % 3) * 1.5;
        const building = new THREE.Mesh(new THREE.BoxGeometry(bw, h, bd), bmat[b % bmat.length]);
        const dist = half + 16 + (b % 4) * 1.8; // set back ≥12m from edge
        building.position.set(
          p.x + Math.sin(ang) * side * dist,
          h / 2,
          p.y - Math.cos(ang) * side * dist
        );
        building.rotation.y = -ang;
        building.castShadow = !low;
        group.add(building);
      }
      // second ring of lower buildings to kill open grass gaps
      for (let b = 0; b < (low ? 40 : 80); b++) {
        const i = Math.floor((b / (low ? 40 : 80)) * pts.length) % pts.length;
        const p = pts[i], q = pts[(i + 1) % pts.length];
        const ang = Math.atan2(q.y - p.y, q.x - p.x);
        const side = (b % 2) ? 1 : -1;
        const h = 5 + (b % 7) * 2.2;
        const building = new THREE.Mesh(new THREE.BoxGeometry(6, h, 5), bmat[(b + 2) % bmat.length]);
        const dist = half + 24 + (b % 4) * 2.5;
        building.position.set(
          p.x + Math.sin(ang) * side * dist, h / 2,
          p.y - Math.cos(ang) * side * dist
        );
        building.rotation.y = -ang;
        group.add(building);
      }
      // Monaco / harbor water on one side
      if (/monaco|singapore|miami|abu-dhabi|montreal/i.test(tid)) {
        const waterMat = new THREE.MeshStandardMaterial({
          color: 0x1a6a9a, roughness: 0.15, metalness: 0.55, envMap: envMap || undefined, envMapIntensity: 0.9
        });
        for (let w = 0; w < (low ? 10 : 18); w++) {
          const i = (w * 9 + 3) % pts.length;
          const p = pts[i], q = pts[(i + 2) % pts.length];
          const ang = Math.atan2(q.y - p.y, q.x - p.x);
          const side = -1; // harbor side
          const patch = new THREE.Mesh(new THREE.BoxGeometry(28, 0.08, 18), waterMat);
          patch.position.set(
            p.x + Math.sin(ang) * side * (half + 22),
            -0.04,
            p.y - Math.cos(ang) * side * (half + 22)
          );
          patch.rotation.y = -ang;
          group.add(patch);
        }
        // quay wall
        const quayMat = new THREE.MeshStandardMaterial({ color: 0x6a6e74, roughness: 0.7, metalness: 0.2 });
        for (let w = 0; w < (low ? 8 : 14); w++) {
          const i = (w * 9 + 3) % pts.length;
          const p = pts[i], q = pts[(i + 2) % pts.length];
          const ang = Math.atan2(q.y - p.y, q.x - p.x);
          const wall = new THREE.Mesh(new THREE.BoxGeometry(22, 1.2, 0.5), quayMat);
          wall.position.set(
            p.x + Math.sin(ang) * -1 * (half + 12),
            0.5,
            p.y - Math.cos(ang) * -1 * (half + 12)
          );
          wall.rotation.y = -ang;
          group.add(wall);
        }
      }
    }

    // Concrete / plaza apron along track (hides grass in chase view)
    {
      const plazaMat = new THREE.MeshStandardMaterial({ color: isStreet ? 0x6a6e72 : 0x4a5348, roughness: 0.95, metalness: 0.05 });
      const apronW = isStreet ? 11 : 2.2;
      const pStep = preferLow() ? 4 : 2;
      for (let i = 0; i < pts.length; i += pStep) {
        const a = pts[i], b = pts[(i + pStep) % pts.length];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        const ang = Math.atan2(dy, dx);
        const midX = (a.x + b.x) / 2, midZ = (a.y + b.y) / 2;
        [-1, 1].forEach(side => {
          const apron = new THREE.Mesh(new THREE.BoxGeometry(len * 1.05, 0.06, apronW), plazaMat);
          apron.position.set(midX + Math.sin(ang) * side * (half + apronW * 0.45), 0.01, midZ - Math.cos(ang) * side * (half + apronW * 0.45));
          apron.rotation.y = -ang;
          group.add(apron);
        });
      }
    }

    const ashMat = new THREE.MeshStandardMaterial({
      map: asphaltTex, color: 0x2a2e36, roughness: 0.97, metalness: 0.05
    });
    const kerbMat = new THREE.MeshStandardMaterial({ map: kerbTex, roughness: 0.65, metalness: 0.1 });
    const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 });
    const runoffMat = new THREE.MeshStandardMaterial({ map: runoffTex || undefined, color: 0x2a4a30, roughness: 1 });
    const gravelMat = new THREE.MeshStandardMaterial({ map: gravelTex || undefined, color: 0xb8a878, roughness: 1 });
    const armcoMat = new THREE.MeshStandardMaterial({ color: 0xc0c4c8, metalness: 0.75, roughness: 0.35, envMap: envMap || undefined });

    const step = low ? 4 : 2;
    const sponsors = ['AEROX', 'NEXLUBE', 'VOLTICA', 'PACEPRO', 'GRIDONE', 'TURBOTEK', 'SKYLINE RP', 'CIRCUIT X'];
    let sponsorIdx = 0;

    for (let i = 0; i < pts.length; i += step) {
      const a = pts[i], b = pts[(i + step) % pts.length];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const ang = Math.atan2(dy, dx);
      const midX = (a.x + b.x) / 2, midZ = (a.y + b.y) / 2;
      // asphalt
      const road = new THREE.Mesh(new THREE.BoxGeometry(len * 1.08, 0.1, half * 2), ashMat);
      road.position.set(midX, 0.05, midZ);
      road.rotation.y = -ang;
      road.receiveShadow = true;
      group.add(road);
      // white edge lines every segment
      [-1, 1].forEach(side => {
        const line = new THREE.Mesh(new THREE.BoxGeometry(len * 1.02, 0.12, 0.28), lineMat);
        line.position.set(midX + Math.sin(ang) * side * (half - 0.2), 0.11, midZ - Math.cos(ang) * side * (half - 0.2));
        line.rotation.y = -ang;
        group.add(line);
      });
      // dashed center line
      if (i % (step * 2) === 0) {
        const mid = new THREE.Mesh(new THREE.BoxGeometry(len * 0.35, 0.12, 0.16), lineMat);
        mid.position.set(midX, 0.11, midZ);
        mid.rotation.y = -ang;
        group.add(mid);
      }
      // kerbs — taller sausage kerbs at corners, flatter on straights
      {
        const c = pts[(i + step * 3) % pts.length];
        const ang2 = Math.atan2(c.y - b.y, c.x - b.x);
        let da = Math.abs(ang2 - ang); if (da > Math.PI) da = Math.PI * 2 - da;
        const isCorner = da > 0.12;
        if (isCorner || i % (step * 3) === 0) {
          const kh = isCorner ? 0.38 : 0.18;
          const kw = isCorner ? 1.05 : 0.7;
          [-1, 1].forEach(side => {
            const k = new THREE.Mesh(new THREE.BoxGeometry(Math.min(len * 1.05, 14), kh, kw), kerbMat);
            k.position.set(midX + Math.sin(ang) * side * (half + kw * 0.55), kh / 2, midZ - Math.cos(ang) * side * (half + kw * 0.55));
            k.rotation.y = -ang;
            k.receiveShadow = true;
            group.add(k);
          });
        }
      }
      // runoff / gravel — skip wide grass runoff on street circuits
      if (!isStreet && i % (step * 2) === 0) {
        const run = new THREE.Mesh(new THREE.BoxGeometry(len * 0.9, 0.04, 4.5), runoffMat);
        run.position.set(midX + Math.sin(ang) * (half + 3.2), 0.02, midZ - Math.cos(ang) * (half + 3.2));
        run.rotation.y = -ang;
        run.receiveShadow = true;
        group.add(run);
        if (i % (step * 6) === 0) {
          const grav = new THREE.Mesh(new THREE.BoxGeometry(len * 0.8, 0.05, 5.5), gravelMat);
          grav.position.set(midX - Math.sin(ang) * (half + 5.5), 0.02, midZ + Math.cos(ang) * (half + 5.5));
          grav.rotation.y = -ang;
          group.add(grav);
        }
      }
      // Armco / barriers — tight to edge on street circuits
      if (i % (step * 2) === 0) {
        const wallDist = isStreet ? (half + 1.5) : (half + 8.5);
        const wallH = isStreet ? 1.15 : 1.0;
        const wall = new THREE.Mesh(new THREE.BoxGeometry(len * 0.95, wallH, isStreet ? 0.35 : 0.2), armcoMat);
        wall.position.set(midX + Math.sin(ang) * wallDist, wallH / 2, midZ - Math.cos(ang) * wallDist);
        wall.rotation.y = -ang;
        group.add(wall);
        // opposite barrier on street circuits
        if (isStreet) {
          const wall2 = wall.clone();
          wall2.position.set(midX - Math.sin(ang) * wallDist, wallH / 2, midZ + Math.cos(ang) * wallDist);
          group.add(wall2);
        }
        if (i % (step * 15) === 0) {
          addSponsorBoard(group,
            midX + Math.sin(ang) * (wallDist + 4.5), 2.2,
            midZ - Math.cos(ang) * (wallDist + 4.5),
            ang, sponsors[sponsorIdx++ % sponsors.length], 0x1a2040);
        }
        // tyre barrier stacks — skip street circuits and near pit entry/exit
        const nearPit = (typeof track.pitEntry === 'number') && (
          Math.abs(i - track.pitEntry) < step * 10 ||
          Math.abs(i - track.pitExit) < step * 10
        );
        if (!isStreet && !nearPit && i % (step * 10) === 0) {
          const tyreMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.95 });
          for (let stack = 0; stack < 3; stack++) {
            for (let col = 0; col < 4; col++) {
              const tyre = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.14, 6, 10), tyreMat);
              tyre.rotation.x = Math.PI / 2;
              tyre.position.set(
                midX + Math.sin(ang) * (half + 5.5) + Math.cos(ang) * (col * 0.7 - 1),
                0.35 + stack * 0.55,
                midZ - Math.cos(ang) * (half + 5.5) + Math.sin(ang) * (col * 0.7 - 1)
              );
              group.add(tyre);
            }
          }
        }
      }
    }

    // Start/finish gantry + lights + grid slots
    const sf = pts[0];
    const sfa = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
    // Start gantry: local Z is track-lateral after rotation.y=-sfa (local X was forward — bug)
    const gantry = new THREE.Group();
    const gantryMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.55, roughness: 0.4 });
    const legX = half + 11; // outside track + runoff + armco (wall at half+8.5)
    const beamY = 9.5;
    [-1, 1].forEach(s => {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.55, beamY + 0.4, 0.55), gantryMat);
      post.position.set(0, (beamY + 0.4) / 2, s * legX);
      gantry.add(post);
      // foot plate so legs don't look floating
      const foot = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.18, 1.8), gantryMat);
      foot.position.set(0, 0.08, s * legX);
      gantry.add(foot);
    });
    const span = legX * 2 + 0.4;
    const beam = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, span), gantryMat);
    beam.position.set(0, beamY, 0);
    gantry.add(beam);
    // short under-beam stays (no long floating rail)
    [-1, 1].forEach(s => {
      const stay = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.55, 0.18), gantryMat);
      stay.position.set(0.2, beamY - 0.35, s * (legX * 0.55));
      gantry.add(stay);
    });
    // 5 start-light pods under the beam, centred over track, clear of cars
    for (let L = 0; L < 5; L++) {
      const pod = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.35, 0.45),
        new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.5, roughness: 0.35 }));
      pod.position.set(0.15, beamY - 0.55, (L - 2) * 1.35);
      gantry.add(pod);
      const light = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10),
        new THREE.MeshStandardMaterial({ color: 0x330000, emissive: 0x220000, roughness: 0.35 }));
      light.position.set(0.15, beamY - 0.85, (L - 2) * 1.35);
      light.name = 'startLight' + L;
      gantry.add(light);
    }
    gantry.position.set(sf.x, 0, sf.y);
    gantry.rotation.y = -sfa;
    group.add(gantry);

    // grid slot markings
    for (let g = 0; g < 10; g++) {
      const slot = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.12, 0.15), lineMat);
      const back = g * 6.5 + 4;
      slot.position.set(sf.x - Math.cos(sfa) * back + Math.sin(sfa) * ((g % 2) ? 2.2 : -2.2), 0.11, sf.y - Math.sin(sfa) * back - Math.cos(sfa) * ((g % 2) ? 2.2 : -2.2));
      slot.rotation.y = -sfa;
      group.add(slot);
    }

    // Pit wall near S/F
    const pitWall = new THREE.Mesh(new THREE.BoxGeometry(60, 1.4, 0.4),
      new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.5, metalness: 0.2 }));
    pitWall.position.set(sf.x + Math.sin(sfa) * (half + 12), 0.7, sf.y - Math.cos(sfa) * (half + 12));
    pitWall.rotation.y = -sfa;
    group.add(pitWall);

    // Grandstands with crowd — closer so chase cam reads stands + crowd
    const standMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 0.9, metalness: 0.05 });
    const standCount = low ? 18 : 36;
    // Prefer bent sections so chase cam (which seeks curvature) sees stands
    const bendIdx = [];
    for (let i = 0; i < pts.length; i += 2) {
      const a = pts[i], b = pts[(i + 3) % pts.length], c = pts[(i + 6) % pts.length];
      const a1 = Math.atan2(b.y - a.y, b.x - a.x), a2 = Math.atan2(c.y - b.y, c.x - b.x);
      let da = Math.abs(a2 - a1); if (da > Math.PI) da = Math.PI * 2 - da;
      if (da > 0.12) bendIdx.push(i);
    }
    for (let k = 0; k < standCount; k++) {
      const si = bendIdx.length
        ? bendIdx[Math.floor((k / standCount) * bendIdx.length) % bendIdx.length]
        : Math.floor((k / standCount) * pts.length) % pts.length;
      const p = pts[si], q = pts[(si + 4) % pts.length];
      const ang = Math.atan2(q.y - p.y, q.x - p.x);
      // depth 7: place so inner face sits just outside barriers (not into track)
      const stand = new THREE.Mesh(new THREE.BoxGeometry(36, 9, 6), standMat);
      const side = (k % 2) ? 1 : -1;
      // Outer face well clear of runoff; never crowds chase FOV between cam and car
      const standDist = half + 28; // ≥12m from edge (inner face ~half+25)
      stand.position.set(
        p.x + Math.sin(ang) * side * standDist,
        4.5,
        p.y - Math.cos(ang) * side * standDist
      );
      stand.rotation.y = -ang;
      stand.castShadow = !low;
      group.add(stand);
      // roof lip + bright fascia so chase reads grandstand (not a grey slab)
      const roof = new THREE.Mesh(new THREE.BoxGeometry(38, 0.35, 7),
        new THREE.MeshStandardMaterial({ color: 0x1a2030, metalness: 0.4, roughness: 0.5 }));
      roof.position.copy(stand.position); roof.position.y = 9.2; roof.rotation.y = -ang;
      group.add(roof);
      const fasciaCols = [0xe80020, 0xffd100, 0x27f4d2, 0xffffff, 0x3671c6, 0xff8000];
      const fascia = new THREE.Mesh(new THREE.BoxGeometry(36, 1.0, 0.35),
        new THREE.MeshStandardMaterial({ color: fasciaCols[k % fasciaCols.length], roughness: 0.45, metalness: 0.2, emissive: fasciaCols[k % fasciaCols.length], emissiveIntensity: 0.2 }));
      fascia.position.set(
        stand.position.x + Math.sin(ang) * side * (-2.8),
        8.0,
        stand.position.z - Math.cos(ang) * side * (-2.8)
      );
      fascia.rotation.y = -ang;
      group.add(fascia);
      // Crowd colour-noise face (reads as packed stands, not a grey slab)
      {
        const cc = document.createElement('canvas');
        cc.width = 128; cc.height = 64;
        const cx = cc.getContext('2d');
        cx.fillStyle = '#2a3038'; cx.fillRect(0, 0, 128, 64);
        const cols = ['#c44', '#48c', '#ec4', '#e8e', '#4c8', '#fff', '#f84', '#88c', '#222'];
        for (let n = 0; n < 900; n++) {
          cx.fillStyle = cols[n % cols.length];
          cx.fillRect((n * 17) % 128, (n * 11) % 64, 2 + (n % 2), 3);
        }
        const crowdFace = new THREE.Mesh(
          new THREE.PlaneGeometry(34, 7),
          new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cc) })
        );
        crowdFace.position.set(
          stand.position.x + Math.sin(ang) * side * (-3.1),
          4.0,
          stand.position.z - Math.cos(ang) * side * (-3.1)
        );
        crowdFace.rotation.y = -ang + (side > 0 ? 0 : Math.PI);
        group.add(crowdFace);
      }
      if (typeof THREE.InstancedMesh !== 'undefined') {
        const crowdGeo = new THREE.PlaneGeometry(0.55, 1.0);
        const crowdMat = new THREE.MeshBasicMaterial({ color: 0xffffff, vertexColors: true, side: THREE.DoubleSide, depthWrite: false });
        const count = low ? 60 : 160;
        const im = new THREE.InstancedMesh(crowdGeo, crowdMat, count);
        const dummy = new THREE.Object3D();
        const colors = [0xe80020, 0x27f4d2, 0xffd100, 0xffffff, 0xff8000, 0x3671c6, 0x64c4ff, 0xff66aa];
        for (let c = 0; c < count; c++) {
          const along = (Math.random() - 0.5) * 38;
          const up = 1.5 + Math.random() * 9;
          const out = (Math.random() - 0.5) * 5;
          dummy.position.set(
            stand.position.x + Math.cos(ang) * along + Math.sin(ang) * side * out,
            up,
            stand.position.z + Math.sin(ang) * along - Math.cos(ang) * side * out
          );
          dummy.rotation.y = -ang + (side > 0 ? 0 : Math.PI);
          dummy.updateMatrix();
          im.setMatrixAt(c, dummy.matrix);
          im.setColorAt(c, new THREE.Color(colors[c % colors.length]));
        }
        im.instanceMatrix.needsUpdate = true;
        if (im.instanceColor) im.instanceColor.needsUpdate = true;
        group.add(im);
      }
    }

    // Trees (instanced) — rounded canopy clusters, not crude cones
    if (!isStreet && typeof THREE.InstancedMesh !== 'undefined') {
      const trunkGeo = new THREE.CylinderGeometry(0.28, 0.42, 3.4, 6);
      const leafGeo = new THREE.IcosahedronGeometry(2.4, 0);
      const trunkMat = new THREE.MeshLambertMaterial({ color: 0x4a3020 });
      const greens = [0x1a4a28, 0x1e5a30, 0x246038, 0x2a6840, 0x145028, 0x0e4020];
      const treeCount = low ? 60 : 110;
      const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
      const leaves = new THREE.InstancedMesh(leafGeo,
        new THREE.MeshLambertMaterial({ color: 0x228b3a }), treeCount * 2);
      const dummy = new THREE.Object3D();
      for (let t = 0; t < treeCount; t++) {
        const i = (t * 7) % pts.length;
        const p = pts[i], q = pts[(i + 2) % pts.length];
        const ang = Math.atan2(q.y - p.y, q.x - p.x);
        const side = (t % 2) ? 1 : -1;
        const dist = half + 22 + (t % 7) * 4.0 + (t % 3);
        const x = p.x + Math.sin(ang) * side * dist;
        const z = p.y - Math.cos(ang) * side * dist;
        const sc = 1.0 + (t % 6) * 0.18;
        dummy.position.set(x, 1.7 * sc, z); dummy.scale.set(sc, sc, sc); dummy.rotation.set(0,0,0); dummy.updateMatrix();
        trunks.setMatrixAt(t, dummy.matrix);
        // two overlapping canopy blobs for volume
        dummy.position.set(x, 4.6 * sc, z); dummy.scale.set(sc * 1.05, sc * 0.9, sc * 1.05); dummy.updateMatrix();
        leaves.setMatrixAt(t * 2, dummy.matrix);
        leaves.setColorAt(t * 2, new THREE.Color(greens[t % greens.length]));
        dummy.position.set(x + (t % 3) * 0.3, 5.8 * sc, z - (t % 2) * 0.25);
        dummy.scale.set(sc * 0.75, sc * 0.7, sc * 0.75); dummy.updateMatrix();
        leaves.setMatrixAt(t * 2 + 1, dummy.matrix);
        leaves.setColorAt(t * 2 + 1, new THREE.Color(greens[(t + 2) % greens.length]));
      }
      trunks.instanceMatrix.needsUpdate = true;
      leaves.instanceMatrix.needsUpdate = true;
      if (leaves.instanceColor) leaves.instanceColor.needsUpdate = true;
      group.add(trunks, leaves);
    }

    // Marshal posts
    for (let m = 0; m < 8; m++) {
      const i = ((m + 1) * Math.floor(pts.length / 9)) % pts.length;
      const p = pts[i], q = pts[(i + 1) % pts.length];
      const ang = Math.atan2(q.y - p.y, q.x - p.x);
      const post = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 1.2),
        new THREE.MeshStandardMaterial({ color: 0xff6600, roughness: 0.7 }));
      post.position.set(p.x + Math.sin(ang) * (half + 12), 1.1, p.y - Math.cos(ang) * (half + 12));
      group.add(post);
    }

    return group;
  }

  function buildPitLane(track, teamColor) {
    const g = new THREE.Group();
    g.name = 'pit';
    const half = track.halfWidth;
    const nPts = [];
    const n = track.pts.length;
    let i0 = track.pitEntry, i1 = track.pitExit;
    if (i1 < i0) i1 += n;
    for (let i = i0; i <= i1; i += preferLow() ? 2 : 1) {
      const p = track.pts[i % n];
      const q = track.pts[(i + 1) % n];
      const ang = Math.atan2(q.y - p.y, q.x - p.x);
      nPts.push({ x: p.x + Math.sin(ang) * (half + 10), y: p.y - Math.cos(ang) * (half + 10), ang });
    }
    if (nPts.length < 2) {
      const entry = track.pts[track.pitEntry % n];
      nPts.push({ x: entry.x + half + 10, y: entry.y, ang: 0 });
      nPts.push({ x: entry.x + half + 30, y: entry.y + 20, ang: 0 });
    }
    const pitMat = new THREE.MeshStandardMaterial({ color: 0x3a3f48, roughness: 0.9, map: asphaltTex });
    for (let i = 0; i < nPts.length - 1; i++) {
      const a = nPts[i], b = nPts[i + 1];
      const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      const road = new THREE.Mesh(new THREE.BoxGeometry(len, 0.07, 7), pitMat);
      road.position.set((a.x + b.x) / 2, 0.035, (a.y + b.y) / 2);
      road.rotation.y = -ang;
      g.add(road);
    }

    garageMeshes = [];
    // box near pit entry so stop + garage sit where the car actually boxes
    const mid = nPts[Math.min(2, nPts.length - 1)] || nPts[0];
    const teamCols = ['#FF8000', '#27F4D2', '#E80020', '#3671C6', '#64C4FF', '#00665E', '#0090FF', '#F50537'];
    for (let k = 0; k < 8; k++) {
      const col = new THREE.Color(teamCols[k]);
      const garage = new THREE.Group();
      // open-front garage: floor, back, sides, roof
      const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.15, 8),
        new THREE.MeshStandardMaterial({ color: 0x222830, roughness: 0.8 }));
      floor.position.y = 0.05;
      const back = new THREE.Mesh(new THREE.BoxGeometry(9, 4.5, 0.3),
        new THREE.MeshStandardMaterial({ color: 0x1a2030, roughness: 0.7 }));
      back.position.set(0, 2.25, -4);
      const sideL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4.5, 8),
        new THREE.MeshStandardMaterial({ color: 0x1a2030, roughness: 0.7 }));
      sideL.position.set(-4.5, 2.25, 0);
      const sideR = sideL.clone(); sideR.position.x = 4.5;
      const roof = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.25, 8.2),
        new THREE.MeshStandardMaterial({ color: 0x151a24, roughness: 0.6 }));
      roof.position.y = 4.6;
      // team banners on open face + fascia
      const bannerMat = new THREE.MeshStandardMaterial({
        color: col, roughness: 0.4, metalness: 0.25, emissive: col, emissiveIntensity: 0.35
      });
      const banner = new THREE.Mesh(new THREE.BoxGeometry(8.6, 1.1, 0.25), bannerMat);
      banner.position.set(0, 3.9, 4.0);
      const fascia = new THREE.Mesh(new THREE.BoxGeometry(9.0, 0.7, 0.2), bannerMat);
      fascia.position.set(0, 4.35, 0.0);
      // back-wall team stripe
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(8.0, 1.6, 0.15), bannerMat);
      stripe.position.set(0, 2.4, -3.85);
      // interior light
      const lamp = new THREE.PointLight(0xfff0dd, preferLow() ? 0.4 : 0.9, 14);
      lamp.position.set(0, 4.2, 0);
      garage.add(floor, back, sideL, sideR, roof, banner, fascia, stripe, lamp);
      // line garages along pit lane, open face toward track
      const along = (k - 3.5) * 10;
      garage.position.set(
        mid.x + Math.sin(mid.ang || 0) * 12 + Math.cos(mid.ang || 0) * along,
        0,
        mid.y - Math.cos(mid.ang || 0) * 12 + Math.sin(mid.ang || 0) * along
      );
      // open face (+local Z) toward track = opposite pit-outward
      garage.rotation.y = -(mid.ang || 0);
      g.add(garage);
      garageMeshes.push(garage);
    }

    // Pit box marking (white rectangle + team stripe on ground)
    {
      const boxMark = new THREE.Group();
      const outline = new THREE.Mesh(
        new THREE.PlaneGeometry(5.2, 12.5),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, depthWrite: false })
      );
      outline.rotation.x = -Math.PI / 2;
      outline.position.y = 0.06;
      const inner = new THREE.Mesh(
        new THREE.PlaneGeometry(4.6, 11.6),
        new THREE.MeshBasicMaterial({ color: 0x2a3038, transparent: true, opacity: 0.55, depthWrite: false })
      );
      inner.rotation.x = -Math.PI / 2;
      inner.position.y = 0.07;
      const stripe = new THREE.Mesh(
        new THREE.PlaneGeometry(0.35, 11.6),
        new THREE.MeshBasicMaterial({
          color: teamColor ? new THREE.Color(teamColor) : 0xff8000,
          transparent: true, opacity: 0.9, depthWrite: false
        })
      );
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(-1.8, 0.08, 0);
      boxMark.add(outline, inner, stripe);
      // place at crewAnchor (computed below) — temp; reposition after anchor set
      g.userData._boxMark = boxMark;
      g.add(boxMark);
    }

    // Crew 15: 3/wheel (gun, off, on) ×4 = 12, front jack, rear jack, lollipop
    crew = [];
    jacks = []; guns = [];
    const outX = Math.sin(mid.ang || 0), outZ = -(Math.cos(mid.ang || 0));
    // Park box parallel to pit lane IN FRONT of garage (not inside)
    const crewAnchor = garageMeshes[0]
      ? garageMeshes[0].position.clone()
      : new THREE.Vector3(mid.x, 0, mid.y);
    if (garageMeshes[0]) {
      // garage centre is ~8m out from pit lane; place box 5.5m toward track = clear of garage mouth
      crewAnchor.x = garageMeshes[0].position.x - outX * 9.5;
      crewAnchor.z = garageMeshes[0].position.z - outZ * 9.5;
    } else {
      crewAnchor.x = mid.x; crewAnchor.z = mid.y;
    }
    crewAnchor.ang = mid.ang || 0;
    if (g.userData._boxMark) {
      const bm = g.userData._boxMark;
      bm.position.set(crewAnchor.x, 0, crewAnchor.z);
      bm.rotation.y = -(mid.ang || 0);
    }
    const tc = teamColor ? new THREE.Color(teamColor) : new THREE.Color(0xff8000);
    // Match body papaya compensation so suits don't read yellow
    {
      const hsl = { h: 0, s: 0, l: 0 }; tc.getHSL(hsl);
      if (hsl.h > 0.03 && hsl.h < 0.14 && hsl.s > 0.45) {
        hsl.h = Math.max(0.028, hsl.h - 0.045);
        hsl.s = Math.min(1, hsl.s * 1.2);
        hsl.l = Math.min(0.45, hsl.l * 0.9);
        tc.setHSL(hsl.h, hsl.s, hsl.l);
      }
    }
    const suitMat = new THREE.MeshLambertMaterial({ color: tc });
    const whiteSuit = new THREE.MeshLambertMaterial({ color: 0xf2f2f2 });
    const helmMat = new THREE.MeshLambertMaterial({ color: tc });
    const helmWhite = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.4, metalness: 0.15 });
    // offsets: [lateral, along] in car-local (car +Z forward along pit lane)
    // 3 per corner: gun (closest), tyre-off, tyre-on
    const roles = [
      // FL: gun, off, on
      [-1.45, 1.45], [-2.15, 1.55], [-2.15, 1.15],
      // FR
      [1.45, 1.45], [2.15, 1.55], [2.15, 1.15],
      // RL
      [-1.45, -1.55], [-2.15, -1.65], [-2.15, -1.25],
      // RR
      [1.45, -1.55], [2.15, -1.65], [2.15, -1.25],
      // front jack, rear jack, lollipop
      [0.0, 3.05], [0.0, -3.05], [-2.6, 3.5]
    ];
    const gunIdx = [0, 3, 6, 9];
    const lolliIdx = 14;
    for (let c = 0; c < roles.length; c++) {
      const person = new THREE.Group();
      const isLolli = c === lolliIdx;
      const bodyGeo = THREE.CapsuleGeometry
        ? new THREE.CapsuleGeometry(0.11, 0.40, 3, 6)
        : new THREE.CylinderGeometry(0.11, 0.11, 0.72, 6);
      const body = new THREE.Mesh(bodyGeo, isLolli ? whiteSuit : suitMat);
      body.position.y = 0.52;
      const helm = new THREE.Mesh(new THREE.SphereGeometry(0.115, 8, 6), isLolli ? helmWhite : helmMat);
      helm.position.y = 0.98;
      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 0.06),
        new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8, roughness: 0.2 }));
      visor.position.set(0, 0.98, 0.09);
      [-1, 1].forEach(s => {
        const arm = new THREE.Mesh(
          THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.035, 0.22, 2, 5)
            : new THREE.CylinderGeometry(0.035, 0.035, 0.32, 5),
          isLolli ? whiteSuit : suitMat);
        arm.position.set(s * 0.18, 0.62, 0.02);
        arm.rotation.z = s * 0.55;
        person.add(arm);
      });
      person.add(body, helm, visor);
      if (gunIdx.indexOf(c) >= 0) {
        const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.35, 6),
          new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.35 }));
        gun.rotation.z = Math.PI / 2;
        gun.position.set(roles[c][0] > 0 ? -0.25 : 0.25, 0.7, 0.15);
        person.add(gun);
      }
      if (isLolli) {
        const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.4, 5),
          new THREE.MeshStandardMaterial({ color: 0x222222 }));
        stick.position.set(0.2, 1.3, 0);
        const sign = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.05),
          new THREE.MeshStandardMaterial({ color: 0xd8181f, emissive: 0x440000 }));
        sign.position.set(0.2, 2.05, 0);
        person.add(stick, sign);
      }
      // spare tyre for off/on crew (quick swap visual)
      if ([1, 2, 4, 5, 7, 8, 10, 11].indexOf(c) >= 0) {
        const spare = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.08, 6, 12),
          new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 }));
        spare.rotation.y = Math.PI / 2;
        spare.position.set(roles[c][0] > 0 ? -0.2 : 0.2, 0.35, 0.25);
        person.add(spare);
        person.userData.spareTire = spare;
      }
      person.position.set(crewAnchor.x + roles[c][0], 0, crewAnchor.z + roles[c][1]);
      person.userData.roleOffset = roles[c];
      person.userData.roleKind = gunIdx.indexOf(c) >= 0 ? 'gun' : (c === 12 || c === 13 ? 'jack' : (isLolli ? 'lolli' : 'tire'));
      person.visible = false;
      g.add(person);
      crew.push(person);
    }
    // Jacks
    for (let j = 0; j < 2; j++) {
      const jack = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.4),
        new THREE.MeshStandardMaterial({ color: 0xffd100, metalness: 0.5, roughness: 0.4 }));
      jack.position.set(crewAnchor.x, 0.2, crewAnchor.z + (j ? -3.0 : 3.0));
      jack.visible = false;
      g.add(jack);
      jacks.push(jack);
    }
    // Wheel guns
    for (let w = 0; w < 4; w++) {
      const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.5, 6),
        new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.3 }));
      gun.rotation.z = Math.PI / 2;
      gun.position.set(crewAnchor.x + (w % 2 ? 1.4 : -1.4), 0.5, crewAnchor.z + (w < 2 ? 1.5 : -1.5));
      gun.visible = false;
      g.add(gun);
      guns.push(gun);
    }
    // Release light on a thin pole (reads as a light, not a floating green slab)
    releaseLight = new THREE.Group();
    const rlPole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 2.4, 6),
      new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.5, roughness: 0.4 }));
    rlPole.position.y = 1.2;
    const rlLamp = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0x880000, emissive: 0x330000, roughness: 0.35 }));
    rlLamp.position.y = 2.45;
    rlLamp.name = 'releaseLamp';
    releaseLight.add(rlPole, rlLamp);
    releaseLight.position.set(crewAnchor.x + 3.2, 0, crewAnchor.z + 2.2);
    releaseLight.userData.lamp = rlLamp;
    releaseLight.visible = false;
    g.add(releaseLight);

    g.userData.pitPath = nPts;
    g.userData.boxPos = crewAnchor;
    g.userData.boxAng = mid.ang || 0;
    return g;
  }

  function buildSky(wet) {
    const g = new THREE.Group();
    // Full sphere sky: BackSide, no depth/fog, gradient from camera-centred world direction
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        topColor: { value: new THREE.Color(wet ? 0x5a6a7c : 0x4a8ec8) },
        midColor: { value: new THREE.Color(wet ? 0x9aa8b4 : 0x9ac6e8) },
        botColor: { value: new THREE.Color(wet ? 0xc8d0d8 : 0xdceaf4) }
      },
      vertexShader: [
        'varying vec3 vDir;',
        'void main(){',
        '  vDir = normalize(position);',
        '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        '  gl_Position = projectionMatrix * mv;',
        '  gl_Position.z = gl_Position.w * 0.999;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform vec3 topColor, midColor, botColor;',
        'varying vec3 vDir;',
        'void main(){',
        '  float h = clamp(vDir.y, -1.0, 1.0);',
        '  vec3 col = mix(botColor, midColor, smoothstep(-0.05, 0.35, h));',
        '  col = mix(col, topColor, smoothstep(0.25, 0.95, h));',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n')
    });
    // Radius well inside camera.far (9000) so it never clips; full sphere = no rim
    const skyGeo = new THREE.SphereGeometry(4000, 48, 32);
    skyDome = new THREE.Mesh(skyGeo, skyMat);
    skyDome.frustumCulled = false;
    skyDome.renderOrder = -1000;
    g.add(skyDome);

    // No sun sprite — directional light alone (avoids bright smear)
    return g;
  }

  function init(race) {
    if (!hasTHREE()) return false;
    raceRef = race;
    if (!renderer) makeRenderer();
    if (!renderer) return false;
    scene = new THREE.Scene();
    const wet = race.weather === 'wet';
    scene.background = new THREE.Color(wet ? 0x9aa8b4 : 0x9ac6e8);
    // Distance haze matching pale horizon (not green-grey wash)
    if (fogOn) scene.fog = new THREE.Fog(wet ? 0x9aa8b4 : 0xa8c4dc, preferLow() ? 500 : 900, preferLow() ? 2800 : 5200);

    camera = new THREE.PerspectiveCamera(55, 1180 / 600, 0.12, 9000);
    camera.position.set(0, 8, 20);
    scene.add(camera); // required so camera-child cockpit HUD is rendered
    chasePos = new THREE.Vector3();
    chaseLook = new THREE.Vector3();

    sun = new THREE.DirectionalLight(0xffe8c8, 2.4);
    sun.position.set(160, 280, 110);
    sun.castShadow = renderer.shadowMap.enabled;
    if (sun.castShadow) {
      sun.shadow.mapSize.set(preferLow() ? 512 : 1536, preferLow() ? 512 : 1536);
      sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
      sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
      sun.shadow.camera.near = 5; sun.shadow.camera.far = 220;
      sun.shadow.bias = -0.00025;
      sun.shadow.normalBias = 0.02;
    }
    scene.add(sun);
    if (sun.target) scene.add(sun.target);
    scene.add(new THREE.AmbientLight(0x6a88b0, 0.22));
    scene.add(new THREE.HemisphereLight(0x9ec8ff, 0x3a5a38, 0.55));

    scene.add(buildSky(wet));

    trackMesh = buildTrackRibbon(race.track, race.meta && race.meta.id);
    scene.add(trackMesh);
    const human = race.cars.find(c => c.human);
    pitGroup = buildPitLane(race.track, human && human.teamColors && human.teamColors.primary);
    scene.add(pitGroup);

    carMeshes = race.cars.map(c => {
      const m = buildCarMesh(c);
      scene.add(m);
      return m;
    });

    cockpitParts = buildCockpitOverlay();
    scene.add(cockpitParts);

    fxGroup = new THREE.Group();
    scene.add(fxGroup);
    sparks = []; smoke = [];

    active = true;
    canvas.classList.add('active');
    document.getElementById('game') && document.getElementById('game').classList.add('hud-overlay');
    mode = 'chase';
    return true;
  }

  function dispose() {
    active = false;
    if (canvas) canvas.classList.remove('active');
    const g = document.getElementById('game');
    if (g) g.classList.remove('hud-overlay');
    if (scene) {
      scene.traverse(o => {
        if (o.geometry) o.geometry.dispose && o.geometry.dispose();
        if (o.material) {
          if (Array.isArray(o.material)) o.material.forEach(m => m.dispose && m.dispose());
          else o.material.dispose && o.material.dispose();
        }
      });
    }
    scene = null; carMeshes = []; crew = []; pitGroup = null; raceRef = null;
    jacks = []; guns = []; sparks = []; smoke = [];
  }

  function carWorldPos(track, car) {
    // During an active pit stop, park the human car at the garage box
    if (car.inPit && car.human && car.pitTimer > 0 && pitGroup && pitGroup.userData.boxPos) {
      const bp = pitGroup.userData.boxPos;
      const ang = (typeof pitGroup.userData.boxAng === 'number') ? pitGroup.userData.boxAng
        : (typeof bp.ang === 'number' ? bp.ang : 0);
      return { x: bp.x, y: 0, z: bp.z, ang };
    }
    const pt = track.pointAt(car.dist);
    const nx = Math.sin(pt.ang), nz = -Math.cos(pt.ang);
    let lat = car.lateral;
    if (car.inPit) lat = track.halfWidth + 10 + Math.min(4, Math.abs(car.lateral) * 0.05);
    return { x: pt.x + nx * lat, y: 0, z: pt.y + nz * lat, ang: pt.ang };
  }

  function setMode(m) {
    mode = m || 'chase';
    if (cockpitParts) cockpitParts.visible = (mode === 'cockpit');
  }
  function setQuality(q) {
    quality = q || 'auto';
    if (renderer) {
      renderer.setPixelRatio(preferLow() ? 1 : Math.min(1.75, window.devicePixelRatio || 1));
      renderer.shadowMap.enabled = shadows && !preferLow();
    }
  }
  function getQuality() { return quality; }
  function getMode() { return mode; }

  function showPitCrew(show) {
    crew.forEach((p, i) => { p.visible = !!show; });
    jacks.forEach(j => { j.visible = !!show; });
    guns.forEach(g => { g.visible = !!show; });
    if (releaseLight) {
      releaseLight.visible = !!show;
      const lamp = releaseLight.userData.lamp || releaseLight.getObjectByName('releaseLamp');
      if (lamp && lamp.material) {
        lamp.material.color.setHex(0x880000);
        lamp.material.emissive.setHex(0x330000);
      }
    }
    pitCamActive = !!show;
    pitAnimT = 0;
    if (show) mode = 'pit';
  }

  function spawnSpark(x, y, z) {
    if (preferLow() || sparks.length > 40) return;
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 4, 4),
      new THREE.MeshBasicMaterial({ color: 0xffcc66 })
    );
    m.position.set(x, y, z);
    m.userData.v = new THREE.Vector3((Math.random() - 0.5) * 4, 1 + Math.random() * 3, (Math.random() - 0.5) * 4);
    m.userData.life = 0.4 + Math.random() * 0.3;
    fxGroup.add(m);
    sparks.push(m);
  }

  function spawnSmoke(x, y, z) {
    if (preferLow() || smoke.length > 20) return;
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.35 })
    );
    m.position.set(x, y, z);
    m.userData.v = new THREE.Vector3((Math.random() - 0.5), 0.8, (Math.random() - 0.5));
    m.userData.life = 0.8;
    fxGroup.add(m);
    smoke.push(m);
  }

  function update(race, dt) {
    if (!active || !scene || !race) return;
    raceRef = race;
    const track = race.track;

    race.cars.forEach((car, i) => {
      const m = carMeshes[i];
      if (!m) return;
      const w = carWorldPos(track, car);
      let lift = 0;
      if (car.inPit && car.human && mode === 'pit') {
        // jack lift during pit
        pitAnimT += dt;
        lift = Math.min(0.55, pitAnimT * 0.4);
        jacks.forEach(j => { j.position.y = 0.2 + lift * 0.5; });
        guns.forEach((g, gi) => { g.rotation.x += dt * 25; });
        if (releaseLight && pitAnimT > 1.8) {
          const lamp = releaseLight.userData.lamp || releaseLight.getObjectByName('releaseLamp');
          if (lamp && lamp.material) {
            lamp.material.color.setHex(0x00cc44);
            lamp.material.emissive.setHex(0x007722);
          }
        }
      }
      m.position.set(w.x, w.y + lift, w.z);
      m.rotation.y = Math.PI / 2 - w.ang;
      if (car.spin > 0) m.rotation.y += car.spin * 4;
      // DRS flap
      const drs = m.getObjectByName('drs');
      if (drs) drs.rotation.x = car.drs ? -0.35 : 0;
      m.visible = !car.finished || race.time < (car.finishTime || 1e9) + 2;
      if (car.human && mode === 'cockpit') m.visible = false;

      // speed FX for player
      const carSpd = car.speed || car.spd || 0;
      // Skip near-camera FX in cockpit — smoke spheres read as broken beige gloves
      if (car.human && mode !== 'cockpit') {
        if (carSpd > 55 && Math.random() < dt * 8) spawnSpark(w.x, 0.1, w.z);
        if (car.brake && carSpd > 40 && Math.random() < dt * 6) {
          spawnSmoke(w.x - Math.sin(w.ang) * 1.4, 0.15, w.z - Math.cos(w.ang) * 1.4);
        }
      }
      // kerb shake
      if (car.human && Math.abs(car.lateral) > track.halfWidth * 0.85) camShake = Math.max(camShake, 0.35);
    });

    // soft shadow follow player
    const humans = race.cars.filter(c => c.human);
    const follow = humans[0] || race.cars[0];
    if (follow && sun && sun.castShadow) {
      const w = carWorldPos(track, follow);
      sun.position.set(w.x + 40, 80, w.z + 30);
      sun.target.position.set(w.x, 0, w.z);
      sun.target.updateMatrixWorld();
    }

    if (follow) {
      const w = carWorldPos(track, follow);
      const spd = follow.speed || follow.spd || 0;
      // Smooth heading lag for chase yaw (shortest-angle)
      if (chaseHeading == null || !isFinite(chaseHeading)) chaseHeading = w.ang;
      let dh = w.ang - chaseHeading;
      while (dh > Math.PI) dh -= Math.PI * 2;
      while (dh < -Math.PI) dh += Math.PI * 2;
      chaseHeading += dh * 0.14;
      const fwdX = Math.cos(chaseHeading), fwdZ = Math.sin(chaseHeading);
      const trueFwdX = Math.cos(w.ang), trueFwdZ = Math.sin(w.ang);

      if (mode === 'pit' && pitGroup && pitGroup.userData.boxPos) {
        const bp = pitGroup.userData.boxPos;
        // Look at car (snapped to box during stop) so garage+banners frame behind
        const look = new THREE.Vector3(w.x, 0.7, w.z);
        // Face along pit lane when we know box angle
        const carAng = (typeof pitGroup.userData.boxAng === 'number') ? pitGroup.userData.boxAng : ((typeof bp.ang === 'number') ? bp.ang : (follow.inPit ? w.ang : 0));
        // side = pit-outward (away from track); camera sits on TRACK side looking toward garage
        const sideX = Math.sin(carAng), sideZ = -Math.cos(carAng);
        const fwdXp = Math.cos(carAng), fwdZp = Math.sin(carAng);
        // Front 3/4 elevated — car parallel in box, garage behind
        const pitDesired = new THREE.Vector3(
          look.x - sideX * 7.0 + fwdXp * 11.5,
          5.6,
          look.z - sideZ * 7.0 + fwdZp * 11.5
        );
        if (camera.position.distanceTo(pitDesired) > 40) camera.position.copy(pitDesired);
        else camera.position.lerp(pitDesired, 0.28);
        camera.lookAt(look.x + sideX * 0.5 - fwdXp * 1.2, 0.5, look.z + sideZ * 0.5 - fwdZp * 1.2);
        camera.fov = 40; camera.updateProjectionMatrix();
        // crew in fixed role offsets around car (smaller figures)
        crew.forEach((p, i) => {
          p.visible = true;
          const off = p.userData.roleOffset || [Math.cos(i) * 2, Math.sin(i) * 2];
          // offsets are in car-local (x lateral, z along)
          p.position.x = look.x + sideX * off[0] + fwdXp * off[1];
          p.position.z = look.z + sideZ * off[0] + fwdZp * off[1];
          // working bob + gunners lean in during stop
          const bob = Math.sin(performance.now() / 160 + i * 0.9) * 0.04;
          const lean = (pitAnimT > 0.2 && pitAnimT < 2.2) ? 0.06 : 0;
          p.position.y = bob;
          p.rotation.y = Math.atan2(look.x - p.position.x, look.z - p.position.z);
          p.rotation.x = lean * (i % 2 ? 1 : -0.5);
          // Quick tire-swap: spare tire lifts then drops during mid-stop
          if (p.userData.spareTire) {
            const phase = Math.min(1, Math.max(0, (pitAnimT - 0.35) / 1.4));
            const lift = Math.sin(phase * Math.PI) * 0.45;
            p.userData.spareTire.position.y = 0.35 + lift;
            p.userData.spareTire.rotation.x = phase * Math.PI * 2;
          }
        });
        jacks.forEach((j, ji) => {
          j.visible = true;
          j.position.set(
            look.x + fwdXp * (ji ? -2.85 : 2.85),
            0.15 + Math.min(0.45, pitAnimT * 0.35),
            look.z + fwdZp * (ji ? -2.85 : 2.85)
          );
        });
        guns.forEach((g, gi) => {
          g.visible = true;
          const lx = (gi % 2 ? 1.55 : -1.55);
          const lz = (gi < 2 ? 1.55 : -1.65);
          g.position.set(look.x + sideX * lx + fwdXp * lz, 0.42, look.z + sideZ * lx + fwdZp * lz);
          g.rotation.x += dt * 28;
        });
        if (releaseLight) {
          releaseLight.visible = true;
          releaseLight.position.set(look.x + sideX * 3.5 + fwdXp * 2.5, 2.0, look.z + sideZ * 3.5 + fwdZp * 2.5);
        }
        // hide track tyre-barrier stacks near the box so they don't fill the foreground
        if (trackMesh) {
          trackMesh.traverse(obj => {
            if (obj.geometry && obj.geometry.type === 'TorusGeometry' && obj.position) {
              const dx = obj.position.x - look.x, dz = obj.position.z - look.z;
              if (dx * dx + dz * dz < 18 * 18) obj.visible = false;
            }
          });
        }
      } else if (mode === 'cockpit') {
        const eye = new THREE.Vector3(w.x - trueFwdX * 0.08, 1.05, w.z - trueFwdZ * 0.08);
        if (camera.position.distanceTo(eye) > 40) camera.position.copy(eye);
        else camera.position.lerp(eye, 0.45);
        camera.lookAt(w.x + trueFwdX * 28, 0.72, w.z + trueFwdZ * 28);
        camera.fov = 68 + Math.min(14, spd * 0.09);
        camera.updateProjectionMatrix();
        if (cockpitParts) {
          cockpitParts.visible = true;
          if (cockpitParts.userData.shoulderMat && follow.teamColors) {
            const sc = new THREE.Color(follow.teamColors.primary || '#ff8000');
            const hsl = { h: 0, s: 0, l: 0 }; sc.getHSL(hsl);
            if (hsl.h > 0.03 && hsl.h < 0.14 && hsl.s > 0.45) {
              hsl.h = Math.max(0.025, hsl.h - 0.055);
              hsl.s = Math.min(1, hsl.s * 1.35);
              hsl.l = Math.min(0.44, Math.max(0.30, hsl.l * 0.82));
              sc.setHSL(hsl.h, hsl.s, hsl.l);
            }
            cockpitParts.userData.shoulderMat.color.copy(sc);
            if (cockpitParts.userData.gloveCuffMat) cockpitParts.userData.gloveCuffMat.color.copy(sc);
          }
          // Digital wheel display: speed, gear, lap
          if (cockpitParts.userData.dispCtx && cockpitParts.userData.dispTex) {
            const ctx2 = cockpitParts.userData.dispCtx;
            const kph = Math.round((spd || 0) * 2.4);
            const gear = spd < 5 ? 'N' : String(Math.min(8, Math.max(1, Math.ceil(spd / 22))));
            const lapN = Math.min((follow.lap || 0) + 1, (race.laps || 3));
            ctx2.fillStyle = '#03140e'; ctx2.fillRect(0, 0, 128, 64);
            ctx2.fillStyle = '#14e090'; ctx2.font = 'bold 26px monospace'; ctx2.textAlign = 'center';
            ctx2.fillText(String(kph).padStart(3, '0'), 64, 30);
            ctx2.font = 'bold 13px monospace';
            ctx2.fillStyle = '#9fffd0';
            ctx2.fillText(gear + '  L' + lapN, 64, 52);
            cockpitParts.userData.dispTex.needsUpdate = true;
          }
          if (cockpitParts.userData.steerWheel) {
            cockpitParts.userData.steerWheel.rotation.z = -(follow.steer || 0) * 0.55;
          }
          // Spin front wheels with speed
          const spin = (spd || 0) * 0.35;
          ['fwheelL', 'fwheelR'].forEach(k => {
            const t = cockpitParts.userData[k];
            if (t) t.rotation.x += spin * 0.05;
          });
          // keep cockpit HUD in camera space
          if (cockpitParts.parent !== camera) {
            scene.remove(cockpitParts);
            camera.add(cockpitParts);
            cockpitParts.position.set(0, 0, 0);
            cockpitParts.rotation.set(0, 0, 0);
          }
        }
      } else if (mode === 'podium') {
        // orbit handled by Trophies.update / external
      } else {
        if (cockpitParts) {
          cockpitParts.visible = false;
          if (cockpitParts.parent === camera) {
            camera.remove(cockpitParts);
            scene.add(cockpitParts);
          }
        }
        // Chase: heading-yaw with lag, lateral clamp — car centred in lower third ~25-30% width
        const back = 6.6, height = 2.45;
        const desired = new THREE.Vector3(
          w.x - fwdX * back,
          height + camShake * (Math.random() - 0.5) * 0.12,
          w.z - fwdZ * back
        );
        const lerpRate = 0.18 + Math.min(0.14, spd * 0.0012);
        if (!chasePos || chasePos.lengthSq() < 0.01 || chasePos.distanceTo(desired) > 40) chasePos.copy(desired);
        else chasePos.lerp(desired, lerpRate);
        // Clamp lateral offset so car stays horizontally centred
        const rightX = -fwdZ, rightZ = fwdX;

      const nctx = numC.getContext('2d');
      nctx.fillStyle = '#d4af37'; nctx.font = 'bold 48px sans-serif'; nctx.textAlign = 'center';
      nctx.fillText(String(s.place + 1), 32, 48);
      const numPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(numC), transparent: true }));
      numPlane.position.set(origin.x + s.x, s.h / 2, origin.z + 1.32);
      podiumGroup.add(numPlane);

      const car = order[s.place];
      if (car) {
        const driver = buildDriverFigure(car, s.place === 0 ? 1.05 : 0.95);
        driver.position.set(origin.x + s.x, s.h, origin.z - 0.15);
        podiumGroup.add(driver);
        const trophy = buildTrophyMesh(s.place === 0 ? 'track' : 'small',
          s.place === 0 ? 0xffd700 : (s.place === 1 ? 0xc0c0c0 : 0xcd7f32));
        if (trophy) {
          trophy.position.set(origin.x + s.x + 0.55, s.h + 1.5, origin.z - 0.1);
          trophy.scale.setScalar(s.place === 0 ? 0.85 : 0.6);
          // held up
          trophy.rotation.z = -0.15;
          podiumGroup.add(trophy);
        }
      }
    });

    scene.add(podiumGroup);
    spawnConfetti(scene, new THREE.Vector3(origin.x, 2, origin.z));
    spawnChampagne(scene, new THREE.Vector3(origin.x, 2, origin.z));
    orbitOrigin = origin.clone();
    orbitT = 0;
    camera.position.set(origin.x + 11, 5.5, origin.z + 10);
    camera.lookAt(origin.x, 2.2, origin.z);
    camera.fov = 48; camera.updateProjectionMatrix();

    const human = order.find(c => c.human);
    if (human && human.position === 1) {
      const hw = (window.__game && window.__game.state && window.__game.state.humanWins) || 0;
      recordWin(race.meta.id, human.id, hw + 1);
    }
    return true;
  }

  function update(dt) {
    confettiParts.forEach(p => {
      if (!p.userData.v) return;
      p.position.addScaledVector(p.userData.v, dt);
      p.userData.v.y -= 9.8 * dt * 0.35;
      p.rotation.x += (p.userData.spin || 1) * dt;
      p.rotation.z += (p.userData.spin || 1) * dt * 0.7;
    });
    if (ceremonyActive && orbitOrigin && World3D.getCamera && World3D.getMode() === 'podium') {
      orbitT += dt * 0.25;
      const cam = World3D.getCamera();
      if (cam) {
        const r = 12;
        cam.position.x = orbitOrigin.x + Math.cos(orbitT) * r;
        cam.position.z = orbitOrigin.z + Math.sin(orbitT) * r;
        cam.position.y = 5.2 + Math.sin(orbitT * 0.5) * 0.4;
        cam.lookAt(orbitOrigin.x, 2.2, orbitOrigin.z);
      }
    }
  }

  function isCeremony() { return ceremonyActive; }

  function renderCabinetHTML() {
    const data = load();
    let html = '<div class="cabinet" id="trophyCabinet">';
    html += '<h2>Trophy Cabinet</h2>';
    if (data.champ) html += '<div class="champ-trophy">Championship Trophy ★</div>';
    html += '<div class="cabinet-grid">';
    F1DATA.tracks.forEach(t => {
      const info = data.tracks[t.id];
      html += '<div class="cabinet-slot' + (info ? ' won' : '') + '" data-track="' + t.id + '">';
      html += '<div class="cup">' + (info ? '🏆' : '·') + '</div>';
      html += '<div class="name">' + t.name + '</div>';
      html += '<div class="meta">' + (info ? (info.count + ' win' + (info.count > 1 ? 's' : '')) : '—') + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
    return html;
  }

  return {
    load, save, recordWin, getCabinet, showPodium3D, update, clearFX,
    renderCabinetHTML, buildTrophyMesh, isCeremony
  };
})();

})();

;(function(){

  const ctx = canvas.getContext('2d');
  let state = freshState();
  let last = 0;
  let raf = 0;

  function freshState() {
    return {
      screen: 'title',
      numPlayers: 1,
      players: [],
      pickIndex: 0,
      tirePick: 0,
      strategySlot: 0,
      weatherPreview: null,
      trackId: F1DATA.tracks[0].id,
      laps: 3,
      driverPoints: {},
      driverWins: {},
      humanWins: 0,
      racesPlayed: 0,
      race: null,

    };
  }

  function initPoints() {
    state.driverPoints = {};
    state.driverWins = {};
    F1DATA.teams.forEach(t => t.drivers.forEach(d => {
      state.driverPoints[d.id] = 0;
      state.driverWins[d.id] = 0;
    }));
    state.humanWins = 0;
    state.racesPlayed = 0;
  }

  function save() {

      numPlayers: state.numPlayers,
      players: state.players,
      trackId: state.trackId,
      laps: state.laps,
      driverPoints: state.driverPoints,
      driverWins: state.driverWins,
      humanWins: state.humanWins,
      racesPlayed: state.racesPlayed,
      screen: state.screen === 'race' ? 'calendar' : state.screen
    };
    Save.write(data);
  }

  function load() {
    const data = Save.read();
    if (!data) return false;
    Object.assign(state, freshState(), data);
    state.race = null;
    state.input = [{}, {}].map(() => ({ throttle: false, brake: false, left: false, right: false, pit: false }));
    return true;
  }

  const actions = {
    newGame() {
      state = freshState();
      initPoints();
      state.players = [];
      state.numPlayers = 1;
      save();
      UI.showPlayers(state, actions);
    },
    continueGame() {
      if (!load()) return;
      if (state.humanWins >= WINS_TO_END_SEASON) UI.showStandings(state, actions, true);
      else if (state.players && state.players[0] && state.players[0].driverId) UI.showCalendar(state, actions);
      else UI.showPlayers(state, actions);
    },
    toTitle() { save(); UI.showTitle(state, actions); },

    toTeamPick() {

    },
    toCalendar() { save(); UI.showCalendar(state, actions); },
    toStandings() { UI.showStandings(state, actions, false); },
    toGrid() { UI.showGrid(state, actions); },
    startRace() {
      const cfg = {
        trackId: state.trackId,
        laps: state.laps || 3,
        weather: state.weatherPreview || undefined,
        use3d: true,
        players: state.players.map(p => ({
          teamId: p.teamId, driverId: p.driverId,
          difficulty: p.difficulty || 'hard',
          assist: !!p.assist,

          strategy: (p.strategy && p.strategy.length === 3) ? p.strategy.slice() : null
        }))
      };
      if (state.race && state.race.use3d && window.World3D) {
        try { World3D.dispose(); } catch (e) {}
      }
      state.race = Race.start(cfg);
      state.screen = 'race';
      state._podiumShown = false;
      UI.showRaceChrome(state, actions);

      loop(last);
    },
    radioCall(kind) {
      if (window.TeamRadio) TeamRadio.playerCall(kind);
    },
    goRace() {

        UI.showRaceChrome(state, actions);

    },
    pit() {
      if (!state.race) return;

    pauseRace() {

  function applyResults() {
    if (!state.race || !state.race.results) return;
    state.racesPlayed++;
    state.race.results.forEach(c => {
      state.driverPoints[c.id] = (state.driverPoints[c.id] || 0) + (c.points || 0);
      if (c.position === 1) {
        state.driverWins[c.id] = (state.driverWins[c.id] || 0) + 1;
        if (c.human) state.humanWins = (state.humanWins || 0) + 1;

  function loop(t) {
    raf = requestAnimationFrame(loop);
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;

    // already handled via key handlers into state.input
    if (state.race && state.screen === 'podium') {
      if (window.Trophies) Trophies.update(dt);
      if (state.race.use3d && window.World3D && World3D.isActive()) {
        World3D.render();
      }
    } else if (state.race && state.screen === 'race') {
      // Lights countdown advances inside Race.step while running is still false
      const lightsOn = state.race.lights > 0 && state.race.lights < 6;
      if (!state.race.finished && (state.race.running || lightsOn)) {
        Race.step(state.race, dt, state.input);
      }
      Race.draw(state.race, ctx, state.input);
      // Pit compound chooser visibility
      const pitEl = document.getElementById('pitChoose');
      if (pitEl) {
        const human = state.race.cars.find(c => c.human);
        if (human && human.inPit && human.pitChooseOpen) pitEl.classList.remove('hidden');

      if (state.race.finished && !state._podiumShown) {

    DIFFICULTY,
    save, load, initPoints,
    startRace: actions.startRace,
    debugFinish(humanFirst) {

    },
    debugFinishP1() { this.debugFinish(true); },
    debugFinishAI() { this.debugFinish(false); },
    debugPenalty(type) { if (state.race) Race.debugForcePenalty(state.race, type || 'track'); },
    debugPit() { if (state.race) Race.debugPit(state.race); },
    debugAutopilot(seconds, difficulty) {

    scriptedDrive(opts) {
      if (!state.race) return { ok: false };
      return Race.scriptedDrive(state.race, opts || {});
    },
    getRace() { return state.race; },
    buildRaceAt(trackId, laps, difficulty, opts) {

          state.players[0].driverId = F1DATA.teams[0].drivers[0].id;

    },
    Tracks,
    applyResults,
    setHumanWins(n) { state.humanWins = n; },
    gotoPodium() { UI.showPodium(state, actions); },
    gotoStandings(over) { UI.showStandings(state, actions, !!over); },

      state.players[0].tire = sets[0];

    openStrategy() { UI.showTires(state, actions); },

})();

<script id="car-mode-js">
window.__CAR_GAME = "f1-champs";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
</script>
