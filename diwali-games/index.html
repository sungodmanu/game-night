<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230e121b%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%23ffd77a%27/%3E%3Ccircle cx=%2740%27 cy=%2726%27 r=%2716%27 fill=%27%230e121b%27/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0a2e">
<title>Diwali Games</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0618;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#2a1048 0%,#0d0618 70%)}
#game{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:transparent}
#overlay,#hud{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:5}
#overlay>* ,#hud>*{pointer-events:auto}
.hidden{display:none!important}
.icon-btn{position:absolute;top:max(8px,env(safe-area-inset-top));z-index:40;width:48px;height:48px;border:2px solid rgba(255,200,100,.45);border-radius:14px;background:rgba(30,10,50,.75);color:#ffe7a8;font-size:22px;cursor:pointer;backdrop-filter:blur(4px)}
#muteBtn{right:max(8px,env(safe-area-inset-right))}
#fsBtn{right:max(64px,calc(env(safe-area-inset-right) + 56px))}
.icon-btn:active{transform:scale(.94)}
.toast{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);background:rgba(40,15,60,.92);border:2px solid #f5c542;border-radius:16px;padding:12px 20px;font-size:18px;z-index:50;pointer-events:none;max-width:90%;text-align:center}
.screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:auto;gap:10px}
.screen.landscape-tight{justify-content:flex-start}
.title{font-size:clamp(22px,4.2vw,36px);font-weight:800;letter-spacing:.02em;text-shadow:0 2px 0 #7a2e00,0 0 18px rgba(255,180,40,.5);color:#ffe08a;text-align:center}
.sub{font-size:clamp(13px,2.4vw,18px);color:#f0d4a8;opacity:.9;text-align:center}
.profiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.profile-card{min-width:min(42vw,220px);min-height:120px;padding:16px 18px;border-radius:20px;border:3px solid #f5c542;background:linear-gradient(160deg,#5a1f8a,#2a0a48);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:20px;font-weight:700;box-shadow:0 8px 0 #3a1058,0 0 24px rgba(255,180,40,.25)}
.profile-card .emoji{font-size:42px;line-height:1}
.profile-card .label{font-size:14px;font-weight:500;color:#ffd9a0}
.profile-card:active{transform:translateY(3px);box-shadow:0 4px 0 #3a1058}
.hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(960px,100%);margin-top:6px}
@media (max-width:700px),(max-height:420px){.hub-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.game-tile{min-height:88px;border-radius:18px;border:3px solid rgba(255,210,120,.55);background:linear-gradient(145deg,#7a2a10,#3a0e28);padding:12px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35);position:relative}
.game-tile .emoji{font-size:clamp(28px,5vw,40px)}
.game-tile .name{font-size:clamp(13px,2.2vw,17px);font-weight:700;color:#fff6d8}
.game-tile .tag{font-size:11px;color:#ffd090}
.game-tile.soon{opacity:.55;cursor:default;filter:grayscale(.25)}
.game-tile.soon .badge{position:absolute;top:6px;right:6px;background:#222;color:#ffd070;font-size:10px;padding:3px 7px;border-radius:999px;border:1px solid #886}
.game-tile.playable{background:linear-gradient(145deg,#c45a12,#6a1a40);border-color:#ffd060;box-shadow:0 6px 0 #4a1020,0 0 20px rgba(255,160,40,.35)}
.game-tile:not(.soon):active{transform:translateY(2px)}
.topbar{display:flex;width:100%;max-width:1100px;align-items:center;justify-content:space-between;gap:8px;padding-right:120px}
.btn{min-height:48px;min-width:48px;padding:10px 16px;border-radius:14px;border:2px solid #f0c050;background:linear-gradient(180deg,#ff9a3c,#d45410);color:#2a1000;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #7a2a00}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7a2a00}
.btn.ghost{background:rgba(40,15,60,.7);color:#ffe7a8;border-color:rgba(255,200,100,.5);box-shadow:0 4px 0 #1a0830}
.btn.big{min-height:56px;font-size:18px;padding:12px 20px}
.btn.p1{min-height:64px;min-width:64px;font-size:18px;border-radius:18px}
.btn.danger{background:linear-gradient(180deg,#ff6a6a,#b02020);border-color:#ffaaaa;color:#fff}
.stickers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:28px}
.sticker{font-size:22px;filter:drop-shadow(0 0 4px rgba(255,200,80,.5))}
.edit-name{margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.edit-name input{min-height:44px;min-width:140px;border-radius:12px;border:2px solid #c8a040;padding:8px 12px;font-size:16px;background:#2a1040;color:#fff}
.modal{position:absolute;inset:0;background:rgba(10,4,20,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .card{background:linear-gradient(160deg,#4a2068,#1e0a38);border:3px solid #f5c542;border-radius:20px;padding:20px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.modal .card h3{font-size:22px;color:#ffe08a}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.rangoli-wrap{display:flex;flex-direction:column;width:100%;height:100%;max-width:1180px;gap:8px}
.rangoli-main{flex:1;display:flex;gap:8px;min-height:0;width:100%}
.rangoli-canvas-box{flex:1;min-width:0;min-height:0;border-radius:16px;border:3px solid #e8b040;background:#1a0f08;overflow:hidden;position:relative;box-shadow:inset 0 0 40px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.rangoli-canvas-box canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.toolbar{display:flex;flex-direction:column;gap:4px;width:min(168px,28vw);overflow:auto;padding:2px;max-height:100%}
.toolbar .section{font-size:11px;color:#ffd090;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.swatch,.stamp,.tool{width:100%;min-height:48px;border-radius:12px;border:2px solid rgba(255,220,140,.4);background:rgba(50,20,70,.7);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.p1-mode .swatch,.p1-mode .stamp,.p1-mode .tool{min-height:52px;font-size:15px;border-radius:14px}
.p1-mode .bottom-bar .btn{min-height:56px}
.swatch.active,.stamp.active,.tool.active{border-color:#fff;box-shadow:0 0 0 3px #f5c542,0 0 12px rgba(255,180,40,.5)}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.palette .swatch{min-height:44px}
.p1-mode .palette .swatch{min-height:48px}
.bottom-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding-bottom:4px;padding-right:100px}
.pattern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:min(900px,100%);padding:8px}
.pattern-card{min-height:100px;border-radius:16px;border:3px solid #e8b040;background:#2a1440;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px}
.pattern-card .emoji{font-size:36px}
.pattern-card .name{font-size:13px;font-weight:700;color:#ffe8b0}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;width:min(900px,100%)}
.gallery-item{aspect-ratio:1;border-radius:12px;border:2px solid #c8a040;background:#1a0f08;overflow:hidden;cursor:pointer}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.empty{opacity:.7;font-size:15px;padding:20px;text-align:center}
.sym-row{display:flex;gap:4px;flex-wrap:nowrap}
.sym-row .tool{flex:1 1 28px;min-width:28px;width:auto;padding:4px;font-size:15px}
.stamp-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stamp-grid .stamp{width:100%;min-height:48px;padding:4px;font-size:20px}
.p1-mode .stamp-grid .stamp{min-height:56px;font-size:22px}
@media (max-height:420px){
  .title{font-size:22px}
  .game-tile{min-height:72px;padding:8px}
  .profile-card{min-height:96px;padding:10px}
  .toolbar{width:min(130px,26vw)}
}

/* Diya Path */
.diyapath-screen{max-width:1180px}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;width:min(720px,100%);padding:4px 0 12px}
.level-card{min-height:72px;min-width:64px;border-radius:16px;border:2px solid #e8b040;background:linear-gradient(160deg,#3a1860,#1a0830);color:#ffe8b0;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #120420}
.level-card .num{font-size:20px}
.level-card .meta{font-size:11px;opacity:.8;font-weight:600}
.level-card .stars{font-size:12px;min-height:16px}
.level-card.locked{opacity:.45;cursor:default;filter:grayscale(.3)}
.level-card.p1,.p1-mode .level-card{min-height:80px;min-width:72px;border-radius:18px}
.diya-board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%;position:relative;padding:4px}
.marigold-frame{padding:10px;border-radius:20px;background:linear-gradient(180deg,rgba(255,160,40,.25),rgba(80,30,10,.35));border:3px solid #e8a030;box-shadow:0 0 24px rgba(255,160,40,.2),inset 0 0 20px rgba(0,0,0,.35);max-width:100%;max-height:100%}
.diya-board{display:grid;grid-template-columns:repeat(var(--cols),minmax(48px,1fr));grid-template-rows:repeat(var(--rows),minmax(48px,1fr));gap:6px;width:min(560px,92vw,78vh);aspect-ratio:var(--cols)/var(--rows);max-height:min(560px,70vh);overflow:auto}
.diya-cell{appearance:none;-webkit-appearance:none;border:2px solid rgba(255,200,100,.15);border-radius:14px;background:rgba(20,8,30,.55);min-width:48px;min-height:48px;position:relative;cursor:default;padding:0;display:flex;align-items:center;justify-content:center}
.diya-cell.empty{pointer-events:none}
.diya-cell.filled{cursor:pointer;background:radial-gradient(circle at 50% 40%,#5a2a10,#2a1008);border-color:#e8a040;box-shadow:0 0 10px rgba(255,140,40,.25)}
.diya-cell.can-move{box-shadow:0 0 14px rgba(255,200,80,.55),0 0 4px #ffd070}
.diya-cell.hint{outline:3px solid #ffe08a;outline-offset:1px;animation:hintPulse 1.4s ease-in-out infinite}
.diya-cell.wobble{animation:wobble .4s ease}
.diya-cell.p1,.p1-mode .diya-cell.filled{border-radius:16px;border-width:3px;min-width:56px;min-height:56px}
.p1-mode .diya-cell{min-width:56px;min-height:56px}
.diya-glyph{font-size:clamp(16px,3.5vw,28px);line-height:1;filter:drop-shadow(0 0 4px rgba(255,180,40,.5))}
.diya-arrow{position:absolute;bottom:2px;right:3px;font-size:clamp(10px,2.2vw,16px);color:#ffe08a;text-shadow:0 0 4px #000;font-weight:900}
.lantern-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.diya-bottom{padding-right:100px}
@keyframes hintPulse{0%,100%{box-shadow:0 0 10px rgba(255,220,100,.4)}50%{box-shadow:0 0 22px rgba(255,220,100,.85)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (max-height:420px){
  .diya-board{width:min(420px,58vw,62vh);gap:4px}
  .level-card{min-height:64px}
  .marigold-frame{padding:6px}
}


/* Quiz Quest — storybook */
.quiz-screen{max-width:1180px}
.quiz-story{font-size:clamp(14px,2.4vw,18px);color:#ffd9a8;text-align:center;max-width:640px}
.quiz-rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;width:min(960px,100%);padding:4px 0 16px}
.quiz-round-card{min-height:120px;border-radius:18px;border:3px solid #e8b040;background:linear-gradient(160deg,#4a1868,#1a0830);color:#ffe8b0;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:14px 16px;text-align:left;box-shadow:0 5px 0 #120420}
.quiz-round-card .emoji{font-size:28px}
.quiz-round-card .name{font-size:16px;font-weight:800}
.quiz-round-card .story{font-size:12px;opacity:.85;font-weight:500;line-height:1.35}
.quiz-round-card .stars{font-size:12px;margin-top:4px;color:#ffd070}
.quiz-round-card.done{border-color:#9fe07a}
.quiz-round-card.p1,.p1-mode .quiz-round-card{min-height:132px;border-radius:20px}
.quiz-page{width:min(720px,100%);background:linear-gradient(165deg,rgba(70,30,100,.92),rgba(25,8,45,.94));border:3px solid #f0c050;border-radius:22px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 28px rgba(255,160,40,.22),inset 0 0 30px rgba(0,0,0,.25);position:relative}
.quiz-page.result{align-items:center;text-align:center}
.quiz-q{font-size:clamp(18px,3.2vw,26px);font-weight:800;color:#fff6d8;text-align:center;line-height:1.35;text-shadow:0 2px 0 rgba(80,30,0,.45)}
.quiz-q.p1{font-size:clamp(20px,3.6vw,28px)}
.quiz-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.quiz-choices.p1{grid-template-columns:1fr 1fr;gap:12px}
.quiz-choice{min-height:64px;border-radius:16px;border:3px solid rgba(255,200,100,.55);background:linear-gradient(180deg,#5a2860,#2a1040);color:#fff6d8;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:10px 12px;text-align:left;box-shadow:0 4px 0 #140420}
.quiz-choice .emoji{font-size:28px;line-height:1;flex-shrink:0}
.quiz-choice .label{line-height:1.25}
.quiz-choice.p1,.p1-mode .quiz-choice{min-height:76px;font-size:17px;border-radius:18px}
.p1-mode .quiz-choice .emoji{font-size:34px}
.quiz-choice.correct{border-color:#9fe07a;background:linear-gradient(180deg,#3a6840,#1a4028);box-shadow:0 0 16px rgba(120,220,100,.45)}
.quiz-choice.wrong{animation:wobble .4s ease;border-color:#ff8a8a}
.quiz-choice:disabled{opacity:.92}
.quiz-fact{margin-top:4px;padding:12px;border-radius:16px;background:rgba(255,200,80,.12);border:2px dashed #f0c050;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.quiz-fact .fact-title{font-weight:800;color:#ffe08a;font-size:16px}
.quiz-fact .fact-body{font-size:clamp(14px,2.4vw,17px);color:#ffe8c8;line-height:1.4}
.quiz-fact.p1 .fact-body{font-size:clamp(15px,2.6vw,18px)}
.quiz-stars{font-size:36px;letter-spacing:4px}
@media (max-width:520px){
  .quiz-choices{grid-template-columns:1fr}
  .quiz-rounds{grid-template-columns:1fr}
}
@media (max-height:420px){
  .quiz-round-card{min-height:96px;padding:10px}
  .quiz-choice{min-height:56px}
  .quiz-page{padding:12px}
}
/* Diya Memory Match */
.memory-screen{max-width:1180px}
.mem-table{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px;width:min(720px,100%);padding:4px 0 12px;justify-items:stretch}
.mem-card{position:relative;aspect-ratio:1;min-height:56px;min-width:48px;border-radius:14px;border:3px solid #e8b040;background:linear-gradient(160deg,#4a1868,#1a0830);cursor:pointer;box-shadow:0 4px 0 #120420;perspective:600px;padding:0;overflow:hidden}
.mem-card .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,5vw,36px);backface-visibility:hidden;transition:transform .28s ease}
.mem-card .back{background:linear-gradient(160deg,#5a2868,#2a1040);transform:rotateY(0)}
.mem-card .front{background:linear-gradient(160deg,#6a3a28,#3a1810);transform:rotateY(180deg);border-radius:11px}
.mem-card.up .back{transform:rotateY(180deg)}
.mem-card.up .front{transform:rotateY(0)}
.mem-card.matched{border-color:#9fe07a;box-shadow:0 0 14px rgba(120,220,100,.4);cursor:default}
.mem-card.matched .front{background:linear-gradient(160deg,#3a6840,#1a4028)}
.mem-card.p1,.p1-mode .mem-card{min-height:72px;border-radius:18px;border-width:3px}
.p1-mode .mem-card .face{font-size:clamp(28px,6vw,42px)}
.mem-clock{font-weight:800;color:#ffd070;font-size:16px;min-width:52px;text-align:center}
.mem-result{width:min(520px,100%);background:linear-gradient(165deg,rgba(70,30,100,.92),rgba(25,8,45,.94));border:3px solid #f0c050;border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 0 28px rgba(255,160,40,.22)}
@media (max-height:420px){
  .mem-table{gap:6px}
  .mem-card{min-height:48px}
  .p1-mode .mem-card{min-height:56px}
}
@media (max-width:520px){
  .mem-table{gap:6px}
}
/* Phuljhadi Pop — dark night sky, no strobe */
.phul-screen{max-width:1180px}
.phul-stage{position:relative;flex:1;width:min(720px,100%);min-height:220px;display:flex;flex-direction:column;background:linear-gradient(180deg,#07041a 0%,#12082e 55%,#1a0a28 100%);border:3px solid #c09040;border-radius:20px;overflow:hidden;box-shadow:inset 0 0 40px rgba(255,160,40,.08),0 0 24px rgba(80,40,120,.35)}
.phul-count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(48px,12vw,96px);font-weight:900;color:#ffe6a0;text-shadow:0 0 20px rgba(255,180,60,.35);z-index:5;pointer-events:none;transition:opacity .25s ease}
.phul-count.hidden{opacity:0}
.phul-track{flex:1;display:grid;grid-template-columns:repeat(var(--lanes),1fr);gap:6px;padding:10px 10px 0;position:relative;min-height:140px}
.phul-lane{position:relative;border-radius:12px;background:linear-gradient(180deg,rgba(255,200,100,.04),rgba(255,180,80,.07));border:1px solid rgba(255,200,120,.12)}
.phul-note{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:clamp(22px,4.5vw,34px);filter:drop-shadow(0 0 6px rgba(255,180,60,.35));pointer-events:none;will-change:top}
.phul-note.boom{font-size:clamp(26px,5vw,38px)}
.phul-note.missed{opacity:.3;filter:grayscale(.6)}
.phul-pads{display:grid;grid-template-columns:repeat(var(--lanes),1fr);gap:8px;padding:8px 10px 12px}
.phul-pad{min-height:64px;border-radius:18px;border:3px solid #e8b040;background:linear-gradient(180deg,#4a2868,#1a1030);color:#ffe8b0;font-size:28px;cursor:pointer;box-shadow:0 4px 0 #0c0618;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.phul-pad.p1,.p1-mode .phul-pad{min-height:80px;font-size:36px;border-radius:22px;border-width:4px}
.phul-pad.flash{box-shadow:0 0 14px rgba(255,190,80,.4);border-color:#ffe08a;background:linear-gradient(180deg,#5a3870,#2a1840)}
.phul-pops{position:absolute;left:0;right:0;bottom:70px;height:80px;pointer-events:none;z-index:4}
.phul-pop{position:absolute;bottom:0;transform:translate(-50%,0);font-size:28px;transition:none}
.phul-result{width:min(520px,100%);background:linear-gradient(165deg,rgba(30,16,60,.94),rgba(12,6,28,.96));border:3px solid #f0c050;border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 0 28px rgba(255,160,40,.18)}

<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Diwali Games"></canvas>
  <div id="hud" class="hidden"></div>

<script>"use strict";
/* ==== 00-core.js ==== */
;(function(){
/* Diwali Games — core */
const DG = window.DG = {
  VERSION: 1,
  SAVE_KEY: 'diwali-games-v1',
  W: 1180, H: 600,
  profiles: {
    alpha: { id: 'alpha', defaultName: 'Player 1', label: 'Easy · big taps', emoji: '🪔', easy: true },
    beta:  { id: 'beta',  defaultName: 'Player 2', label: 'More tools', emoji: '✨', easy: false }
  },
  games: [
    { id: 'rangoli', name: 'Rangoli Studio', emoji: '🎨', tag: 'Color & create', ready: true },
    { id: 'quiz', name: 'Diwali Quiz Quest', emoji: '📖', tag: 'Storybook quiz', ready: true },
    { id: 'memory', name: 'Diya Memory', emoji: '🃏', tag: 'Flip & match', ready: true },
    { id: 'diyapath', name: 'Diya Path', emoji: '🏮', tag: 'Arrow escape', ready: true },
    { id: 'fireworks', name: 'Phuljhadi Pop', emoji: '🎆', tag: 'Tap the beat', ready: true },
    { id: 'sweets', name: 'Sweet Shop', emoji: '🍬', tag: 'Pack orders', ready: true },
    { id: 'spot', name: 'Spot the Diya', emoji: '🔍', tag: 'Find differences', ready: true }
  ],
  memStore: null,
  state: null,
  screen: 'boot',
  muted: false,
  canvas: null,
  ctx: null,
  overlay: null,
  hud: null,
  profileId: null,
  run: null
};

DG.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
DG.lerp = (a, b, t) => a + (b - a) * t;
DG.rand = (a, b) => a + Math.random() * (b - a);
DG.pick = (arr) => arr[(Math.random() * arr.length) | 0];
DG.now = () => performance.now();

DG.toast = (msg, ms) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), ms || 1500);
};

DG.isEasy = () => {
  const p = DG.profiles[DG.profileId || 'alpha'];
  return !!(p && p.easy);
};

DG.fitCanvas = () => {
  const c = DG.canvas;
  if (!c) return;
  if (c.width !== DG.W) c.width = DG.W;
  if (c.height !== DG.H) c.height = DG.H;
};

DG.clear = (color) => {
  const ctx = DG.ctx;
  if (!ctx) return;
  ctx.fillStyle = color || '#1a0a2e';
  ctx.fillRect(0, 0, DG.W, DG.H);
};

DG.roundRect = (ctx, x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};

DG.bindTap = (el, fn) => {
  if (!el) return;
  let locked = false;
  const go = (e) => {
    if (locked) return;
    locked = true;
    try { DG.Audio && DG.Audio.unlock(); } catch (_) {}
    try { fn(e); } catch (err) { console.error(err); }
    setTimeout(() => { locked = false; }, 180);
  };
  el.addEventListener('click', go);
  el.addEventListener('pointerup', (e) => {
    if (e.pointerType === 'touch') go(e);
  });
};

})();
/* ==== 10-audio.js ==== */
;(function(){
/* Gentle WebAudio — unlock only after first input */
DG.Audio = (() => {
  let ctx = null, master = null, unlocked = false;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = DG.muted ? 0 : 0.28;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    unlocked = true;
  }

  function tone(freq, dur, type, vol, slide) {
    if (DG.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function scheduleTone(freq, when, dur, type, vol, slide) {
    if (DG.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = Math.max(when, c.currentTime);
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    const v = Math.min(0.12, vol || 0.06); // keep festive tune gentle
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  return {
    unlock,
    getCtx: () => ensure(),
    currentTime: () => { const c = ensure(); return c ? c.currentTime : 0; },
    scheduleTone,
    setMuted(m) {
      DG.muted = !!m;
      if (master) master.gain.value = DG.muted ? 0 : 0.28;
      try { localStorage.setItem('dg-mute', DG.muted ? '1' : '0'); } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = DG.muted ? '🔇' : '🔊';
    },
    loadMute() {
      try { DG.muted = localStorage.getItem('dg-mute') === '1'; } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = DG.muted ? '🔇' : '🔊';
      if (master) master.gain.value = DG.muted ? 0 : 0.28;
    },
    click() { tone(340, 0.05, 'triangle', 0.07); },
    soft() { tone(380, 0.08, 'sine', 0.08); },
    stamp() { tone(520, 0.09, 'triangle', 0.1); },
    fill() { tone(280, 0.1, 'sine', 0.09, 200); },
    win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'sine', 0.11), i * 85)); },
    save() { tone(660, 0.08, 'sine', 0.1); setTimeout(() => tone(880, 0.12, 'sine', 0.1), 70); },
    blocked() { tone(180, 0.1, 'triangle', 0.08, 120); setTimeout(() => tone(140, 0.12, 'sine', 0.07, 90), 90); },
    lantern() { tone(440, 0.08, 'sine', 0.09); setTimeout(() => tone(660, 0.14, 'sine', 0.1, 880), 70); },
    sparkle() { tone(880, 0.06, 'triangle', 0.06, 1320); setTimeout(() => tone(1180, 0.05, 'sine', 0.045), 40); },
    pop() { tone(520, 0.05, 'sine', 0.07, 240); }
  };
})();

})();
/* ==== 20-save.js ==== */
;(function(){
/* localStorage with try/catch + memory fallback */
DG.Save = (() => {
  function blankProfile(id) {
    const meta = DG.profiles[id];
    return {
      id,
      name: meta.defaultName,
      stickers: [],
      badges: [],
      gallery: [],
      rangoliClears: 0,
      playSeconds: 0,
      diyaPath: { maxCleared: 0, stars: {}, cleared: {} },
      quiz: { rounds: {}, stars: {}, totalCorrect: 0 },
      memory: { maxCleared: 0, stars: {}, cleared: {}, bestMs: {} },
      phuljhadi: { maxCleared: 0, stars: {}, cleared: {}, bestCombo: {} },
      sweets: { maxCleared: 0, stars: {}, cleared: {} },
      spot: { maxCleared: 0, stars: {}, cleared: {} }
    };
  }

  function blankState() {
    return {
      v: DG.VERSION,
      lastProfile: null,
      profiles: {
        alpha: blankProfile('alpha'),
        beta: blankProfile('beta')
      }
    };
  }

  function readRaw() {
    try {
      const s = localStorage.getItem(DG.SAVE_KEY);
      if (s) return JSON.parse(s);
    } catch (_) {}
    return DG.memStore;
  }

  function writeRaw(data) {
    DG.memStore = data;
    try {
      localStorage.setItem(DG.SAVE_KEY, JSON.stringify(data));
      return true;
    } catch (_) {
      return false;
    }
  }

  function load() {
    const raw = readRaw();
    if (!raw || raw.v !== DG.VERSION) {
      DG.state = blankState();
      save();
      return DG.state;
    }
    for (const id of ['alpha', 'beta']) {
      raw.profiles[id] = Object.assign(blankProfile(id), raw.profiles[id] || {});
      if (!Array.isArray(raw.profiles[id].stickers)) raw.profiles[id].stickers = [];
      if (!Array.isArray(raw.profiles[id].badges)) raw.profiles[id].badges = [];
      if (!Array.isArray(raw.profiles[id].gallery)) raw.profiles[id].gallery = [];
      if (!raw.profiles[id].diyaPath) raw.profiles[id].diyaPath = { maxCleared: 0, stars: {}, cleared: {} };
      if (!raw.profiles[id].diyaPath.stars) raw.profiles[id].diyaPath.stars = {};
      if (!raw.profiles[id].diyaPath.cleared) raw.profiles[id].diyaPath.cleared = {};
      if (!raw.profiles[id].quiz) raw.profiles[id].quiz = { rounds: {}, stars: {}, totalCorrect: 0 };
      if (!raw.profiles[id].quiz.rounds) raw.profiles[id].quiz.rounds = {};
      if (!raw.profiles[id].quiz.stars) raw.profiles[id].quiz.stars = {};
      if (!raw.profiles[id].memory) raw.profiles[id].memory = { maxCleared: 0, stars: {}, cleared: {}, bestMs: {} };
      if (!raw.profiles[id].memory.stars) raw.profiles[id].memory.stars = {};
      if (!raw.profiles[id].memory.cleared) raw.profiles[id].memory.cleared = {};
      if (!raw.profiles[id].memory.bestMs) raw.profiles[id].memory.bestMs = {};
      if (!raw.profiles[id].phuljhadi) raw.profiles[id].phuljhadi = { maxCleared: 0, stars: {}, cleared: {}, bestCombo: {} };
      if (!raw.profiles[id].phuljhadi.stars) raw.profiles[id].phuljhadi.stars = {};
      if (!raw.profiles[id].phuljhadi.cleared) raw.profiles[id].phuljhadi.cleared = {};
      if (!raw.profiles[id].phuljhadi.bestCombo) raw.profiles[id].phuljhadi.bestCombo = {};
      if (!raw.profiles[id].sweets) raw.profiles[id].sweets = { maxCleared: 0, stars: {}, cleared: {} };
      if (!raw.profiles[id].sweets.stars) raw.profiles[id].sweets.stars = {};
      if (!raw.profiles[id].sweets.cleared) raw.profiles[id].sweets.cleared = {};
      if (!raw.profiles[id].spot) raw.profiles[id].spot = { maxCleared: 0, stars: {}, cleared: {} };
      if (!raw.profiles[id].spot.stars) raw.profiles[id].spot.stars = {};
      if (!raw.profiles[id].spot.cleared) raw.profiles[id].spot.cleared = {};
    }
    DG.state = raw;
    return DG.state;
  }

  function save() {
    if (!DG.state) return false;
    return writeRaw(DG.state);
  }

  function profile(id) {
    if (!DG.state) load();
    return DG.state.profiles[id || DG.profileId || DG.state.lastProfile || 'alpha'];
  }

  function setProfile(id) {
    DG.profileId = id;
    DG.state.lastProfile = id;
    save();
  }

  function addSticker(emoji) {
    const p = profile();
    if (!p.stickers.includes(emoji)) {
      p.stickers.push(emoji);
      if (emoji === '🎨' && !p.badges.includes('rangoli')) p.badges.push('rangoli');
      if (emoji === '📖' && !p.badges.includes('quiz')) p.badges.push('quiz');
      if (emoji === '🃏' && !p.badges.includes('memory')) p.badges.push('memory');
      if (emoji === '🎆' && !p.badges.includes('phuljhadi')) p.badges.push('phuljhadi');
      if (emoji === '🍬' && !p.badges.includes('sweets')) p.badges.push('sweets');
      if (emoji === '🔍' && !p.badges.includes('spot')) p.badges.push('spot');
      // 🪔 sticker shared across games; each game pushes its own badge id
      save();
    }
  }

  function pushGallery(dataUrl) {
    const p = profile();
    p.gallery.unshift({ t: Date.now(), img: dataUrl });
    if (p.gallery.length > 12) p.gallery.length = 12;
    p.rangoliClears = (p.rangoliClears || 0) + 1;
    addSticker('🎨');
    if (p.rangoliClears >= 3) addSticker('🪷');
    save();
  }

  return { load, save, profile, setProfile, blankProfile, blankState, readRaw, writeRaw, addSticker, pushGallery };
})();

})();
/* ==== 30-art.js ==== */
;(function(){
/* Canvas art helpers — diyas, marigolds, night sky */
DG.Art = {
  drawHubBg(ctx, w, h, t) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#1a0838');
    g.addColorStop(0.55, '#2a0e48');
    g.addColorStop(1, '#1a0a18');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    // stars
    ctx.fillStyle = 'rgba(255,240,200,0.85)';
    for (let i = 0; i < 60; i++) {
      const x = ((i * 97) % w);
      const y = ((i * 53) % (h * 0.55));
      const tw = 0.5 + 0.5 * Math.sin(t * 0.002 + i);
      ctx.globalAlpha = 0.35 + 0.55 * tw;
      ctx.beginPath();
      ctx.arc(x, y, 1.2 + (i % 3) * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // moon
    ctx.beginPath();
    ctx.arc(w * 0.88, h * 0.14, 28, 0, Math.PI * 2);
    ctx.fillStyle = '#fff4c8';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w * 0.9, h * 0.12, 24, 0, Math.PI * 2);
    ctx.fillStyle = '#1a0838';
    ctx.fill();
    // marigold garland
    for (let i = 0; i < 18; i++) {
      const x = (i / 17) * w;
      const y = h * 0.78 + Math.sin(i * 0.9 + t * 0.001) * 6;
      this.marigold(ctx, x, y, 10 + (i % 3));
    }
    // diyas along bottom
    for (let i = 0; i < 7; i++) {
      const x = w * (0.12 + i * 0.12);
      this.diya(ctx, x, h * 0.9, 1 + 0.15 * Math.sin(t * 0.004 + i));
    }
  },

  marigold(ctx, x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.55, r * 0.35, r * 0.55, 0, 0, Math.PI * 2);
      ctx.fillStyle = i % 2 ? '#ff9a1a' : '#ffd24a';
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = '#c45a00';
    ctx.fill();
    ctx.restore();
  },

  diya(ctx, x, y, flicker) {
    ctx.save();
    ctx.translate(x, y);
    // bowl
    ctx.beginPath();
    ctx.ellipse(0, 4, 22, 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#c45a18';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, 0, 20, 8, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#8a3010';
    ctx.fill();
    // flame
    const fh = 18 * flicker;
    const grad = ctx.createRadialGradient(0, -fh * 0.4, 1, 0, -fh * 0.2, fh);
    grad.addColorStop(0, '#fff6c0');
    grad.addColorStop(0.4, '#ffb020');
    grad.addColorStop(1, 'rgba(255,80,0,0)');

      if (pack.length < 5) issues.push((easy ? 'easy' : 'hard') + ' songs <5');

        if (ids.has(s.id)) issues.push('dup id ' + s.id);
        ids.add(s.id);

      easy: EASY_N.length,
      hard: HARD_N.length,
      deg: DEG.length

    get,

    durationBeats,

  }

  }

  function gridNeed(lv) {
    return (lv.rows | 0) * (lv.cols | 0);
  }

  function changeNeeded(lv) {
    return (lv.paid | 0) - (lv.due | 0);
  }

  function canMakeChange(amount, coins) {
    if (amount < 0) return false;
    if (amount === 0) return true;
    const bag = [];
    (coins || []).forEach((c) => {
      for (let i = 0; i < (c.n | 0); i++) bag.push(c.v | 0);

    const reach = new Uint8Array(amount + 1);
    reach[0] = 1;
    for (let i = 0; i < bag.length; i++) {
      const v = bag[i];
      for (let s = amount; s >= v; s--) if (reach[s - v]) reach[s] = 1;
    }
    return !!reach[amount];
  }

  function forProfile(isEasy) { return isEasy ? EASY.slice() : HARD.slice(); }
  function get(isEasy, id) { return forProfile(isEasy).find((l) => l.id === id) || null; }

  function validateAll() {
    const issues = [];
    if (EASY.length < 10) issues.push('easy <10');
    if (HARD.length < 15) issues.push('hard <15');
    EASY.forEach((lv) => {
      const t = orderTotal(lv.order);

      Object.keys(lv.order).forEach((k) => {
        if (!LIST.some((s) => s.id === k)) issues.push('unknown sweet ' + k);
      });
    });
    HARD.forEach((lv) => {
      if (lv.kind === 'pack') {
        if (orderTotal(lv.order) < 1) issues.push('pack empty ' + lv.id);

        const n = gridNeed(lv);
        if (n < 1 || n > 20) issues.push('grid size ' + lv.id);

      } else if (lv.kind === 'change') {
        const need = changeNeeded(lv);
        if (need <= 0) issues.push('change <=0 ' + lv.id);
        if (!canMakeChange(need, lv.coins)) issues.push('unsolvable change ' + lv.id + ' need=' + need);
      } else issues.push('bad kind ' + lv.id);
    });
    return { ok: issues.length === 0, issues, easy: EASY.length, hard: HARD.length, sweets: LIST.length };
  }

  return {
    SWEETS: LIST, forProfile, get, sweetById, orderTotal, gridNeed, changeNeeded, canMakeChange, validateAll
  };
})();

  function placeProps(ctx, w, h, lv, mods, scale) {

    getStickers: () => (DG.Save.profile().stickers || []).slice(),
    resetSave: () => {
      DG.state = DG.Save.blankState();
      DG.Save.save();
      return true;
    },
    playToWin: async (gameId) => {
      if (gameId === 'rangoli' || !gameId) return DG.Rangoli.autoPlay();
      if (gameId === 'diyapath') return DG.DiyaPath.autoPlay(1);
      if (gameId === 'quiz') return DG.Quiz.autoPlay();
      if (gameId === 'memory') return DG.Memory.autoPlay(1);
      if (gameId === 'fireworks' || gameId === 'phuljhadi') return DG.Phuljhadi.autoPlay(1);
      if (gameId === 'sweets') return DG.Sweets.autoPlay(1);
      if (gameId === 'spot') return DG.Spot.autoPlay(1);
      return { ok: false, reason: 'coming-soon' };
    }
  };

  DG.UI.showProfiles();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();</script>

<!-- Game Night car mode -->
<style id="car-mode-css">
/* Game Night car mode: shared styles (Tesla browser, touch only, >= 64px tap targets) */
.car-back {
  position: fixed; z-index: 2147483000; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-width: 132px; height: 64px; padding: 0 20px 0 14px; box-sizing: border-box;
  border-radius: 32px; border: 3px solid rgba(255, 255, 255, 0.92);
  background: rgba(16, 20, 34, 0.86); color: #fff; text-decoration: none;
  font: 800 24px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.3px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), 0 6px 18px rgba(0, 0, 0, 0.25);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  pointer-events: auto; cursor: pointer;
}
.car-back .car-back-arrow { font-size: 30px; line-height: 1; margin-top: -3px; }
.car-back:active, .car-back.down { transform: translateY(2px) scale(0.97); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
.car-back.tl { left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); }
.car-back.bl { left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.car-back.inflow { position: relative; left: auto; top: auto; bottom: auto; flex: 0 0 auto; }

/* generic car game tweaks (none) */
</style>
<script id="car-mode-js">
window.__CAR_GAME = "diwali-games";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
</script>
