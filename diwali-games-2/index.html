<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230e121b%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%23ffd77a%27/%3E%3Ccircle cx=%2740%27 cy=%2726%27 r=%2716%27 fill=%27%230e121b%27/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<title>Diwali Games Pack 2</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0618;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#2a1048 0%,#0d0618 70%)}
#game{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:transparent}
#overlay,#hud{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:5}
#overlay>* ,#hud>*{pointer-events:auto}
.hidden{display:none!important}
.icon-btn{position:absolute;top:max(8px,env(safe-area-inset-top));z-index:40;width:48px;height:48px;border:2px solid rgba(255,200,100,.45);border-radius:14px;background:rgba(30,10,50,.75);color:#ffe7a8;font-size:22px;cursor:pointer;backdrop-filter:blur(4px)}
#muteBtn{right:max(8px,env(safe-area-inset-right))}
#fsBtn{right:max(64px,calc(env(safe-area-inset-right) + 56px))}
.icon-btn:active{transform:scale(.94)}
.toast{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);background:rgba(40,15,60,.92);border:2px solid #f5c542;border-radius:16px;padding:12px 20px;font-size:18px;z-index:50;pointer-events:none;max-width:90%;text-align:center}
.screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:auto;gap:10px}
.screen.landscape-tight{justify-content:flex-start}
.title{font-size:clamp(22px,4.2vw,36px);font-weight:800;letter-spacing:.02em;text-shadow:0 2px 0 #7a2e00,0 0 18px rgba(255,180,40,.5);color:#ffe08a;text-align:center}
.sub{font-size:clamp(13px,2.4vw,18px);color:#f0d4a8;opacity:.9;text-align:center}
.profiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.profile-card{min-width:min(42vw,220px);min-height:120px;padding:16px 18px;border-radius:20px;border:3px solid #f5c542;background:linear-gradient(160deg,#5a1f8a,#2a0a48);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:20px;font-weight:700;box-shadow:0 8px 0 #3a1058,0 0 24px rgba(255,180,40,.25)}
.profile-card .emoji{font-size:42px;line-height:1}
.profile-card .label{font-size:14px;font-weight:500;color:#ffd9a0}
.profile-card:active{transform:translateY(3px);box-shadow:0 4px 0 #3a1058}
.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(720px,100%);margin-top:6px}
@media (min-width:900px){.hub-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.game-tile{min-height:88px;border-radius:18px;border:3px solid rgba(255,210,120,.55);background:linear-gradient(145deg,#7a2a10,#3a0e28);padding:12px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35);position:relative}
.game-tile .emoji{font-size:clamp(28px,5vw,40px)}
.game-tile .name{font-size:clamp(13px,2.2vw,17px);font-weight:700;color:#fff6d8}
.game-tile .tag{font-size:11px;color:#ffd090}
.game-tile.soon{opacity:.55;cursor:default;filter:grayscale(.25)}
.game-tile.soon .badge{position:absolute;top:6px;right:6px;background:#222;color:#ffd070;font-size:10px;padding:3px 7px;border-radius:999px;border:1px solid #886}
.game-tile.playable{background:linear-gradient(145deg,#c45a12,#6a1a40);border-color:#ffd060;box-shadow:0 6px 0 #4a1020,0 0 20px rgba(255,160,40,.35)}
.game-tile:not(.soon):active{transform:translateY(2px)}
.topbar{display:flex;width:100%;max-width:1100px;align-items:center;justify-content:space-between;gap:8px;padding-right:120px}
.btn{min-height:48px;min-width:48px;padding:10px 16px;border-radius:14px;border:2px solid #f0c050;background:linear-gradient(180deg,#ff9a3c,#d45410);color:#2a1000;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #7a2a00}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7a2a00}
.btn.ghost{background:rgba(40,15,60,.7);color:#ffe7a8;border-color:rgba(255,200,100,.5);box-shadow:0 4px 0 #1a0830}
.btn.big{min-height:56px;font-size:18px;padding:12px 20px}
.btn.p1{min-height:64px;min-width:64px;font-size:18px;border-radius:18px}
.btn.danger{background:linear-gradient(180deg,#ff6a6a,#b02020);border-color:#ffaaaa;color:#fff}
.stickers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:28px}
.sticker{font-size:22px;filter:drop-shadow(0 0 4px rgba(255,200,80,.5))}
.edit-name{margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.edit-name input{min-height:44px;min-width:140px;border-radius:12px;border:2px solid #c8a040;padding:8px 12px;font-size:16px;background:#2a1040;color:#fff}
.modal{position:absolute;inset:0;background:rgba(10,4,20,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .card{background:linear-gradient(160deg,#4a2068,#1e0a38);border:3px solid #f5c542;border-radius:20px;padding:20px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.modal .card h3{font-size:22px;color:#ffe08a}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;width:min(720px,100%);padding:4px 0 12px}
.level-card{min-height:72px;min-width:64px;border-radius:16px;border:2px solid #e8b040;background:linear-gradient(160deg,#3a1860,#1a0830);color:#ffe8b0;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #120420}
.level-card .num{font-size:20px}
.level-card .meta{font-size:11px;opacity:.8;font-weight:600}
.level-card .stars{font-size:12px;min-height:16px}

.level-card.p1,.p1-mode .level-card{min-height:80px;min-width:72px;border-radius:18px}
.quiz-stars{font-size:28px;letter-spacing:2px}

.lantern-play{padding-bottom:0;overflow:hidden}
.lantern-stage{position:relative;flex:1;width:min(1180px,100%);min-height:0;border-radius:16px;border:3px solid #e8b060;overflow:hidden;background:#140828;box-shadow:0 4px 0 #1a0c04;touch-action:none}
.lantern-stage canvas{display:block;width:100%;height:100%;touch-action:none}
.lantern-hud{position:absolute;left:8px;top:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:2;font-weight:800;color:#ffe8b0;text-shadow:0 1px 3px #000}

/* Kandil Craft */
.kandil-screen{max-width:1180px;width:100%;height:100%}
.kandil-layout{display:flex;gap:10px;width:100%;max-width:1100px;flex:1;min-height:0;align-items:stretch}
.kandil-preview-wrap{flex:0 0 min(42%,420px);display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.kandil-preview-wrap canvas{width:100%;max-width:420px;height:auto;aspect-ratio:420/460;border-radius:16px;border:3px solid #e8b060;background:#1a0a30;touch-action:none}
.kandil-preview-actions{flex-wrap:wrap;justify-content:center}
.kandil-tools{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 12px;min-width:0;-webkit-overflow-scrolling:touch}
.tool-section{background:rgba(30,12,50,.55);border:2px solid rgba(232,176,96,.35);border-radius:14px;padding:8px}
.tool-label{font-size:12px;font-weight:700;color:#ffd090;margin-bottom:6px}
.tool-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tool-btn{min-height:44px;min-width:44px;padding:8px 10px;border-radius:12px;border:2px solid rgba(255,200,100,.45);background:rgba(40,15,60,.75);color:#ffe8b0;font-weight:700;font-size:13px;cursor:pointer}
.tool-btn.on{border-color:#ffd060;background:linear-gradient(180deg,#c45a12,#6a1a40);color:#fff}
.tool-btn.p1,.p1-mode .tool-btn{min-height:56px;min-width:56px;font-size:15px;border-radius:16px}
.tool-btn .tname{display:block;font-size:11px;font-weight:600}
.swatch{width:40px;height:40px;border-radius:12px;border:3px solid rgba(255,255,255,.35);cursor:pointer;padding:0}
.swatch.big,.p1-mode .swatch{width:56px;height:56px;border-radius:16px;border-width:4px}
.swatch.on{outline:3px solid #ffe08a;outline-offset:1px}
.panel-chip{width:40px;height:40px;border-radius:12px;border:3px solid #fff;font-weight:800;color:#1a0800;cursor:pointer;text-shadow:0 0 2px #fff}
.panel-chip.big{width:56px;height:56px;border-radius:16px;font-size:18px}
.panel-chip.on{box-shadow:0 0 0 3px #ffe08a}
.btn.surprise{width:100%;margin-top:4px;background:linear-gradient(180deg,#ff80c0,#a02070);border-color:#ffc0e0;color:#fff}
.kandil-target{position:absolute;right:8px;top:8px;background:rgba(20,8,40,.85);border:2px solid #e8b060;border-radius:12px;padding:6px;text-align:center;pointer-events:none}
.kandil-preview-wrap{position:relative}
.target-cv{display:block;width:90px;height:105px}
.street-wrap{width:100%;max-width:1100px;border-radius:16px;border:3px solid #e8b060;overflow:hidden;background:#140828}
.street-wrap canvas{display:block;width:100%;height:auto}
.order-card .meta{font-size:10px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .kandil-preview-wrap canvas{max-height:180px}

}

.boats-hud{position:absolute;left:8px;top:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:2;font-weight:800;color:#ffe8b0;text-shadow:0 1px 3px #000}

/* Mehndi Patterns */
.mehndi-screen{max-width:1180px;width:100%;height:100%}
.mehndi-studio{padding-bottom:0;overflow:hidden}
.mehndi-layout{display:flex;gap:10px;width:100%;max-width:1100px;flex:1;min-height:0;align-items:stretch}
.mehndi-stage{position:relative;flex:0 0 min(48%,500px);display:flex;flex-direction:column;align-items:center;min-width:0}
.mehndi-stage canvas{width:100%;max-width:500px;height:auto;aspect-ratio:500/620;border-radius:16px;border:3px solid #e8b060;background:#2a1040;touch-action:none;display:block}
.mehndi-tools{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 12px;min-width:0;-webkit-overflow-scrolling:touch}

.mehndi-hud{position:absolute;left:8px;top:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:2;font-weight:800;color:#ffe8b0;text-shadow:0 1px 3px #000;font-size:13px}
.mehndi-gal{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;overflow:auto;padding:8px;width:100%}
.mehndi-gal-card{background:rgba(30,12,50,.8);border:2px solid #e8b060;border-radius:14px;padding:8px;text-align:center}
.mehndi-gal-card canvas{border-radius:10px;display:block}
.mehndi-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(20,8,40,.9);border:2px solid #e8b060;border-radius:14px;padding:8px 14px;color:#ffe8b0;z-index:5;font-weight:700;white-space:nowrap}
.mehndi-result-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,4,20,.45);z-index:8;pointer-events:auto}

<body>
<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Diwali Games Pack 2"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="overlay"></div>
  <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  <button id="fsBtn" class="icon-btn" type="button" aria-label="Fullscreen">⛶</button>
</div>
<script>"use strict";
/* ==== 00-core.js ==== */
;(function(){
/* Diwali Games Pack 2 — core */
const DG = window.DG = {
  VERSION: 1,
  SAVE_KEY: 'diwali-games-2-v1',
  W: 1180, H: 600,
  profiles: {
    alpha: { id: 'alpha', defaultName: 'Player 1', label: 'Easy · big taps', emoji: '🪔', easy: true },
    beta:  { id: 'beta',  defaultName: 'Player 2', label: 'More challenge', emoji: '✨', easy: false }
  },
  games: [
    { id: 'lantern', name: 'Lantern Glide', emoji: '🏮', tag: 'One-touch flyer', ready: true },
    { id: 'kandil', name: 'Kandil Craft', emoji: '🎨', tag: 'Lantern designer', ready: true },
    { id: 'boats', name: 'Ayodhya Boat Ride', emoji: '⛵', tag: 'Gentle river', ready: true },
    { id: 'mehndi', name: 'Mehndi Patterns', emoji: '✋', tag: 'Trace & color', ready: true }
  ],
  memStore: null,
  state: null,
  screen: 'boot',
  muted: false,
  canvas: null,
  ctx: null,
  overlay: null,
  hud: null,
  profileId: null,
  run: null
};

DG.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
DG.lerp = (a, b, t) => a + (b - a) * t;
DG.rand = (a, b) => a + Math.random() * (b - a);
DG.pick = (arr) => arr[(Math.random() * arr.length) | 0];
DG.now = () => performance.now();

DG.toast = (msg, ms) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), ms || 1500);
};

DG.isEasy = () => {
  const p = DG.profiles[DG.profileId || 'alpha'];
  return !!(p && p.easy);
};

DG.fitCanvas = () => {
  const c = DG.canvas;
  if (!c) return;
  if (c.width !== DG.W) c.width = DG.W;
  if (c.height !== DG.H) c.height = DG.H;
};

DG.clear = (color) => {
  const ctx = DG.ctx;
  if (!ctx) return;
  ctx.fillStyle = color || '#1a0a2e';
  ctx.fillRect(0, 0, DG.W, DG.H);
};

DG.bindTap = (el, fn) => {
  if (!el) return;
  let locked = false;
  const go = (e) => {
    if (locked) return;
    locked = true;
    try { DG.Audio && DG.Audio.unlock(); } catch (_) {}
    try { fn(e); } catch (err) { console.error(err); }
    setTimeout(() => { locked = false; }, 180);
  };
  el.addEventListener('click', go);
  el.addEventListener('pointerup', (e) => {
    if (e.pointerType === 'touch') go(e);
  });
};

})();
/* ==== 10-audio.js ==== */
;(function(){
/* Gentle WebAudio — unlock only after first input */
DG.Audio = (() => {
  let ctx = null, master = null, unlocked = false;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = DG.muted ? 0 : 0.28;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    unlocked = true;
  }

  function tone(freq, dur, type, vol, slide) {
    if (DG.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function scheduleTone(freq, when, dur, type, vol, slide) {
    if (DG.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = Math.max(when, c.currentTime);
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);

    grd.addColorStop(0, 'rgba(255,200,80,0.55)');
    grd.addColorStop(1, 'rgba(255,140,40,0)');

    ctx.fill();

    ctx.fillStyle = glow ? '#ffb040' : '#e89030';

    ctx.fill();
    ctx.strokeStyle = '#a05010';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#6a3010';

    ctx.lineWidth = 2;

    ctx.lineTo(x - 8, y + r + 14);
    ctx.moveTo(x + 6, y + r);
    ctx.lineTo(x + 8, y + r + 14);
    ctx.stroke();
  }

  function loop(ts) {
    if (!state) return;
    if (!lastTs) lastTs = ts;
    const dt = Math.min(50, ts - lastTs);
    lastTs = ts;
    if (!state.paused && !state.won && !state.lost) step(dt);
    draw();
    updateHud();
    if (state && !state.won && !state.lost) raf = requestAnimationFrame(loop);
  }

  function autoplayLevel(id, easy) {
    const list = DG.LanternLevels.forProfile(easy);
    const lv = list.find((l) => l.id === id) || list[0];
    const ph = DG.LanternLevels.phys(easy);

  }

    return {
      easy: DG.LanternSolver.proveAll(true),
      hard: DG.LanternSolver.proveAll(false)
    };
  }

  return { open, startLevel, stopPlay, autoplayLevel, prove, getState: () => state };

      }

      ctx.strokeStyle = 'rgba(255,255,255,0.35)';

          ctx.moveTo(x, y - 6); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 6, y);

      }
    } else if (pat === 'zigzag') {
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      for (let y = -70; y < 70; y += 14) {
        ctx.beginPath();
        for (let x = -90; x < 90; x += 12) ctx.lineTo(x, y + ((x / 12) % 2 ? 6 : -6));

      }

      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = '#000';
      if (cutout === 'diamond') {
        ctx.beginPath();
        ctx.moveTo(0, -14); ctx.lineTo(12, 0); ctx.lineTo(0, 14); ctx.lineTo(-12, 0);

      const a1 = -Math.PI / 6 + ((i + 1) / n) * Math.PI * 2;

        ctx.closePath();

    }
    if (isLit) {
      ctx.fillStyle = hexAlpha(d.glow, 0.85);
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    }
  }

  function setDesign(d) { design = cloneDesign(d); ensurePanels(); }
  function setLit(v) { lit = !!v; }
  function hang() { return DG.Save.hangLantern(cloneDesign(design)); }
  function openOrders() { mode = 'orders'; orderId = null; renderShell(); }
  function openGallery() { mode = 'gallery'; orderId = null; cancelAnimationFrame(raf); renderShell(); }
  function startOrder(id) {
    orderId = id;

  function scoreCurrent() {

      const cur = level.pathAt(y);

      const maxX = cur.cx + cur.half - R;

    el.innerHTML = '';
    el.classList.remove('hidden');
    const p = DG.Save.profile();
    const gal = (p.mehndi && p.mehndi.gallery) || [];
    const scr = document.createElement('div');
    scr.className = 'screen landscape-tight mehndi-screen';
    scr.innerHTML = `
      <div class="topbar">
        <button class="btn ghost" id="back">← Back</button>
        <div class="title" style="font-size:clamp(18px,3.5vw,26px)">🖼 Mehndi gallery</div>
        <span></span>
      </div>
      <div class="mehndi-gal" id="gg"></div>`;
    el.appendChild(scr);
    const gg = scr.querySelector('#gg');
    if (!gal.length) {
      gg.innerHTML = '<div class="sub" style="padding:24px">No designs yet — draw one in Free mode!</div>';
    } else {
      gal.slice().reverse().forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'mehndi-gal-card';
        const cv = document.createElement('canvas');
        cv.width = 160; cv.height = 200;
        const c = cv.getContext('2d');
        try {
          const img = new Image();
          img.onload = () => c.drawImage(img, 0, 0, 160, 200);
          img.src = item.dataUrl;
        } catch (_) {}
        const label = document.createElement('div');
        label.className = 'sub';
        label.textContent = item.label || ('Design ' + (gal.length - idx));
        card.appendChild(cv);
        card.appendChild(label);
        gg.appendChild(card);
      });
    }
    DG.bindTap(scr.querySelector('#back'), () => { DG.Audio.click(); open(); });
  }

  /* ---------- Levels ---------- */
  function startLevel(id) {
    cancelAnimationFrame(raf);
    const list = levels();
    const lv = list.find((l) => l.id === id) || list[0];
    level = {
      id: lv.id,
      mode: lv.mode,
      easy: lv.easy,
      tolerance: lv.tolerance,
      path: lv.path.map((p) => ({ x: p.x, y: p.y })),
      revealed: (lv.revealed || []).map((p) => ({ x: p.x, y: p.y })),
      target: (lv.target || lv.path).map((p) => ({ x: p.x, y: p.y })),
      coverNeed: lv.coverNeed,
      lives: lv.lives || 3,
      title: lv.title
    };
    strokes = [];
    // seed revealed strokes as already-dry guide ink (non-interactive look)
    if (level.revealed.length) {
      strokes.push({
        points: level.revealed.map((p) => ({ x: p.x, y: p.y, t: 0, r: 4 })),
        colorId: 'deep',
        driedAt: 0,
        kind: 'guide',
        permanent: true
      });
    }
    tool = 'brush';
    colorId = 'classic';
    brushR = level.easy ? 12 : 8;
    drawing = false;
    lastPt = null;
    const targets = level.mode === 'trace' ? level.path : level.target;
    buildHitMask(targets, level.tolerance);
    state = {
      paused: false,
      won: false,
      lost: false,
      lives: level.easy ? Infinity : level.lives,
      accuracy: 0,
      stars: 0,
      outAttempts: 0,
      covered: 0,
      need: level.coverNeed
    };
    mode = 'play';
    renderStudio(level.mode === 'trace' ? 'mehndi-play' : 'mehndi-play', false);
  }

  function buildHitMask(pts, tol) {
    // coarse grid for coverage
    const cell = 4;
    const cols = Math.ceil(W / cell);
    const rows = Math.ceil(H / cell);
    hitMask = new Uint8Array(cols * rows);
    coverTotal = 0;
    coverHit = 0;
    const r = Math.max(1, Math.floor(tol / cell));
    pts.forEach((p) => {
      const cx = Math.floor(p.x / cell);
      const cy = Math.floor(p.y / cell);
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy > r * r) continue;
          const x = cx + dx, y = cy + dy;
          if (x < 0 || y < 0 || x >= cols || y >= rows) continue;
          const i = y * cols + x;
          if (!hitMask[i]) { hitMask[i] = 1; coverTotal++; }
        }
      }
    });
    // mark 1 = need, 2 = hit
    hitMask._cols = cols;
    hitMask._rows = rows;
    hitMask._cell = cell;
    hitMask._tol = tol;
  }

  function stampCoverage(x, y, radius) {
    if (!hitMask) return;
    const cell = hitMask._cell;
    const cols = hitMask._cols;
    const rows = hitMask._rows;
    const cx = Math.floor(x / cell);
    const cy = Math.floor(y / cell);
    const r = Math.max(1, Math.ceil(radius / cell));
    let newly = 0;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r * r) continue;
        const ix = cx + dx, iy = cy + dy;
        if (ix < 0 || iy < 0 || ix >= cols || iy >= rows) continue;
        const i = iy * cols + ix;
        if (hitMask[i] === 1) { hitMask[i] = 2; newly++; }
      }
    }
    coverHit += newly;
    if (coverTotal > 0) state.covered = coverHit / coverTotal;
  }

  function pointOnTarget(x, y) {
    if (!level) return true;
    const pts = level.mode === 'trace' ? level.path : level.target;
    const tol = level.tolerance;
    for (let i = 0; i < pts.length; i++) {
      if (Math.hypot(pts[i].x - x, pts[i].y - y) <= tol) return true;
    }
    return false;
  }

  function renderStudio(screenName, isFree) {
    DG.screen = screenName;
    const el = DG.overlay;
    el.innerHTML = '';
    el.classList.remove('hidden');
    const easy = isEasy();
    const scr = document.createElement('div');
    scr.className = 'screen mehndi-screen mehndi-studio' + (easy ? ' p1-mode' : '');
    const title = isFree
      ? 'Free henna'
      : (level.mode === 'trace' ? `Trace ${level.id}` : (level.mode === 'mirror' ? `Mirror ${level.id}` : `Finish ${level.id}`));
    scr.innerHTML = `
      <div class="topbar" style="padding-right:100px">
        <button class="btn ghost" id="quit">←</button>
        <div class="sub" id="titleLine">${title}</div>
        <button class="btn ghost" id="undo">↩</button>
      </div>
      <div class="mehndi-layout">
        <div class="mehndi-stage" id="stage">
          <canvas id="mehndiCv" width="${W}" height="${H}"></canvas>
          <div class="mehndi-hud" id="hud"></div>
        </div>
        <div class="mehndi-tools" id="tools"></div>
      </div>`;
    el.appendChild(scr);
    canvas = scr.querySelector('#mehndiCv');
    ctx = canvas.getContext('2d');
    buildTools(scr.querySelector('#tools'), isFree);
    bindDraw(scr.querySelector('#stage'));
    DG.bindTap(scr.querySelector('#quit'), () => {
      DG.Audio.click();
      cancelAnimationFrame(raf);
      if (isFree) open();
      else open();
    });
    DG.bindTap(scr.querySelector('#undo'), () => {
      DG.Audio.click();
      // remove last non-guide stroke
      for (let i = strokes.length - 1; i >= 0; i--) {
        if (strokes[i].kind !== 'guide') { strokes.splice(i, 1); break; }
      }
      if (!isFree && level) {
        // rebuild coverage from player strokes
        const targets = level.mode === 'trace' ? level.path : level.target;
        buildHitMask(targets, level.tolerance);
        strokes.forEach((s) => {
          if (s.kind === 'guide') return;
          s.points.forEach((p) => stampCoverage(p.x, p.y, (p.r || brushR) + 2));
        });
        updateHud();
      }
    });
    updateHud();
    lastTs = 0;
    loop(DG.now());
  }

  let lastTs = 0;
  function loop(ts) {
    if (!canvas) return;
    raf = requestAnimationFrame(loop);
    const now = ts || DG.now();
    draw(now);
    if (mode === 'play' && state && !state.won && !state.lost) {
      checkWin();
    }
  }

  function buildTools(host, isFree) {
    host.innerHTML = '';
    const colors = document.createElement('div');
    colors.className = 'mehndi-swatches';
    HENNA.forEach((h) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mehndi-swatch' + (colorId === h.id ? ' on' : '');
      b.style.background = h.wet;
      b.title = h.name;
      DG.bindTap(b, () => {
        colorId = h.id;
        tool = 'brush';
        buildTools(host, isFree);
      });
      colors.appendChild(b);
    });
    host.appendChild(colors);

    const stamps = document.createElement('div');
    stamps.className = 'mehndi-stamps';
    STAMPS.forEach((s) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn ghost mehndi-stamp' + (tool === 'stamp' && stampId === s.id ? ' on' : '');
      b.textContent = s.emoji + ' ' + s.name;
      DG.bindTap(b, () => {
        tool = 'stamp';
        stampId = s.id;
        buildTools(host, isFree);
      });
      stamps.appendChild(b);
    });
    host.appendChild(stamps);

    const brushBtn = document.createElement('button');
    brushBtn.type = 'button';
    brushBtn.className = 'btn' + (tool === 'brush' ? ' big' : ' ghost');
    brushBtn.textContent = '✏️ Cone brush';
    DG.bindTap(brushBtn, () => { tool = 'brush'; buildTools(host, isFree); });
    host.appendChild(brushBtn);

    if (isFree) {
      const save = document.createElement('button');
      save.type = 'button';
      save.className = 'btn big p1';
      save.textContent = '💾 Save to gallery';
      DG.bindTap(save, () => { DG.Audio.success && DG.Audio.success(); saveToGallery(); });
      host.appendChild(save);
      const clr = document.createElement('button');
      clr.type = 'button';
      clr.className = 'btn ghost';
      clr.textContent = 'Clear';
      DG.bindTap(clr, () => { strokes = []; });
      host.appendChild(clr);
    } else {
      const done = document.createElement('button');
      done.type = 'button';
      done.className = 'btn big p1';
      done.id = 'checkBtn';
      done.textContent = level.easy ? '⭐ Done!' : '✓ Check';
      DG.bindTap(done, () => { DG.Audio.click(); finishCheck(true); });
      host.appendChild(done);
    }
  }

  function updateHud() {
    const hud = document.querySelector('#hud');
    if (!hud) return;
    if (mode === 'free') {
      hud.innerHTML = `<span>Henna · ${henna().name}</span><span>Stamps ready</span>`;
      return;
    }
    if (!state) return;
    const lives = state.lives === Infinity ? '∞' : '❤'.repeat(Math.max(0, state.lives));
    const pct = Math.round((state.covered || 0) * 100);
    hud.innerHTML = `<span>${lives}</span><span>Cover ${pct}%</span><span>${level ? level.title : ''}</span>`;
  }

  function canvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    const x = ((src.clientX - rect.left) / rect.width) * W;
    const y = ((src.clientY - rect.top) / rect.height) * H;
    return { x, y };
  }

  function bindDraw(stage) {
    const down = (e) => {
      e.preventDefault();
      if (!state || state.won || state.lost || state.paused) return;
      try { DG.Audio.unlock(); } catch (_) {}
      const p = canvasPos(e);
      if (tool === 'stamp') {
        placeStamp(p.x, p.y);
        return;
      }
      drawing = true;
      lastPt = p;
      const now = DG.now();
      const stroke = {
        points: [{ x: p.x, y: p.y, t: now, r: brushR }],
        colorId,
        driedAt: null,
        kind: 'brush'
      };
      strokes.push(stroke);
      if (mode === 'play') {
        if (!pointOnTarget(p.x, p.y)) {
          penalizeMiss();
        } else {
          stampCoverage(p.x, p.y, brushR + 4);
        }
      }
      updateHud();
    };
    const move = (e) => {
      if (!drawing) return;
      e.preventDefault();
      const p = canvasPos(e);
      const stroke = strokes[strokes.length - 1];
      if (!stroke || stroke.kind !== 'brush') return;
      const now = DG.now();
      // smooth: only add if moved enough
      const lp = stroke.points[stroke.points.length - 1];
      if (Math.hypot(p.x - lp.x, p.y - lp.y) < 2) return;
      stroke.points.push({ x: p.x, y: p.y, t: now, r: brushR });
      if (mode === 'play') {
        if (!pointOnTarget(p.x, p.y)) {
          // allow slight overshoot; count miss if far
          const pts = level.mode === 'trace' ? level.path : level.target;
          let min = 1e9;
          for (let i = 0; i < pts.length; i++) {
            const d = Math.hypot(pts[i].x - p.x, pts[i].y - p.y);
            if (d < min) min = d;
          }
          if (min > level.tolerance * 1.35) penalizeMiss();
          else stampCoverage(p.x, p.y, brushR + 4);
        } else {
          stampCoverage(p.x, p.y, brushR + 4);
        }
      }
      updateHud();
    };
    const up = (e) => {
      if (!drawing) return;
      e.preventDefault();
      drawing = false;
      const stroke = strokes[strokes.length - 1];
      if (stroke && stroke.kind === 'brush') stroke.driedAt = DG.now() + 2800;
      lastPt = null;
    };
    ['pointerdown', 'mousedown', 'touchstart'].forEach((ev) => stage.addEventListener(ev, down, { passive: false }));
    ['pointermove', 'mousemove', 'touchmove'].forEach((ev) => stage.addEventListener(ev, move, { passive: false }));
    ['pointerup', 'pointerleave', 'mouseup', 'touchend', 'touchcancel'].forEach((ev) => stage.addEventListener(ev, up, { passive: false }));
  }

  function penalizeMiss() {
    if (!state || state.won || state.lost || level.easy) return;
    // debounce misses
    const now = DG.now();
    if (state._lastMiss && now - state._lastMiss < 450) return;
    state._lastMiss = now;
    state.outAttempts = (state.outAttempts || 0) + 1;
    if (state.lives !== Infinity) {
      state.lives -= 1;
      try { DG.Audio.bump && DG.Audio.bump(); } catch (_) {}
      if (state.lives <= 0) {
        state.lost = true;
        showResult(false);
      }
    }
    updateHud();
  }

  function placeStamp(x, y) {
    const now = DG.now();
    const pts = stampPoints(stampId, x, y, isEasy() ? 1.25 : 1);
    strokes.push({
      points: pts.map((p) => ({ x: p.x, y: p.y, t: now, r: p.r || 3 })),
      colorId,
      driedAt: now + 2500,
      kind: 'stamp',
      stampId
    });
    if (mode === 'play') {
      let any = false, bad = false;
      pts.forEach((p) => {
        if (pointOnTarget(p.x, p.y)) { stampCoverage(p.x, p.y, 6); any = true; }
        else bad = true;
      });
      if (bad && !any && !level.easy) penalizeMiss();
    }
    updateHud();
  }

  function stampPoints(id, x, y, scale) {
    const pts = [];
    if (id === 'paisley') {
      for (let i = 0; i <= 24; i++) {
        const t = i / 24;
        const a = t * Math.PI * 1.6 - 0.3;
        const r = 22 * scale * (0.35 + 0.65 * Math.sin(t * Math.PI));
        pts.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * 1.35, r: 3 * scale });
      }
    } else if (id === 'flower') {
      for (let p = 0; p < 6; p++) {
        const a = (p / 6) * Math.PI * 2;
        for (let i = 0; i <= 8; i++) {
          const t = i / 8;
          pts.push({
            x: x + Math.cos(a) * 18 * scale * t,
            y: y + Math.sin(a) * 18 * scale * t,
            r: 3.5 * scale
          });
        }
      }
      pts.push({ x, y, r: 5 * scale });
    } else if (id === 'vine') {
      for (let i = 0; i <= 20; i++) {
        const t = i / 20;
        pts.push({
          x: x + (t - 0.5) * 50 * scale,
          y: y + Math.sin(t * Math.PI * 2) * 12 * scale,
          r: 3 * scale
        });
      }
    } else if (id === 'dots') {
      for (let i = -2; i <= 2; i++) {
        pts.push({ x: x + i * 10 * scale, y: y, r: 4 * scale });
        if (i !== 0) pts.push({ x: x, y: y + i * 10 * scale, r: 3 * scale });
      }
    } else if (id === 'mandala') {
      for (let ring = 1; ring <= 3; ring++) {
        const n = 8 * ring;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          pts.push({
            x: x + Math.cos(a) * 12 * ring * scale * 0.7,
            y: y + Math.sin(a) * 12 * ring * scale * 0.7,
            r: 2.5 * scale
          });
        }
      }
      pts.push({ x, y, r: 5 * scale });
    }
    return pts;
  }

  function checkWin() {
    if (!state || state.won || state.lost) return;
    if ((state.covered || 0) >= level.coverNeed) {
      finishCheck(false);
    }
  }

  function finishCheck(manual) {
    if (!state || state.won || state.lost) return;
    const cov = state.covered || 0;
    if (level.easy) {
      // no fail — award stars by coverage
      state.won = true;
      let stars = 1;
      if (cov >= 0.55) stars = 2;
      if (cov >= level.coverNeed) stars = 3;
      if (cov < 0.25 && manual) stars = 1; // still celebrate
      state.stars = stars;
      state.accuracy = cov;
      persistProgress(stars);
      showResult(true);
      return;
    }
    // hard: need coverNeed, else if manual just report; lives already handle misses
    if (cov >= level.coverNeed) {
      state.won = true;
      state.accuracy = cov;
      let stars = 1;
      if (cov >= 0.8) stars = 2;
      if (cov >= 0.92 && state.lives >= 2) stars = 3;
      state.stars = stars;
      persistProgress(stars);
      showResult(true);
    } else if (manual) {
      // flash hint — not enough
      const hint = document.createElement('div');
      hint.className = 'mehndi-toast';
      hint.textContent = 'Keep going — cover more of the pattern!';
      document.querySelector('.mehndi-stage')?.appendChild(hint);
      setTimeout(() => hint.remove(), 1600);
    }
  }

  function persistProgress(stars) {
    const p = DG.Save.profile();
    if (!p.mehndi) p.mehndi = { maxCleared: 0, stars: {}, cleared: {}, gallery: [] };
    p.mehndi.cleared[level.id] = true;
    p.mehndi.maxCleared = Math.max(p.mehndi.maxCleared || 0, level.id);
    const prev = p.mehndi.stars[level.id] || 0;
    p.mehndi.stars[level.id] = Math.max(prev, stars);
    DG.Save.addSticker('✋');
    DG.Save.save();
  }

  function saveToGallery() {
    // force dry for snapshot
    const p = DG.Save.profile();
    if (!p.mehndi) p.mehndi = { maxCleared: 0, stars: {}, cleared: {}, gallery: [] };
    draw(DG.now() + 100000, true);
    let dataUrl = '';
    try { dataUrl = canvas.toDataURL('image/png'); } catch (_) { dataUrl = ''; }
    p.mehndi.gallery.push({
      dataUrl,
      label: 'Henna ' + new Date().toLocaleDateString(),
      t: Date.now()
    });
    if (p.mehndi.gallery.length > 24) p.mehndi.gallery = p.mehndi.gallery.slice(-24);
    DG.Save.addSticker('✋');
    DG.Save.save();
    const toast = document.createElement('div');
    toast.className = 'mehndi-toast';
    toast.textContent = 'Saved to gallery!';
    document.querySelector('.mehndi-stage')?.appendChild(toast);
    setTimeout(() => toast.remove(), 1400);
  }

  function showResult(won) {
    cancelAnimationFrame(raf);
    mode = 'result';
    DG.screen = 'mehndi-result';
    // keep drawing final frame under modal
    draw(DG.now() + 5000, true);
    const el = DG.overlay;
    const box = document.createElement('div');
    box.className = 'mehndi-result';
    const stars = won ? '★'.repeat(state.stars) + '☆'.repeat(3 - state.stars) : '—';
    box.innerHTML = `
      <h3>${won ? (level.easy ? 'Beautiful!' : 'Pattern complete!') : 'Try again'}</h3>
      <div class="stars-lg">${stars}</div>
      <div class="sub">Cover ${Math.round((state.accuracy || state.covered || 0) * 100)}%</div>
      <div class="row" style="gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn big p1" id="again">${won ? 'Next' : 'Retry'}</button>
        <button class="btn ghost" id="menu">Levels</button>
      </div>`;
    // attach over studio
    const stage = el.querySelector('.mehndi-stage') || el;
    const wrap = document.createElement('div');
    wrap.className = 'mehndi-result-wrap';
    wrap.appendChild(box);
    el.appendChild(wrap);
    const list = levels();
    DG.bindTap(box.querySelector('#again'), () => {
      DG.Audio.click();
      wrap.remove();
      if (won) {
        const next = list.find((l) => l.id === level.id + 1);
        if (next) startLevel(next.id);
        else open();
      } else startLevel(level.id);
    });
    DG.bindTap(box.querySelector('#menu'), () => { DG.Audio.click(); open(); });
    try { if (won) DG.Audio.success && DG.Audio.success(); } catch (_) {}
  }

  /* ---------- Drawing ---------- */
  function drawHand(c) {
    const { cx, cy, rx, ry } = PALM;
    c.save();
    // palm
    c.fillStyle = '#f3d2b0';
    c.strokeStyle = '#c49870';
    c.lineWidth = 3;
    c.beginPath();
    c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    // fingers
    const fingers = [
      { a: -1.15, len: 110, w: 22 },
      { a: -0.55, len: 125, w: 24 },
      { a: -0.05, len: 130, w: 24 },
      { a: 0.45, len: 118, w: 22 },
      { a: 1.05, len: 90, w: 26 } // thumb-ish
    ];
    fingers.forEach((f, i) => {
      const baseX = cx + Math.cos(f.a - Math.PI / 2) * (rx * 0.55);
      const baseY = cy - ry * 0.85 + Math.sin(f.a) * 8;
      const tipX = baseX + Math.cos(f.a - Math.PI / 2) * f.len;
      const tipY = baseY + Math.sin(f.a - Math.PI / 2) * f.len;
      c.beginPath();
      c.lineWidth = f.w;
      c.lineCap = 'round';
      c.strokeStyle = '#f3d2b0';
      c.moveTo(baseX, baseY);
      c.lineTo(tipX, tipY);
      c.stroke();
      c.beginPath();
      c.lineWidth = 2;
      c.strokeStyle = '#c49870';
      c.moveTo(baseX, baseY);
      c.lineTo(tipX, tipY);
      c.stroke();
    });
    // wrist
    c.beginPath();
    c.fillStyle = '#f3d2b0';
    c.ellipse(cx, cy + ry * 0.95, rx * 0.7, 36, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  function strokeColor(stroke, now) {
    const h = HENNA.find((x) => x.id === stroke.colorId) || HENNA[1];
    if (stroke.kind === 'guide') return 'rgba(120,50,30,0.35)';
    if (stroke.driedAt == null) return h.wet;
    if (now >= stroke.driedAt) return h.dry;
    const t = Math.max(0, Math.min(1, 1 - (stroke.driedAt - now) / 2800));
    // lerp wet→dry roughly via alpha mix
    return mixHex(h.wet, h.dry, t);
  }

  function mixHex(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
    const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl = Math.round(ab + (bb - ab) * t);
    return `rgb(${r},${g},${bl})`;
  }

  function drawStroke(c, stroke, now) {
    if (!stroke.points.length) return;
    const col = strokeColor(stroke, now);
    c.strokeStyle = col;
    c.fillStyle = col;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    if (stroke.kind === 'guide') {
      // dotted guide
      c.setLineDash([4, 10]);
      c.lineWidth = 5;
      c.beginPath();
      stroke.points.forEach((p, i) => {
        if (i === 0) c.moveTo(p.x, p.y);
        else c.lineTo(p.x, p.y);
      });
      c.stroke();
      c.setLineDash([]);
      return;
    }
    if (stroke.points.length === 1) {
      const p = stroke.points[0];
      c.beginPath();
      c.arc(p.x, p.y, p.r || 4, 0, Math.PI * 2);
      c.fill();
      return;
    }
    c.lineWidth = (stroke.points[0].r || brushR) * 1.6;
    c.beginPath();
    stroke.points.forEach((p, i) => {
      if (i === 0) c.moveTo(p.x, p.y);
      else c.lineTo(p.x, p.y);
    });
    c.stroke();
  }

  function drawGuidePath(c) {
    if (!level) return;
    if (level.mode === 'trace') {
      c.save();
      c.setLineDash([5, 12]);
      c.strokeStyle = 'rgba(140,60,40,0.45)';
      c.lineWidth = 6;
      c.lineCap = 'round';
      c.beginPath();
      level.path.forEach((p, i) => {
        if (i === 0) c.moveTo(p.x, p.y);
        else c.lineTo(p.x, p.y);
      });
      c.stroke();
      // start star
      const s = level.path[0];
      c.setLineDash([]);
      c.fillStyle = '#f0c040';
      c.font = '22px sans-serif';
      c.fillText('★', s.x - 8, s.y + 6);
      c.restore();
    } else {
      // faint target ghost for hard modes
      c.save();
      c.setLineDash([3, 8]);
      c.strokeStyle = 'rgba(140,60,40,0.28)';
      c.lineWidth = 4;
      c.beginPath();
      level.target.forEach((p, i) => {
        if (i === 0) c.moveTo(p.x, p.y);
        else c.lineTo(p.x, p.y);
      });
      c.stroke();
      c.setLineDash([]);
      c.restore();
    }
  }

  function draw(now, forceDry) {
    if (!ctx) return;
    const c = ctx;
    const t = forceDry ? now + 1e7 : now;
    c.clearRect(0, 0, W, H);
    // background cloth
    c.fillStyle = '#2a1040';
    c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,200,100,0.05)';
    for (let i = 0; i < 40; i++) {
      c.fillRect((i * 97) % W, (i * 53) % H, 40, 2);
    }
    drawHand(c);
    if (mode === 'play' || mode === 'result') drawGuidePath(c);
    strokes.forEach((s) => drawStroke(c, s, t));
  }

  /* ---------- Hooks for smoke / content ---------- */
  function prove() {
    return {
      easy: DG.MehndiLevels.proveAll(true),
      hard: DG.MehndiLevels.proveAll(false)
    };
  }

  /** Auto-trace the current (or given) level perfectly within tolerance */
  function autoComplete(id) {
    if (id != null) startLevel(id);
    if (!level || !state) return { ok: false };
    const pts = level.mode === 'trace' ? level.path : level.target;
    const now = DG.now();
    const stroke = {
      points: pts.map((p) => ({ x: p.x, y: p.y, t: now, r: Math.max(6, level.tolerance * 0.35) })),
      colorId: 'maroon',
      driedAt: now + 500,
      kind: 'brush'
    };
    strokes.push(stroke);
    pts.forEach((p) => stampCoverage(p.x, p.y, level.tolerance * 0.9));
    updateHud();
    finishCheck(true);
    return {
      ok: !!state.won,
      covered: state.covered,
      stars: state.stars,
      level: level.id,
      mode: level.mode
    };
  }

  function getState() {
    return state && level ? {
      level: level.id,
      mode: level.mode,
      lives: state.lives,
      covered: state.covered,
      won: state.won,
      lost: state.lost,
      stars: state.stars,
      accuracy: state.accuracy,
      strokeCount: strokes.filter((s) => s.kind !== 'guide').length
    } : state;
  }

  function galleryCount() {
    const p = DG.Save.profile();
    return ((p.mehndi && p.mehndi.gallery) || []).length;
  }

  return {
    open,
    openFree,
    openGallery,
    startLevel,
    autoComplete,
    prove,
    getState,
    galleryCount,
    HENNA,
    STAMPS,
    saveToGallery,
    // expose for content check hook used by smoke
    checkPath: (easy, id) => {
      const list = easy ? DG.MehndiLevels.easy : DG.MehndiLevels.hard;
      const lv = list.find((l) => l.id === id) || list[0];
      return DG.MehndiLevels.checkCompletable(lv);
    }
  };
})();

})();

<script id="car-mode-js">
window.__CAR_GAME = "diwali-games-2";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
</script>
