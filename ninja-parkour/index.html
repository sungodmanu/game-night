<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

.hidden{display:none!important}

.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;width:100%;max-width:760px;max-height:48vh;overflow:auto;padding:4px}

.world-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.world-tab{min-height:48px;padding:10px 14px;border-radius:14px;border:3px solid transparent;background:rgba(255,255,255,.12);color:#fff;font-weight:800;cursor:pointer;font-size:14px}
.world-tab.sel{border-color:#ffe566;background:rgba(255,229,102,.25)}
.hint{font-size:14px;opacity:.9;background:rgba(255,229,102,.18);border:2px solid rgba(255,229,102,.35);padding:8px 12px;border-radius:12px;max-width:520px;text-align:center}
#rotateTip{position:absolute;left:50%;top:calc(56px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:0 12px;max-width:min(340px,92vw)}
#rotateTip.hidden{display:none!important}
#rotateTip .hint-banner{pointer-events:none;background:rgba(10,16,36,.88);border:2px solid rgba(255,229,102,.45);border-radius:16px;padding:10px 14px;font-weight:800;font-size:14px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);line-height:1.3}
#hudLevel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(42vw,220px);font-size:clamp(12px,3.2vw,16px)}
.chip#hudLevel,.hud-left .chip:last-child{white-space:nowrap;max-width:min(46vw,240px);overflow:hidden;text-overflow:ellipsis;font-size:clamp(12px,3.1vw,15px)}
@media (max-height:650px){
  .profile-card{min-height:150px;width:min(230px,40vw)}

}
@media (orientation:portrait) and (max-width:500px){
  .profile-card{width:min(300px,80vw)}
}
</style>

<body>
<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Ninja Parkour"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="touch" class="hidden" aria-hidden="true"></div>
  <div id="overlay"></div>
  <div id="rotateTip" class="hidden" role="status" aria-live="polite">
    <div class="hint-banner">Turn sideways 🔄 for the best view</div>
  </div>
  <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  <button id="fsBtn" class="icon-btn" type="button" aria-label="Fullscreen">⛶</button>
</div>
<script>"use strict";
/* ==== 00-core.js ==== */
;(function(){
/* Ninja Parkour — core namespace & helpers */
const NP = window.NP = {
  VERSION: 1,
  SAVE_KEY: 'ninja-parkour-v1',
  W: 1180, H: 600,
  TILE: 40,
  profiles: {
    p1: {
      id: 'p1', defaultName: 'Player 1', label: 'Gentle',
      infiniteLives: true, lives: 99,
      coyoteMs: 180, bufferMs: 160,
      holdJumpMs: 250, releaseCut: 0.6,
      jumpH: 3.3, jumpT: 0.40, fallMult: 1.55,
      jumpMult: 1.0, guardSpeed: 0.7,
      hurtInset: 8, cornerCorr: 6, ledgeProbe: 20, pickupPad: 18,
      hitPad: 10, checkpoints: 'all', slideWindow: 1.2,
      touchBtn: 80, minTapTiles: 1.35
    },
    p2: {
      id: 'p2', defaultName: 'Player 2', label: 'Adventure',
      infiniteLives: false, lives: 3,
      coyoteMs: 120, bufferMs: 110,
      holdJumpMs: 200, releaseCut: 0.58,
      jumpH: 3.0, jumpT: 0.38, fallMult: 1.75,
      jumpMult: 1.0, guardSpeed: 1.0,
      hurtInset: 6, cornerCorr: 4, ledgeProbe: 12, pickupPad: 8,
      hitPad: 4, checkpoints: 'marked', slideWindow: 1.0,
      touchBtn: 68, minTapTiles: 1.1
    }
  },
  outfits: [
    { id: 'midnight', name: 'Midnight', color: '#2b2f4a', accent: '#7ec8ff', unlock: 0 },
    { id: 'ember', name: 'Ember', color: '#c44536', accent: '#ffb347', unlock: 8 },
    { id: 'jade', name: 'Jade', color: '#1f7a4c', accent: '#7dff9a', unlock: 16 },
    { id: 'orchid', name: 'Orchid', color: '#7a3e9d', accent: '#ff9ad4', unlock: 24 },
    { id: 'solar', name: 'Solar', color: '#d4a017', accent: '#ffe566', unlock: 40 },
    { id: 'frost', name: 'Frost', color: '#3d6b8a', accent: '#c8f0ff', unlock: 60 },
    { id: 'shadow', name: 'Shadow', color: '#111218', accent: '#9aa0b8', unlock: 80 },
    { id: 'rainbow', name: 'Rainbow', color: '#ff5e7a', accent: '#7ec8ff', unlock: 100 }
  ],
  worlds: [
    { id: 'lantern', name: 'Lantern Rooftops', short: 'Rooftops', sky: ['#1a1430', '#3a2060'], accent: '#ffb347', ground: '#3a2a48' },
    { id: 'harbor', name: 'Neon Harbor', short: 'Harbor', sky: ['#061428', '#0a3a5c'], accent: '#39f0ff', ground: '#143048' },
    { id: 'cloud', name: 'Cloud Towers', short: 'Cloud', sky: ['#6eb6ff', '#c8e8ff'], accent: '#ffe566', ground: '#8ec8f0', light: true },
    { id: 'storm', name: 'Storm Citadel', short: 'Storm', sky: ['#0a0e18', '#1a2848'], accent: '#a78bfa', ground: '#1e2438' }
  ],
  memStore: null,
  state: null,
  screen: 'boot',
  raf: 0,
  lastT: 0,
  muted: false,
  keys: Object.create(null),
  touch: Object.create(null),
  canvas: null,
  ctx: null,
  overlay: null,
  hud: null,
  touchEl: null,
  run: null,
  race: null,
  cam: { x: 0, y: 0 },
  pointers: Object.create(null)
};

NP.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
NP.lerp = (a, b, t) => a + (b - a) * t;
NP.rand = (a, b) => a + Math.random() * (b - a);
NP.pick = (arr) => arr[(Math.random() * arr.length) | 0];
NP.seeded = (seed) => {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
};
NP.now = () => performance.now();
NP.meta = () => NP.profiles[(NP.state && NP.state.lastProfile) || 'p1'];
NP.toast = (msg, ms) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), ms || 1400);
};
NP.BASE_W = 1180; NP.BASE_H = 600;
NP.fitCanvas = () => {
  const c = NP.canvas;
  if (!c) return;
  const iw = window.innerWidth || NP.BASE_W;
  const ih = window.innerHeight || NP.BASE_H;
  const portrait = ih > iw * 1.05;
  NP.portrait = portrait;
  let wantW = NP.BASE_W, wantH = NP.BASE_H;
  if (portrait) {
    // Aim for on-screen ninja ≥36px (48 * scale). Prefer matching device aspect
    // so width fills; keep look-ahead ≥ ~280 world px.
    const minNinja = 36;
    const targetScale = Math.max(0.82, minNinja / 48); // ≥0.82 → ≥39px headroom
    wantW = Math.round(Math.min(500, Math.max(380, iw / targetScale)));
    wantH = Math.round(wantW * (ih / Math.max(1, iw)));
    wantH = NP.clamp(wantH, 720, 1200);
  }
  if (NP.W !== wantW || NP.H !== wantH) {
    NP.W = wantW; NP.H = wantH;
  }
  if (c.width !== NP.W) c.width = NP.W;
  if (c.height !== NP.H) c.height = NP.H;
  c.classList.toggle('portrait', !!portrait);
  NP.refreshRotateHint && NP.refreshRotateHint();
};
NP.clear = (color) => {
  const ctx = NP.ctx;
  ctx.fillStyle = color || '#0b1224';
  ctx.fillRect(0, 0, NP.W, NP.H);
};
NP.roundRect = (ctx, x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};
NP.rectHit = (a, b, pad) => {
  pad = pad || 0;
  return a.x + pad < b.x + b.w - pad && a.x + a.w - pad > b.x + pad &&
    a.y + pad < b.y + b.h - pad && a.y + a.h - pad > b.y + pad;
};

})();
/* ==== 10-audio.js ==== */
;(function(){
/* WebAudio SFX — only after first user input */
NP.Audio = (() => {
  let ctx = null, master = null, unlocked = false;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = NP.muted ? 0 : 0.3;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    unlocked = true;
  }

  function tone(freq, dur, type, vol, slide) {
    if (NP.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol) {
    if (NP.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const n = Math.max(1, (c.sampleRate * dur) | 0);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    g.gain.value = vol || 0.05;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1000;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  return {
    unlock,
    setMuted(m) {
      NP.muted = !!m;
      if (master) master.gain.value = NP.muted ? 0 : 0.3;
      try { localStorage.setItem('np-mute', NP.muted ? '1' : '0'); } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = NP.muted ? '🔇' : '🔊';
    },
    loadMute() {
      try { NP.muted = localStorage.getItem('np-mute') === '1'; } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = NP.muted ? '🔇' : '🔊';
    },
    click() { tone(340, 0.05, 'triangle', 0.06); },
    jump() { tone(280, 0.1, 'square', 0.07, 520); },
    doubleJump() { tone(360, 0.09, 'square', 0.06, 640); },
    land() { noise(0.05, 0.04); },
    slide() { noise(0.12, 0.035); tone(120, 0.1, 'sawtooth', 0.03, 80); },
    grab() { tone(420, 0.07, 'triangle', 0.07); },
    scroll() { tone(660, 0.06, 'sine', 0.09); setTimeout(() => tone(880, 0.08, 'sine', 0.07), 40); },
    hurt() { tone(160, 0.16, 'sawtooth', 0.08, 70); },
    win() { [392, 494, 587, 784].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'sine', 0.09), i * 70)); },
    checkpoint() { tone(520, 0.08, 'sine', 0.08); setTimeout(() => tone(700, 0.1, 'triangle', 0.07), 50); },
    whoosh() { tone(200, 0.1, 'sawtooth', 0.04, 90); noise(0.08, 0.03); }
  };
})();

})();
/* ==== 20-save.js ==== */
;(function(){
/* localStorage per-profile saves with in-memory fallback + Continue */
NP.Save = (() => {
  function blankProfile(id) {
    const meta = NP.profiles[id];
    return {
      id,
      name: meta.defaultName,
      maxLevel: 1,
      cleared: {},
      scrolls: 0,
      totalScrolls: 0,
      outfit: 'midnight',
      unlockedOutfits: ['midnight'],
      lives: meta.lives,
      playSeconds: 0,
      checkpoint: null,
      continueLevel: null
    };
  }

  function blankState() {
    return {
      v: NP.VERSION,
      lastProfile: null,
      profiles: { p1: blankProfile('p1'), p2: blankProfile('p2') }
    };
  }

  function readRaw() {
    try {
      const s = localStorage.getItem(NP.SAVE_KEY);
      if (s) return JSON.parse(s);
    } catch (_) {}
    return NP.memStore;
  }

  function writeRaw(data) {
    NP.memStore = data;
    try {
      localStorage.setItem(NP.SAVE_KEY, JSON.stringify(data));
      return true;
    } catch (_) {
      return false;
    }
  }

  function load() {
    const raw = readRaw();
    if (!raw || raw.v !== NP.VERSION) {
      NP.state = blankState();
      save();
      return NP.state;
    }
    for (const id of ['p1', 'p2']) {
      raw.profiles[id] = Object.assign(blankProfile(id), raw.profiles[id] || {});
      if (!raw.profiles[id].cleared) raw.profiles[id].cleared = {};
      if (!Array.isArray(raw.profiles[id].unlockedOutfits)) raw.profiles[id].unlockedOutfits = ['midnight'];
    }
    NP.state = raw;
    return NP.state;
  }

  function save() {
    if (!NP.state) return false;
    return writeRaw(NP.state);

    const path = (level.path || []).concat([{ x: level.goal.x, y: level.goal.y }]);

      NP.Game.updateGuards(level, dt, meta.guardSpeed || 1);
      const target = path[Math.min(wi, path.length - 1)];
