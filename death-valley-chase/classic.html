<!DOCTYPE html>

<title>Death Valley Chase</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;width:100%;overflow:hidden;background:#1a1020;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 0%,#5a2a28 0%,#1a1020 70%)}
#game{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#c4844a;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#game.portrait{width:100%;height:auto;max-height:94dvh;max-width:100%;object-fit:contain}
#overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
#overlay>*{pointer-events:auto}
#overlay.sheet{align-items:flex-end;justify-content:center}
#overlay.sheet .panel{max-width:none;width:100%;height:auto;max-height:48%;border-radius:0;background:transparent;border:none;box-shadow:none;padding:0;overflow:visible;display:flex;flex-direction:column;justify-content:flex-end;backdrop-filter:none;-webkit-backdrop-filter:none}
/* HUD sits below the top-left Games back button and the top-right icon cluster */
#hud{position:absolute;left:0;right:0;top:calc(72px + env(safe-area-inset-top));padding:0 12px;display:flex;gap:8px;align-items:center;justify-content:center;pointer-events:none;z-index:5;font-weight:800;flex-wrap:wrap}
#hud.hidden,#touch.hidden,#pauseBtn.hidden{display:none!important}
.hud-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(20,10,16,.62);border:2px solid rgba(255,224,150,.35);font-size:15px;text-shadow:0 1px 2px #000;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.icon-btn{position:absolute;z-index:20;width:48px;height:48px;min-width:48px;min-height:48px;border:none;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
/* ≥12px gaps between Pause, Mute, Fullscreen — all top-right, clear of the Games back button */
#fsBtn{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))}
#muteBtn{top:calc(8px + env(safe-area-inset-top));right:calc(68px + env(safe-area-inset-right))}
#pauseBtn{top:calc(8px + env(safe-area-inset-top));right:calc(128px + env(safe-area-inset-right))}
.icon-btn:active{transform:scale(.94)}
.btn{min-width:48px;min-height:48px;padding:12px 22px;border:none;border-radius:18px;font-size:20px;font-weight:800;cursor:pointer;color:#3a1a10;background:#ffe09a;box-shadow:0 4px 0 #c48a2a,0 8px 18px rgba(0,0,0,.25);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c48a2a,0 4px 10px rgba(0,0,0,.25)}
.btn.big{font-size:24px;padding:14px 26px;border-radius:22px;min-height:60px}
.btn.green{background:#9ee07a;box-shadow:0 4px 0 #3d8a2a,0 8px 18px rgba(0,0,0,.25)}
.btn.blue{background:#9ad8ff;box-shadow:0 4px 0 #2a6a9a,0 8px 18px rgba(0,0,0,.25)}
.btn.pink{background:#ffb0c8;box-shadow:0 4px 0 #c45a7a,0 8px 18px rgba(0,0,0,.25)}
.btn.orange{background:#ffb060;box-shadow:0 4px 0 #c46a18,0 8px 18px rgba(0,0,0,.25)}
.btn.purple{background:#d4b0ff;box-shadow:0 4px 0 #7a4ab0,0 8px 18px rgba(0,0,0,.25)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.panel{background:rgba(36,18,22,.92);border:3px solid rgba(255,210,140,.28);border-radius:28px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 16px 50px rgba(0,0,0,.45);max-width:min(980px,96vw);max-height:min(94dvh,94vh);overflow:auto}
.title{font-size:clamp(26px,5vw,44px);font-weight:900;letter-spacing:.5px;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35);margin-bottom:6px;color:#ffe09a}
.sub{text-align:center;opacity:.92;margin-bottom:14px;font-size:15px;line-height:1.4}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.profile-card{width:min(280px,42vw);min-height:170px;border-radius:24px;background:linear-gradient(160deg,#7a3a22,#2a1418);border:4px solid rgba(255,255,255,.2);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.profile-card:active{transform:scale(.97)}
.profile-card h2{font-size:22px}
.profile-card .meta{font-size:14px;opacity:.85;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:700;min-height:40px}
#touch{position:absolute;inset:0;z-index:8;pointer-events:none}
.lane-btn,.jump-btn{position:absolute;pointer-events:auto;z-index:9;border:none;color:#3a1a10;font-weight:900;cursor:pointer;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.28),0 8px 16px rgba(0,0,0,.25)}
.lane-btn{width:64px;height:64px;min-width:48px;min-height:48px;border-radius:18px;background:rgba(255,224,154,.9);font-size:26px}
.jump-btn{width:72px;height:72px;min-width:56px;min-height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe9a0,#ff8a3d 58%,#c94a16);font-size:26px}
.lane-btn:active,.lane-btn.down,.jump-btn:active,.jump-btn.down{transform:translateY(2px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.28)}
#laneLeft{left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom))}
#laneRight{left:calc(88px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom))}
#jump1{right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom))}
#laneLeft2,#laneRight2,#jump2{display:none}
#touch.coop #laneLeft2,#touch.coop #laneRight2,#touch.coop #jump2{display:block}
#touch.coop #laneLeft{left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom))}
#touch.coop #laneRight{left:calc(88px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom))}
#touch.coop #jump1{left:calc(160px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));right:auto}
#touch.coop #laneLeft2{right:calc(88px + env(safe-area-inset-right));left:auto;bottom:calc(16px + env(safe-area-inset-bottom))}
#touch.coop #laneRight2{right:calc(16px + env(safe-area-inset-right));left:auto;bottom:calc(16px + env(safe-area-inset-bottom))}
#touch.coop #jump2{right:calc(160px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom))}
.toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:12px 20px;border-radius:16px;font-weight:800;font-size:18px;z-index:30;pointer-events:none;text-align:center;max-width:80%}
.hidden{display:none!important}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;width:100%;max-width:820px;padding:4px}
.lvl{min-width:56px;min-height:52px;border-radius:14px;border:none;background:rgba(255,255,255,.14);color:#fff;font-weight:900;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.lvl span{font-size:10px;font-weight:700;opacity:.85}
.lvl.done{background:#e8b84a;color:#3a1a10}
.lvl.locked{opacity:.35;cursor:default}
.lvl.cur{outline:3px solid #ffe09a}
.meter{height:10px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;width:100%;border:1px solid rgba(255,255,255,.2)}
.meter>i{display:block;height:100%;border-radius:999px}
.meter.food>i{background:#8fd36a}
.meter.water>i{background:#6ec4ff}
.meter.health>i{background:#ff8aa0}
.care-card{width:min(100%,920px);background:rgba(20,10,16,.88);border:2px solid rgba(255,224,150,.28);border-radius:20px;padding:8px 14px;margin:8px auto calc(10px + env(safe-area-inset-bottom));max-height:42dvh;overflow:auto}
.animal-list{display:flex;gap:8px;overflow:auto;padding:4px 0;width:100%;max-height:80px}
.animal-chip{min-width:64px;min-height:64px;border-radius:16px;border:3px solid transparent;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.animal-chip.sel{border-color:#ffe09a;background:rgba(255,224,154,.22)}
.animal-chip.sad{outline:2px solid #ff8aa0}
#rotateTip{position:absolute;left:50%;top:calc(128px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:0 12px;max-width:min(340px,92vw)}
#rotateTip.hidden{display:none!important}
#rotateTip .hint-banner{pointer-events:none;background:rgba(36,18,22,.88);border:2px solid rgba(255,224,154,.45);border-radius:16px;padding:10px 14px;font-weight:800;font-size:14px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);line-height:1.3}
.care-card .btn{min-height:48px;padding:8px 14px;font-size:16px}
@media (max-width:500px){
  .care-card{max-height:48dvh}
  .care-card .btn{min-height:44px;padding:8px 12px;font-size:15px}
  .animal-chip{min-width:56px;min-height:56px;font-size:10px}
}
@media (max-height:650px){
  .profile-card{min-height:140px;width:min(230px,40vw)}
  .title{font-size:clamp(20px,4.2vw,32px)}
  .panel{padding:12px;border-radius:20px}
  .lane-btn{width:56px;height:56px}
  .jump-btn{width:64px;height:64px;min-width:56px;min-height:56px;font-size:22px}
  #laneRight{left:calc(80px + env(safe-area-inset-left))}
  #touch.coop #jump1{left:calc(144px + env(safe-area-inset-left))}
  #touch.coop #jump2{right:calc(144px + env(safe-area-inset-right))}
  #touch.coop #laneLeft2{right:calc(80px + env(safe-area-inset-right))}
}
@media (max-height:450px){
  .lane-btn{width:48px;height:48px;min-width:48px;min-height:48px;font-size:20px;border-radius:14px}
  .jump-btn{width:56px;height:56px;min-width:56px;min-height:56px}
  #laneRight{left:calc(70px + env(safe-area-inset-left))}
  #touch.coop #jump1{left:calc(124px + env(safe-area-inset-left))}
  #touch.coop #jump2{right:calc(124px + env(safe-area-inset-right))}
  #touch.coop #laneLeft2{right:calc(70px + env(safe-area-inset-right))}
}
@media (orientation:portrait) and (max-width:500px){
  .profile-card{width:min(300px,80vw)}
  .lane-btn{width:64px;height:64px}
  .jump-btn{width:72px;height:72px}
}
</style>

<body>
<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Death Valley Chase"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="touch" class="hidden" aria-hidden="true">
    <button class="lane-btn" id="laneLeft" data-player="0" data-dir="-1" type="button" aria-label="Left">◀</button>
    <button class="lane-btn" id="laneRight" data-player="0" data-dir="1" type="button" aria-label="Right">▶</button>
    <button class="jump-btn" id="jump1" data-player="0" type="button" aria-label="Jump">⬆</button>
    <button class="lane-btn p2" id="laneLeft2" data-player="1" data-dir="-1" type="button" aria-label="P2 Left">◀</button>
    <button class="lane-btn p2" id="laneRight2" data-player="1" data-dir="1" type="button" aria-label="P2 Right">▶</button>
    <button class="jump-btn p2" id="jump2" data-player="1" type="button" aria-label="P2 Jump">⬆</button>
  </div>
  <div id="overlay"></div>
  <div id="rotateTip" class="hidden" role="status" aria-live="polite">
    <div class="hint-banner">Turn sideways for a wider trail!</div>
  </div>
  <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause">⏸</button>
  <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  <button id="fsBtn" class="icon-btn" type="button" aria-label="Fullscreen">⛶</button>
</div>
<script>"use strict";
/* ==== 00-core.js ==== */
;(function(){
/* Death Valley Chase — core namespace & helpers */
const DV = window.DV = {
  VERSION: 1,
  SAVE_KEY: 'death-valley-chase-v1',
  W: 1180, H: 600,
  BASE_W: 1180, BASE_H: 600,
  LEVELS_PER_AREA: 70,
  BADGES_PER_UPGRADE: 10,
  LANES: 3,
  profiles: {
    p1: {
      id: 'p1', defaultName: 'Player 1', label: 'Junior Ranger',
      infiniteLives: true, lives: 99,
      speed: 240, gapScale: 1.45, density: 0.72,
      invuln: 2.1, magnet: 90, jumpV: 620,
      touchBtn: 80, animals: 0.85
    },
    p2: {
      id: 'p2', defaultName: 'Player 2', label: 'Park Ranger',
      infiniteLives: false, lives: 3,
      speed: 330, gapScale: 1.0, density: 1.0,
      invuln: 1.25, magnet: 24, jumpV: 660,
      touchBtn: 68, animals: 1.0
    }
  },
  memStore: null,
  state: null,
  screen: 'boot',
  raf: 0,
  lastT: 0,
  muted: false,
  autoplay: false,
  keys: Object.create(null),
  jumpHold: [false, false],
  laneHold: [0, 0],
  pointers: Object.create(null),
  canvas: null,
  ctx: null,
  overlay: null,
  hud: null,
  touchEl: null,
  run: null,
  portrait: false,
  shelterSel: 0,
  passportPage: 0
};

DV.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
DV.lerp = (a, b, t) => a + (b - a) * t;
DV.rand = (a, b) => a + Math.random() * (b - a);
DV.pick = (arr) => arr[(Math.random() * arr.length) | 0];
DV.seeded = (seed) => {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
};
DV.hash = (...parts) => {
  let h = 2166136261;
  const s = parts.join('|');
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
};
DV.now = () => performance.now();
DV.meta = (id) => DV.profiles[id || (DV.run && DV.run.soloProfile) || (DV.state && DV.state.lastProfile) || 'p1'];
DV.toast = (msg, ms) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), ms || 1600);
};
DV.fitCanvas = () => {
  const c = DV.canvas;
  if (!c) return;
  const iw = window.innerWidth || DV.BASE_W;
  const ih = window.innerHeight || DV.BASE_H;
  const portrait = ih > iw * 1.05;
  DV.portrait = portrait;
  let wantW = DV.BASE_W, wantH = DV.BASE_H;
  if (portrait) {
    const targetScale = 0.88;
    wantW = Math.round(Math.min(520, Math.max(390, iw / targetScale)));
    wantH = Math.round(wantW * (ih / Math.max(1, iw)));
    wantH = DV.clamp(wantH, 700, 1200);
  }
  if (DV.W !== wantW || DV.H !== wantH) {
    DV.W = wantW; DV.H = wantH;
    if (DV.run && DV.Game && DV.Game.reflow) DV.Game.reflow();
  }
  if (c.width !== DV.W) c.width = DV.W;
  if (c.height !== DV.H) c.height = DV.H;
  c.classList.toggle('portrait', !!portrait);
  DV.refreshRotateHint && DV.refreshRotateHint();
};
DV.clear = (color) => {
  const ctx = DV.ctx;
  ctx.fillStyle = color || '#c4844a';
  ctx.fillRect(0, 0, DV.W, DV.H);
};
DV.roundRect = (ctx, x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};
DV.bindTap = (el, fn) => {
  if (!el) return;
  let last = 0;
  const run = (e) => {
    const t = Date.now();
    if (t - last < 260) return;
    last = t;
    try { e.preventDefault(); } catch (_) {}
    fn(e);
  };
  el.addEventListener('pointerup', run);
  el.addEventListener('click', run);
};
DV.laneY = (lane) => {
  const ground = DV.H * (DV.portrait ? 0.70 : 0.78);
  const spacing = DV.portrait ? 78 : 90;
  return ground - lane * spacing;
};
DV.trackTop = () => DV.laneY(DV.LANES - 1) - 70;
DV.groundY = () => DV.laneY(0) + 28;

})();
/* ==== 10-audio.js ==== */
;(function(){
/* WebAudio SFX — only after first user input */
DV.Audio = (() => {
  let ctx = null, master = null, unlocked = false;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = DV.muted ? 0 : 0.3;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    unlocked = true;
  }

  function tone(freq, dur, type, vol, slide) {
    if (DV.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol) {
    if (DV.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const n = Math.max(1, (c.sampleRate * dur) | 0);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    g.gain.value = vol || 0.05;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1400;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  return {
    unlock,
    setMuted(m) {
      DV.muted = !!m;
      if (master) master.gain.value = DV.muted ? 0 : 0.3;
      try { localStorage.setItem('dvc-mute', DV.muted ? '1' : '0'); } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = DV.muted ? '🔇' : '🔊';
    },
    loadMute() {
      try { DV.muted = localStorage.getItem('dvc-mute') === '1'; } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = DV.muted ? '🔇' : '🔊';
    },
    click() { tone(360, 0.05, 'triangle', 0.06); },
    jump() { tone(420, 0.09, 'sine', 0.07, 280); },
    hit() { tone(180, 0.1, 'sawtooth', 0.07, 90); noise(0.08, 0.04); },
    rescue() { tone(620, 0.08, 'sine', 0.09); setTimeout(() => tone(880, 0.12, 'sine', 0.07), 50); },
    coin() { tone(880, 0.06, 'square', 0.05); setTimeout(() => tone(1180, 0.07, 'square', 0.04), 40); },

  function puddle(ctx, x, y, s, t) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = 'rgba(80,150,190,.65)';
    ctx.beginPath(); ctx.ellipse(0, 4, 28, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.beginPath(); ctx.ellipse(-6, 2, 8, 3, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawObstacle(ctx, o, sx, sy, t) {
    const s = o.h ? o.h / 60 : 1;
    switch (o.kind) {
      case 'cactus': case 'yucca': cactus(ctx, sx, sy, 1.05 * s, t); break;
      case 'tumbleweed': tumbleweed(ctx, sx, sy - 10, 1.2, t + o.x); break;
      case 'devil': devil(ctx, sx, sy, 1, t); break;
      case 'puddle': case 'washout': puddle(ctx, sx, sy + 8, 1.1, t); if (o.kind === 'washout') { ctx.fillStyle = '#8a6038'; DV.roundRect(ctx, sx - 30, sy + 10, 60, 10, 4); ctx.fill(); } break;
      case 'shimmer':
        ctx.save(); ctx.globalAlpha = 0.4 + Math.sin(t * 8) * 0.15; ctx.fillStyle = '#fff6c0';
        for (let i = 0; i < 5; i++) { ctx.fillRect(sx - 12 + Math.sin(t * 6 + i) * 6, sy - 70 + i * 16, 8, 14); }
        ctx.restore(); break;
      case 'salt':
        ctx.fillStyle = '#f4f0e4'; DV.roundRect(ctx, sx - 24, sy - 16, 48, 28, 8); ctx.fill();
        ctx.strokeStyle = '#d8d0c0'; ctx.stroke(); break;
      case 'berm': case 'mound': case 'cinder': case 'gravel': case 'snow':
        ctx.fillStyle = o.kind === 'snow' ? '#f4f8fc' : o.kind === 'cinder' ? '#4a3834' : '#d2b080';
        ctx.beginPath(); ctx.ellipse(sx, sy, 28, 16, 0, 0, Math.PI * 2); ctx.fill(); break;
      case 'spire':
        ctx.fillStyle = '#e0a858';
        ctx.beginPath(); ctx.moveTo(sx - 16, sy + 10); ctx.lineTo(sx, sy - 80); ctx.lineTo(sx + 16, sy + 10); ctx.fill(); break;
      case 'crack':
        ctx.strokeStyle = '#3a2018'; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sx - 20, sy + 8); ctx.lineTo(sx - 4, sy - 8); ctx.lineTo(sx + 16, sy + 10); ctx.stroke(); break;
      case 'log': case 'root':
        ctx.fillStyle = '#6a4430'; DV.roundRect(ctx, sx - 32, sy - 12, 64, 18, 8); ctx.fill();
        ctx.fillStyle = '#c8a07a'; ctx.beginPath(); ctx.arc(sx + 32, sy - 3, 8, 0, Math.PI * 2); ctx.fill(); break;
      case 'bush':
        ctx.fillStyle = '#3d8a46';
        ctx.beginPath(); ctx.arc(sx - 10, sy - 6, 14, 0, Math.PI * 2); ctx.arc(sx + 10, sy - 8, 16, 0, Math.PI * 2); ctx.arc(sx, sy - 16, 12, 0, Math.PI * 2); ctx.fill(); break;
      case 'steam':
        ctx.fillStyle = 'rgba(230,240,245,.55)';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath(); ctx.arc(sx + Math.sin(t * 3 + i) * 8, sy - 20 - i * 16 - (t * 20 % 16), 10 + i, 0, Math.PI * 2); ctx.fill();
        }
        break;
      default:
        rock(ctx, sx, sy, s, o.kind === 'cinder' ? '#4a3834' : '#8a7460');
    }
  }

  function eyes(ctx, x, y, blink, sad) {
    const h = blink > 0.86 ? 1.2 : 5;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x - 5, y, 4.2, h, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 5, y, 4.2, h, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a1810';
    if (h > 2) {
      ctx.beginPath(); ctx.arc(x - 4.2, y + (sad ? 1 : 0), 2.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 5.8, y + (sad ? 1 : 0), 2.1, 0, Math.PI * 2); ctx.fill();
    }
  }

  function bandage(ctx, x, y, ang) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang || -0.4);
    ctx.fillStyle = '#f4f0e0'; DV.roundRect(ctx, -8, -4, 16, 8, 2); ctx.fill();
    ctx.fillStyle = '#e8a0a8'; ctx.fillRect(-2, -4, 4, 8);
    ctx.restore();
  }

  function drawAnimal(ctx, an, x, y, t, st) {
    st = st || {};
    const spec = DV.SPECIES[an.species] || DV.SPECIES.tortoise;
    const sad = st.sad || (an.hunger < 35 || an.thirst < 35 || an.health < 40);
    const baby = an.baby || st.baby;
    const sc = (baby ? 0.68 : (an.old ? 1.0 : 1.12)) * (spec.size || 1) * (st.scale || 1);
    const bob = Math.sin((st.limp ? t * 6 : t * 8) + (an.x || 0)) * (st.limp ? 2 : 3);
    const blink = (Math.sin(t * 2.2 + (an.tint || 0)) + 1) / 2;
    ctx.save();
    ctx.translate(x, y - bob);
    if (st.flip) ctx.scale(-1, 1);
    ctx.scale(sc, sc);

    if (spec.bucket) {
      ctx.fillStyle = 'rgba(160,210,230,.55)';
      DV.roundRect(ctx, -16, -8, 32, 24, 4); ctx.fill();
      ctx.strokeStyle = '#8aa0b0'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = spec.color;
      ctx.beginPath(); ctx.ellipse(0, 4, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-3, 3, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c07040'; DV.roundRect(ctx, -18, -12, 8, 6, 2); ctx.fill();
      ctx.restore();
      if (an.old) { ctx.fillStyle = '#eee'; ctx.font = '10px system-ui'; ctx.fillText('old', x - 10, y + 26); }
      return;
    }

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(0, 18, 16, 5, 0, 0, Math.PI * 2); ctx.fill();

    // body
    ctx.fillStyle = spec.color;
    ctx.beginPath(); ctx.ellipse(0, 4, 18, 13, 0, 0, Math.PI * 2); ctx.fill();
    // legs
    ctx.fillStyle = spec.color;
    const leg = Math.sin(t * (st.limp ? 5 : 10)) * 4;
    ctx.fillRect(-12, 10, 5, 8 + leg);
    ctx.fillRect(-2, 10, 5, 8 - leg);
    ctx.fillRect(6, 10, 5, 8 + leg * 0.6);
    // head
    ctx.beginPath(); ctx.ellipse(14, -6, 11, 10, 0, 0, Math.PI * 2); ctx.fill();
    // species extras
    if (an.species === 'tortoise') {
      ctx.fillStyle = spec.shell || '#7a5a32';
      ctx.beginPath(); ctx.ellipse(-2, 0, 16, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5a3a18'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-10, -6, 8, 7); ctx.strokeRect(-1, -6, 8, 7); ctx.strokeRect(-6, 2, 8, 7);
    } else if (an.species === 'kitfox' || an.species === 'jackrabbit' || an.species === 'burro') {
      ctx.fillStyle = spec.color;
      const eh = an.species === 'jackrabbit' ? 22 : 16;
      ctx.beginPath(); ctx.ellipse(-2, -22, 4, eh / 2, -0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8, -24, 4, eh / 2 + 2, 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f0c0c8';
      ctx.beginPath(); ctx.ellipse(-2, -22, 2, eh / 3, -0.2, 0, Math.PI * 2); ctx.fill();
    } else if (an.species === 'bighorn') {
      ctx.strokeStyle = '#c8b090'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(8, -8, 10, Math.PI, Math.PI * 1.8); ctx.stroke();
      ctx.beginPath(); ctx.arc(18, -6, 10, Math.PI * 0.2, Math.PI * 1.1); ctx.stroke();
    } else if (an.species === 'roadrunner' || an.species === 'jay' || an.species === 'raven' || an.species === 'wren' || an.species === 'turkey' || an.species === 'swan' || an.species === 'condor') {
      ctx.fillStyle = spec.color;
      ctx.beginPath(); ctx.moveTo(8, -16); ctx.lineTo(14, -26); ctx.lineTo(18, -14); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-8, 0); ctx.quadraticCurveTo(-28, -10, -34, 6); ctx.quadraticCurveTo(-16, 8, -6, 6); ctx.fill();
      ctx.fillStyle = '#f0c040';
      ctx.beginPath(); ctx.moveTo(24, -6); ctx.lineTo(32, -2); ctx.lineTo(24, 0); ctx.fill();
    } else if (an.species === 'coyote' || an.species === 'wolf' || an.species === 'ringtail') {
      ctx.beginPath(); ctx.moveTo(-16, 0); ctx.quadraticCurveTo(-30, -16, -22, 8); ctx.fill();
      ctx.beginPath(); ctx.moveTo(8, -16); ctx.lineTo(4, -24); ctx.lineTo(14, -16); ctx.fill();
    } else if (an.species === 'bear' || an.species === 'bison') {
      ctx.beginPath(); ctx.arc(6, -14, 6, 0, Math.PI * 2); ctx.arc(18, -12, 6, 0, Math.PI * 2); ctx.fill();
    } else if (an.species === 'deer' || an.species === 'elk') {
      ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(10, -14); ctx.lineTo(6, -28); ctx.lineTo(0, -24); ctx.moveTo(16, -14); ctx.lineTo(22, -28); ctx.lineTo(26, -22); ctx.stroke();
    }

    eyes(ctx, 16, -8, blink, sad);
    if (sad) {
      ctx.strokeStyle = '#5a3040'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(16, -2, 5, 0.15, Math.PI - 0.15); ctx.stroke();
    } else {
      ctx.strokeStyle = '#5a3040'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(16, -3, 4, 0.2, Math.PI - 0.2, true); ctx.stroke();
    }
    if (st.limp || an._injured !== false) bandage(ctx, 2, 2, -0.3);
    if (an.old) {
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(12, -8, 6, 0, Math.PI * 2); ctx.arc(20, -8, 6, 0, Math.PI * 2); ctx.stroke();
    }
    if (st.heart) {
      ctx.fillStyle = '#ff6a8a';
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.bezierCurveTo(-8, -36, -14, -24, 0, -18); ctx.bezierCurveTo(14, -24, 8, -36, 0, -28); ctx.fill();
    }
    ctx.restore();
    if (an.withBaby && !st.noBaby) {
      drawAnimal(ctx, { species: an.species, baby: true, tint: an.tint }, x - 26, y + 8, t, { baby: true, limp: false, scale: 1, noBaby: true });
    }
  }

  function drawRanger(ctx, p, t, opts) {
    opts = opts || {};
    const x = p.sx, y = p.sy - (p.z || 0);
    const run = p.grounded === false ? 0 : Math.sin(t * 14);
    const bob = p.grounded === false ? 0 : Math.sin(t * 14) * 2;
    ctx.save();
    ctx.translate(x, y + bob);
    if (opts.flip) ctx.scale(-1, 1);
    const sc = opts.scale || (DV.portrait ? 1.15 : 1);
    ctx.scale(sc, sc);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(0, 28 + (p.z || 0), 16, 5, 0, 0, Math.PI * 2); ctx.fill();

    if (opts.buggy) {
      // jeep body
      ctx.fillStyle = '#5a7a3a';
      DV.roundRect(ctx, -30, 2, 58, 22, 6); ctx.fill();
      ctx.fillStyle = '#d8e8c8';
      DV.roundRect(ctx, -8, -8, 24, 14, 4); ctx.fill();
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath(); ctx.arc(-16, 24, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(16, 24, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f0d0b0';
      ctx.beginPath(); ctx.arc(4, -12, 8, 0, Math.PI * 2); ctx.fill();
      hat(ctx, 4, -20, 0);
      ctx.restore();
      return;
    }

    // legs
    ctx.strokeStyle = '#3a5a88'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, 8); ctx.lineTo(-8 - run * 6, 24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, 8); ctx.lineTo(8 + run * 6, 24); ctx.stroke();
    ctx.fillStyle = '#5a3a22';
    ctx.beginPath(); ctx.ellipse(-10 - run * 6, 26, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10 + run * 6, 26, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.fillStyle = '#d8c06a';
    DV.roundRect(ctx, -11, -10, 22, 22, 6); ctx.fill();
    // pack
    ctx.fillStyle = '#6a4a28';
    DV.roundRect(ctx, -16, -8, 8, 14, 3); ctx.fill();
    // arms
    ctx.strokeStyle = '#f0d0b0'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-16 + run * 5, 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(16 - run * 5, 8); ctx.stroke();
    // head
    ctx.fillStyle = '#f0d0b0';
    ctx.beginPath(); ctx.arc(0, -20, 10, 0, Math.PI * 2); ctx.fill();
    eyes(ctx, 1, -20, (Math.sin(t * 2) + 1) / 2, false);
    hat(ctx, 0, -28, Math.sin(t * 10) * 0.05);
    // bandana
    ctx.fillStyle = p.color || '#d4453a';
    ctx.beginPath(); ctx.arc(0, -12, 8, 0.15, Math.PI - 0.15); ctx.fill();
    ctx.restore();
  }

  function hat(ctx, x, y, ang) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang || 0);
    ctx.fillStyle = '#c4a05a';
    ctx.beginPath(); ctx.ellipse(0, 4, 16, 4, 0, 0, Math.PI * 2); ctx.fill();
    DV.roundRect(ctx, -8, -6, 16, 10, 3); ctx.fill();
    ctx.fillStyle = '#3d6a3a';
    ctx.fillRect(-8, 0, 16, 3);
    ctx.fillStyle = '#e8c84a';
    ctx.beginPath(); ctx.arc(0, -2, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBg(ctx, world, cam, t) {
    const pal = (world && world.palette) || DV.PARKS[0].areas[0].palette;
    drawSky(ctx, pal, t, cam, world);
    drawGround(ctx, pal, cam, t, world);
  }

  function titleScene(ctx, t) {
    const world = { palette: DV.PARKS[0].areas[0].palette, area: { id: 'furnace-creek' }, remix: 0 };
    drawBg(ctx, world, t * 30, t);
    // wandering friends
    drawAnimal(ctx, { species: 'tortoise', x: 1, _injured: false }, DV.W * 0.18, DV.laneY(0) + 10, t, { limp: false });
    drawAnimal(ctx, { species: 'kitfox', x: 2 }, DV.W * 0.28, DV.laneY(1), t, { limp: true });
    drawRanger(ctx, { sx: DV.W * 0.52, sy: DV.laneY(1), z: 0, grounded: true, color: '#d4453a' }, t, {});
    cactus(ctx, DV.W * 0.74, DV.laneY(0) + 16, 1.3, t);
    rock(ctx, DV.W * 0.86, DV.laneY(2) + 8, 1.1);
  }

  function upgradeBits(level) {
    return {
      fence: level >= 1, hut: level >= 1, trough: level >= 1,
      vet: level >= 2, pond: level >= 3, sails: level >= 4,
      nursery: level >= 5, garden: level >= 6, lanterns: level >= 7,
      rocks: level >= 8, barn: level >= 9, fountain: level >= 10
    };
  }

  function drawShelter(ctx, p, t, selId) {
    const w = DV.W, h = DV.H;
    const pal = { skyTop: '#f0c878', skyBot: '#f0a060', far: '#c47a4a', mid: '#d89058', ground: '#e8b870', accent: '#7aaa4a', sun: '#ffe9a0' };
    drawSky(ctx, pal, t, 0, { remix: 0, area: { id: 'furnace-creek' } });
    ctx.fillStyle = pal.ground;
    ctx.fillRect(0, h * 0.42, w, h * 0.58);
    ctx.fillStyle = '#c8b06a';
    ctx.fillRect(0, h * 0.70, w, h * 0.30);
    ctx.fillStyle = 'rgba(122,160,74,.35)';
    ctx.fillRect(0, h * 0.68, w, 18);
    const u = upgradeBits(p.shelterLevel);
    const cx = w / 2, cy = h * 0.62;
    if (u.fence) {
      ctx.strokeStyle = '#6a4a28'; ctx.lineWidth = 5;
      DV.roundRect(ctx, 40, h * 0.46, w - 80, h * 0.42, 16); ctx.stroke();
      for (let i = 0; i < 10; i++) {
        ctx.fillStyle = '#8a5a30';
        ctx.fillRect(50 + i * ((w - 120) / 9), h * 0.46, 8, h * 0.1);
      }
    }
    if (u.sails) {
      ctx.fillStyle = 'rgba(255,230,160,.55)';
      ctx.beginPath(); ctx.moveTo(80, h * 0.48); ctx.lineTo(240, h * 0.42); ctx.lineTo(260, h * 0.56); ctx.lineTo(90, h * 0.58); ctx.fill();
      ctx.beginPath(); ctx.moveTo(w - 80, h * 0.48); ctx.lineTo(w - 240, h * 0.42); ctx.lineTo(w - 260, h * 0.56); ctx.lineTo(w - 90, h * 0.58); ctx.fill();
    }
    if (u.pond) {
      ctx.fillStyle = '#5aa0c8';
      ctx.beginPath(); ctx.ellipse(w * 0.18, h * 0.57, 64, 24, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.3)';
      ctx.beginPath(); ctx.ellipse(w * 0.16, h * 0.56, 18, 7, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (u.vet) {
      ctx.fillStyle = '#f4f0e8';
      DV.roundRect(ctx, w * 0.72, h * 0.48, 90, 64, 8); ctx.fill();
      ctx.fillStyle = '#c45a4a';
      ctx.fillRect(w * 0.72, h * 0.48, 90, 14);
      ctx.fillStyle = '#3d8a46';
      ctx.fillRect(w * 0.72 + 38, h * 0.62, 14, 8);
      ctx.fillRect(w * 0.72 + 41, h * 0.59, 8, 14);
    }
    if (u.barn) {
      ctx.fillStyle = '#a05038';
      ctx.fillRect(w * 0.08, h * 0.50, 100, 70);
      ctx.beginPath(); ctx.moveTo(w * 0.08 - 6, h * 0.50); ctx.lineTo(w * 0.08 + 50, h * 0.40); ctx.lineTo(w * 0.08 + 106, h * 0.50); ctx.fill();
    }
    if (u.hut || p.shelterLevel >= 1) {
      ctx.fillStyle = '#c4a06a';
      DV.roundRect(ctx, cx - 40, h * 0.50, 80, 54, 6); ctx.fill();
      ctx.fillStyle = '#8a4a28';
      ctx.beginPath(); ctx.moveTo(cx - 50, h * 0.50); ctx.lineTo(cx, h * 0.40); ctx.lineTo(cx + 50, h * 0.50); ctx.fill();
    }
    if (u.trough) {
      ctx.fillStyle = '#8aa0b0';
      DV.roundRect(ctx, cx + 50, h * 0.70, 50, 14, 4); ctx.fill();
      ctx.fillStyle = '#6ec4ff';
      DV.roundRect(ctx, cx + 54, h * 0.71, 42, 8, 3); ctx.fill();
    }
    if (u.garden) {
      ctx.fillStyle = '#6aaa40';
      for (let i = 0; i < 6; i++) {
        ctx.beginPath(); ctx.arc(w * 0.38 + i * 18, h * 0.62, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = i % 2 ? '#e8c84a' : '#e8789a';
        ctx.beginPath(); ctx.arc(w * 0.38 + i * 18, h * 0.615, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6aaa40';
      }
    }
    if (u.nursery) {
      ctx.fillStyle = '#f0c8d8';
      DV.roundRect(ctx, w * 0.58, h * 0.57, 54, 28, 8); ctx.fill();
      ctx.strokeStyle = '#d080a0'; ctx.stroke();
    }
    if (u.rocks) {
      rock(ctx, w * 0.86, h * 0.72, 1.2, '#b09080');
      rock(ctx, w * 0.90, h * 0.74, 0.8, '#c0a090');
    }
    if (u.fountain) {
      ctx.fillStyle = '#d0d8e0';
      ctx.beginPath(); ctx.arc(cx, h * 0.64, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7ec8f0';
      ctx.beginPath(); ctx.arc(cx, h * 0.62, 6, 0, Math.PI * 2); ctx.fill();
    }
    if (u.lanterns) {
      for (let i = 0; i < 5; i++) {
        const lx = 70 + i * ((w - 140) / 4);
        ctx.fillStyle = '#5a3a20';
        ctx.fillRect(lx, h * 0.48, 4, 36);
        ctx.fillStyle = 'rgba(255,200,80,.85)';
        ctx.beginPath(); ctx.arc(lx + 2, h * 0.48, 6, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (p.shelterLevel < 1) {
      ctx.fillStyle = 'rgba(40,20,16,.55)';
      DV.roundRect(ctx, w / 2 - 180, h * 0.48, 360, 90, 16); ctx.fill();
      ctx.fillStyle = '#ffe09a';
      ctx.font = '700 20px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('A shade tent for now… ' + p.badges + '/10 badges to build the shelter!', w / 2, h * 0.55);
    }

    // place animals
    const list = p.animals || [];
    const n = list.length;
    for (let i = 0; i < n; i++) {
      const a = list[i];
      const col = i % 6, row = Math.floor(i / 6) % 3;
      const ax = 90 + col * ((w - 160) / 5) + Math.sin(t * 0.8 + i) * 8;
      const ay = h * 0.46 + row * 44 + Math.cos(t * 0.6 + i * 1.3) * 4;
      const sad = a.hunger < 35 || a.thirst < 35 || a.health < 40;
      const sel = selId && a.id === selId;
      if (sel) {
        ctx.strokeStyle = '#ffe09a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(ax, ay - 8, 28, 0, Math.PI * 2); ctx.stroke();
      }
      drawAnimal(ctx, a, ax, ay, t + i, { limp: false, sad, heart: !sad && Math.sin(t + i) > 0.7, noBaby: true });
    }
  }

  function drawPassport(ctx, p, page, t) {
    const w = DV.W, h = DV.H;
    ctx.fillStyle = '#3a2a20';
    ctx.fillRect(0, 0, w, h);
    // book
    const reserved = DV.portrait ? 170 : 130;
    const bw = Math.min(w * 0.9, 1000), bh = Math.min(h - reserved - 16, 540);
    const bx = (w - bw) / 2, by = 12;
    ctx.fillStyle = '#6a2030';
    DV.roundRect(ctx, bx - 10, by - 10, bw + 20, bh + 20, 16); ctx.fill();
    ctx.fillStyle = '#f4ead0';
    DV.roundRect(ctx, bx, by, bw / 2 - 4, bh, 4); ctx.fill();
    DV.roundRect(ctx, bx + bw / 2 + 4, by, bw / 2 - 4, bh, 4); ctx.fill();

      if (DV.screen === 'play' && DV.run) DV.UI.showTouch(DV.run.mode === 'coop');
    });
    window.addEventListener('orientationchange', () => setTimeout(() => {
      DV.fitCanvas();
      if (DV.screen === 'play' && DV.run) DV.UI.showTouch(DV.run.mode === 'coop');
    }, 50));

    const mute = document.getElementById('muteBtn');
    if (mute) mute.onclick = () => { DV.Audio.unlock(); DV.Audio.setMuted(!DV.muted); };
    const fs = document.getElementById('fsBtn');
    if (fs) fs.onclick = () => {
      DV.Audio.unlock();
      const app = document.getElementById('app');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const req = app.requestFullscreen || app.webkitRequestFullscreen;
        if (req) req.call(app).catch(() => {});
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
      }
    };
    const pause = document.getElementById('pauseBtn');
    if (pause) {
      pause.classList.add('hidden');
      pause.onclick = () => { DV.Audio.unlock(); DV.Game.togglePause(); };
    }
    DV.UI.bindTouch();
  }

  function init() {
    DV.canvas = document.getElementById('game');
    DV.ctx = DV.canvas.getContext('2d');
    DV.overlay = document.getElementById('overlay');
    DV.hud = document.getElementById('hud');
    DV.touchEl = document.getElementById('touch');
    DV.fitCanvas();
    DV.Save.load();
    DV.Audio.loadMute();
    bindInput();
    DV.screen = 'title';
    DV.UI.title();
    DV.raf = requestAnimationFrame(loop);

    window.__game = {
      DV,
      start(level, profile, coop) {
        if (profile && !coop) DV.Save.setProfile(profile);
        return DV.Game.start(level || 1, { profile: profile, coop: !!coop, autoplay: false, skipIntro: true });
      },
      startCoop(level) { return DV.Game.start(level || 1, { coop: true, skipIntro: true }); },
      autoplay(on) { DV.autoplay = on !== false; if (DV.run) DV.run.autoplay = DV.autoplay; return DV.autoplay; },
      state: () => DV.state,
      run: () => DV.run,
      screen: () => DV.screen,
      goTitle: () => DV.UI.title(),
      goProfiles: () => DV.UI.profiles(),
      goLevels: (coop) => DV.UI.map(!!coop),
      goHow: () => DV.UI.how(),
      goTwo: () => DV.UI.twoPlayer(),
      goShelter: () => DV.UI.shelter(),
      goPassport: () => DV.UI.passport(),
      pause: () => DV.Game.togglePause(),
      key(k, down) { DV.keys[k] = !!down; },
      setLane(i, dir) {
        if (!DV.run || !DV.run.players[i]) return;
        DV.run.players[i].lane = DV.clamp(Math.round(DV.run.players[i].laneF) + dir, 0, 2);
      },
      jump(i) { if (DV.run && DV.run.players[i]) DV.Game.doJump(DV.run.players[i]); },
      muted: () => DV.muted,
      players: () => DV.run && DV.run.players,
      resetSave: () => DV.Save.resetAll(),
      fastForward: (s) => DV.Game.fastForward(s),
      locate: (n) => DV.World.locate(n),
      generate: (n, pid) => DV.World.generate(n, pid || 'p1'),
      solve: (n, pid) => DV.World.solve(DV.World.generate(n, pid || 'p1'), pid || 'p1'),
      solveRange: (pid, from, to, extra) => DV.World.solveRange(pid || 'p1', from, to, extra),
      completeUpTo: (n, pid) => DV.Save.completeUpTo(n, pid),
      jumpTo(level, pid) {
        const p = DV.Save.profile(pid);
        p.currentLevel = level;
        if (p.maxLevel < level) p.maxLevel = level;
        DV.Save.save();
        return DV.Game.start(level, { profile: pid || p.id, skipIntro: true });
      },
      care: (id, kind) => DV.Save.care(DV.Save.profile(), id, kind),
      careAll: (kind) => DV.Save.careAll(DV.Save.profile(), kind),
      tickCare: (n) => DV.Save.tickCare(DV.Save.profile(), n || 1),
      addAnimal: (spec, opts) => {
        const p = DV.Save.profile();
        const a = DV.Save.blankAnimal(spec || 'tortoise', opts || {});
        p.animals.push(a);
        DV.Save.save();
        return a;
      },
      autoSolve: () => DV.Game.autoSolveCurrent(),
      officialCount: () => DV.World.officialCount()
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

})();</script>

<script id="car-mode-js">
window.__CAR_GAME = "death-valley-chase";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
</script>
