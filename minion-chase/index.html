<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230e121b%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%23ffd77a%27/%3E%3Ccircle cx=%2740%27 cy=%2726%27 r=%2716%27 fill=%27%230e121b%27/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;width:100%;overflow:hidden;background:#120a28;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 0%,#3a1d6e 0%,#120a28 70%)}
#game{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#1a1040;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#game.portrait{width:100%;height:auto;max-height:94dvh;max-width:100%;object-fit:contain}
#overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
#overlay>*{pointer-events:auto}
/* HUD sits below the top-left Games back button and the top-right icon cluster */
#hud{position:absolute;left:0;right:0;top:calc(72px + env(safe-area-inset-top));padding:0 12px;display:flex;gap:8px;align-items:center;justify-content:center;pointer-events:none;z-index:5;font-weight:800;flex-wrap:wrap}
#hud.hidden,#touch.hidden,#pauseBtn.hidden{display:none!important}
.icon-btn{position:absolute;z-index:20;width:48px;height:48px;min-width:48px;min-height:48px;border:none;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
/* ≥12px gaps between Pause, Mute, Fullscreen — all top-right, clear of the Games back button */
#fsBtn{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))}
#muteBtn{top:calc(8px + env(safe-area-inset-top));right:calc(68px + env(safe-area-inset-right))}
#pauseBtn{top:calc(8px + env(safe-area-inset-top));right:calc(128px + env(safe-area-inset-right))}
.icon-btn:active{transform:scale(.94)}
.btn{min-width:48px;min-height:48px;padding:12px 22px;border:none;border-radius:18px;font-size:20px;font-weight:800;cursor:pointer;color:#2a1450;background:#ffe566;box-shadow:0 4px 0 #d4b000,0 8px 18px rgba(0,0,0,.25);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d4b000,0 4px 10px rgba(0,0,0,.25)}
.btn.big{font-size:24px;padding:14px 26px;border-radius:22px;min-height:60px}
.btn.green{background:#7dff9a;box-shadow:0 4px 0 #2db854,0 8px 18px rgba(0,0,0,.25)}
.btn.blue{background:#9ad0ff;box-shadow:0 4px 0 #3a7fbf,0 8px 18px rgba(0,0,0,.25)}
.btn.pink{background:#ff9ad4;box-shadow:0 4px 0 #d44f9a,0 8px 18px rgba(0,0,0,.25)}
.btn.purple{background:#c9a6ff;box-shadow:0 4px 0 #7a4ad0,0 8px 18px rgba(0,0,0,.25)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.panel{background:rgba(18,10,40,.92);border:3px solid rgba(255,220,160,.22);border-radius:28px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 16px 50px rgba(0,0,0,.45);max-width:min(980px,96vw);max-height:min(94dvh,94vh);overflow:auto}
.title{font-size:clamp(26px,5vw,44px);font-weight:900;letter-spacing:.5px;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35);margin-bottom:6px;color:#ffe566}
.sub{text-align:center;opacity:.9;margin-bottom:14px;font-size:15px;line-height:1.4}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.profile-card{width:min(280px,42vw);min-height:170px;border-radius:24px;background:linear-gradient(160deg,#4a2880,#1a1040);border:4px solid rgba(255,255,255,.2);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.profile-card:active{transform:scale(.97)}
.profile-card h2{font-size:22px}
.profile-card .meta{font-size:14px;opacity:.85;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:700;min-height:40px}
#touch{position:absolute;inset:0;z-index:8;pointer-events:none}
.joy{position:absolute;pointer-events:auto;z-index:9;display:flex;flex-direction:column;align-items:center;gap:4px}
.joy#joy1{left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom))}
.joy#joy2{right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom))}
.joy-base{width:96px;height:96px;min-width:64px;min-height:64px;border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.35);box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative;touch-action:none}
.joy-knob{width:42px;height:42px;border-radius:50%;background:rgba(255,229,102,.95);border:3px solid rgba(80,40,0,.35);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.joy-label{font-size:12px;font-weight:800;opacity:.85;text-shadow:0 1px 2px #000}
.joy.hidden{display:none!important}
.toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:12px 20px;border-radius:16px;font-weight:800;font-size:18px;z-index:30;pointer-events:none}
.hidden{display:none!important}
input.name-in{font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;min-height:48px;width:min(240px,70vw);text-align:center}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;width:100%;max-width:640px;padding:4px}
.lvl{min-width:80px;min-height:72px;border-radius:16px;border:none;background:rgba(255,255,255,.14);color:#fff;font-weight:900;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lvl span{font-size:11px;font-weight:700;opacity:.85}
.lvl.done{background:#3dd68c;color:#083018}
.lvl.locked{opacity:.35;cursor:default}
.lvl.cur{outline:3px solid #ffe566}
#rotateTip{position:absolute;left:50%;top:calc(128px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:0 12px;max-width:min(340px,92vw)}
#rotateTip.hidden{display:none!important}
#rotateTip .hint-banner{pointer-events:none;background:rgba(18,10,40,.88);border:2px solid rgba(255,229,102,.45);border-radius:16px;padding:10px 14px;font-weight:800;font-size:14px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);line-height:1.3}
@media (max-height:650px){
  .profile-card{min-height:140px;width:min(230px,40vw)}
  .title{font-size:clamp(20px,4.2vw,32px)}
  .panel{padding:12px;border-radius:20px}
  .joy-base{width:80px;height:80px}
}
@media (orientation:portrait) and (max-width:500px){
  .profile-card{width:min(300px,80vw)}
  .joy-base{width:88px;height:88px}
}
</style>

<body>
<div id="app">
  <canvas id="game" width="1180" height="600" aria-label="Pixie Chase"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="touch" class="hidden" aria-hidden="true">
    <div class="joy" id="joy1" data-player="0">
      <div class="joy-base"><div class="joy-knob"></div></div>
      <div class="joy-label">P1</div>
    </div>
    <div class="joy" id="joy2" data-player="1">
      <div class="joy-base"><div class="joy-knob"></div></div>
      <div class="joy-label">P2</div>
    </div>
  </div>
  <div id="overlay"></div>
  <div id="rotateTip" class="hidden" role="status" aria-live="polite">
    <div class="hint-banner">Turn sideways for a wider chase!</div>
  </div>
  <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause">⏸</button>
  <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute">🔊</button>
  <button id="fsBtn" class="icon-btn" type="button" aria-label="Fullscreen">⛶</button>
</div>
<script>"use strict";
/* ==== 00-core.js ==== */
;(function(){
/* Pixie Chase — core namespace & helpers */
const MC = window.MC = {
  VERSION: 1,
  SAVE_KEY: 'minion-chase-v1',
  W: 1180, H: 600,
  BASE_W: 1180, BASE_H: 600,
  profiles: {
    p1: {
      id: 'p1', defaultName: 'Player 1', label: 'Gentle',
      infiniteLives: true, lives: 99,
      speed: 280, pixieSpeed: 0.52, pickupPad: 18, hurtInset: 10,
      invuln: 1.8, shield: 5, freeze: 3.6, dash: 0.42,
      touchBtn: 80
    },
    p2: {
      id: 'p2', defaultName: 'Player 2', label: 'Adventure',
      infiniteLives: false, lives: 3,
      speed: 255, pixieSpeed: 1.0, pickupPad: 8, hurtInset: 5,
      invuln: 1.35, shield: 3.6, freeze: 2.6, dash: 0.32,
      touchBtn: 68
    }
  },
  memStore: null,
  state: null,
  screen: 'boot',
  raf: 0,
  lastT: 0,
  muted: false,
  autoplay: false,
  keys: Object.create(null),
  sticks: [{ x: 0, y: 0 }, { x: 0, y: 0 }],
  pointers: Object.create(null),
  canvas: null,
  ctx: null,
  overlay: null,
  hud: null,
  touchEl: null,
  run: null,
  portrait: false
};

MC.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
MC.lerp = (a, b, t) => a + (b - a) * t;
MC.rand = (a, b) => a + Math.random() * (b - a);
MC.pick = (arr) => arr[(Math.random() * arr.length) | 0];
MC.seeded = (seed) => {
  let s = (seed >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
};
MC.now = () => performance.now();
MC.len = (x, y) => Math.hypot(x, y);
MC.norm = (x, y) => {
  const l = Math.hypot(x, y) || 1;
  return { x: x / l, y: y / l };
};
MC.meta = (id) => MC.profiles[id || (MC.run && MC.run.soloProfile) || (MC.state && MC.state.lastProfile) || 'p1'];
MC.toast = (msg, ms) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.remove(), ms || 1400);
};
MC.fitCanvas = () => {
  const c = MC.canvas;
  if (!c) return;
  const iw = window.innerWidth || MC.BASE_W;
  const ih = window.innerHeight || MC.BASE_H;
  const portrait = ih > iw * 1.05;
  MC.portrait = portrait;
  let wantW = MC.BASE_W, wantH = MC.BASE_H;
  if (portrait) {
    const targetScale = 0.88;
    wantW = Math.round(Math.min(520, Math.max(390, iw / targetScale)));
    wantH = Math.round(wantW * (ih / Math.max(1, iw)));
    wantH = MC.clamp(wantH, 700, 1200);
  }
  if (MC.W !== wantW || MC.H !== wantH) {
    MC.W = wantW; MC.H = wantH;
    if (MC.run) MC.Game && MC.Game.reclamp && MC.Game.reclamp();
  }
  if (c.width !== MC.W) c.width = MC.W;
  if (c.height !== MC.H) c.height = MC.H;
  c.classList.toggle('portrait', !!portrait);
  MC.refreshRotateHint && MC.refreshRotateHint();
};
MC.clear = (color) => {
  const ctx = MC.ctx;
  ctx.fillStyle = color || '#1a1040';
  ctx.fillRect(0, 0, MC.W, MC.H);
};
MC.roundRect = (ctx, x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
};
MC.bindTap = (el, fn) => {
  if (!el) return;
  let last = 0;
  const run = (e) => {
    const t = Date.now();
    if (t - last < 260) return;
    last = t;
    try { e.preventDefault(); } catch (_) {}
    fn(e);
  };
  el.addEventListener('pointerup', run);
  el.addEventListener('click', run);
};

})();
/* ==== 10-audio.js ==== */
;(function(){
/* WebAudio SFX — only after first user input */
MC.Audio = (() => {
  let ctx = null, master = null, unlocked = false;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = MC.muted ? 0 : 0.3;
    master.connect(ctx.destination);
    return ctx;
  }

  function unlock() {
    const c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    unlocked = true;
  }

  function tone(freq, dur, type, vol, slide) {
    if (MC.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const t0 = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol) {
    if (MC.muted) return;
    const c = ensure();
    if (!c || !unlocked) return;
    const n = Math.max(1, (c.sampleRate * dur) | 0);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    g.gain.value = vol || 0.05;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1200;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  return {
    unlock,
    setMuted(m) {
      MC.muted = !!m;
      if (master) master.gain.value = MC.muted ? 0 : 0.3;
      try { localStorage.setItem('mc-mute', MC.muted ? '1' : '0'); } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = MC.muted ? '🔇' : '🔊';
    },
    loadMute() {
      try { MC.muted = localStorage.getItem('mc-mute') === '1'; } catch (_) {}
      const btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = MC.muted ? '🔇' : '🔊';
    },
    click() { tone(360, 0.05, 'triangle', 0.06); },
    pickup() { tone(720, 0.08, 'sine', 0.09); setTimeout(() => tone(960, 0.1, 'sine', 0.07), 40); },
    dash() { tone(240, 0.12, 'sawtooth', 0.05, 700); noise(0.08, 0.03); },
    freeze() { tone(880, 0.1, 'sine', 0.07, 420); tone(520, 0.16, 'triangle', 0.05); },
    shield() { tone(500, 0.12, 'triangle', 0.08); setTimeout(() => tone(700, 0.1, 'sine', 0.06), 50); },
    hurt() { tone(160, 0.16, 'sawtooth', 0.08, 70); noise(0.1, 0.04); },
    win() { [392, 494, 587, 784].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'sine', 0.09), i * 70)); },
    lose() { tone(220, 0.2, 'sawtooth', 0.07, 90); setTimeout(() => tone(140, 0.25, 'triangle', 0.06, 70), 120); },
    tick() { tone(880, 0.04, 'square', 0.03); }
  };
})();

})();
/* ==== 20-save.js ==== */
;(function(){
/* localStorage per-profile saves with in-memory fallback */
MC.Save = (() => {
  function blankProfile(id) {
    const meta = MC.profiles[id];
    return {
      id,
      name: meta.defaultName,
      maxLevel: 1,
      cleared: {},
      best: 0,
      bestLevel: {},
      playSeconds: 0
    };
  }

  function blankState() {
    return {
      v: MC.VERSION,
      lastProfile: 'p1',
      profiles: { p1: blankProfile('p1'), p2: blankProfile('p2') }
    };
  }

  function readRaw() {
    try {
      const s = localStorage.getItem(MC.SAVE_KEY);
      if (s) return JSON.parse(s);
    } catch (_) {}
    return MC.memStore;
  }

  function writeRaw(data) {
    MC.memStore = data;
    try {
      localStorage.setItem(MC.SAVE_KEY, JSON.stringify(data));
      return true;
    } catch (_) {
      return false;
    }
  }

  function load() {
    const raw = readRaw();
    if (!raw || raw.v !== MC.VERSION) {
      MC.state = blankState();
      save();
      return MC.state;
    }
    for (const id of ['p1', 'p2']) {
      raw.profiles[id] = Object.assign(blankProfile(id), raw.profiles[id] || {});
      if (!raw.profiles[id].cleared) raw.profiles[id].cleared = {};
      if (!raw.profiles[id].bestLevel) raw.profiles[id].bestLevel = {};
    }
    if (!raw.lastProfile) raw.lastProfile = 'p1';
    MC.state = raw;
    return MC.state;
  }

  function save() {
    if (!MC.state) return false;
    return writeRaw(MC.state);
  }

  function profile(id) {
    if (!MC.state) load();
    return MC.state.profiles[id || MC.state.lastProfile || 'p1'];
  }

  function setProfile(id) {
    MC.state.lastProfile = id;
    save();
  }

  function rename(id, name) {
    const p = profile(id);
    p.name = String(name || MC.profiles[id].defaultName).slice(0, 16) || MC.profiles[id].defaultName;
    save();
  }

  function markCleared(levelId, score) {
    const p = profile();
    p.cleared[levelId] = true;
    if (score > (p.best || 0)) p.best = score;
    if (score > (p.bestLevel[levelId] || 0)) p.bestLevel[levelId] = score;
    if (levelId >= p.maxLevel) p.maxLevel = Math.min(MC.Levels.list.length, levelId + 1);
    save();
  }

  function recordScore(score) {
    const p = profile();
    if (score > (p.best || 0)) {
      p.best = score;
      save();
      return true;
    }
    save();
    return false;
  }

  return { load, save, profile, setProfile, rename, markCleared, recordScore, blankProfile, blankState, readRaw, writeRaw };
})();

})();
/* ==== 30-levels.js ==== */
;(function(){
/* Survive-the-timer levels / waves */
MC.Levels = {
  list: [
    { id: 1, name: 'Warm-Up',     title: 'Courtyard Warm-Up',  time: 14, start: 2, max: 3, speed: 0.72, spawn: 8, stars: 4 },
    { id: 2, name: 'Garden',      title: 'Candle Garden',      time: 18, start: 3, max: 4, speed: 0.82, spawn: 7, stars: 5 },
    { id: 3, name: 'Hedge',       title: 'Moonlit Hedge',      time: 20, start: 3, max: 5, speed: 0.92, spawn: 6, stars: 5 },
    { id: 4, name: 'Swarm',       title: 'Pixie Swarm',        time: 22, start: 4, max: 6, speed: 1.00, spawn: 6, stars: 6 },
    { id: 5, name: 'Lanterns',    title: 'Flying Lanterns',    time: 24, start: 4, max: 7, speed: 1.08, spawn: 5.5, stars: 6 },
    { id: 6, name: 'Midnight',    title: 'Midnight Chase',     time: 26, start: 5, max: 7, speed: 1.16, spawn: 5, stars: 7 },
    { id: 7, name: 'Storm',       title: 'Spell Storm',        time: 28, start: 5, max: 8, speed: 1.24, spawn: 5, stars: 7 },
    { id: 8, name: 'Mischief',    title: 'The Grand Mischief', time: 30, start: 6, max: 9, speed: 1.32, spawn: 4.5, stars: 8 }
  ],
  get(id) { return MC.Levels.list.find((l) => l.id === id) || MC.Levels.list[0]; }
};

})();
/* ==== 40-art.js ==== */
;(function(){
/* Original canvas art — cute wizard + purple pixies */
MC.Art = (() => {
  function circle(ctx, x, y, r, fill) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function ellipse(ctx, x, y, rx, ry, fill) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function drawBg(ctx, t) {

      MC._rotateSeenEver = localStorage.getItem('mc-rotate-hint-v1') === '1';
    } catch (e) { MC._rotateSeenEver = false; }
    MC._rotateDismissed = !!MC._rotateSeenEver;
    MC._rotateHintTimer = 0;
    MC.refreshRotateHint = () => {
      const tip = document.getElementById('rotateTip');
      if (!tip) return;
      const show = !!MC.portrait && !MC._rotateDismissed && MC.screen === 'play';
      if (show && tip.classList.contains('hidden')) {
        tip.classList.remove('hidden');
        MC._rotateHintTimer = 4.0;
        try { localStorage.setItem('mc-rotate-hint-v1', '1'); MC._rotateSeenEver = true; } catch (err) {}
      }
      if (!show) tip.classList.add('hidden');
    };
    window.addEventListener('resize', () => {
      MC.fitCanvas();
      if (MC.screen === 'play' && MC.run) MC.UI.showTouch(MC.run.mode === 'coop');
    });
    window.addEventListener('orientationchange', () => setTimeout(() => {
      MC.fitCanvas();
      if (MC.screen === 'play' && MC.run) MC.UI.showTouch(MC.run.mode === 'coop');
    }, 50));

    const mute = document.getElementById('muteBtn');
    if (mute) mute.onclick = () => { MC.Audio.unlock(); MC.Audio.setMuted(!MC.muted); };
    const fs = document.getElementById('fsBtn');
    if (fs) fs.onclick = () => {
      MC.Audio.unlock();
      const app = document.getElementById('app');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const req = app.requestFullscreen || app.webkitRequestFullscreen;
        if (req) req.call(app).catch(() => {});
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
      }
    };
    const pause = document.getElementById('pauseBtn');
    if (pause) {
      pause.classList.add('hidden');
      pause.onclick = () => { MC.Audio.unlock(); MC.Game.togglePause(); };
    }
    MC.UI.bindJoysticks();
  }

  function init() {
    MC.canvas = document.getElementById('game');
    MC.ctx = MC.canvas.getContext('2d');
    MC.overlay = document.getElementById('overlay');
    MC.hud = document.getElementById('hud');
    MC.touchEl = document.getElementById('touch');
    MC.fitCanvas();
    MC.Save.load();
    MC.Audio.loadMute();
    bindInput();
    MC.screen = 'title';
    MC.UI.title();
    MC.raf = requestAnimationFrame(loop);

    window.__game = {
      MC,
      start(level, profile, coop) {
        if (profile && !coop) MC.Save.setProfile(profile);
        return MC.Game.start(level || 1, { profile: profile, coop: !!coop, autoplay: false });
      },
      startCoop(level) { return MC.Game.start(level || 1, { coop: true }); },
      autoplay(on) { MC.autoplay = on !== false; return MC.autoplay; },
      state: () => MC.state,
      run: () => MC.run,
      screen: () => MC.screen,
      goTitle: () => MC.UI.title(),
      goProfiles: () => MC.UI.profiles(),
      goLevels: (coop) => MC.UI.levels(!!coop),
      goHow: () => MC.UI.how(),
      pause: () => MC.Game.togglePause(),
      key(k, down) { MC.keys[k] = !!down; },
      setStick(i, x, y) { MC.sticks[i] = { x: x, y: y }; },
      muted: () => MC.muted,
      players: () => MC.run && MC.run.players
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

})();</script>

.car-back.bl { left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }

/* generic car game tweaks (none) */
</style>
<script id="car-mode-js">
window.__CAR_GAME = "minion-chase";
/* Game Night car mode, part 2 (shared): back button + helpers. window.__CAR_GAME is set by the build. */
(function () {
  'use strict';
  var CAR = window.__CAR = window.__CAR || {};
  CAR.game = window.__CAR_GAME || '';
  CAR.events = CAR.events || [];
  if (CAR.tesla === undefined) CAR.tesla = /Tesla/i.test(navigator.userAgent || '') || /[?&]car=tesla\b/.test(location.search);
  var root = document.documentElement;
  root.classList.add('car-mode', 'car-' + CAR.game);
  if (CAR.tesla) root.classList.add('car-tesla');

  CAR.leave = function () {
    if (CAR.leaving) return;
    CAR.leaving = true;
    try { if (CAR.beforeLeave) CAR.beforeLeave(); } catch (e) {}
    location.href = '../';
  };

  // The big "<- Games" button. Navigation is done on pointerup as well as click, because some games
  // lock the page down (preventDefault on touches) which can swallow the synthetic click.
  CAR.backButton = function (cls, parent, before) {
    var a = document.createElement('a');
    a.href = '../';
    a.id = 'car-back';
    a.className = 'car-back ' + (cls || 'tl');
    a.setAttribute('aria-label', 'Back to the games menu');
    a.innerHTML = '<span class="car-back-arrow" aria-hidden="true">\u2190</span><span class="car-back-label">Games</span>';
    var downId = null;
    a.addEventListener('pointerdown', function (e) { downId = e.pointerId; a.classList.add('down'); e.stopPropagation(); });
    a.addEventListener('pointerup', function (e) {
      a.classList.remove('down');
      if (downId === e.pointerId) { e.preventDefault(); e.stopPropagation(); CAR.leave(); }
      downId = null;
    });
    a.addEventListener('pointercancel', function () { downId = null; a.classList.remove('down'); });
    a.addEventListener('pointerleave', function () { a.classList.remove('down'); });
    a.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); CAR.leave(); });
    ['touchstart', 'touchend', 'mousedown', 'mouseup'].forEach(function (t) { a.addEventListener(t, function (e) { e.stopPropagation(); }); });
    parent = parent || document.body;
    if (before) parent.insertBefore(a, before); else parent.appendChild(a);
    CAR.back = a;
    return a;
  };

  CAR.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  };
})();

/* Generic Game Night car mode: just the back button. */
(function () {
  'use strict';
  var CAR = window.__CAR;
  CAR.ready(function () { CAR.backButton('tl'); });
})();
</script>
